                fetches++;",""],["                pagesPerHost.merge(host, 1, Integer::sum);",""],["                Optional<Page> page = web.fetch(e.url());",""],["                nowMs += 100;","Fetch time"],["                if (page.isEmpty()) {",""],["                    log.add(String.format(\"t=%5dms 404 %s\", nowMs, e.url()));",""],["                    continue;",""],["                }",""],["                String hash = sha256(page.get().html());",""],["                if (!seenContentHashes.add(hash)) {","Content already stored (mirror/AMP): store mat karo, links bhi skip"],["                    log.add(String.format(\"t=%5dms DUP-CONTENT %s\", nowMs, e.url()));",""],["                    continue;",""],["                }",""],["                stored.add(e.url());",""],["                log.add(String.format(\"t=%5dms FETCH %-38s depth=%d\", nowMs, e.url(), e.depth()));",""],["                for (String href : page.get().links()) enqueueLink(e, href);",""],["            }",""],["        }",""],["",""],["        private void enqueueLink(FrontierEntry parent, String href) {",""],["            Optional<String> norm = normalizeUrl(parent.url(), href);",""],["            if (norm.isEmpty()) return;",""],["            String url = norm.get();",""],["            if (!seenUrls.addIfNew(url)) {","Normalization ke baad duplicate (#top, :443, CAPS host): dobara frontier me nahi"],["                log.add(\"          dup-url \" + href);",""],["                return;",""],["            }",""],["            String host = hostOf(url);",""],["            String path = URI.create(url).getRawPath();",""],["            if (robotsDisallow.getOrDefault(host, List.of()).stream().anyMatch(path::startsWith)) {","robots.txt respect: legal + ethical + IP ban se bachao"],["                log.add(\"          ROBOTS-BLOCKED \" + url);",""],["                return;",""],["            }",""],["            if (parent.depth() + 1 > MAX_DEPTH || pagesPerHost.getOrDefault(host, 0) >= MAX_PAGES_PER_HOST) {",""],["                log.add(\"          TRAP-GUARD skip \" + url);",""],["                return;",""],["            }",""],["            frontier.add(new FrontierEntry(url, parent.depth() + 1));","Naya, allowed URL frontier me"],["        }",""],["",""],["        static String sha256(String s) {",""],["            try {",""],["                return HexFormat.of().formatHex(MessageDigest.getInstance(\"SHA-256\").digest(s.getBytes(StandardCharsets.UTF_8))).substring(0, 16);",""],["            } catch (NoSuchAlgorithmException ex) {",""],["                throw new IllegalStateException(ex);",""],["            }",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        System.out.println(\"normalize: \" + normalizeUrl(\"https://news.example.com/world\", \"https://NEWS.example.com:443/sports#scores\").orElse(\"-\"));",""],["        Crawler crawler = new Crawler();",""],["        crawler.seed(\"https://news.example.com/\");",""],["        crawler.crawl(20);",""],["        crawler.log.forEach(System.out::println);",""],["        System.out.println(\"stored \" + crawler.stored.size() + \" unique pages: \" + crawler.stored);",""],["    }",""],["}",""]]}};
'use strict';
/* ===================== registries ===================== */

  { id: 'start', name: 'Start' },
  { id: 'hld', name: 'HLD Foundations' },
  { id: 'deep', name: 'Internals Deep Dive' },
  { id: 'lld', name: 'LLD Foundations' },

  { id: 'prep', name: 'Staff Interview Prep' },

  { id: 'anime', name: 'Animation' }
];
const LVNAME = { 1: 'Engineer', 2: 'Mid-level', 3: 'Senior / Staff' };
const KIND_NAME = { client: 'Client', edge: 'LB / Gateway', svc: 'Service', cache: 'Cache', db: 'Database', queue: 'Queue / Log', worker: 'Worker', ext: 'External' };
function T(o) { TOPICS.push(o); BYID[o.id] = o; }
function S(id, o) { o.id = id; SC[id] = o; SC_ORDER.push(id); }

/* ===================== helpers ===================== */
const $ = (q, el) => (el || document).querySelector(q);
const $$ = (q, el) => Array.from((el || document).querySelectorAll(q));
const clone = x => JSON.parse(JSON.stringify(x));
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmt(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[\[([a-z0-9-]+)\|([^\]]+)\]\]/g, '<a href="#$1" class="xref" data-go="$1">$2</a>');
  return h;
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* storage blocked: ignore */ } }

/* ===================== block renderer ===================== */
function blocks(arr) { return (arr || []).map(block).join(''); }
function block(b) {
  const [t, a, c] = b;
  switch (t) {
    case 'h': return `<h3>${fmt(a)}</h3>`;
    case 'p': return `<p>${fmt(a)}</p>`;

/* ===================== Java code viewer ===================== */
const KW = new Set(('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long native new package private protected public return short static switch synchronized this throw throws transient try void volatile while var record yield sealed permits true false null').split(' '));
function hl(src) {
  const re = /(\/\/.*$)|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])')|(@[A-Za-z_]\w*)|(\b\d[\d_]*(?:\.\d+)?[LlFfDd]?\b)|([A-Za-z_$][\w$]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const [tok, com, str, chr, ann, num, word] = m;
    if (com) out += `<span class="s-com">${esc(com)}</span>`;
    else if (str || chr) out += `<span class="s-str">${esc(tok)}</span>`;
    else if (ann) out += `<span class="s-ann">${esc(ann)}</span>`;
    else if (num) out += `<span class="s-num">${esc(num)}</span>`;
    else if (word) {
      if (KW.has(word)) out += `<span class="s-kw">${word}</span>`;
      else if (/^[A-Z]/.test(word)) out += `<span class="s-typ">${word}</span>`;
      else out += word;
    }
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeView(id) {
  const c = (typeof CODE !== 'undefined') && CODE[id];
  if (!c) return `<aside class="call warn"><b class="k">Missing</b>Code "${esc(id)}" nahi mila.</aside>`;
  let notes = 0;
  const rows = c.lines.map(([src, note], i) => {
    const n = i + 1;
    if (note) notes++;
    return `<div class="c-ln${note ? ' has-note' : ''}"${note ? ' tabindex="0" role="button" aria-expanded="false"' : ''} data-n="${n}"><span class="c-no">${n}</span><code class="c-src">${hl(src) || ' '}</code></div>${note ? `<div class="c-note" hidden><span class="c-note-n">L${n}</span>${fmt(note)}</div>` : ''}`;
  }).join('');
  return `<figure class="code" data-code="${esc(id)}"><figcaption><span class="c-file">${esc(c.file)}</span><span class="c-meta">${c.lines.length} lines · ${notes} explained</span><span class="c-act"><button class="btn sm" data-act="code-all" aria-pressed="false">Explain all</button><button class="btn sm ghost" data-act="code-copy">Copy</button></span></figcaption><p class="c-hint">Blue line-number wali kisi bhi line pe tap karo, uska matlab neeche khulega.</p><div class="c-body">${rows}</div></figure>`;
}
function toggleNote(ln, force) {
  const note = ln.nextElementSibling;
  if (!note || !note.classList.contains('c-note')) return;
  const open = force !== undefined ? force : note.hidden;
  note.hidden = !open;
  ln.classList.toggle('on', open);
  ln.setAttribute('aria-expanded', String(open));
}
function copyCode(fig, btn) {
  const c = CODE[fig.dataset.code];
  const text = c.lines.map(l => l[0]).join('\n');
  const done = ok => { btn.textContent = ok ? 'Copied' : 'Copy blocked'; setTimeout(() => { btn.textContent = 'Copy'; }, 1800); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove(); done(ok);
  };
  try { navigator.clipboard.writeText(text).then(() => done(true), fallback); } catch (_) { fallback(); }
}

/* ===================== diagrams ===================== */
let svgUid = 0;
function boxesOf(sc) {
  if (sc._b) return sc._b;
  const B = {};
  for (const id in sc.n) {
    const [x, y, label, kind, w0] = sc.n[id];
    const lines = label.split('\n');
    const w = w0 || Math.max(76, Math.min(124, Math.max(...lines.map(l => l.length)) * 6.5 + 18));
    B[id] = { id, x, y, w, h: lines.length > 1 ? 42 : 30, kind, label };
  }
  return (sc._b = B);
}
function clipPt(A, B) {
  const dx = B.x - A.x, dy = B.y - A.y;
  if (!dx && !dy) return { x: A.x, y: A.y };
  const tx = dx ? (A.w / 2 + 3) / Math.abs(dx) : Infinity, ty = dy ? (A.h / 2 + 3) / Math.abs(dy) : Infinity;
  const t = Math.min(tx, ty);
  return { x: A.x + dx * t, y: A.y + dy * t };
}
function labelSVG(b, label) {
  const lines = label.split('\n');
  if (lines.length === 1) return `<text x="${b.x}" y="${b.y}">${esc(lines[0])}</text>`;
  return `<text x="${b.x}" y="${b.y - 7}">${esc(lines[0])}</text><text class="sm" x="${b.x}" y="${b.y + 9}">${esc(lines[1])}</text>`;
}
function diagramSVG(sc, cls) {
  const W = sc.w || 360, H = sc.h, B = boxesOf(sc), uid = ++svgUid;
  let edges = '', labels = '', nodes = '';
  for (const [a, b, lab, dash] of sc.e) {
    const A = B[a], Bb = B[b];
    const p1 = clipPt(A, Bb), p2 = clipPt(Bb, A);
    edges += `<line class="ed${dash ? ' dash' : ''}" data-e="${a}>${b}" x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" marker-end="url(#ah${uid})"/>`;
    if (lab) labels += `<text class="el" x="${((p1.x + p2.x) / 2).toFixed(1)}" y="${((p1.y + p2.y) / 2 - 3).toFixed(1)}" text-anchor="middle">${esc(lab)}</text>`;
  }
  for (const id in B) {
    const b = B[id];
    nodes += `<g class="nd k-${b.kind}" data-id="${id}" data-l="${esc(b.label)}"><rect x="${b.x - b.w / 2}" y="${b.y - b.h / 2}" width="${b.w}" height="${b.h}" rx="6"/><g class="nd-l">${labelSVG(b, b.label)}</g><text class="x" x="${b.x}" y="${b.y - b.h / 2 - 5}">DOWN</text></g>`;
  }
  return `<svg class="dia ${cls || ''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sc.title)} architecture diagram"><defs><marker id="ah${uid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><g>${edges}</g><g>${labels}</g><g>${nodes}</g><g class="pk" style="display:none"><circle class="halo" r="11"/><circle r="6"/></g></svg>`;
}
function legendHTML(sc) {
  const kinds = [...new Set(Object.values(sc.n).map(n => n[3]))];
  return `<span class="legend">${kinds.map(k => `<span class="k-${k}"><i></i>${KIND_NAME[k]}</span>`).join('')}</span>`;
}

T({

      ['Load balancer kya karta hai? Ek algorithm samjhao.', 'Traffic ko multiple servers me baantta hai aur unhealthy servers ko health checks se rotation se hata deta hai. **Round robin**: har request agle server ko; simple aur fair jab servers aur requests similar hon. Long connections ke liye least-connections better.', 1],

      ['URL shortener me base62 kyun? 7 chars me kitne codes?', 'Base62 (0-9, a-z, A-Z) URL-safe characters hain aur number ko chhota string banata hai. 62⁷ ≈ 3.5 trillion codes: kaafi saalon ke liye bahut.', 1],

      ['Parking lot me do gates ko same spot na mile, kaise?', 'Spot allocate ko atomic banao: Java me `AtomicBoolean.compareAndSet(false, true)`; DB me `UPDATE spots SET status=OCCUPIED WHERE id=? AND status=FREE` aur affected rows check. Jo haara wo agla spot dhoondhe.', 1],

T({

  body: [

    ['qa', [
      ['Read replicas use kiye, user ko apna hi update nahi dikh raha. Kyun, aur fix?', 'Async replication lag. Fix: **read-your-writes**: user ke apne recent writes (ya write ke baad kuch second) leader se padho; ya session me last-write timestamp rakho aur replica tab tak use mat karo jab tak woh catch up na kare.', 2],
      ['Shard key kaise choose karte ho? Ek example do.', 'Rules: zyada queries ek shard pe khatam hon, load barabar bante, hot key na bane. Chat: `conversation_id` (ek chat ka history ek shard). Orders: `user_id` (user ke orders saath). Galat example: `created_date` (aaj ka saara traffic ek shard pe).', 2],
      ['Consistent hashing kyun, aur virtual nodes kya karte hain?', '`hash % N` me N badla to ~sab keys move. Ring pe sirf ~1/N move. Virtual nodes: har server ring pe 100+ positions leta hai, isliye load barabar aur server hatne pe uska load sab pe bikharta hai. Code: [[hld-consistent-hashing|Consistent Hashing]].', 2],
      ['At-least-once delivery me duplicates kaise handle karoge?', 'Consumer **idempotent** banao: har event ka unique `event_id`; processed table pe unique constraint ya upsert. Duplicate aaye to skip. Offset/ack process ke baad. Animation: [[message-queue|Message Queue]] me "crash before commit".', 2],
      ['Outbox pattern kya hai, kab chahiye?', 'Jab DB write aur event publish dono chahiye. Same transaction me business row + outbox row; relay (poller/CDC) outbox se Kafka me publish karta hai. Dual write ka "ek hua ek nahi" problem khatam. Consumers idempotent hone chahiye (relay retry kar sakta hai).', 2],
      ['50 gateways ke saath rate limiter. Race condition kahan hai aur fix?', 'Do gateways GET karke same count dekhte hain aur dono allow kar dete hain. Fix: Redis **Lua script** (refill + check + decrement atomic) ya `INCR` + expiry. Redis down ho to fail-open/closed pehle se decide. Detail: [[rate-limiter|Rate Limiter]].', 2],
      ['Cache stampede kya hai? Fix?', 'Hot key expire hui aur hazaron requests ek saath DB pe. Fix: **single-flight** (ek request load kare, baaki wait), TTL me random jitter, stale-while-revalidate (purana serve karo, background me refresh), hot keys ke liye early refresh.', 2],
      ['Idempotency-Key API me kaise implement karoge?', [['ol', ['Client UUID bhejta hai.', 'Server `(key, user)` ko unique store me `IN_PROGRESS` likhta hai (Redis SET NX / DB unique).', 'Kaam ke baad response store, state `DONE`, TTL ~24h.', 'Same key dobara: DONE ho to stored response; IN_PROGRESS ho to 409/retry-later.', 'Same key + different body = 422 error.']]], 2],
      ['Chat ke liye WebSocket, SSE ya long polling? Kyun?', 'WebSocket: two-way, frequent messages, typing/receipts, ek persistent connection. SSE sirf server se client (notifications/live scores). Long polling fallback hai (overhead zyada). Cost: stateful connections, isliye gateway + session store design.', 2],
      ['Kafka me ordering guarantee kya hai?', 'Sirf **per partition**. Same key same partition me jaati hai, isliye per-key order milta hai (orderId ke events sequence me). Global order ke liye 1 partition = no scale. Retries me reorder rokne ke liye idempotent producer.', 2],
      ['BookMyShow me optimistic ya pessimistic locking?', 'Hot seats pe contention zyada hai. Practical: Redis SET NX + TTL as fast gatekeeper (all-or-nothing Lua), aur DB conditional update (`WHERE status=AVAILABLE` / version) as final truth. Pure pessimistic `SELECT FOR UPDATE` simple hai par hot seats pe lock queue + deadlock risk.', 2],
      ['Circuit breaker ki states aur kab OPEN hota hai?', 'CLOSED (normal) → lagatar failures/threshold cross → **OPEN** (calls turant fallback) → cool-down ke baad **HALF_OPEN** (kuch trial calls) → success = CLOSED, fail = phir OPEN. Fayda: dead dependency pe threads waste nahi, cascading failure ruka.', 2],

    ]]

});

T({
  id: 'mock-l3', sec: 'mock', short: 'Round 3: Senior / Staff (L3)', wide: true,
  title: 'Mock Round 3: Senior / Staff (L3)',
  sub: 'Tradeoffs, failure modes, evolution aur judgement',
  lv: [3],
  body: [

    ['qa', [
      ['CAP/PACELC ko real design me kaise use karte ho?', [['p', 'System-level label (CP/AP) se zyada **feature-level** decision: payment status, seat booking, unique username = consistency; feed, likes, presence = availability + latency.'], ['p', 'Phir har feature ke liye bolo: stale/duplicate data ka business cost kya hai, aur partition/failover ke time user ko kya dikhega (error, degraded, ya purana data).']], 3],
      ['Saga vs 2PC: kab kya, aur saga me kya galat ho sakta hai?', [['ul', ['2PC: atomic, par coordinator fail pe participants locks pakde atke; external systems (payment gateway) support nahi karte.', 'Saga: local transactions + compensations. Eventual consistency, intermediate states dikh sakte hain.', 'Pitfalls: compensation bhi fail ho sakta hai (retry + idempotent banao), "pivot" step ke baad compensation possible nahi (design order soch ke), concurrent sagas ke liye semantic locks / status flags.']]], 3],
      ['Multi-region active-active ke challenges?', 'Write conflicts (same record do regions me), cross-region latency (strong consistency = har write pe 100 ms+), data residency laws, split-brain risk, failover testing, cost 2x. Mitigation: per-user/tenant **home region**, CRDTs ya LWW jahan chal sake, global uniqueness ke liye central/consensus service, regular game-days.', 3],
      ['99.99% availability target: design me kya badlega?', [['ul', ['~4.3 min downtime/month: koi manual failover nahi chalega, sab automatic.', 'Har layer redundant (multi-AZ), koi SPOF nahi (LB, DB, config, DNS).', 'Dependencies ki availability multiply hoti hai: critical path chhota, non-critical async/optional.', 'Safe deploys: canary, auto-rollback, feature flags; error budget se release speed control.', 'Load shedding + graceful degradation planned.']]], 3],
      ['Hot key / celebrity problem ka generic approach?', 'Detect (per-key metrics, sampling) → **spread** (key salting/replication: `key#1..N`, reads kisi bhi replica se) → **cache closer** (local in-process cache, CDN) → **change the algorithm** (fan-out pull for celebrities, sharded counters for likes) → isolate (dedicated capacity).', 3],
      ['"Exactly-once processing" ka claim kaise justify karoge?', 'End-to-end exactly-once tabhi jab source replayable ho, processing deterministic ho, aur **sink idempotent/transactional** ho. Kafka transactions Kafka-to-Kafka tak; external DB ke saath outbox/idempotency keys. Practical answer: at-least-once delivery + idempotent effects = effectively-once.', 3],
      ['Monolith ko microservices me kab aur kaise todoge?', 'Kab: team boundaries clash kar rahe, deploys ek doosre ko block kar rahe, alag scaling needs, domain stable. Kaise: **strangler fig** (edge pe routing, ek capability nikalo), data ownership pehle alag karo (shared DB anti-pattern), contracts + observability ready, ek ek service. Kab nahi: chhoti team, domain abhi badal raha.', 3],
      ['Zero-downtime schema migration kaise?', '**Expand → migrate → contract**: (1) naya column/table add (backward compatible), (2) code dono likhe (dual write), (3) backfill purana data batches me, (4) reads naye pe shift (flag), (5) verify, (6) purana hatao. Har step independently rollback-able.', 3],
      ['Cascading failure rokne ke tools?', 'Timeouts (hierarchy ke saath), limited retries with backoff + jitter + retry budget, circuit breakers, bulkheads (alag pools), load shedding (priority-based), backpressure (bounded queues), rate limits, aur dependency ko optional banana (fallbacks). Animation: [[animation|Generic architecture]] failure flows.', 3],
      ['1 minute me traffic 10x ho gaya. Plan?', 'Autoscaling minutes leti hai, isliye: CDN/edge caching, queue-based load leveling (writes buffer), non-critical features off (feature shedding), priority-based load shedding, pre-warmed capacity known events ke liye, aur DB ko protect (cache, rate limit, read replicas). Baad me: capacity planning + load tests.', 3],
      ['Design review me over-engineering kaise pakadte ho?', 'Har component ko requirement ya measured bottleneck se trace karo; nahi hua to sawaal. Reversible decisions jaldi, irreversible (shard key, ID format, public API) pe time. Ops cost aur team skill bhi count karo. Detail: [[trade-framework|Tradeoff Framework]].', 3],
      ['Reconciliation jobs kab chahiye?', 'Jab do systems eventually consistent hain aur galti ka cost bada hai: payment vs orders, ledger vs balances, inventory vs bookings. Job dono sides compare karta hai, mismatch pe auto-fix (refund, recompute) ya alert. "Distributed systems me reconciliation = safety net."', 3],
      ['Leader election me split-brain kaise rokoge?', 'Majority **quorum** wala consensus (Raft/ZooKeeper/etcd): minority side leader nahi ban sakti. Leases with expiry, aur storage pe **fencing tokens** (monotonic number) taaki purana leader (GC pause ke baad jaaga) writes na kar sake.', 3],
      ['Naye system pe kaunse metrics/alerts lagaoge?', 'SLIs: availability (success rate), latency (p50/p99), throughput, saturation (CPU, queue depth, connection pools), consumer lag. Alerts SLO **burn-rate** pe (fast + slow window), symptoms pe, causes pe nahi. Structured logs with request-id + distributed tracing. Dashboards: RED per service, USE per resource.', 3]
    ]]
  ]
});

T({

  title: 'Mock Round 4: Staff Deep Dives',

  lv: [3],
  body: [

    ['qa', [
      ['Raft me entry "committed" kab hoti hai, aur leader crash ke baad committed entry kyun nahi khoti?', [

        ['p', 'Follow-up trap: purane term ki entries ko leader sirf replica count se commit nahi karta (Raft paper ka Figure 8 case); woh current term ki entry ke saath indirectly commit hoti hain. Demo: [[raft-consensus|Raft]].']

      ['Raft leader se seedha read karna linearizable kyun nahi? Fix kya hai?', 'Partition ke baad purana leader (minority side) ko pata nahi hota ki naya leader ban chuka; woh stale data de sakta hai. Fixes: **ReadIndex** (leader pehle majority se heartbeat round karke confirm kare ki wahi leader hai, phir commit index tak apply hone ka wait kare; etcd linearizable reads ke liye yahi karta hai), **lease reads** (lease ke andar bina round trip ke padho; bounded clock drift pe depend), ya read ko bhi log me daalo (sabse slow). Stale-OK reads followers se de sakte ho.', 3],
      ['Async replication + automatic failover: data loss ho sakta hai? Kaise kam karoge?', [

        ['ul', [

      ['Fencing token kya hai? Sirf lease kaafi kyun nahi?', 'Lease holder ruk sakta hai (lambi GC pause, VM freeze) aur lease expire hone ke baad jaag ke likh deta hai, kyunki usne lease pause se pehle check kiya tha. **Fencing token**: har lease grant pe badhta hua number; storage sabse bada dekha hua token yaad rakhta hai aur chhote token wali write reject karta hai. Isliye zombie leader ka write storage pe hi ruk jaata hai. Shart: check **storage/resource side** pe ho; sirf client-side check kaafi nahi.', 3],
      ['Write-heavy workload pe LSM-tree aur read-heavy OLTP pe B-tree kyun? Amplification samjhao.', [

      ['Bloom filter LSM reads me kaise help karta hai? False positive se kya bigadta hai?', 'Har SSTable ka Bloom filter memory me: "key pakka nahi hai" bole to us file ka disk read skip. False positive = ek bekaar disk read; correctness pe asar nahi (false negative hota hi nahi). ~10 bits per key ≈ 1% false positives. Range scans me normal Bloom filter kaam nahi aata (prefix Bloom filters madad karte hain).', 3],
      ['Event time vs processing time; watermark kya hai; late events ka kya karoge?', [['ul', [
        '**Event time** (click kab hua) pe windows: replay ya delay ke baad bhi same result. Processing time sirf monitoring jaisi cheezon ke liye.',

      ['Search index ko shard kaise karoge: document-partitioned ya term-partitioned?', [

          '**Term-partitioned** (global index): query sirf relevant terms ke shards pe, par multi-term query me cross-shard intersection, ek document ki write kai shards pe, aur hot terms.',
          'Scoring trap: har shard apna IDF nikaale to scores skew hote hain (chhote shards) → global stats (DFS query) ya har shard me kaafi docs.'

        ['p', 'Demo: [[search-index|Search index]].']

      ['Elasticsearch me naya document ~1 second me searchable kyun hota hai, turant kyun nahi?', 'Naye docs memory buffer me jaate hain (durability ke liye translog me bhi). **Refresh** (default 1 s) buffer se naya immutable **segment** banata hai jo searchable hota hai. Segments background me merge hote hain; deletes pehle "deleted" mark hote hain aur merge pe physically hatte hain: LSM jaisa hi idea. Tradeoff: chhota refresh interval = fresher results par zyada chhote segments aur kam indexing throughput (bulk load me refresh interval badha do).', 3],
      ['CDN pe static assets aur video: cache key, invalidation aur origin protection kaise design karoge?', [['ul', [

      ['Microservices me JWT vs opaque tokens? JWT revoke kaise karoge?', [

      ['Multi-tenant SaaS: ek tenant ka data doosre ko kabhi na dikhe, kaise ensure karoge?', [['ul', [

        'Isolation model: pool (shared tables) → bridge (schema per tenant) → silo (DB per tenant, bade/regulated customers). Cost vs isolation.',
        'Noisy neighbour: per-tenant rate limits, quotas, alag queues.',
        'Bade customers ke liye per-tenant encryption keys.',
        'Automated tests jo cross-tenant access try karein, aur audit logs.'
      ]]], 3],
      ['OLTP data warehouse/lake me chahiye. App se DB + Kafka dono me likhna (dual write) galat kyun hai? Sahi tareeka?', 'Dual write me partial failure: DB commit hua par Kafka write fail (ya ulta) → dono systems hamesha ke liye out of sync; do writers ka order bhi alag ho sakta hai. Sahi: **CDC** (Debezium DB ka WAL/binlog padhta hai) → Kafka → lake/warehouse: sirf committed changes, sahi order me. Domain events ke liye **outbox** table (same transaction) + CDC. Initial load = snapshot, phir stream. Schema changes ke liye schema registry compatibility rules. Animation: [[data-platforms|Data platforms]].', 3],
      ['Live system ka database badalna hai (jaise MySQL → Cassandra) bina downtime. Plan batao.', [['ol', [
        'Naye store me bhi writes: dual write (ya CDC se replicate); reads abhi purane se.',
        'Purana data batches me backfill: **idempotent upserts** + version/timestamp, taaki backfill live writes ko overwrite na kare.',
        '**Shadow reads**: dono se padho, compare, mismatch ka metric.',
        'Mismatch ~0 ho to reads % me shift (feature flag): 1% → 10% → 100%.',
        'Writes ka primary naya store; purana kuch time sync me (rollback ke liye).',
        'Verify ke baad purana band (contract).'
      ]], ['p', 'Har step reversible hona chahiye. Animation: [[migrations|Migrations]].']], 3],
      ['Interviewer: "Is design ki monthly cost kitni hogi?" Kaise estimate karoge, aur cost kam karne ke levers?', [
        ['p', 'Teen bade buckets: **compute** (peak QPS ÷ per-instance capacity jo load test se mili, + headroom), **storage** (daily ingest × retention × replication factor), **network egress** (media/video me aksar sabse bada). Har ek ka order of magnitude bolo, phir sabse bade bucket pe focus.'],
        ['ul', [
          'Storage tiering: hot → warm → cold (jaise S3 Standard-IA, Glacier), retention/TTL, compression.',
          'CDN hit ratio badhao: egress aur origin compute dono kam.',
          'Right-sizing + autoscaling; batch jobs ke liye spot/preemptible.',
          'Logs/metrics sampling aur cardinality limits.',
          'Cache se DB load kam (DB sabse mehenga scale hota hai).'
        ]],
        ['p', 'Calculator: [[cost-capacity|Cost & capacity]].']
      ], 3],
      ['"Koi complex system batao jo tumne design kiya": answer kaise structure karoge?', [['ol', [
        'Context: problem, scale (numbers), constraints.',
        'Tumhara role: tumne kya decide/lead kiya (team ka nahi, tumhara).',
        '1–2 bade decisions: options kya the, kya chuna, **kyun**, aur uska cost kya tha.',
        'Kya galat hua aur kaise sambhala (incident, rollback, learning).',
        'Outcome numbers ke saath (latency, cost, reliability, team velocity).',
        'Aaj dobara karte to kya alag karte.'
      ]], ['p', 'Template + example: [[past-systems|Past systems]].']], 3],
      ['Design ke end me interviewer poochhe: "Is design ka sabse bada risk kya hai?"', 'Ek concrete risk chuno (generic "scale" nahi): kahan hai, blast radius kitna, kaise pata chalega (metric/alert), abhi kya mitigation, aur kya jaan-boojh ke defer kiya. Jaise payments me: "PSP timeout ke baad UNKNOWN state. Detection: UNKNOWN count + age pe alert. Mitigation: status query + daily reconciliation. Deferred: multi-PSP routing." Ye judgement dikhata hai. Phrases: [[staff-delivery|Staff delivery]].', 3]
    ]]
  ]
});

T({
  id: 'mock-drills', sec: 'mock', short: 'Round 5: Design drills (12)', wide: true,
  title: 'Mock Round 5: Design Drills',
  sub: '12 naye problems: 5-minute outline + interviewer ka curveball follow-up',
  lv: [2, 3],
  body: [
    ['note', 'Har **Drill** ke liye 5 minute ka timer lagao aur zor se outline bolo, phir answer se compare karo. Har drill ke baad ek **Curveball** hai: interviewer ka typical follow-up, uska answer 2 minute me. Poora design + animation har answer ke link me hai.'],
    ['steps', [
      ['Clarify (1 min)', 'Scope, users, scale, consistency needs: 3–4 sawaal.'],
      ['Numbers (1 min)', 'QPS, storage, bandwidth: sirf jo design badle.'],
      ['Core design (2 min)', 'API, data model, main components aur data flow.'],
      ['Deep dive + failures (1 min)', 'Sabse mushkil hissa + 2–3 failure modes.']
    ]],
    ['qa', [
      ['**Drill**: 1 billion pages/month crawl karne wala web crawler design karo.', [
        ['ul', [
          '**Clarify**: Sirf HTML? Recrawl freshness? robots.txt/politeness? JS rendering?',
          '**Numbers**: ~400 pages/s; ~100 KB/page → ~100 TB/month; seen-URL set arabon me.',
          '**Core**: Seeds → URL frontier (priority front queues + per-host back queues) → fetchers (DNS + robots cache) → parser → dedup (URL Bloom/KV, content hash/simhash) → frontier. Pages WARC/S3 me, metadata KV me.',
          '**Deep dive**: Host se partition: politeness ek node pe local; 429/503 pe adaptive slow-down.',
          '**Failures**: Spider traps (depth/budget/pattern), node crash (durable frontier + shard reassign), slow hosts (backoff).'
        ]],
        ['p', 'Poora design + animation: [[web-crawler|Web Crawler]].']
      ], 3],
      ['**Curveball**: Ek bahut bada host ek crawler node pe hai aur woh node bottleneck ban gaya. Kya karoge?', 'Host-based partitioning ka skew. Fetch rate to politeness se bandha hai, isliye asli bottleneck aksar parsing/processing/storage hota hai. Fix: fetch us node pe rehne do, par **parsing aur processing alag worker pool** pe; bahut bade host ko path prefix se sub-partition karo aur un sub-partitions ke beech **shared per-host rate limiter** rakho; site sitemaps/dumps de to unhe use karo (crawl se sasta).', 3],
      ['**Drill**: 1 crore jobs/day wala distributed job scheduler (cron + delayed jobs) design karo.', [
        ['ul', [
          '**Clarify**: At-least-once chalega? Job duration? Priorities? DAG dependencies?',
          '**Numbers**: ~115 jobs/s average, midnight pe bada spike; ~10 GB/day history.',
          '**Core**: Jobs table (next_run_at index) → workers `SELECT … FOR UPDATE SKIP LOCKED` se claim + lease → execute → done ya backoff ke saath retry; cron ka next run complete pe compute.',
          '**Deep dive**: Leases + heartbeats (worker mara to reclaim); execution key (job@time) se idempotent side effects.',
          '**Failures**: Worker crash (lease expiry), poison job (max attempts → DLQ), thundering herd (jitter, rate limits), clock skew (DB ka time).'
        ]],
        ['p', 'Poora design + animation: [[job-scheduler|Job Scheduler]].']
      ], 3],
      ['**Curveball**: "Email bhejo" job do baar chal gaya: worker GC pause me tha, lease expire hui, doosre worker ne bhi chala diya. Kaise rokoge?', 'Scheduler at-least-once hi de sakta hai. Asli fix **downstream idempotency**: execution key (job_id@scheduled_time) email service ko do; woh key pehle dekh chuka ho to skip (unique constraint). Saath me completion pe fencing (`UPDATE … WHERE id = ? AND lease_token = ?`) taaki zombie worker job state na bigaade, aur lambe jobs heartbeat se lease extend karein. Yaad rakho: fencing state bachata hai, email nahi; email ko dedup hi bachata hai.', 3],
      ['**Drill**: 1 lakh hosts ke liye metrics + alerting system (Prometheus/Datadog jaisa) design karo.', [
        ['ul', [
          '**Clarify**: Pull ya push? Retention? Dashboards + alerts dono? Multi-tenant?',
          '**Numbers**: 10 crore active series, ~1 crore samples/s; ~1.4 B/sample compressed → ~1.2 TB/day.',
          '**Core**: Agents/scrapers → ingest (series hash se shard) → TSDB (head + WAL → compressed blocks, label inverted index) → query layer → rule evaluator → Alertmanager (dedup, group, route).',
          '**Deep dive**: Cardinality control (labels me user_id nahi); downsampling + long-term object storage.',
          '**Failures**: Ingest down (agent buffer), cardinality explosion (limits), monitoring khud down (dead man\'s switch).'
        ]],
        ['p', 'Poora design + animation: [[metrics-monitoring|Metrics & Monitoring]].']
      ], 3],
      ['**Curveball**: Kisi team ne label me `user_id` daal diya; TSDB ki memory phat rahi hai. Abhi kya karoge, aur aage kaise rokoge?', 'Abhi: ingest pe us label ko **drop/relabel** karo, aur top series-by-metric se offending metric/team pakdo. Aage: per-tenant/per-metric **series limits** (limit cross = reject + owner ko alert), CI me label lint/allowlist, aur high-cardinality cheezein (user_id, request_id) logs/traces me rakho, metrics me nahi. Wajah: series = labels ka har unique combination, to user_id = crores series.', 3],
      ['**Drill**: Search autocomplete (har keystroke pe top 5 suggestions, < 100 ms) design karo.', [
        ['ul', [
          '**Clarify**: Personalized? Trending kitna fresh? Languages? Typos?',
          '**Numbers**: 10 crore searches/day × ~3 suggest calls ≈ 3,500 QPS avg (~10K peak); trie kuch GB.',
          '**Core**: Query logs → aggregation (time decay) → offline trie build, har node pe precomputed top-K → snapshot → serving nodes memory me hot-swap; short prefixes browser + CDN cache.',
          '**Deep dive**: Trending ke liye streaming counts ka chhota delta layer, query time pe merge.',
          '**Failures**: Offensive suggestion (blocklist + turant rollback), node down (stateless, snapshot se), log lag (stale par working).'
        ]],
        ['p', 'Poora design + animation: [[autocomplete|Autocomplete]].']
      ], 2],
      ['**Curveball**: Bada cricket match chal raha hai; "ind vs" type karne pe live match 10 minute baad bhi suggestions me nahi. Kyun, aur fix?', 'Trie hourly/daily offline build hota hai, isliye naya trend late aata hai. Fix: streaming pipeline (Kafka → Flink, 5-min windows) se **trending delta layer**: chhota in-memory map (prefix → trending queries) jo query time pe main trie ke top-K ke saath merge ho (score boost). Safety filter delta layer pe bhi. Short prefixes ka CDN TTL chhota rakho, warna purane suggestions cache se aate rahenge.', 2],
      ['**Drill**: Ad click aggregator: har ad ke per-minute clicks (billing ke liye) aur har minute top-100 ads.', [
        ['ul', [
          '**Clarify**: Billing-grade accuracy? Events kitni late aa sakte? Query dimensions?',
          '**Numbers**: 1B clicks/day ≈ 11.5K/s (peak ~50K/s); raw ~100 GB/day.',
          '**Core**: Click → logger (clickId, Kafka, 302 redirect) → Flink (event-time 1-min windows, watermark, dedup) → OLAP (ad × minute upsert); raw S3 pe; top-K per partition + merge.',
          '**Deep dive**: Exactly-once: checkpoints + idempotent upsert; nightly batch recount = billing truth (reconciliation).',
          '**Failures**: Flink crash (checkpoint restore), late events (allowed lateness + side output), hot ad (key salting), duplicate clicks (clickId).'
        ]],
        ['p', 'Poora design + animation: [[ad-click|Ad Click Aggregator]].']
      ], 3],
      ['**Curveball**: Advertiser bolta hai "dashboard me 10,240 clicks, bill me 10,180". Kaun sahi hai, kaise samjhaoge?', 'Bill (batch recount) source of truth hai: raw log pe nightly job dedup, invalid (bot) traffic filter aur late events ke saath exact count karta hai. Dashboard stream ka fast estimate hai. Process: dono ka gap monitor karo (reconciliation metric + threshold alert), dashboard pe "estimated" label, aur disputes ke liye raw logs retain (clickId-level proof).', 3],
      ['**Drill**: 5 crore players wale game ka real-time leaderboard (top 100 + "meri rank").', [
        ['ul', [
          '**Clarify**: Global ya region/friends? Daily/weekly reset? Ties kaise toote?',
          '**Numbers**: 5 crore entries × ~100 B ≈ 5 GB per board; contest end pe ~50K updates/s.',
          '**Core**: Score events (Kafka) → score service (matchId idempotency) → Redis ZSET: ZINCRBY / ZREVRANGE / ZREVRANK; DB source of truth; top-100 ka 1–2 s cache.',
          '**Deep dive**: Tie-break ke liye composite score; period keys (`lb:weekly:2026-W41`) + TTL.',
          '**Failures**: Redis down (replica; DB/Kafka se rebuild), burst (Kafka buffer + pipelining), duplicate results (matchId).'
        ]],
        ['p', 'Poora design + animation: [[leaderboard|Leaderboard]].']
      ], 2],
      ['**Curveball**: Board 50 crore players ka ho gaya; ek Redis node me fit nahi. Exact rank kaise doge?', '**Score-range sharding**: shard 1 = 9000+ points, shard 2 = 8000–8999, … Har shard apna count rakhe. Global rank = upar wale shards ke counts ka sum + shard ke andar rank. Score badle to player shard badal sakta hai (remove + add). Ranges distribution dekh ke choose karo (histogram se), warna ek shard bhar jaata hai. Ya product decision: top 10K exact, baaki "top 5%" approximate (histogram buckets): sasta aur users ke liye kaafi.', 3],
      ['**Drill**: YouTube jaisa video upload + streaming platform design karo.', [
        ['ul', [
          '**Clarify**: Uploads/day, views/day? Live? DRM?',
          '**Numbers**: 5 lakh uploads/day × 1 GB = 500 TB/day raw; ~110 PB/day egress → CDN design ka center.',
          '**Core**: Presigned multipart upload (resumable) → S3 → transcode DAG (split → parallel encode per rendition → HLS/DASH package → thumbnails) → CDN; player ABR (2–6 s segments).',
          '**Deep dive**: Popular content edges pe pre-position, long tail pull-through + origin shield; per-title encoding; mehenga codec (AV1) sirf popular videos ke liye.',
          '**Failures**: Upload drop (missing parts resume), transcoder crash (idempotent task retry), viral spike (request collapsing), edge down (anycast/DNS).'
        ]],
        ['p', 'Poora design + animation: [[youtube|YouTube]].']
      ], 2],
      ['**Curveball**: Upload ke 2 minute baad video viral; lakhon log ek saath aaye aur origin pe load spike. Kya hua, fix?', 'Edges pe abhi cache nahi tha, isliye har edge ka miss origin tak gaya (thundering herd). Fix: **request collapsing** (har edge pe ek hi origin fetch, baaki wait), **origin shield** (edges aur origin ke beech ek tier, toh origin pe har segment ki lagbhag ek request), segments immutable + long TTL, aur trending videos ko proactively edges pe push. Origin pe rate limits + priority.', 2],
      ['**Drill**: Google Drive / Dropbox jaisa file sync (multi-device, versions, sharing) design karo.', [
        ['ul', [
          '**Clarify**: Max file size? Real-time collaboration scope me? Offline edits?',
          '**Numbers**: 50 crore users × avg 10 GB → exabytes; 4 MB blocks.',
          '**Core**: Client chunking + SHA-256 → "kaunse hashes missing?" → sirf missing blocks object store pe (presigned) → metadata commit (base version) → journal + notifier → baaki devices cursor se changes pull.',
          '**Deep dive**: Content-addressed dedup + delta sync; content-defined chunking (insert pe sirf aas-paas ke blocks badle).',
          '**Failures**: Upload interrupted (hash-based resume), offline conflict (conflicted copy), notification lost (cursor poll), metadata failover (version-based idempotent commit).'
        ]],
        ['p', 'Poora design + animation: [[google-drive|Google Drive]].']
      ], 2],
      ['**Curveball**: Security team bolti hai cross-user dedup se privacy leak hota hai. Kaise, aur kya karoge?', 'Upload pe server bole "ye block already hai, skip" to attacker kisi known file ka hash bhej ke jaan sakta hai ki **kisi aur user ke paas woh file hai** (side channel). Fix: dedup sirf per-user/per-org scope me; ya client hamesha upload kare (bandwidth cost) aur server-side dedup chupke se ho. Convergent encryption ke apne risks hain. Tradeoff: storage saving vs privacy.', 3],
      ['**Drill**: Google Docs jaisa real-time collaborative editor design karo.', [
        ['ul', [
          '**Clarify**: Ek doc pe max concurrent editors? Rich text? Offline kitni der? History?',
          '**Targets**: Local typing latency ~0; remote changes < 200 ms; sab replicas same text pe converge.',
          '**Core**: WebSocket gateway (docId se sticky) → doc owner server (OT: rev numbers, transform) → op log (quorum write) + snapshots; presence pub/sub; client local echo + ek pending op.',
          '**Deep dive**: OT vs CRDT: central server hai to OT simple; offline-first / P2P ho to CRDT.',
          '**Failures**: Owner crash (naya owner: snapshot + op log replay, clients rebase), client offline (buffer + rebase), divergence (checksums + resync).'
        ]],
        ['p', 'Poora design + animation: [[google-docs|Google Docs]].']
      ], 3],
      ['**Curveball**: Do users ne same position pe ek saath type kiya; ek ki screen pe "hb", doosre ki pe "bh". Bug kya hai?', 'Transform me **deterministic tie-break** missing hai: same position pe do inserts ka order har replica pe same rule se tay hona chahiye (site/user id compare, ya server order). Bina iske har client apna op pehle rakhta hai → divergence. Fix: tie-break + property-based tests (random concurrent ops, sab replicas same text pe converge) + production me periodic checksum compare.', 3],
      ['**Drill**: Payments + wallet system (card/UPI via PSP, refunds, payouts) design karo.', [
        ['ul', [
          '**Clarify**: Payment methods? Wallet regulated (PPI)? Payout frequency? Multi-currency?',
          '**Numbers**: 1 crore payments/day ≈ 115/s (peak 10x); ~3 ledger entries per payment.',
          '**Core**: Payment service (state machine + Idempotency-Key) → PSP (same key) → double-entry ledger (append-only, har txn ka sum 0) + outbox event; wallet = ledger accounts, check + debit ek transaction; daily reconciliation vs PSP settlement files.',
          '**Deep dive**: PSP timeout = UNKNOWN state → status query / webhook; blind retry kabhi nahi.',
          '**Failures**: Crash after PSP success (reconciliation), duplicate webhook (event id dedup), double click (idempotency key), ledger DB failover (sync replication).'
        ]],
        ['p', 'Poora design + animation: [[payment-system|Payment System]].']
      ], 3],
      ['**Curveball**: Merchant bolta hai "customer ka paisa kata, par order failed dikha". Kaise debug aur fix karoge?', 'Classic UNKNOWN/crash case. Debug: idempotency key se payment record, PSP status, ledger txn aur outbox events ka trail. PSP pe SUCCEEDED par ledger/order me nahi → ye gap reconciliation pakadti hai, par T+1 ka wait mehenga hai. Fix: ek **resolver job** jo UNKNOWN / stuck PROCESSING payments ko minutes me PSP status se resolve kare; order service PaymentSucceeded event pe order confirm kare, ya order ab possible nahi to auto-refund. Stuck payments ke count + age pe alert.', 3],
      ['**Drill**: Yelp jaisa "nearby places" search (radius + category + rating) design karo.', [
        ['ul', [
          '**Clarify**: Kitne businesses? Search QPS? Update kitni jaldi dikhe? Static places ya moving objects?',
          '**Numbers**: 20 crore businesses; 50K QPS peak; geo index ~8 GB (RAM me, har node pe copy).',
          '**Core**: Read path: location service → geo index (geohash cells + neighbours, ya quadtree) → candidates → exact distance filter → rank → page. Write path: business service → DB → CDC / nightly index rebuild.',
          '**Deep dive**: Geohash vs quadtree vs S2/H3; cell edge problem.',
          '**Failures**: Replica down (LB), kharab index build (snapshot rollback), popular area stampede (cache + coalescing).'
        ]],
        ['p', 'Poora design + animation: [[nearby-places|Nearby Places]].']
      ], 2],
      ['**Curveball**: User do geohash cells ki boundary pe khada hai; 50 m door wala cafe results me nahi aaya. Kyun?', 'Geohash prefix match sirf usi cell ke points deta hai; paas wala cafe padosi cell me ho sakta hai (jiska prefix kabhi bilkul alag hota hai). Fix: user ka cell **+ 8 neighbours** query karo, phir exact distance (haversine) se filter. Precision radius ke hisaab se chuno (cell ≥ radius). Quadtree/S2 me bhi query box ya covering cells se hoti hai, single cell se nahi.', 2],
      ['**Drill**: Hotel booking (Booking.com / MakeMyTrip): search, multi-night reserve, pay, cancel, overbooking.', [
        ['ul', [
          '**Clarify**: Overbooking allowed? Payment kab? Hold kitni der? Kitne hotels?',
          '**Numbers**: 5 lakh hotels; inventory rows (hotel × room type × date) ~180 crore → hotel_id se shard; bookings ~12/s (peak 10x), search ~100x.',
          '**Core**: Search (index + cache, eventual) alag. Reservation: client reservationId (idempotent) → ek transaction me har night ki row pe conditional update (`reserved + n ≤ total × factor`) → PENDING_PAYMENT hold with expiry → pay → CONFIRMED.',
          '**Deep dive**: Multi-night atomicity (affected rows ≠ nights → rollback); BookMyShow se farak (counts, seats nahi).',
          '**Failures**: Payment fail (sweeper hold release), double click (reservationId), last room ki race (conditional update: ek hi jeetega).'
        ]],
        ['p', 'Poora design + animation: [[hotel-booking|Hotel Booking]].']
      ], 2],
      ['**Curveball**: Festive sale pe ek popular hotel ki inventory rows pe lock contention; bookings timeout ho rahi hain. Kya karoge?', 'Pehle measure: kis hotel/dates pe contention. Phir: transaction chhota rakho (sirf inventory update; payment transaction ke bahar), rows hamesha same order me lock karo (date ascending, deadlock na ho), hot hotels ke liye **per-hotel queue** (bookings serialize, async confirm: "request received"), ya hot inventory Redis atomic counters (Lua) pe + DB reconciliation. UX: search me "last few rooms". Tradeoff: turant confirm vs throughput.', 3]
    ], { wait: 'Drill: 5 minute outline bolo. Curveball: 2 minute. Phir reveal karo.' }]
  ]
});
