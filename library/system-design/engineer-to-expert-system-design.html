<style>
/* Layout: whiteboard graph-paper ground; sticky top bar with topics drawer + level filter;
   each topic = Problem pane (left, sticky on wide screens) | Solution pane (right); stacks under 900px.
   Animation view = architecture stage + live state tables. */
:root{
  --board:#F3F5F4; --panel:#FFFFFF; --ink:#17202A; --muted:#56626E; --line:#D3DBDE; --dot:#C9D2D5;
  --blue:#2350C2; --green:#16794A; --red:#BF3A2C; --amber:#9C6312; --violet:#6A3BAE; --teal:#0E6F7E;
  --code-bg:#EEF2F3; --code-ln:#8F9BA5; --flash:#FFE9A8; --chip:#E7ECEE;
  --k-client:#3D5A98; --k-edge:#5747AA; --k-svc:#0E6F7E; --k-cache:#C0452A; --k-db:#94600F;
  --k-queue:#9C3277; --k-worker:#16794A; --k-ext:#68717C; --edge:#8995A0;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-hand:"Kalam","Segoe Print","Bradley Hand",cursive;
  --top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#11161B; --panel:#171E25; --ink:#E4EAEE; --muted:#9AA7B2; --line:#2A353F; --dot:#25303A;
    --blue:#82A6FF; --green:#5BC48C; --red:#FF8170; --amber:#E2B05A; --violet:#B99BFF; --teal:#56C3D2;
    --code-bg:#0F1419; --code-ln:#5D6B77; --flash:#4A3F12; --chip:#222C35;
    --k-client:#8EA9EA; --k-edge:#A99CF2; --k-svc:#56C3D2; --k-cache:#FF8F72; --k-db:#E2B05A;
    --k-queue:#EE86C6; --k-worker:#5BC48C; --k-ext:#A3ADB8; --edge:#66737F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --board:#11161B; --panel:#171E25; --ink:#E4EAEE; --muted:#9AA7B2; --line:#2A353F; --dot:#25303A;
  --blue:#82A6FF; --green:#5BC48C; --red:#FF8170; --amber:#E2B05A; --violet:#B99BFF; --teal:#56C3D2;
  --code-bg:#0F1419; --code-ln:#5D6B77; --flash:#4A3F12; --chip:#222C35;
  --k-client:#8EA9EA; --k-edge:#A99CF2; --k-svc:#56C3D2; --k-cache:#FF8F72; --k-db:#E2B05A;
  --k-queue:#EE86C6; --k-worker:#5BC48C; --k-ext:#A3ADB8; --edge:#66737F;
  color-scheme: dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background-color:var(--board); color:var(--ink);
  background-image:radial-gradient(var(--dot) 1px, transparent 1.2px); background-size:22px 22px;
  font:16px/1.62 var(--f-body);
}
a{color:var(--blue)}
code{font-family:var(--f-mono); font-size:.86em; background:var(--chip); padding:.08em .35em; border-radius:4px; overflow-wrap:anywhere}
strong{font-weight:600}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

/* ---------- top bar ---------- */
.bar{
  position:sticky; top:var(--top); z-index:30; display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:color-mix(in srgb, var(--panel) 92%, transparent);
  border-bottom:1px solid var(--line); backdrop-filter:saturate(1.2) blur(8px);
}
.brand{display:flex; align-items:baseline; gap:8px; min-width:0; text-decoration:none; color:var(--ink)}
.brand b{font-family:var(--f-display); font-stretch:115%; font-weight:800; letter-spacing:.01em; font-size:1.02rem; white-space:nowrap}
.brand span{font-family:var(--f-hand); color:var(--blue); font-size:1rem; white-space:nowrap}
.bar .grow{flex:1}
.btn{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel);
  padding:7px 12px; border-radius:7px; cursor:pointer; font-size:.88rem; font-weight:500; line-height:1.2;
}
.btn:hover{border-color:var(--blue)}
.btn.sm{padding:5px 9px; font-size:.8rem}
.btn.ghost{background:transparent}
.btn.primary{background:var(--blue); border-color:var(--blue); color:var(--panel)}
.btn[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel)}
.seg button{border:0; background:transparent; padding:6px 10px; font-size:.8rem; cursor:pointer; font-weight:600; font-family:var(--f-mono)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--panel)}
.seg-l{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-right:2px}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:minmax(0,1fr); max-width:1360px; margin:0 auto}
.nav{
  position:fixed; inset:0 auto 0 0; width:min(330px, 88vw); z-index:40; background:var(--panel);
  border-right:1px solid var(--line); overflow-y:auto; padding:calc(var(--top) + 14px) 14px 40px;
  transform:translateX(-102%); transition:transform .22s ease;
}
.nav.open{transform:none}
.scrim{position:fixed; inset:0; z-index:35; background:rgba(10,14,18,.45)}
.nav h3{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:18px 8px 6px}
.nav a{display:flex; gap:8px; align-items:baseline; padding:6px 8px; border-radius:6px; color:var(--ink); text-decoration:none; font-size:.92rem; line-height:1.35}
.nav a .n{font-family:var(--f-mono); font-size:.7rem; color:var(--muted); min-width:1.6em}
.nav a:hover{background:var(--chip)}
.nav a[aria-current="page"]{background:var(--ink); color:var(--panel)}
.nav a[aria-current="page"] .n{color:inherit}
.nav-close{display:flex; justify-content:space-between; align-items:center; padding:0 6px}
@media (min-width:1180px){
  .shell{grid-template-columns:290px minmax(0,1fr)}
  .nav{position:sticky; top:calc(var(--top) + 55px); height:calc(100vh - 55px - var(--top)); transform:none; transition:none; width:auto; z-index:1; background:transparent; border-right:1px solid var(--line)}
  .scrim,.nav-close,#menuBtn{display:none}
}
main{min-width:0; padding:22px 16px 56px}

/* ---------- topic head ---------- */
.eyebrow{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
h1{font-family:var(--f-display); font-stretch:112%; font-weight:800; font-size:clamp(1.55rem, 4.2vw, 2.35rem); line-height:1.12; margin:0 0 6px; text-wrap:balance; letter-spacing:-.005em}
.t-sub{color:var(--muted); margin:0 0 12px; max-width:68ch}
.t-meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.t-head{margin-bottom:20px}
.lvtag{font-family:var(--f-mono); font-size:.72rem; font-weight:600; padding:3px 8px; border-radius:999px; border:1px solid currentColor; white-space:nowrap}
.lvtag.l1{color:var(--teal)} .lvtag.l2{color:var(--amber)} .lvtag.l3{color:var(--violet)}

/* ---------- split panes ---------- */
.split{display:grid; grid-template-columns:minmax(0,1fr); gap:18px; align-items:start}
.pane{min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px 18px 8px}
.pane-h{
  font-family:var(--f-mono); font-size:.74rem; letter-spacing:.16em; text-transform:uppercase; margin:0 0 12px;
  display:inline-block; padding-bottom:3px; border-bottom:3px solid var(--amber)
}
.sol .pane-h{border-bottom-color:var(--blue)}
@media (min-width:900px){
  .split{grid-template-columns:minmax(0,.86fr) minmax(0,1.3fr)}
  .prob{position:sticky; top:calc(var(--top) + 70px); max-height:calc(100vh - 90px - var(--top)); overflow-y:auto}
}
#menuBtn{white-space:nowrap}
@media (max-width:520px){
  main{padding-top:16px}
  .pane{padding:14px 12px 4px}
  .brand span, .seg-l{display:none}
  .bar{gap:8px; padding-inline:12px}
  .bar .seg button{padding:6px 8px}
  .brand b{font-size:.92rem}
}
@media (max-width:360px){ .brand{display:none} }
.pane h3, .wide h3{font-family:var(--f-display); font-stretch:108%; font-weight:700; font-size:1.06rem; margin:22px 0 8px; text-wrap:balance}
.pane > h3:first-of-type{margin-top:4px}
.pane p, .wide p{margin:0 0 12px; max-width:72ch}
.pane ul, .pane ol, .wide ul, .wide ol{margin:0 0 14px; padding-left:1.25em}
.pane li, .wide li{margin:4px 0}
.wide{max-width:1100px}

/* level sections */
.lv{border:1px dashed var(--line); border-radius:8px; padding:12px 14px 2px; margin:14px 0}
.lv-h{font-family:var(--f-mono); font-size:.74rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px; display:flex; align-items:center; gap:8px}
.lv-h::before{content:""; width:9px; height:9px; border-radius:50%; background:currentColor}
.lv1 > .lv-h{color:var(--teal)} .lv2 > .lv-h{color:var(--amber)} .lv3 > .lv-h{color:var(--violet)}
body[data-lv="1"] .lv:not(.lv1), body[data-lv="2"] .lv:not(.lv2), body[data-lv="3"] .lv:not(.lv3){display:none}
.lv-note{display:none; font-size:.85rem; color:var(--muted)}
body[data-lv="1"] .lv-note, body[data-lv="2"] .lv-note, body[data-lv="3"] .lv-note{display:block}

/* callouts */
.call{border-radius:7px; padding:10px 12px; margin:12px 0; font-size:.94rem; background:var(--chip)}
.call b.k{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; margin-right:6px}
.call.tip b.k{color:var(--green)} .call.warn b.k{color:var(--red)} .call.note b.k{color:var(--blue)}
.call.why{background:color-mix(in srgb, var(--blue) 9%, var(--panel))}
.why-k{font-family:var(--f-hand); font-weight:700; color:var(--blue); font-size:1.05rem; margin-right:4px}

/* tables, kv, api */
.tbl-wrap{overflow-x:auto; margin:6px 0 14px; border:1px solid var(--line); border-radius:7px}
table{border-collapse:collapse; width:100%; font-size:.88rem}
th,td{text-align:left; vertical-align:top; padding:7px 10px; border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:var(--code-bg); white-space:nowrap}
tr:last-child td{border-bottom:0}
td{font-variant-numeric:tabular-nums}
.kv{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:8px; margin:6px 0 14px}
.kv div{border:1px solid var(--line); border-radius:7px; padding:8px 10px; min-width:0}
.kv dt{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.kv dd{margin:2px 0 0; font-weight:600; font-variant-numeric:tabular-nums; font-size:.95rem}
.api{display:grid; gap:6px; margin:6px 0 14px}
.api-row{display:grid; grid-template-columns:62px minmax(0,1fr); gap:2px 10px; border:1px solid var(--line); border-radius:7px; padding:7px 10px; align-items:baseline}
.api-row code{background:transparent; padding:0; font-weight:600}
.api-row .d{grid-column:2; font-size:.86rem; color:var(--muted)}
.m{font-family:var(--f-mono); font-size:.72rem; font-weight:700; text-align:center; border-radius:4px; padding:2px 0; color:var(--panel)}
.m-get{background:var(--teal)} .m-post{background:var(--green)} .m-put,.m-patch{background:var(--amber)} .m-delete{background:var(--red)} .m-ws,.m-sse,.m-rpc{background:var(--violet)}
.steps{list-style:none; padding:0 !important; counter-reset:st; display:grid; gap:8px}
.steps li{counter-increment:st; display:grid; grid-template-columns:30px minmax(0,1fr); gap:2px 10px; margin:0 !important}
.steps li::before{content:counter(st); grid-row:span 2; font-family:var(--f-mono); font-weight:700; font-size:.8rem; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; border:1.5px solid var(--ink)}
.steps li span{grid-column:2; color:var(--muted); font-size:.92rem}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 14px}
.chip{font-family:var(--f-mono); font-size:.76rem; background:var(--chip); border-radius:4px; padding:3px 8px}

/* tradeoff cards */
.to-list{display:grid; gap:10px; margin:8px 0 16px}
@media (min-width:1300px){ .wide .to-list{grid-template-columns:1fr 1fr} }
.to{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--panel); min-width:0}
.to h4{margin:0 0 6px; font-family:var(--f-display); font-stretch:108%; font-size:.98rem}
.to-row{display:grid; grid-template-columns:62px minmax(0,1fr); gap:10px; padding:5px 0; border-top:1px dotted var(--line)}
.to-row p{margin:0 !important; font-size:.9rem}
.tag{font-family:var(--f-mono); font-size:.66rem; font-weight:700; letter-spacing:.08em; padding:2px 0; text-align:center; border-radius:4px; align-self:start; margin-top:3px}
.ap .tag{background:color-mix(in srgb,var(--green) 16%,var(--panel)); color:var(--green)}
.ig .tag{background:color-mix(in srgb,var(--red) 14%,var(--panel)); color:var(--red)}
.wy .tag{background:color-mix(in srgb,var(--blue) 14%,var(--panel)); color:var(--blue)}

/* ---------- code viewer ---------- */
.code{margin:10px 0 18px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--code-bg)}
.code figcaption{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--panel)}
.c-file{font-family:var(--f-mono); font-weight:600; font-size:.82rem}
.c-meta{font-size:.74rem; color:var(--muted)}
.c-act{margin-left:auto; display:flex; gap:6px}
.c-hint{margin:0 !important; padding:6px 12px; font-size:.78rem; color:var(--muted); border-bottom:1px solid var(--line); font-family:var(--f-hand)}
.c-body{font-family:var(--f-mono); font-size:.8rem; line-height:1.55; padding:6px 0; max-height:none}
.c-ln{display:grid; grid-template-columns:2.6em minmax(0,1fr); padding:0 10px 0 0}
.c-no{color:var(--code-ln); text-align:right; padding-right:.8em; user-select:none; font-size:.92em}
.c-src{background:transparent; padding:0; font-size:1em; white-space:pre-wrap; overflow-wrap:anywhere; border-radius:0}
.c-ln.has-note{cursor:pointer}
.c-ln.has-note .c-no{color:var(--blue); font-weight:600; text-decoration:underline dotted; text-underline-offset:3px}
.c-ln.has-note:hover, .c-ln.on{background:color-mix(in srgb, var(--blue) 10%, transparent)}
.c-note{margin:3px 10px 6px 2.6em; padding:7px 10px; border-radius:6px; background:var(--panel); border:1px solid var(--line); font-family:var(--f-body); font-size:.86rem; line-height:1.5}
.c-note-n{font-family:var(--f-mono); font-size:.7rem; color:var(--blue); font-weight:700; margin-right:4px}
.s-kw{color:var(--violet); font-weight:600} .s-str{color:var(--green)} .s-com{color:var(--code-ln); font-style:italic}
.s-num{color:var(--amber)} .s-ann{color:var(--red)} .s-typ{color:var(--teal)}

/* ---------- diagrams ---------- */
.dia-fig{margin:10px 0 18px; border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden}
.dia-scroll{overflow-x:auto}
svg.dia{display:block; width:100%; min-width:296px; max-width:560px; height:auto; margin:0 auto; font-family:var(--f-body)}
@media (max-width:520px){ .lv{padding:10px 8px 2px} }
.dia-fig figcaption{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; padding:8px 10px; border-top:1px solid var(--line); font-size:.82rem; color:var(--muted)}
.legend{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.74rem}
.legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; border:1.5px solid currentColor}
.ed{stroke:var(--edge); stroke-width:1.4; fill:none}
.ed.dash{stroke-dasharray:5 4}
.ed.hot{stroke:var(--blue); stroke-width:2.6}
.ah{fill:var(--edge)}
.el{font-size:9.5px; fill:var(--muted); paint-order:stroke; stroke:var(--panel); stroke-width:3px; stroke-linejoin:round}
.nd rect{fill:color-mix(in srgb, var(--k) 11%, var(--panel)); stroke:var(--k); stroke-width:1.5}
.nd text{fill:var(--ink); font-size:11px; font-weight:600; text-anchor:middle; dominant-baseline:central}
.nd text.sm{font-size:9.5px; font-weight:400; fill:var(--muted)}
.nd.on rect{stroke-width:3; fill:color-mix(in srgb, var(--k) 24%, var(--panel))}
.nd.down rect{stroke:var(--red); stroke-dasharray:4 3; fill:color-mix(in srgb, var(--red) 12%, var(--panel))}
.nd.down text{fill:var(--red)}
.nd .x{display:none; font-size:9px; font-weight:700; fill:var(--red)}
.nd.down .x{display:inline}
.k-client{--k:var(--k-client)} .k-edge{--k:var(--k-edge)} .k-svc{--k:var(--k-svc)} .k-cache{--k:var(--k-cache)}
.k-db{--k:var(--k-db)} .k-queue{--k:var(--k-queue)} .k-worker{--k:var(--k-worker)} .k-ext{--k:var(--k-ext)}
.legend .k-client,.legend .k-edge,.legend .k-svc,.legend .k-cache,.legend .k-db,.legend .k-queue,.legend .k-worker,.legend .k-ext{color:var(--k)}
.pk circle{fill:var(--blue)}
.pk .halo{fill:none; stroke:var(--blue); stroke-width:2; opacity:.45}
.pk.r circle{fill:var(--green)} .pk.r .halo{stroke:var(--green)}
.pk.e circle{fill:var(--red)} .pk.e .halo{stroke:var(--red)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
.nd.pulse rect{animation:pulse .5s ease 2; transform-box:fill-box; transform-origin:center}

/* ---------- pager ---------- */
.pager{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:26px}
.pager a{display:block; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:10px 12px; text-decoration:none; color:var(--ink); min-width:0}
.pager a small{display:block; font-family:var(--f-mono); font-size:.68rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.pager a span{display:block; font-weight:600; overflow-wrap:anywhere}
.pager .nx{text-align:right; grid-column:2}

/* ---------- home ---------- */
.home-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px; margin:8px 0 16px}
.home-card{border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--panel); min-width:0}
.home-card h4{margin:0 0 6px; font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.home-card a{display:block; padding:3px 0; text-decoration:none; font-size:.93rem}
.home-card a:hover{text-decoration:underline}
.hand{font-family:var(--f-hand); color:var(--blue); font-size:1.12rem}

/* ---------- mock Q&A ---------- */
.qa-tools{display:flex; gap:8px; margin:6px 0 10px}
.qa{list-style:none; padding:0 !important; margin:0; display:grid; gap:10px}
.qa-item{display:grid; grid-template-columns:minmax(0,1fr); gap:0; border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden; margin:0 !important}
@media (min-width:900px){ .qa-item{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)} }
.qa-q{padding:12px 14px; border-bottom:1px solid var(--line)}
@media (min-width:900px){ .qa-q{border-bottom:0; border-right:1px solid var(--line)} }
.qa-q p{margin:6px 0 10px !important; font-weight:600}
.qa-n{font-family:var(--f-mono); font-size:.72rem; font-weight:700; margin-right:6px}
.qa-a{padding:12px 14px; min-width:0}
.qa-a p:last-child{margin-bottom:4px}
.qa-wait{padding:12px 14px; color:var(--muted); font-family:var(--f-hand); font-size:1.02rem; align-self:center}

/* ---------- learning links ---------- */
.learn{margin-top:18px}
.learn-sub{color:var(--muted); font-size:.88rem; margin:0 0 10px}
.links{list-style:none; padding:0 !important; margin:4px 0 16px; display:grid; gap:8px}
@media (min-width:900px){ .links{grid-template-columns:1fr 1fr} }
.links li{display:grid; grid-template-columns:74px minmax(0,1fr); gap:10px; align-items:start; border:1px solid var(--line); border-radius:7px; padding:8px 10px; margin:0 !important; background:var(--panel); min-width:0}
.lk-kind{font-family:var(--f-mono); font-size:.64rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:3px 0; border-radius:4px; background:var(--chip); color:var(--muted); margin-top:2px}
.lk-body{display:flex; flex-direction:column; gap:1px; min-width:0}
.lk-body a{font-weight:600; text-decoration:none; overflow-wrap:anywhere}
.lk-body a:hover{text-decoration:underline}
.lk-body a::after{content:" ↗"; font-size:.8em; color:var(--muted)}
.lk-host{font-family:var(--f-mono); font-size:.7rem; color:var(--muted); overflow-wrap:anywhere}
.lk-note{font-size:.86rem; color:var(--ink)}

/* ---------- animation view ---------- */
.an-groups{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
.an-groups button{border:1px solid var(--line); background:transparent; border-radius:6px; padding:5px 10px; font-size:.8rem; cursor:pointer; font-family:var(--f-mono); font-weight:600}
.an-groups button small{color:var(--muted); font-weight:400; margin-left:2px}
.an-groups button[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:var(--panel)}
.an-groups button[aria-pressed="true"] small{color:inherit}
.an-tabs{display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; margin-bottom:6px; scrollbar-width:thin}
.an-tabs button{flex:0 0 auto; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 12px; font-size:.84rem; cursor:pointer; white-space:nowrap}
.an-tabs button[aria-selected="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.an-flows{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px}
.an-flows button{border:1px dashed var(--line); background:transparent; border-radius:6px; padding:5px 10px; font-size:.82rem; cursor:pointer}
.an-flows button[aria-pressed="true"]{border-style:solid; border-color:var(--blue); color:var(--blue); background:color-mix(in srgb,var(--blue) 8%,var(--panel)); font-weight:600}
.an-flows button.fail{color:var(--red)}
.an-flows button.fail[aria-pressed="true"]{border-color:var(--red); background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.an-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-items:start}
@media (min-width:1000px){ .an-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)} }
.an-stage{background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; min-width:0}
.an-ctrl{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 10px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--code-bg)}
.an-ctrl .sp{margin-left:auto}
.an-cap{padding:12px 14px; min-height:150px}
.an-cap .k{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); letter-spacing:.06em}
.an-cap .msg{font-family:var(--f-mono); font-weight:600; font-size:.9rem; margin:4px 0 6px; overflow-wrap:anywhere}
.an-cap p{margin:0 0 8px}
.an-side{display:grid; gap:12px; min-width:0}
.sp-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:10px}
.spn{background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; min-width:0}
.spn h4{margin:0; padding:7px 10px; font-family:var(--f-mono); font-size:.74rem; letter-spacing:.04em; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--line)}
.spn h4::before{content:""; width:9px; height:9px; border-radius:2px; border:2px solid var(--k)}
.spn .tbl-wrap{border:0; border-radius:0; margin:0}
.spn table{font-size:.78rem; font-family:var(--f-mono)}
.spn th{font-size:.64rem}
.spn th, .spn td{padding:5px 8px}
.spn td{white-space:normal; overflow-wrap:anywhere}
.spn .empty{padding:8px 10px; color:var(--muted); font-size:.8rem; font-family:var(--f-hand)}
@keyframes flash{0%{background:var(--flash)}100%{background:transparent}}
tr.flash td{animation:flash 2.2s ease-out}
.an-steps{list-style:none; margin:0; padding:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; max-height:420px; overflow-y:auto}
.an-steps li{display:grid; grid-template-columns:28px minmax(0,1fr); gap:8px; padding:7px 10px; border-bottom:1px solid var(--line); cursor:pointer; font-size:.84rem}
.an-steps li:last-child{border-bottom:0}
.an-steps li .no{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); padding-top:2px}
.an-steps li .mm{font-family:var(--f-mono); font-size:.78rem; overflow-wrap:anywhere}
.an-steps li.done{color:var(--muted)}
.an-steps li.cur{background:color-mix(in srgb,var(--blue) 10%,var(--panel)); color:var(--ink)}
.an-steps li.cur .no{color:var(--blue); font-weight:700}
.an-steps li.e .mm{color:var(--red)}
.an-sum{margin-top:16px}
@media (prefers-reduced-motion: reduce){
  .nav{transition:none} tr.flash td{animation:none; background:var(--flash)} .nd.pulse rect{animation:none}
}

<script>
const CODE = {"AdClickAggregatorDemo":{"file":"AdClickAggregatorDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.HashMap;",""],["import java.util.HashSet;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.PriorityQueue;",""],["import java.util.Random;",""],["import java.util.Set;",""],["import java.util.TreeMap;",""],["",""],["public class AdClickAggregatorDemo {",""],["",""],["    record Click(String clickId, String adId, long minute) {}","clickId: client/edge pe generate, dedup ke liye"],["",""],["    static final class CountMinSketch {","Fixed memory me approximate counts: kabhi kam nahi, thoda zyada ho sakta hai"],["        private final long[][] table;",""],["        private final int width;",""],["        private final int[] seeds = {17, 31, 61, 101};",""],["",""],["        CountMinSketch(int width) {",""],["            this.width = width;",""],["            this.table = new long[seeds.length][width];",""],["        }",""],["",""],["        private int bucket(String key, int row) { return Math.floorMod(key.hashCode() * seeds[row] + (seeds[row] << 7), width); }",""],["",""],["        void add(String key) { for (int r = 0; r < seeds.length; r++) table[r][bucket(key, r)]++; }",""],["",""],["        long estimate(String key) {","Har row me collision se count badh sakta hai; minimum sabse kam galat"],["            long min = Long.MAX_VALUE;",""],["            for (int r = 0; r < seeds.length; r++) min = Math.min(min, table[r][bucket(key, r)]);",""],["            return min;",""],["        }",""],["",""],["        int counters() { return seeds.length * width; }",""],["    }",""],["",""],["    static final class MinuteAggregator {",""],["        final Map<Long, Map<String, Long>> exactCounts = new TreeMap<>();","(minute, adId) -> count: billing ke liye exact"],["        private final Set<String> seenClickIds = new HashSet<>();","Real: per-minute dedup state with TTL"],["        final CountMinSketch sketch = new CountMinSketch(16);","Demo me jaan-boojh kar chhota (16 wide) taaki collisions dikhein; real me width hazaron me (error ~ e/width)"],["        int duplicates;",""],["",""],["        void ingest(Click c) {",""],["            if (!seenClickIds.add(c.clickId())) {","Retry / double-fire: billing me double charge nahi"],["                duplicates++;",""],["                return;",""],["            }",""],["            exactCounts.computeIfAbsent(c.minute(), m -> new HashMap<>()).merge(c.adId(), 1L, Long::sum);",""],["            sketch.add(c.adId());",""],["        }",""],["",""],["        List<Map.Entry<String, Long>> topK(long minute, int k) {","Min-heap of size k: O(n log k)"],["            PriorityQueue<Map.Entry<String, Long>> heap = new PriorityQueue<>(Map.Entry.comparingByValue());",""],["            for (Map.Entry<String, Long> e : exactCounts.getOrDefault(minute, Map.of()).entrySet()) {",""],["                heap.add(e);",""],["                if (heap.size() > k) heap.poll();",""],["            }",""],["            List<Map.Entry<String, Long>> out = new ArrayList<>(heap);",""],["            out.sort(Map.Entry.<String, Long>comparingByValue().reversed());",""],["            return out;",""],["        }",""],["    }",""],["",""],["    static Map<String, Long> batchRecount(List<Click> rawLog, long minute) {","Nightly batch: raw S3 log se dobara gino (late events bhi shamil)"],["        Map<String, Long> counts = new HashMap<>();",""],["        Set<String> seen = new HashSet<>();",""],["        for (Click c : rawLog) if (c.minute() == minute && seen.add(c.clickId())) counts.merge(c.adId(), 1L, Long::sum);",""],["        return counts;",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Random random = new Random(42);","Fixed seed: har run same output"],["        List<Click> rawLog = new ArrayList<>();",""],["        for (int i = 0; i < 10_000; i++) {",""],["            int ad = (int) Math.floor(Math.pow(random.nextDouble(), 3) * 50);","Skewed: kuch ads bahut popular (power-law)"],["            Click c = new Click(\"c\" + i, \"ad\" + ad, 1000);",""],["            rawLog.add(c);",""],["            if (random.nextInt(100) < 2) rawLog.add(c);","~2% duplicate deliveries"],["        }",""],["        MinuteAggregator agg = new MinuteAggregator();",""],["        rawLog.forEach(agg::ingest);",""],["        System.out.println(\"events \" + rawLog.size() + \", duplicates dropped \" + agg.duplicates);",""],["        System.out.println(\"top-3 exact: \" + agg.topK(1000, 3));",""],["        for (Map.Entry<String, Long> e : agg.topK(1000, 3)) {",""],["            System.out.println(\"  \" + e.getKey() + \" exact=\" + e.getValue() + \" count-min estimate=\" + agg.sketch.estimate(e.getKey()));",""],["        }",""],["        System.out.println(\"  ad45 exact=\" + agg.exactCounts.get(1000L).getOrDefault(\"ad45\", 0L) + \" count-min estimate=\" + agg.sketch.estimate(\"ad45\") + \" (chhote keys pe collisions se overestimate ho sakta hai)\");",""],["        System.out.println(\"memory: exact map \" + agg.exactCounts.get(1000L).size() + \" keys (grows with ads) vs sketch \" + agg.sketch.counters() + \" counters (fixed)\");",""],["",""],["        List<Click> late = List.of(new Click(\"late-1\", \"ad0\", 1000), new Click(\"late-2\", \"ad0\", 1000));","Stream window band hone ke baad aaye (side output)"],["        rawLog.addAll(late);",""],["        long streamAd0 = agg.exactCounts.get(1000L).get(\"ad0\");",""],["        long batchAd0 = batchRecount(rawLog, 1000).get(\"ad0\");",""],["        System.out.println(\"reconciliation ad0: stream=\" + streamAd0 + \" batch=\" + batchAd0 + \" -> billing uses batch, diff \" + (batchAd0 - streamAd0));",""],["    }",""],["}",""]]},"AutocompleteDemo":{"file":"AutocompleteDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.Comparator;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Set;",""],["import java.util.TreeMap;",""],["import java.util.concurrent.atomic.AtomicReference;",""],["",""],["public class AutocompleteDemo {",""],["",""],["    record Suggestion(String query, double score) {}",""],["",""],["    static final class TrieNode {",""],["        final Map<Character, TrieNode> children = new TreeMap<>();",""],["        Double terminalScore;","Is node pe koi poori query khatam hoti hai to uska score"],["        List<Suggestion> topK = List.of();","Precomputed top-K: query time pe subtree traverse nahi karna padta"],["    }",""],["",""],["    static final class SuggestionTrie {","Immutable snapshot: build hone ke baad kabhi modify nahi (readers lock-free)"],["        private final TrieNode root = new TrieNode();",""],["        private final int k;",""],["",""],["        SuggestionTrie(Map<String, Double> scores, int k, Set<String> blocklist) {",""],["            this.k = k;",""],["            scores.forEach((query, score) -> {",""],["                if (blocklist.stream().anyMatch(query::contains)) return;","Offensive / legal-blocked terms build time pe hi bahar"],["                TrieNode node = root;",""],["                for (char c : query.toCharArray()) node = node.children.computeIfAbsent(c, ch -> new TrieNode());",""],["                node.terminalScore = score;",""],["            });",""],["            computeTopK(root, new StringBuilder());",""],["        }",""],["",""],["        private List<Suggestion> computeTopK(TrieNode node, StringBuilder prefix) {","Post-order: bachchon ke top-K merge karke apna top-K; O(nodes × k)"],["            List<Suggestion> candidates = new ArrayList<>();",""],["            if (node.terminalScore != null) candidates.add(new Suggestion(prefix.toString(), node.terminalScore));",""],["            for (Map.Entry<Character, TrieNode> e : node.children.entrySet()) {",""],["                prefix.append(e.getKey());",""],["                candidates.addAll(computeTopK(e.getValue(), prefix));",""],["                prefix.deleteCharAt(prefix.length() - 1);",""],["            }",""],["            candidates.sort(Comparator.comparingDouble(Suggestion::score).reversed().thenComparing(Suggestion::query));",""],["            node.topK = List.copyOf(candidates.subList(0, Math.min(k, candidates.size())));",""],["            return node.topK;",""],["        }",""],["",""],["        List<Suggestion> suggest(String prefix) {","Query: prefix tak walk (O(len)) + ready list"],["            TrieNode node = root;",""],["            for (char c : prefix.toLowerCase().toCharArray()) {",""],["                node = node.children.get(c);",""],["                if (node == null) return List.of();",""],["            }",""],["            return node.topK;",""],["        }",""],["    }",""],["",""],["    static double score(long weeklyCount, long todayCount) {",""],["        return weeklyCount + 5.0 * todayCount;","Trending boost: aaj ke searches ko zyada weight (time decay ka simple roop)"],["    }",""],["",""],["    public static void main(String[] args) {",""],["        AtomicReference<SuggestionTrie> live = new AtomicReference<>();","Serving nodes yahi reference padhte hain"],["        Map<String, Double> week41 = new TreeMap<>(Map.of(",""],["                \"java interview\", score(9_000, 300), \"javascript array\", score(12_000, 400), \"java streams\", score(5_000, 150),",""],["                \"jaipur weather\", score(7_000, 900), \"java 21 features\", score(2_000, 100), \"ipl schedule\", score(20_000, 800),",""],["                \"ipl live score\", score(15_000, 2_000), \"jav banned term\", score(50_000, 10_000)));",""],["        live.set(new SuggestionTrie(week41, 3, Set.of(\"banned\")));",""],["        for (String prefix : List.of(\"j\", \"jav\", \"java \", \"ip\")) System.out.println(\"'\" + prefix + \"' -> \" + live.get().suggest(prefix));",""],["",""],["        Map<String, Double> rebuilt = new TreeMap<>(week41);",""],["        rebuilt.put(\"ipl final tickets\", score(1_000, 9_000));","Achanak trending query"],["        live.set(new SuggestionTrie(rebuilt, 3, Set.of(\"banned\")));","Naya snapshot ek atomic swap me: readers ko kabhi half-built trie nahi dikhta"],["        System.out.println(\"after hourly rebuild, 'ip' -> \" + live.get().suggest(\"ip\"));",""],["    }",""],["}",""]]},"CapacityPlannerDemo":{"file":"CapacityPlannerDemo.java","lines":[["public class CapacityPlannerDemo {",""],["",""],["    record Workload(long dailyActiveUsers, double readsPerUserPerDay, double writesPerUserPerDay,",""],["                    double peakToAverage, double avgWriteKb, int replicationFactor) {}","Requirements se aane wale numbers"],["",""],["    record UnitCosts(double serverPerMonth, double hotGbPerMonth, double coldGbPerMonth, double egressPerGb) {}","ASSUMED example prices: apne cloud ki price sheet se bharo"],["",""],["    static final class CapacityPlanner {",""],["        static final double SECONDS_PER_DAY = 86_400;",""],["        private final Workload w;",""],["",""],["        CapacityPlanner(Workload w) { this.w = w; }",""],["",""],["        double averageReadQps() { return w.dailyActiveUsers() * w.readsPerUserPerDay() / SECONDS_PER_DAY; }",""],["",""],["        double peakReadQps() { return averageReadQps() * w.peakToAverage(); }","Design peak ke liye, average ke liye nahi"],["",""],["        double peakWriteQps() { return w.dailyActiveUsers() * w.writesPerUserPerDay() / SECONDS_PER_DAY * w.peakToAverage(); }",""],["",""],["        int serversNeeded(double peakQps, double qpsPerServerAtFullLoad, double targetUtilization, int spareServers) {",""],["            double usable = qpsPerServerAtFullLoad * targetUtilization;","100% CPU pe latency phat jaati hai: ~50-60% target"],["            return (int) Math.ceil(peakQps / usable) + spareServers;","N+2: ek maintenance + ek failure ke baad bhi peak sambhal sake"],["        }",""],["",""],["        double storageTbAfterYears(int years) {",""],["            double gbPerDay = w.dailyActiveUsers() * w.writesPerUserPerDay() * w.avgWriteKb() / (1024.0 * 1024.0);",""],["            return gbPerDay * 365 * years * w.replicationFactor() / 1024.0;","Replication factor bhulna common galti hai"],["        }",""],["",""],["        double monthlyStorageCost(double totalTb, double hotFraction, UnitCosts c) {","Tiering: purana data sasti storage me"],["            double gb = totalTb * 1024;",""],["            return gb * hotFraction * c.hotGbPerMonth() + gb * (1 - hotFraction) * c.coldGbPerMonth();",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Workload photoApp = new Workload(20_000_000, 50, 0.2, 3.0, 300, 3);","Example: 2 crore DAU photo app, har 5 me se 1 user roz ek photo daalta hai"],["        UnitCosts assumed = new UnitCosts(250, 0.10, 0.01, 0.05);",""],["        CapacityPlanner plan = new CapacityPlanner(photoApp);",""],["",""],["        System.out.printf(\"avg reads %.0f QPS, peak reads %.0f QPS, peak writes %.0f QPS%n\", plan.averageReadQps(), plan.peakReadQps(), plan.peakWriteQps());",""],["        int noCache = plan.serversNeeded(plan.peakReadQps(), 2_000, 0.6, 2);",""],["        double missRate = 1 - 0.9;","90% cache hit ratio"],["        int withCache = plan.serversNeeded(plan.peakReadQps() * missRate, 2_000, 0.6, 2);",""],["        System.out.println(\"read servers: without cache \" + noCache + \", with 90% cache hit \" + withCache + \" (+ cache cluster)\");",""],["        System.out.printf(\"server cost/month: $%,.0f vs $%,.0f (assumed $%.0f/server)%n\", noCache * assumed.serverPerMonth(), withCache * assumed.serverPerMonth(), assumed.serverPerMonth());",""],["",""],["        double tb = plan.storageTbAfterYears(3);",""],["        System.out.printf(\"storage after 3 years incl. RF=3: %.0f TB%n\", tb);",""],["        System.out.printf(\"storage cost/month: all hot $%,.0f vs 10%% hot + 90%% cold $%,.0f%n\",",""],["                plan.monthlyStorageCost(tb, 1.0, assumed), plan.monthlyStorageCost(tb, 0.10, assumed));","Tiering se cost ~5-8x kam"],["        double egressGbPerMonth = photoApp.dailyActiveUsers() * photoApp.readsPerUserPerDay() * 0.2 * 30 / 1024.0;","Har read ~200 KB image"],["        System.out.printf(\"egress if served from origin: %,.0f GB/month ~ $%,.0f per month (CDN offload is the biggest lever)%n\",",""],["                egressGbPerMonth, egressGbPerMonth * assumed.egressPerGb());",""],["    }",""],["}",""]]},"CdcPipelineDemo":{"file":"CdcPipelineDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.HashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.TreeMap;",""],["",""],["public class CdcPipelineDemo {",""],["",""],["    enum Op { CREATE, UPDATE, DELETE }",""],["",""],["    record ChangeEvent(long lsn, Op op, String orderId, String city, long amountPaise, String status) {}","Debezium event jaisa: position (LSN) + before/after (yahan sirf after)"],["",""],["    static final class OltpDatabase {","Source of truth (MySQL/Postgres); har commit binlog/WAL me change likhta hai"],["        final Map<String, ChangeEvent> rows = new TreeMap<>();",""],["        final List<ChangeEvent> binlog = new ArrayList<>();",""],["",""],["        void upsert(String id, String city, long amount, String status) {",""],["            Op op = rows.containsKey(id) ? Op.UPDATE : Op.CREATE;",""],["            ChangeEvent e = new ChangeEvent(binlog.size() + 1, op, id, city, amount, status);",""],["            rows.put(id, e);",""],["            binlog.add(e);","App sirf DB me likhta hai; event log DB khud banata hai (dual-write nahi)"],["        }",""],["",""],["        void delete(String id) {",""],["            ChangeEvent old = rows.remove(id);",""],["            binlog.add(new ChangeEvent(binlog.size() + 1, Op.DELETE, id, old.city(), 0, \"DELETED\"));",""],["        }",""],["    }",""],["",""],["    interface Sink {",""],["        void apply(ChangeEvent e);",""],["    }",""],["",""],["    static final class SearchIndexSink implements Sink {","Search docs: upsert / delete by key"],["        final Map<String, String> docs = new TreeMap<>();",""],["",""],["        public void apply(ChangeEvent e) {",""],["            if (e.op() == Op.DELETE) docs.remove(e.orderId());",""],["            else docs.put(e.orderId(), e.city() + \" \" + e.status());",""],["        }",""],["    }",""],["",""],["    static final class CityRevenueView implements Sink {","Materialized view (analytics): city -> revenue of PAID orders"],["        final Map<String, Long> revenueByCity = new TreeMap<>();",""],["        private final Map<String, ChangeEvent> lastSeen = new HashMap<>();","Har order ka last applied version: update pe purana contribution hatana"],["",""],["        public void apply(ChangeEvent e) {",""],["            ChangeEvent prev = lastSeen.get(e.orderId());",""],["            if (prev != null && \"PAID\".equals(prev.status())) revenueByCity.merge(prev.city(), -prev.amountPaise(), Long::sum);","Purana hissa minus"],["            if (e.op() != Op.DELETE && \"PAID\".equals(e.status())) revenueByCity.merge(e.city(), e.amountPaise(), Long::sum);","Naya hissa plus"],["            if (e.op() == Op.DELETE) lastSeen.remove(e.orderId()); else lastSeen.put(e.orderId(), e);",""],["        }",""],["    }",""],["",""],["    static final class Connector {","Consumer: har sink ka apna checkpoint (applied LSN)"],["        final String name;",""],["        final Sink sink;",""],["        long appliedLsn;",""],["        int skippedDuplicates;",""],["",""],["        Connector(String name, Sink sink, long startLsn) {",""],["            this.name = name;",""],["            this.sink = sink;",""],["            this.appliedLsn = startLsn;",""],["        }",""],["",""],["        void consume(List<ChangeEvent> events) {",""],["            for (ChangeEvent e : events) {",""],["                if (e.lsn() <= appliedLsn) {","Replay / duplicate delivery: LSN purana = pehle hi apply ho chuka, skip (idempotent)"],["                    skippedDuplicates++;",""],["                    continue;",""],["                }",""],["                sink.apply(e);",""],["                appliedLsn = e.lsn();","Real me ye offset sink ke saath atomically commit hota hai"],["            }",""],["        }",""],["    }",""],["",""],["    static Connector bootstrapFromSnapshot(String name, Sink sink, OltpDatabase db) {","Naya sink: pehle consistent snapshot, phir us LSN ke baad se stream"],["        long snapshotLsn = db.binlog.size();",""],["        db.rows.values().forEach(sink::apply);",""],["        return new Connector(name, sink, snapshotLsn);",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        OltpDatabase db = new OltpDatabase();",""],["        db.upsert(\"o1\", \"Pune\", 50_000, \"CREATED\");",""],["        db.upsert(\"o2\", \"Delhi\", 80_000, \"PAID\");",""],["        db.upsert(\"o1\", \"Pune\", 50_000, \"PAID\");",""],["        db.upsert(\"o3\", \"Pune\", 20_000, \"PAID\");",""],["",""],["        SearchIndexSink search = new SearchIndexSink();",""],["        CityRevenueView revenue = new CityRevenueView();",""],["        Connector searchConn = new Connector(\"search\", search, 0);",""],["        Connector revenueConn = new Connector(\"revenue\", revenue, 0);",""],["        searchConn.consume(db.binlog);",""],["        revenueConn.consume(db.binlog);",""],["        System.out.println(\"search docs  = \" + search.docs);",""],["        System.out.println(\"revenue/city = \" + revenue.revenueByCity);",""],["",""],["        db.upsert(\"o3\", \"Pune\", 20_000, \"REFUNDED\");","Refund: revenue se minus hona chahiye"],["        db.delete(\"o2\");",""],["        revenueConn.consume(db.binlog);","Pura binlog dobara diya (consumer restart from old offset): sirf naye events apply"],["        searchConn.consume(db.binlog);",""],["        System.out.println(\"after refund + delete, revenue/city = \" + revenue.revenueByCity + \" (duplicates skipped: \" + revenueConn.skippedDuplicates + \")\");",""],["        System.out.println(\"search docs  = \" + search.docs);",""],["",""],["        CityRevenueView warehouse = new CityRevenueView();",""],["        Connector warehouseConn = bootstrapFromSnapshot(\"warehouse\", warehouse, db);",""],["        db.upsert(\"o4\", \"Delhi\", 30_000, \"PAID\");",""],["        warehouseConn.consume(db.binlog);",""],["        revenueConn.consume(db.binlog);",""],["        System.out.println(\"new warehouse sink (snapshot + stream) = \" + warehouse.revenueByCity + \", matches live view? \"",""],["                + warehouse.revenueByCity.equals(revenue.revenueByCity));",""],["    }",""],["}",""]]},"CdnEdgeDemo":{"file":"CdnEdgeDemo.java","lines":[["import java.nio.charset.StandardCharsets;",""],["import java.security.GeneralSecurityException;",""],["import java.security.MessageDigest;",""],["import java.util.Base64;",""],["import java.util.HashMap;",""],["import java.util.Map;",""],["import javax.crypto.Mac;",""],["import javax.crypto.spec.SecretKeySpec;",""],["",""],["public class CdnEdgeDemo {",""],["",""],["    static final class UrlSigner {","Private content (paid video) ke liye signed URLs: edge bina origin se pooche verify kare"],["        private final byte[] secret;",""],["",""],["        UrlSigner(String secret) { this.secret = secret.getBytes(StandardCharsets.UTF_8); }",""],["",""],["        String sign(String path, long expiresEpochSec) {",""],["            try {",""],["                Mac mac = Mac.getInstance(\"HmacSHA256\");",""],["                mac.init(new SecretKeySpec(secret, \"HmacSHA256\"));",""],["                byte[] sig = mac.doFinal((path + \"|\" + expiresEpochSec).getBytes(StandardCharsets.UTF_8));","Path + expiry dono sign: koi bhi badla to signature fail"],["                return Base64.getUrlEncoder().withoutPadding().encodeToString(sig);",""],["            } catch (GeneralSecurityException e) {",""],["                throw new IllegalStateException(e);",""],["            }",""],["        }",""],["",""],["        boolean verify(String path, long expiresEpochSec, String signature, long nowEpochSec) {",""],["            if (nowEpochSec > expiresEpochSec) return false;","Expired link: share karke bhi kaam nahi aayega"],["            byte[] expected = sign(path, expiresEpochSec).getBytes(StandardCharsets.UTF_8);",""],["            return MessageDigest.isEqual(expected, signature.getBytes(StandardCharsets.UTF_8));","Constant-time compare: timing attack se signature guess nahi"],["        }",""],["    }",""],["",""],["    static final class Origin {",""],["        int requests;",""],["        boolean up = true;",""],["        final Map<String, String> files = new HashMap<>(Map.of(\"/app.v1.js\", \"console.log('v1')\", \"/video/42/seg1.ts\", \"<2s of video>\"));",""],["",""],["        String fetch(String path) {",""],["            if (!up) throw new IllegalStateException(\"origin 503\");",""],["            requests++;","Origin pe har request = paisa + load; CDN ka kaam isse bachana"],["            return files.get(path);",""],["        }",""],["    }",""],["",""],["    record CacheEntry(String body, long expiresAtSec) {}",""],["",""],["    static final class CacheTier {","Edge (user ke paas) ya Shield (region level): dono same logic"],["        final String name;",""],["        private final CacheTier parent;","Edge miss -> shield; shield miss -> origin"],["        private final Origin origin;",""],["        private final long ttlSec;",""],["        private final Map<String, CacheEntry> cache = new HashMap<>();",""],["",""],["        CacheTier(String name, CacheTier parent, Origin origin, long ttlSec) {",""],["            this.name = name;",""],["            this.parent = parent;",""],["            this.origin = origin;",""],["            this.ttlSec = ttlSec;",""],["        }",""],["",""],["        String get(String path, long now, StringBuilder trace) {",""],["            CacheEntry e = cache.get(path);",""],["            if (e != null && now < e.expiresAtSec()) {","Fresh hit: sabse fast"],["                trace.append(name).append(\" HIT\");",""],["                return e.body();",""],["            }",""],["            trace.append(name).append(e == null ? \" MISS -> \" : \" STALE -> \");",""],["            try {",""],["                String body = parent != null ? parent.get(path, now, trace) : origin.fetch(path);","Origin shield: kai edges ke misses ek jagah collapse"],["                if (parent == null) trace.append(\"origin\");",""],["                cache.put(path, new CacheEntry(body, now + ttlSec));",""],["                return body;",""],["            } catch (IllegalStateException err) {",""],["                if (e != null) {","stale-if-error: origin down hai to purana copy serve karo (better than 503)"],["                    trace.append(\"origin down, served STALE\");",""],["                    return e.body();",""],["                }",""],["                throw err;",""],["            }",""],["        }",""],["",""],["        void purge(String path) { cache.remove(path); }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Origin origin = new Origin();",""],["        CacheTier shield = new CacheTier(\"shield-ap-south\", null, origin, 600);",""],["        CacheTier mumbai = new CacheTier(\"edge-mumbai\", shield, origin, 60);",""],["        CacheTier delhi = new CacheTier(\"edge-delhi\", shield, origin, 60);",""],["        Map<String, CacheTier> geoDns = Map.of(\"Mumbai\", mumbai, \"Pune\", mumbai, \"Delhi\", delhi);","GeoDNS / Anycast: user ko nearest edge"],["",""],["        String[][] requests = {{\"Mumbai\", \"0\"}, {\"Pune\", \"5\"}, {\"Delhi\", \"8\"}, {\"Mumbai\", \"70\"}};",""],["        for (String[] r : requests) {",""],["            StringBuilder trace = new StringBuilder();",""],["            geoDns.get(r[0]).get(\"/app.v1.js\", Long.parseLong(r[1]), trace);",""],["            System.out.printf(\"t=%3ss %-6s -> %s%n\", r[1], r[0], trace);",""],["        }",""],["        System.out.println(\"origin requests so far = \" + origin.requests + \" (4 user requests)\");",""],["",""],["        origin.up = false;",""],["        StringBuilder trace = new StringBuilder();",""],["        mumbai.get(\"/app.v1.js\", 700, trace);",""],["        System.out.println(\"t=700s origin DOWN -> \" + trace);",""],["        origin.up = true;",""],["",""],["        UrlSigner signer = new UrlSigner(\"edge-secret-key\");",""],["        long expires = 1_000;",""],["        String sig = signer.sign(\"/video/42/seg1.ts\", expires);",""],["        System.out.println(\"signed URL valid?      \" + signer.verify(\"/video/42/seg1.ts\", expires, sig, 900));",""],["        System.out.println(\"tampered path valid?   \" + signer.verify(\"/video/43/seg1.ts\", expires, sig, 900));",""],["        System.out.println(\"after expiry valid?    \" + signer.verify(\"/video/42/seg1.ts\", expires, sig, 1_200));",""],["    }",""],["}",""]]},"ChatServiceDemo":{"file":"ChatServiceDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.Collections;",""],["import java.util.Deque;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Optional;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.concurrent.ConcurrentLinkedDeque;",""],["import java.util.concurrent.atomic.AtomicLong;",""],["import java.util.function.Consumer;",""],["",""],["public class ChatServiceDemo {",""],["",""],["    enum MessageStatus { SENT, DELIVERED, READ }","SENT = server ne save kiya (1 tick), DELIVERED = device pe pahuncha (2 ticks), READ = blue ticks"],["",""],["    static final class Message {",""],["        final String messageId;",""],["        final String clientMessageId;",""],["        final String conversationId;",""],["        final long sequence;",""],["        final String senderId;",""],["        final String text;",""],["        volatile MessageStatus status = MessageStatus.SENT;","volatile: ek thread status badle to doosre threads ko turant dikhe"],["",""],["        Message(String messageId, String clientMessageId, String conversationId, long sequence, String senderId, String text) {",""],["            this.messageId = messageId;",""],["            this.clientMessageId = clientMessageId;",""],["            this.conversationId = conversationId;",""],["            this.sequence = sequence;",""],["            this.senderId = senderId;",""],["            this.text = text;",""],["        }",""],["",""],["        @Override",""],["        public String toString() { return \"#\" + sequence + \" \" + senderId + \": \" + text + \" [\" + status + \"]\"; }",""],["    }",""],["",""],["    static final class SessionRegistry {","Redis stand-in: userId -> live WebSocket (real: userId -> gateway server id)"],["        private final Map<String, Consumer<Message>> onlineUsers = new ConcurrentHashMap<>();",""],["",""],["        void connect(String userId, Consumer<Message> socket) { onlineUsers.put(userId, socket); }",""],["",""],["        void disconnect(String userId) { onlineUsers.remove(userId); }",""],["",""],["        Optional<Consumer<Message>> findConnection(String userId) { return Optional.ofNullable(onlineUsers.get(userId)); }",""],["    }",""],["",""],["    static final class ChatService {",""],["        private final SessionRegistry sessions;",""],["        private final Map<String, List<Message>> messageStore = new ConcurrentHashMap<>();","Cassandra stand-in: partition key = conversationId, rows sequence order me"],["        private final Map<String, AtomicLong> sequenceByConversation = new ConcurrentHashMap<>();","Har conversation ka apna counter: ordering per chat, koi global lock nahi"],["        private final Map<String, Message> byClientMessageId = new ConcurrentHashMap<>();","Dedup index: retry pe same clientMessageId aata hai"],["        private final Map<String, Deque<Message>> pendingInbox = new ConcurrentHashMap<>();","Offline user ke undelivered messages"],["        private final AtomicLong messageIds = new AtomicLong();",""],["",""],["        ChatService(SessionRegistry sessions) { this.sessions = sessions; }",""],["",""],["        static String conversationIdFor(String userA, String userB) {","1:1 chat ka stable id: sorted names, isliye A-B aur B-A same chat"],["            return userA.compareTo(userB) < 0 ? userA + \"_\" + userB : userB + \"_\" + userA;",""],["        }",""],["",""],["        Message sendMessage(String clientMessageId, String senderId, String recipientId, String text) {",""],["            Message existing = byClientMessageId.get(clientMessageId);",""],["            if (existing != null) return existing;","Idempotent send: network retry pe wahi message wapas, duplicate nahi"],["            String conversationId = conversationIdFor(senderId, recipientId);",""],["            long sequence = sequenceByConversation.computeIfAbsent(conversationId, k -> new AtomicLong()).incrementAndGet();","Server-assigned sequence: ordering client ki ghadi pe depend nahi karti"],["            Message message = new Message(\"m\" + messageIds.incrementAndGet(), clientMessageId, conversationId, sequence, senderId, text);",""],["            Message winner = byClientMessageId.putIfAbsent(clientMessageId, message);",""],["            if (winner != null) return winner;","Do retries bilkul ek saath aayi: jo pehle register hua wahi jeeta"],["            messageStore.computeIfAbsent(conversationId, k -> Collections.synchronizedList(new ArrayList<>())).add(message);","1) Pehle durable store; single tick sirf persist ke baad"],["            deliverOrQueue(recipientId, message);","2) Phir delivery"],["            return message;",""],["        }",""],["",""],["        private void deliverOrQueue(String recipientId, Message message) {",""],["            Optional<Consumer<Message>> socket = sessions.findConnection(recipientId);",""],["            if (socket.isPresent()) {",""],["                socket.get().accept(message);","Online: WebSocket pe push (real me recipient ke gateway ko route)"],["            } else {",""],["                pendingInbox.computeIfAbsent(recipientId, k -> new ConcurrentLinkedDeque<>()).add(message);","Offline: inbox me rakho + push notification trigger"],["            }",""],["        }",""],["",""],["        void acknowledgeDelivery(Message message) {","Recipient device ka ACK: double tick"],["            if (message.status == MessageStatus.SENT) message.status = MessageStatus.DELIVERED;",""],["        }",""],["",""],["        void markConversationRead(String readerId, String conversationId, long upToSequence) {","Read receipt \"yahan tak padha\" (sequence) bhejta hai, har message ka alag nahi"],["            List<Message> messages = messageStore.get(conversationId);",""],["            if (messages == null) return;",""],["            synchronized (messages) {","synchronizedList pe iterate karte waqt list ka lock lena zaroori"],["                for (Message m : messages) {",""],["                    if (!m.senderId.equals(readerId) && m.sequence <= upToSequence) m.status = MessageStatus.READ;",""],["                }",""],["            }",""],["        }",""],["",""],["        List<Message> syncPendingMessages(String userId) {","Reconnect pe: offline time ke saare messages ek saath"],["            Deque<Message> inbox = pendingInbox.remove(userId);",""],["            if (inbox == null) return List.of();",""],["            List<Message> delivered = new ArrayList<>(inbox);",""],["            delivered.forEach(this::acknowledgeDelivery);",""],["            return delivered;",""],["        }",""],["",""],["        List<Message> history(String conversationId) {",""],["            List<Message> messages = messageStore.getOrDefault(conversationId, List.of());",""],["            synchronized (messages) { return new ArrayList<>(messages); }",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        SessionRegistry sessions = new SessionRegistry();",""],["        ChatService chat = new ChatService(sessions);",""],["        sessions.connect(\"bob\", m -> {",""],["            System.out.println(\"bob's phone got: \" + m);",""],["            chat.acknowledgeDelivery(m);","Device ne turant ACK bheja"],["        });",""],["",""],["        Message first = chat.sendMessage(\"c-001\", \"alice\", \"bob\", \"Hi Bob!\");",""],["        chat.sendMessage(\"c-001\", \"alice\", \"bob\", \"Hi Bob!\");","Same clientMessageId (retry): naya message nahi banega"],["        sessions.disconnect(\"bob\");",""],["        chat.sendMessage(\"c-002\", \"alice\", \"bob\", \"Kal meeting 10 baje?\");",""],["        chat.sendMessage(\"c-003\", \"alice\", \"bob\", \"Reply jab online aao\");",""],["        System.out.println(\"history: \" + chat.history(first.conversationId));",""],["",""],["        List<Message> synced = chat.syncPendingMessages(\"bob\");",""],["        System.out.println(\"bob reconnects, synced \" + synced.size() + \" messages\");",""],["        chat.markConversationRead(\"bob\", first.conversationId, 3);",""],["        System.out.println(\"after read: \" + chat.history(first.conversationId));",""],["    }",""],["}",""]]},"CircuitBreakerDemo":{"file":"CircuitBreakerDemo.java","lines":[["import java.util.concurrent.ThreadLocalRandom;",""],["import java.util.function.Supplier;",""],["",""],["public class CircuitBreakerDemo {","Ek file me poora demo: CircuitBreaker + RetryPolicy + main()"],["",""],["    enum State { CLOSED, OPEN, HALF_OPEN }","CLOSED = normal traffic, OPEN = calls block (fail fast), HALF_OPEN = kuch trial calls"],["",""],["    static class CircuitBreaker {",""],["        private final int failureThreshold;","Kitne lagatar failures ke baad circuit OPEN hoga"],["        private final long openTimeoutMillis;","OPEN me kitni der rukna hai, phir HALF_OPEN trial"],["        private State state = State.CLOSED;",""],["        private int consecutiveFailures = 0;",""],["        private long openedAtMillis = 0;",""],["",""],["        CircuitBreaker(int failureThreshold, long openTimeoutMillis) {",""],["            this.failureThreshold = failureThreshold;",""],["            this.openTimeoutMillis = openTimeoutMillis;",""],["        }",""],["",""],["        <T> T callWithBreaker(Supplier<T> remoteCall, Supplier<T> fallback) {","Main entry: remote call breaker ke through; fail ya OPEN ho to fallback"],["            if (!allowRequest()) {",""],["                return fallback.get();","Fail fast: downstream ko hit hi nahi kiya, turant cached/default answer"],["            }",""],["            try {",""],["                T result = remoteCall.get();","Asli network call LOCK KE BAHAR, taaki slow call baaki threads ko block na kare"],["                onSuccess();",""],["                return result;",""],["            } catch (RuntimeException ex) {",""],["                onFailure();",""],["                return fallback.get();",""],["            }",""],["        }",""],["",""],["        private synchronized boolean allowRequest() {","State padhna/badalna synchronized: do threads ek saath state na bigaadein"],["            if (state != State.OPEN) return true;",""],["            if (System.currentTimeMillis() - openedAtMillis >= openTimeoutMillis) {","Cool-down poora: ek trial ke liye HALF_OPEN"],["                state = State.HALF_OPEN;",""],["                return true;",""],["            }",""],["            return false;",""],["        }",""],["",""],["        private synchronized void onSuccess() {",""],["            consecutiveFailures = 0;","Success pe counter reset aur circuit wapas CLOSED"],["            state = State.CLOSED;",""],["        }",""],["",""],["        private synchronized void onFailure() {",""],["            consecutiveFailures++;",""],["            if (state == State.HALF_OPEN || consecutiveFailures >= failureThreshold) {","HALF_OPEN me ek bhi fail = wapas OPEN; CLOSED me threshold cross = OPEN"],["                state = State.OPEN;",""],["                openedAtMillis = System.currentTimeMillis();",""],["            }",""],["        }",""],["",""],["        synchronized State currentState() { return state; }",""],["    }",""],["",""],["    static class RetryPolicy {",""],["        private final int maxAttempts;",""],["        private final long baseDelayMillis;",""],["        private final long maxDelayMillis;",""],["",""],["        RetryPolicy(int maxAttempts, long baseDelayMillis, long maxDelayMillis) {",""],["            this.maxAttempts = maxAttempts;",""],["            this.baseDelayMillis = baseDelayMillis;",""],["            this.maxDelayMillis = maxDelayMillis;",""],["        }",""],["",""],["        long computeBackoffDelay(int attempt) {","attempt 1,2,3 ke liye wait: base * 2^(attempt-1), upar cap"],["            long exponential = baseDelayMillis * (1L << Math.min(attempt - 1, 20));","Shift ko 20 pe cap kiya taaki long overflow na ho"],["            long capped = Math.min(exponential, maxDelayMillis);",""],["            return ThreadLocalRandom.current().nextLong(capped / 2, capped + 1);","Jitter: random delay, taaki hazaron clients ek hi pal me retry na karein (thundering herd)"],["        }",""],["",""],["        <T> T executeWithRetry(Supplier<T> call) throws InterruptedException {",""],["            RuntimeException lastError = null;",""],["            for (int attempt = 1; attempt <= maxAttempts; attempt++) {",""],["                try {",""],["                    return call.get();",""],["                } catch (RuntimeException ex) {",""],["                    lastError = ex;",""],["                    if (attempt < maxAttempts) Thread.sleep(computeBackoffDelay(attempt));","Retry sirf idempotent calls pe safe (GET, ya Idempotency-Key wala POST)"],["                }",""],["            }",""],["            throw lastError;","Saare attempts fail: error upar bhejo (ya DLQ me daalo)"],["        }",""],["    }",""],["",""],["    public static void main(String[] args) throws InterruptedException {",""],["        CircuitBreaker breaker = new CircuitBreaker(3, 200);",""],["        Supplier<String> flakyPaymentCall = () -> { throw new RuntimeException(\"timeout\"); };",""],["        Supplier<String> cachedFallback = () -> \"fallback: payment status PENDING\";",""],["        for (int i = 1; i <= 5; i++) {",""],["            String reply = breaker.callWithBreaker(flakyPaymentCall, cachedFallback);",""],["            System.out.println(\"call \" + i + \" -> \" + reply + \" | state=\" + breaker.currentState());","3 fail ke baad OPEN: call 4,5 downstream tak jaati hi nahi"],["        }",""],["        Thread.sleep(250);",""],["        String reply = breaker.callWithBreaker(() -> \"payment OK\", cachedFallback);",""],["        System.out.println(\"after cool-down -> \" + reply + \" | state=\" + breaker.currentState());",""],["",""],["        RetryPolicy retry = new RetryPolicy(4, 50, 1000);",""],["        for (int a = 1; a <= 4; a++) System.out.println(\"attempt \" + a + \" backoff ~\" + retry.computeBackoffDelay(a) + \" ms\");",""],["        int[] calls = {0};",""],["        String result = retry.executeWithRetry(() -> {",""],["            if (++calls[0] < 3) throw new RuntimeException(\"503\");",""],["            return \"OK after \" + calls[0] + \" attempts\";",""],["        });",""],["        System.out.println(result);",""],["    }",""],["}",""]]},"CollabEditDemo":{"file":"CollabEditDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.List;",""],["",""],["public class CollabEditDemo {","Operational Transformation (OT), Google Docs jaisa: central server order tay karta hai"],["",""],["    record Op(String type, int pos, char ch, String site) {","Single-character insert/delete; text = in ops ka sequence"],["        static Op insert(int pos, char ch, String site) { return new Op(\"ins\", pos, ch, site); }",""],["",""],["        static Op delete(int pos, String site) { return new Op(\"del\", pos, ' ', site); }",""],["",""],["        static Op noop(String site) { return new Op(\"noop\", -1, ' ', site); }",""],["",""],["        Op shift(int by) { return new Op(type, pos + by, ch, site); }",""],["",""],["        @Override",""],["        public String toString() { return type.equals(\"ins\") ? \"ins(\" + pos + \",'\" + ch + \"')\" : type.equals(\"del\") ? \"del(\" + pos + \")\" : \"noop\"; }",""],["    }",""],["",""],["    static Op transform(Op a, Op b) {","a ko is tarah badlo ki b ke BAAD apply karne pe bhi user ka intent same rahe"],["        if (a.type().equals(\"noop\") || b.type().equals(\"noop\")) return a;",""],["        boolean aIns = a.type().equals(\"ins\"), bIns = b.type().equals(\"ins\");",""],["        if (aIns && bIns) {",""],["            boolean aFirst = a.pos() < b.pos() || (a.pos() == b.pos() && a.site().compareTo(b.site()) < 0);","Same position pe tie: site id se fixed order, taaki sab jagah same result"],["            return aFirst ? a : a.shift(1);",""],["        }",""],["        if (aIns) return a.pos() <= b.pos() ? a : a.shift(-1);","Mere se pehle delete hua: main ek peeche khisko"],["        if (bIns) return a.pos() < b.pos() ? a : a.shift(1);","Mere se pehle insert hua: main ek aage khisko"],["        if (a.pos() == b.pos()) return Op.noop(a.site());","Dono ne same char delete kiya: doosri baar kuch nahi"],["        return a.pos() < b.pos() ? a : a.shift(-1);",""],["    }",""],["",""],["    static String apply(String doc, Op op) {",""],["        return switch (op.type()) {",""],["            case \"ins\" -> doc.substring(0, op.pos()) + op.ch() + doc.substring(op.pos());",""],["            case \"del\" -> doc.substring(0, op.pos()) + doc.substring(op.pos() + 1);",""],["            default -> doc;",""],["        };",""],["    }",""],["",""],["    static final class DocumentServer {","Har document ka ek owner server (docId se consistent hashing): ordering yahin tay"],["        String doc;",""],["        final List<Op> history = new ArrayList<>();","Op log = durable truth; snapshot + log se version history"],["",""],["        DocumentServer(String initial) { this.doc = initial; }",""],["",""],["        Op receive(Op op, int baseRevision) {",""],["            for (int i = baseRevision; i < history.size(); i++) op = transform(op, history.get(i));","Client ne jo ops nahi dekhe, unke against transform"],["            doc = apply(doc, op);",""],["            history.add(op);",""],["            return op;","Transformed op baaki clients ko broadcast"],["        }",""],["",""],["        int revision() { return history.size(); }",""],["    }",""],["",""],["    static final class Client {",""],["        final String site;",""],["        String doc;",""],["        int revision;",""],["        Op pending;","Bheja hua par ack nahi aaya (ek time pe ek)"],["",""],["        Client(String site, String doc) {",""],["            this.site = site;",""],["            this.doc = doc;",""],["        }",""],["",""],["        Op edit(Op op) {","Local echo: user ko turant dikhe, server ka wait nahi (0 ms typing latency)"],["            doc = apply(doc, op);",""],["            pending = op;",""],["            return op;",""],["        }",""],["",""],["        void onAck() {",""],["            pending = null;",""],["            revision++;",""],["        }",""],["",""],["        void onRemote(Op remote) {",""],["            if (pending != null) {","Mera unacked op server pe is remote op ke BAAD lagega: dono ko ek doosre ke against transform"],["                Op remoteForMe = transform(remote, pending);",""],["                pending = transform(pending, remote);",""],["                remote = remoteForMe;",""],["            }",""],["            doc = apply(doc, remote);",""],["            revision++;",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        DocumentServer server = new DocumentServer(\"cat\");",""],["        Client alice = new Client(\"alice\", \"cat\");",""],["        Client bob = new Client(\"bob\", \"cat\");",""],["",""],["        Op a1 = alice.edit(Op.insert(3, 's', \"alice\"));","Alice: \"cats\""],["        Op b1 = bob.edit(Op.delete(0, \"bob\"));","Bob same time: \"at\""],["        System.out.println(\"local: alice='\" + alice.doc + \"' bob='\" + bob.doc + \"'\");",""],["        Op a1s = server.receive(a1, 0);","Server pe Alice pehle pahunchi"],["        alice.onAck();",""],["        Op b1s = server.receive(b1, 0);","Bob ka op base 0 pe tha: Alice ke op ke against transform"],["        bob.onRemote(a1s);","Bob ko Alice ka op mila (uska apna abhi pending)"],["        bob.onAck();",""],["        alice.onRemote(b1s);",""],["        System.out.println(\"round 1: server='\" + server.doc + \"' alice='\" + alice.doc + \"' bob='\" + bob.doc + \"' (converged)\");",""],["",""],["        int base = server.revision();",""],["        Op a2 = alice.edit(Op.insert(0, 'h', \"alice\"));","Dono ne position 0 pe type kiya"],["        Op b2 = bob.edit(Op.insert(0, 'b', \"bob\"));",""],["        Op b2s = server.receive(b2, base);","Is baar Bob pehle"],["        bob.onAck();",""],["        Op a2s = server.receive(a2, base);",""],["        alice.onRemote(b2s);",""],["        alice.onAck();",""],["        bob.onRemote(a2s);",""],["        System.out.println(\"round 2 tie: server='\" + server.doc + \"' alice='\" + alice.doc + \"' bob='\" + bob.doc + \"' transformed=\" + a2s + \",\" + b2s);",""],["        System.out.println(\"history = \" + server.history);",""],["    }",""],["}",""]]},"ConcurrencyDemo":{"file":"ConcurrencyDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.List;",""],["import java.util.concurrent.Callable;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.concurrent.ExecutorService;",""],["import java.util.concurrent.Executors;",""],["import java.util.concurrent.Future;",""],["import java.util.concurrent.TimeUnit;",""],["import java.util.concurrent.atomic.AtomicInteger;",""],["import java.util.concurrent.atomic.AtomicReference;",""],["import java.util.concurrent.locks.ReentrantLock;",""],["",""],["public class ConcurrencyDemo {",""],["",""],["    static final class BankAccount {",""],["        final long id;","id se lock ordering tay hoti hai (deadlock se bachne ke liye)"],["        private long balancePaise;",""],["        final ReentrantLock lock = new ReentrantLock();","Har account ka apna lock: fine-grained, poore bank ka ek lock nahi"],["",""],["        BankAccount(long id, long balancePaise) {",""],["            this.id = id;",""],["            this.balancePaise = balancePaise;",""],["        }",""],["",""],["        long balance() { return balancePaise; }",""],["    }",""],["",""],["    static boolean transferMoney(BankAccount from, BankAccount to, long amountPaise) throws InterruptedException {",""],["        BankAccount first = from.id < to.id ? from : to;","Lock ordering: hamesha chhote id ka lock pehle; A->B aur B->A saath chalein to bhi deadlock nahi"],["        BankAccount second = from.id < to.id ? to : from;",""],["        if (!first.lock.tryLock(50, TimeUnit.MILLISECONDS)) return false;","tryLock timeout: hamesha ke liye nahi atakte, caller retry kar sakta hai"],["        try {",""],["            if (!second.lock.tryLock(50, TimeUnit.MILLISECONDS)) return false;",""],["            try {",""],["                if (from.balancePaise < amountPaise) return false;","Check aur update dono lock ke andar: check-then-act race khatam"],["                from.balancePaise -= amountPaise;",""],["                to.balancePaise += amountPaise;",""],["                return true;",""],["            } finally {",""],["                second.lock.unlock();","finally me unlock: exception aaye to bhi lock chhootega"],["            }",""],["        } finally {",""],["            first.lock.unlock();",""],["        }",""],["    }",""],["",""],["    record VersionedStock(int quantity, long version) {}","Immutable snapshot: quantity + version (DB me version column)"],["",""],["    static final AtomicReference<VersionedStock> STOCK = new AtomicReference<>(new VersionedStock(100, 0));",""],["",""],["    static boolean reserveStockOptimistic(int quantity) {","Optimistic locking: lock nahi pakadte, likhte waqt check karte hain"],["        while (true) {",""],["            VersionedStock current = STOCK.get();","Snapshot padho (DB: SELECT qty, version)"],["            if (current.quantity() < quantity) return false;","Stock khatam: overselling nahi"],["            VersionedStock next = new VersionedStock(current.quantity() - quantity, current.version() + 1);",""],["            if (STOCK.compareAndSet(current, next)) return true;","CAS = UPDATE ... WHERE version = old; beech me kisi ne badla to fail, loop me retry"],["        }",""],["    }",""],["",""],["    public static void main(String[] args) throws Exception {",""],["        BankAccount a = new BankAccount(1, 1_000_000);",""],["        BankAccount b = new BankAccount(2, 1_000_000);",""],["        ExecutorService pool = Executors.newFixedThreadPool(8);","Thread pool: har task ke liye naya thread banana mehenga"],["        AtomicInteger successful = new AtomicInteger();","AtomicInteger: lock ke bina thread-safe counter"],["",""],["        List<Callable<Void>> transfers = new ArrayList<>();",""],["        for (int i = 0; i < 2_000; i++) {",""],["            final boolean aToB = i % 2 == 0;",""],["            transfers.add(() -> {",""],["                if (transferMoney(aToB ? a : b, aToB ? b : a, 100)) successful.incrementAndGet();",""],["                return null;",""],["            });",""],["        }",""],["        pool.invokeAll(transfers);","Saare tasks parallel chalao aur sabke khatam hone tak ruko"],["        System.out.println(\"transfers ok = \" + successful.get() + \", total money = \" + (a.balance() + b.balance()) + \" (must stay 2000000)\");",""],["",""],["        ConcurrentHashMap<String, Integer> hits = new ConcurrentHashMap<>();",""],["        List<Callable<Void>> counters = new ArrayList<>();",""],["        for (int i = 0; i < 1_000; i++) {",""],["            counters.add(() -> {",""],["                hits.merge(\"/home\", 1, Integer::sum);","merge() atomic hai; get() + put() alag likhte to updates kho jaate"],["                return null;",""],["            });",""],["        }",""],["        pool.invokeAll(counters);",""],["        System.out.println(\"hits = \" + hits);",""],["",""],["        List<Callable<Boolean>> buyers = new ArrayList<>();",""],["        for (int i = 0; i < 150; i++) buyers.add(() -> reserveStockOptimistic(1));","150 buyers, sirf 100 stock"],["        int sold = 0;",""],["        for (Future<Boolean> f : pool.invokeAll(buyers)) if (f.get()) sold++;",""],["        System.out.println(\"sold = \" + sold + \", left = \" + STOCK.get().quantity() + \" (no overselling)\");",""],["        pool.shutdown();",""],["    }",""],["}",""]]},"ConsistentHashingDemo":{"file":"ConsistentHashingDemo.java","lines":[["import java.nio.charset.StandardCharsets;",""],["import java.security.MessageDigest;",""],["import java.security.NoSuchAlgorithmException;",""],["import java.util.ArrayList;",""],["import java.util.HashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.TreeMap;",""],["",""],["public class ConsistentHashingDemo {",""],["",""],["    static class ConsistentHashRing {",""],["        private final TreeMap<Long, String> ring = new TreeMap<>();","TreeMap = sorted ring: hash position -> server; lookup O(log n)"],["        private final int virtualNodesPerServer;",""],["",""],["        ConsistentHashRing(int virtualNodesPerServer) {",""],["            this.virtualNodesPerServer = virtualNodesPerServer;",""],["        }",""],["",""],["        void addServer(String server) {",""],["            for (int i = 0; i < virtualNodesPerServer; i++) {",""],["                ring.put(hash(server + \"#vn\" + i), server);","Har server ke 100 virtual nodes: load evenly bantta hai"],["            }",""],[
