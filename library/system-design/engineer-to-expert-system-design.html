 sample raw (64-bit ts + 64-bit value)"],["            for (int i = 1; i < list.size(); i++) {",""],["                long delta = list.get(i).tsSec() - list.get(i - 1).tsSec();",""],["                long prevDelta = i > 1 ? list.get(i - 1).tsSec() - list.get(i - 2).tsSec() : delta;",""],["                long dod = delta - prevDelta;",""],["                bits += dod == 0 ? 1 : (Math.abs(dod) < 64 ? 9 : 36);","Regular scrape interval = delta-of-delta 0 = sirf 1 bit"],["                long xor = Double.doubleToLongBits(list.get(i).value()) ^ Double.doubleToLongBits(list.get(i - 1).value());",""],["                bits += xor == 0 ? 1 : 2 + 5 + 6 + (64 - Long.numberOfLeadingZeros(xor) - Long.numberOfTrailingZeros(xor));","Same value = 1 bit; similar values = kam meaningful bits"],["            }",""],["            return bits;",""],["        }",""],["    }",""],["",""],["    enum AlertState { OK, PENDING, FIRING }",""],["",""],["    static final class AlertRule {","\"avg CPU > 80% for 2 evaluations\" (Prometheus 'for' jaisa)"],["        final String name;",""],["        final double threshold;",""],["        final int forEvaluations;",""],["        AlertState state = AlertState.OK;",""],["        int consecutiveBreaches;",""],["        final List<String> notifications = new ArrayList<>();",""],["",""],["        AlertRule(String name, double threshold, int forEvaluations) {",""],["            this.name = name;",""],["            this.threshold = threshold;",""],["            this.forEvaluations = forEvaluations;",""],["        }",""],["",""],["        void evaluate(double value, long now) {",""],["            AlertState before = state;",""],["            if (value > threshold) {",""],["                consecutiveBreaches++;",""],["                state = consecutiveBreaches >= forEvaluations ? AlertState.FIRING : AlertState.PENDING;","'for' duration: ek spike pe page nahi (alert fatigue kam)"],["            } else {",""],["                consecutiveBreaches = 0;",""],["                state = AlertState.OK;",""],["            }",""],["            if (before != state && (state == AlertState.FIRING || before == AlertState.FIRING)) {","Sirf state change pe notify: har evaluation pe spam nahi"],["                notifications.add(\"t=\" + now + \"s \" + name + \" \" + (state == AlertState.FIRING ? \"FIRING\" : \"RESOLVED\") + String.format(\" (%.0f%%)\", value));",""],["            }",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Tsdb tsdb = new Tsdb(5);",""],["        Map<String, String> host1 = Map.of(\"host\", \"h1\", \"dc\", \"mumbai\");",""],["        for (long t = 0; t < 600; t += 10) {","10 minute, har 10s scrape"],["            double cpu = (t >= 180 && t < 360) ? 92 : 45 + (t % 30) / 10.0;","Minute 3-6 me CPU spike"],["            tsdb.append(\"cpu_percent\", host1, t, cpu);",""],["        }",""],["        AlertRule rule = new AlertRule(\"HighCPU h1\", 80, 2);",""],["        for (long now = 60; now <= 600; now += 60) {","Har minute rule evaluate"],["            double avg = tsdb.range(\"cpu_percent\", host1, now - 60, now).stream().mapToDouble(Sample::value).average().orElse(0);",""],["            rule.evaluate(avg, now);",""],["            System.out.printf(\"t=%3ds avg=%5.1f%% state=%s%n\", now, avg, rule.state);",""],["        }",""],["        System.out.println(\"notifications: \" + rule.notifications);",""],["        System.out.println(\"1-min averages: \" + tsdb.downsampleAvg(\"cpu_percent\", host1, 60).values().stream().map(v -> String.format(\"%.0f\", v)).toList());",""],["        int raw = 60 * 128;",""],["        int compressed = tsdb.estimateCompressedBits(\"cpu_percent\", host1);",""],["        System.out.printf(\"60 samples: raw %d bits vs ~%d bits (%.1fx smaller)%n\", raw, compressed, raw / (double) compressed);",""],["",""],["        int accepted = 0;",""],["        for (int user = 0; user < 1_000; user++) {","Kisi ne galti se user_id label daal diya"],["            if (tsdb.append(\"http_requests\", new LinkedHashMap<>(Map.of(\"user_id\", \"u\" + user)), 0, 1)) accepted++;",""],["        }",""],["        System.out.println(\"high-cardinality label: accepted \" + accepted + \" series, dropped \" + tsdb.droppedSamples + \" samples (alert the owning team)\");",""],["    }",""],["}",""]]},"MigrationRouterDemo":{"file":"MigrationRouterDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.List;",""],["import java.util.TreeMap;",""],["",""],["public class MigrationRouterDemo {",""],["",""],["    enum Phase { OLD_ONLY, DUAL_WRITE, SHADOW_READ, READ_NEW, NEW_ONLY }","Har phase alag deploy/flag; har step se pichhle pe rollback possible"],["",""],["    record User(String id, String name, String email) {}",""],["",""],["    static final class MigrationRouter {",""],["        final TreeMap<String, User> oldStore = new TreeMap<>();","Purana: monolith MySQL table"],["        final TreeMap<String, User> newStore = new TreeMap<>();","Naya: user-service ka apna DB (email lowercase normalized)"],["        Phase phase = Phase.OLD_ONLY;",""],["        int readNewPercent = 0;","READ_NEW me gradual rollout: 1% → 10% → 100%"],["        int shadowMismatches;",""],["        String backfillCheckpoint = \"\";","Backfill kahan tak pahuncha: crash ke baad wahin se"],["        boolean buggyTransform = true;","Demo: pehli backfill me transform bug (email normalize bhool gaye)"],["        final List<String> log = new ArrayList<>();",""],["",""],["        User toNewSchema(User u, boolean viaBackfill) {",""],["            String email = (viaBackfill && buggyTransform) ? u.email() : u.email().toLowerCase();",""],["            return new User(u.id(), u.name().trim(), email);",""],["        }",""],["",""],["        void write(User u) {",""],["            if (phase != Phase.NEW_ONLY) oldStore.put(u.id(), u);","NEW_ONLY tak purana store bhi updated rehta hai: rollback ka raasta khula"],["            if (phase != Phase.OLD_ONLY) newStore.put(u.id(), toNewSchema(u, false));","DUAL_WRITE se naye store me bhi (real: CDC se, taaki dual-write inconsistency na ho)"],["        }",""],["",""],["        void backfill(int batchSize) {","Purane rows naye store me, batches me, checkpoint ke saath (aur throttled)"],["            int copied = 0;",""],["            for (User u : oldStore.tailMap(backfillCheckpoint, false).values()) {",""],["                newStore.putIfAbsent(u.id(), toNewSchema(u, true));","putIfAbsent: dual-write ne naya version likha ho to purane snapshot se overwrite nahi"],["                backfillCheckpoint = u.id();",""],["                if (++copied == batchSize) break;",""],["            }",""],["            log.add(\"backfill batch copied \" + copied + \", checkpoint=\" + backfillCheckpoint);",""],["        }",""],["",""],["        User read(String id) {",""],["            switch (phase) {",""],["                case OLD_ONLY, DUAL_WRITE:",""],["                    return oldStore.get(id);",""],["                case SHADOW_READ: {","User ko purana jawab, background me naye se compare"],["                    User fromOld = oldStore.get(id);",""],["                    User fromNew = newStore.get(id);",""],["                    User expected = fromOld == null ? null : toNewSchema(fromOld, false);",""],["                    if (expected == null ? fromNew != null : !expected.equals(fromNew)) {",""],["                        shadowMismatches++;",""],["                        log.add(\"MISMATCH \" + id + \" old=\" + expected + \" new=\" + fromNew);",""],["                    }",""],["                    return fromOld;",""],["                }",""],["                case READ_NEW:",""],["                    return Math.floorMod(id.hashCode(), 100) < readNewPercent ? newStore.get(id) : oldStore.get(id);","Stable bucketing: same user hamesha same side"],["                default:",""],["                    return newStore.get(id);",""],["            }",""],["        }",""],["",""],["        void rollbackTo(Phase safePhase, String reason) {",""],["            log.add(\"ROLLBACK \" + phase + \" -> \" + safePhase + \" (\" + reason + \")\");",""],["            phase = safePhase;",""],["            readNewPercent = 0;",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        MigrationRouter m = new MigrationRouter();",""],["        for (String[] r : new String[][]{{\"u1\", \"Asha\", \"Asha@Mail.com\"}, {\"u2\", \"Ravi\", \"ravi@mail.com\"}, {\"u3\", \"Meera \", \"MEERA@mail.com\"}, {\"u4\", \"Kabir\", \"kabir@mail.com\"}}) {",""],["            m.write(new User(r[0], r[1], r[2]));",""],["        }",""],["        m.phase = Phase.DUAL_WRITE;",""],["        m.write(new User(\"u5\", \"Zoya\", \"Zoya@Mail.com\"));","Naya user dono stores me"],["        m.write(new User(\"u2\", \"Ravi K\", \"ravi@mail.com\"));","Update bhi dono me"],["        m.backfill(2);",""],["        m.backfill(2);",""],["        m.backfill(2);",""],["",""],["        m.phase = Phase.SHADOW_READ;",""],["        for (String id : List.of(\"u1\", \"u2\", \"u3\", \"u4\", \"u5\")) m.read(id);",""],["        System.out.println(\"shadow mismatches = \" + m.shadowMismatches + \" (backfill transform bug pakda)\");",""],["",""],["        m.buggyTransform = false;","Fix deploy, mismatched rows dobara backfill"],["        for (String id : List.of(\"u1\", \"u3\")) m.newStore.put(id, m.toNewSchema(m.oldStore.get(id), true));",""],["        m.shadowMismatches = 0;",""],["        for (String id : List.of(\"u1\", \"u2\", \"u3\", \"u4\", \"u5\")) m.read(id);",""],["        System.out.println(\"after fix, shadow mismatches = \" + m.shadowMismatches);",""],["",""],["        m.phase = Phase.READ_NEW;",""],["        m.readNewPercent = 10;",""],["        int errorRatePercent = 7;","Monitoring: naye path pe error rate 7% (SLO 1%)"],["        if (errorRatePercent > 1) m.rollbackTo(Phase.SHADOW_READ, \"error rate \" + errorRatePercent + \"% > SLO\");",""],["        m.phase = Phase.READ_NEW;",""],["        m.readNewPercent = 100;",""],["        System.out.println(\"READ_NEW 100%: u3 = \" + m.read(\"u3\"));",""],["        m.phase = Phase.NEW_ONLY;","Kuch din stable rehne ke baad: purana store band (contract phase)"],["        m.write(new User(\"u6\", \"Dev\", \"Dev@Mail.com\"));",""],["        System.out.println(\"NEW_ONLY: old has u6? \" + m.oldStore.containsKey(\"u6\") + \", new has u6? \" + m.newStore.containsKey(\"u6\"));",""],["        m.log.forEach(line -> System.out.println(\"   \" + line));",""],["    }",""],["}",""]]},"MiniKafkaDemo":{"file":"MiniKafkaDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.HashSet;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Set;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.function.Predicate;",""],["",""],["public class MiniKafkaDemo {",""],["",""],["    record LogRecord(long offset, String key, String value) {}",""],["",""],["    static final class Partition {","Partition = append-only log; disk pe sequential writes (sabse fast disk pattern)"],["        private final List<LogRecord> log = new ArrayList<>();",""],["",""],["        synchronized long append(String key, String value) {",""],["            long offset = log.size();","Offset = log me position; partition ke andar strictly increasing"],["            log.add(new LogRecord(offset, key, value));",""],["            return offset;",""],["        }",""],["",""],["        synchronized List<LogRecord> read(long fromOffset, int maxRecords) {","Read se delete nahi hota: retention tak log me rehta hai, replay possible"],["            if (fromOffset >= log.size()) return List.of();",""],["            int end = (int) Math.min(log.size(), fromOffset + maxRecords);",""],["            return new ArrayList<>(log.subList((int) fromOffset, end));",""],["        }",""],["    }",""],["",""],["    static final class Topic {",""],["        final String name;",""],["        final List<Partition> partitions = new ArrayList<>();",""],["",""],["        Topic(String name, int partitionCount) {",""],["            this.name = name;",""],["            for (int i = 0; i < partitionCount; i++) partitions.add(new Partition());",""],["        }",""],["",""],["        int partitionFor(String key) {",""],["            return (key.hashCode() & 0x7fffffff) % partitions.size();","Same key -> same partition -> us key ke events order me. Mask se negative hash ka issue khatam"],["        }",""],["    }",""],["",""],["    static final class Broker {",""],["        private final Map<String, Topic> topics = new ConcurrentHashMap<>();",""],["",""],["        void createTopic(String name, int partitions) { topics.putIfAbsent(name, new Topic(name, partitions)); }",""],["",""],["        int partitionOf(String topic, String key) { return topics.get(topic).partitionFor(key); }",""],["",""],["        int partitionCount(String topic) { return topics.get(topic).partitions.size(); }",""],["",""],["        String produce(String topicName, String key, String value) {",""],["            Topic topic = topics.get(topicName);",""],["            int p = topic.partitionFor(key);",""],["            long offset = topic.partitions.get(p).append(key, value);","Real Kafka: leader append + followers replicate; acks=all pe tabhi success"],["            return topicName + \"-\" + p + \"@\" + offset;",""],["        }",""],["",""],["        List<LogRecord> fetch(String topic, int partition, long fromOffset, int maxRecords) {",""],["            return topics.get(topic).partitions.get(partition).read(fromOffset, maxRecords);",""],["        }",""],["    }",""],["",""],["    static final class ConsumerGroup {","Group ke andar ek partition ek hi consumer padhta hai; alag groups ko poora stream milta hai"],["        final String groupId;",""],["        private final Map<String, Long> committedOffsets = new ConcurrentHashMap<>();","\"topic-partition\" -> agla offset (real: __consumer_offsets topic)"],["",""],["        ConsumerGroup(String groupId) { this.groupId = groupId; }",""],["",""],["        int pollAndProcess(Broker broker, String topic, int partition, int maxRecords, Predicate<LogRecord> handler) {",""],["            String tp = topic + \"-\" + partition;",""],["            long from = committedOffsets.getOrDefault(tp, 0L);","Restart pe last committed offset se shuru"],["            int processed = 0;",""],["            for (LogRecord r : broker.fetch(topic, partition, from, maxRecords)) {",""],["                if (!handler.test(r)) break;","Crash/fail: commit nahi hoga, agli poll me same record dobara aayega"],["                committedOffsets.put(tp, r.offset() + 1);","Process ke BAAD commit = at-least-once (crash pe duplicate possible, loss nahi)"],["                processed++;",""],["            }",""],["            return processed;",""],["        }",""],["",""],["        long committed(String tp) { return committedOffsets.getOrDefault(tp, 0L); }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Broker broker = new Broker();",""],["        broker.createTopic(\"orders\", 3);",""],["        String[][] events = {{\"order-1\", \"CREATED\"}, {\"order-2\", \"CREATED\"}, {\"order-1\", \"PAID\"}, {\"order-1\", \"SHIPPED\"}, {\"order-2\", \"PAID\"}};",""],["        for (String[] e : events) System.out.println(\"produce \" + e[0] + \":\" + e[1] + \" -> \" + broker.produce(\"orders\", e[0], e[1]));",""],["",""],["        int partition = broker.partitionOf(\"orders\", \"order-1\");",""],["        Set<String> appliedEvents = new HashSet<>();","Idempotency store (real: unique constraint on event_id)"],["        boolean[] crashOnce = {true};",""],["        Predicate<LogRecord> billingHandler = r -> {",""],["            String eventId = r.key() + \":\" + r.value();",""],["            if (!appliedEvents.add(eventId)) {","Pehle apply ho chuka: dobara effect nahi (idempotent consumer)"],["                System.out.println(\"  duplicate \" + eventId + \" skipped\");",""],["                return true;",""],["            }",""],["            System.out.println(\"  billing applied \" + eventId + \" @offset \" + r.offset());",""],["            if (r.value().equals(\"SHIPPED\") && crashOnce[0]) {","Crash simulate: kaam ho gaya par commit se pehle process mar gaya"],["                crashOnce[0] = false;",""],["                System.out.println(\"  !! crash after processing, before commit\");",""],["                return false;",""],["            }",""],["            return true;",""],["        };",""],["",""],["        ConsumerGroup billing = new ConsumerGroup(\"billing\");",""],["        billing.pollAndProcess(broker, \"orders\", partition, 10, billingHandler);",""],["        System.out.println(\"committed after crash = \" + billing.committed(\"orders-\" + partition));",""],["        billing.pollAndProcess(broker, \"orders\", partition, 10, billingHandler);","Restart: SHIPPED dobara aaya, idempotency ne bachaya"],["        System.out.println(\"committed after restart = \" + billing.committed(\"orders-\" + partition));",""],["",""],["        ConsumerGroup analytics = new ConsumerGroup(\"analytics\");","Naya group offset 0 se: poora history replay"],["        int total = 0;",""],["        for (int p = 0; p < broker.partitionCount(\"orders\"); p++) total += analytics.pollAndProcess(broker, \"orders\", p, 100, r -> true);",""],["        System.out.println(\"analytics group replayed \" + total + \" events from offset 0\");",""],["    }",""],["}",""]]},"MiniLsmDemo":{"file":"MiniLsmDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.BitSet;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.NavigableMap;",""],["import java.util.TreeMap;",""],["",""],["public class MiniLsmDemo {",""],["",""],["    static final String TOMBSTONE = \"<deleted>\";","Delete bhi ek write hai: tombstone marker, asli hatana compaction me"],["",""],["    static final class BloomFilter {","\"Shayad hai\" ya \"pakka nahi hai\": false positive possible, false negative kabhi nahi"],["        private final BitSet bits;",""],["        private final int size;",""],["        private final int hashCount;",""],["",""],["        BloomFilter(int size, int hashCount) {",""],["            this.bits = new BitSet(size);",""],["            this.size = size;",""],["            this.hashCount = hashCount;",""],["        }",""],["",""],["        private int indexFor(String key, int i) {",""],["            int h1 = key.hashCode();",""],["            int h2 = (h1 >>> 16) | 1;","Double hashing: do hashes se k positions (h1 + i*h2)"],["            return Math.floorMod(h1 + i * h2, size);",""],["        }",""],["",""],["        void add(String key) { for (int i = 0; i < hashCount; i++) bits.set(indexFor(key, i)); }",""],["",""],["        boolean mightContain(String key) {",""],["            for (int i = 0; i < hashCount; i++) if (!bits.get(indexFor(key, i))) return false;","Ek bhi bit 0 = key pakka nahi hai: disk read bacha"],["            return true;",""],["        }",""],["    }",""],["",""],["    static final class SSTable {","Sorted String Table: immutable, sorted file on disk"],["        final String name;",""],["        final NavigableMap<String, String> rows;",""],["        final BloomFilter bloom = new BloomFilter(512, 3);",""],["",""],["        SSTable(String name, Map<String, String> sortedRows) {",""],["            this.name = name;",""],["            this.rows = new TreeMap<>(sortedRows);",""],["            rows.keySet().forEach(bloom::add);",""],["        }",""],["    }",""],["",""],["    static final class LsmTree {",""],["        private final List<String> wal = new ArrayList<>();","Write-ahead log: crash pe memtable yahin se rebuild"],["        private NavigableMap<String, String> memtable = new TreeMap<>();","RAM me sorted (real: skip list)"],["        private final List<SSTable> sstables = new ArrayList<>();","index 0 = sabse naya"],["        private final int memtableLimit;",""],["        private int fileCounter = 0;",""],["        int bloomSkips;",""],["        int diskReads;",""],["",""],["        LsmTree(int memtableLimit) { this.memtableLimit = memtableLimit; }",""],["",""],["        void put(String key, String value) {",""],["            wal.add(\"PUT \" + key + \"=\" + value);","1) Sequential append (fsync) = fast + durable"],["            memtable.put(key, value);","2) Memtable update; disk pe koi random write nahi"],["            if (memtable.size() >= memtableLimit) flushMemtable();",""],["        }",""],["",""],["        void delete(String key) {",""],["            wal.add(\"DEL \" + key);",""],["            memtable.put(key, TOMBSTONE);",""],["            if (memtable.size() >= memtableLimit) flushMemtable();",""],["        }",""],["",""],["        void flushMemtable() {","Memtable full: poora sorted run ek nayi immutable file me"],["            SSTable table = new SSTable(\"SST-\" + (++fileCounter), memtable);",""],["            sstables.add(0, table);",""],["            memtable = new TreeMap<>();",""],["            wal.clear();","Data ab SSTable me durable, WAL truncate"],["            System.out.println(\"   flush -> \" + table.name + \" \" + table.rows.keySet());",""],["        }",""],["",""],["        String get(String key) {",""],["            String v = memtable.get(key);","Read path: pehle memtable (sabse naya data)"],["            if (v == null) {",""],["                for (SSTable t : sstables) {","Phir SSTables naye se purane: pehla match hi latest version"],["                    if (!t.bloom.mightContain(key)) {",""],["                        bloomSkips++;",""],["                        continue;",""],["                    }",""],["                    diskReads++;",""],["                    v = t.rows.get(key);",""],["                    if (v != null) break;",""],["                }",""],["            }",""],["            return TOMBSTONE.equals(v) ? null : v;","Tombstone mila = deleted"],["        }",""],["",""],["        void compact() {","Saari files merge: naya version jeetta, tombstones + purane versions hat-te"],["            TreeMap<String, String> merged = new TreeMap<>();",""],["            for (int i = sstables.size() - 1; i >= 0; i--) merged.putAll(sstables.get(i).rows);","Purani file pehle, naya overwrite karega"],["            merged.values().removeIf(TOMBSTONE::equals);","Full compaction me hi tombstone drop safe (koi purani copy nahi bachi)"],["            int before = sstables.size();",""],["            sstables.clear();",""],["            sstables.add(new SSTable(\"SST-\" + (++fileCounter), merged));",""],["            System.out.println(\"   compaction: \" + before + \" files -> 1 file \" + merged.keySet());",""],["        }",""],["",""],["        void crashAndRecover() {",""],["            memtable = new TreeMap<>();","Crash: RAM ka memtable gaya"],["            List<String> replay = new ArrayList<>(wal);",""],["            wal.clear();",""],["            for (String line : replay) {","WAL replay: bina flush hue writes bhi wapas"],["                String body = line.substring(4);",""],["                if (line.startsWith(\"PUT \")) put(body.substring(0, body.indexOf('=')), body.substring(body.indexOf('=') + 1));",""],["                else delete(body);",""],["            }",""],["            System.out.println(\"   recovered memtable from WAL: \" + memtable.keySet());",""],["        }",""],["",""],["        int fileCount() { return sstables.size(); }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        LsmTree db = new LsmTree(3);",""],["        db.put(\"user:1\", \"Asha\");",""],["        db.put(\"user:2\", \"Ravi\");",""],["        db.put(\"user:3\", \"Meera\");","3rd write: memtable full -> flush"],["        db.put(\"user:1\", \"Asha K\");","Update = naya version (purana SST-1 me padha rehta hai)"],["        db.put(\"user:4\", \"Kabir\");",""],["        db.delete(\"user:2\");",""],["        System.out.println(\"get user:1 = \" + db.get(\"user:1\") + \", user:2 = \" + db.get(\"user:2\") + \", user:9 = \" + db.get(\"user:9\"));",""],["        System.out.println(\"files=\" + db.fileCount() + \" bloomSkips=\" + db.bloomSkips + \" diskReads=\" + db.diskReads);",""],["        db.compact();",""],["        System.out.println(\"after compaction user:1 = \" + db.get(\"user:1\") + \", user:2 = \" + db.get(\"user:2\"));",""],["        db.put(\"user:5\", \"Zoya\");",""],["        db.crashAndRecover();",""],["        System.out.println(\"after crash user:5 = \" + db.get(\"user:5\"));",""],["    }",""],["}",""]]},"MovieBookingDemo":{"file":"MovieBookingDemo.java","lines":[["import java.time.Duration;",""],["import java.time.Instant;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Optional;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.concurrent.ExecutorService;",""],["import java.util.concurrent.Executors;",""],["import java.util.concurrent.Future;",""],["import java.util.concurrent.atomic.AtomicLong;",""],["import java.util.function.Supplier;",""],["",""],["public class MovieBookingDemo {",""],["",""],["    enum SeatStatus { AVAILABLE, HELD, BOOKED }","Lifecycle: AVAILABLE -> HELD (payment window) -> BOOKED; hold expire -> wapas AVAILABLE"],["",""],["    static final class Seat {",""],["        final String seatId;",""],["        SeatStatus status = SeatStatus.AVAILABLE;",""],["        String holdId;",""],["        Instant holdExpiresAt;",""],["",""],["        Seat(String seatId) { this.seatId = seatId; }",""],["    }",""],["",""],["    record Hold(String holdId, String showId, String userId, List<String> seatIds, Instant expiresAt) {}",""],["",""],["    record Booking(String bookingId, String holdId, String paymentRef, List<String> seatIds) {}",""],["",""],["    static final class Show {",""],["        final String showId;",""],["        private final Map<String, Seat> seats = new LinkedHashMap<>();",""],["",""],["        Show(String showId, List<String> seatIds) {",""],["            this.showId = showId;",""],["            seatIds.forEach(id -> seats.put(id, new Seat(id)));",""],["        }",""],["",""],["        synchronized boolean tryHold(List<String> seatIds, String holdId, Instant now, Instant expiresAt) {","Show-level lock: ek show ke seats ek time pe ek hi thread badle"],["            for (String id : seatIds) {",""],["                Seat seat = seats.get(id);",""],["                if (seat == null) throw new IllegalArgumentException(\"No seat \" + id);",""],["                releaseIfExpired(seat, now);","Purana hold expire ho chuka ho to pehle free karo (lazy expiry)"],["                if (seat.status != SeatStatus.AVAILABLE) return false;","Ek bhi seat busy = poora request fail; aadhi booking nahi (all-or-nothing)"],["            }",""],["            for (String id : seatIds) {",""],["                Seat seat = seats.get(id);",""],["                seat.status = SeatStatus.HELD;",""],["                seat.holdId = holdId;",""],["                seat.holdExpiresAt = expiresAt;",""],["            }",""],["            return true;",""],["        }",""],["",""],["        synchronized boolean confirm(Hold hold, Instant now) {",""],["            for (String id : hold.seatIds()) {",""],["                Seat seat = seats.get(id);",""],["                if (seat.status != SeatStatus.HELD || !hold.holdId().equals(seat.holdId) || now.isAfter(seat.holdExpiresAt)) {",""],["                    return false;","Hold expire ho gaya ya ab kisi aur ka: confirm nahi (refund flow)"],["                }",""],["            }",""],["            for (String id : hold.seatIds()) {",""],["                Seat seat = seats.get(id);",""],["                seat.status = SeatStatus.BOOKED;",""],["                seat.holdExpiresAt = null;",""],["            }",""],["            return true;",""],["        }",""],["",""],["        synchronized int releaseExpiredHolds(Instant now) {",""],["            int released = 0;",""],["            for (Seat seat : seats.values()) if (releaseIfExpired(seat, now)) released++;",""],["            return released;",""],["        }",""],["",""],["        private boolean releaseIfExpired(Seat seat, Instant now) {",""],["            if (seat.status == SeatStatus.HELD && now.isAfter(seat.holdExpiresAt)) {",""],["                seat.status = SeatStatus.AVAILABLE;",""],["                seat.holdId = null;",""],["                seat.holdExpiresAt = null;",""],["                return true;",""],["            }",""],["            return false;",""],["        }",""],["",""],["        synchronized String seatMap() {",""],["            StringBuilder sb = new StringBuilder();",""],["            seats.values().forEach(s -> sb.append(s.seatId).append('=').append(s.status).append(' '));",""],["            return sb.toString().trim();",""],["        }",""],["    }",""],["",""],["    static final class BookingService {",""],["        private static final Duration HOLD_TTL = Duration.ofMinutes(8);","Payment window: itni der seats locked"],["        private final Map<String, Show> shows = new ConcurrentHashMap<>();",""],["        private final Map<String, Hold> holds = new ConcurrentHashMap<>();",""],["        private final Map<String, Booking> bookingsByHold = new ConcurrentHashMap<>();","Idempotency: same hold ka confirm do baar = same booking"],["        private final AtomicLong ids = new AtomicLong(100);",""],["        private final Supplier<Instant> clock;","Clock inject: test me time aage badha sakte hain"],["",""],["        BookingService(Supplier<Instant> clock) { this.clock = clock; }",""],["",""],["        void addShow(Show show) { shows.put(show.showId, show); }",""],["",""],["        Optional<Hold> holdSeats(String showId, List<String> seatIds, String userId) {",""],["            Instant now = clock.get();",""],["            String holdId = \"H\" + ids.incrementAndGet();",""],["            Instant expiresAt = now.plus(HOLD_TTL);",""],["            if (!shows.get(showId).tryHold(seatIds, holdId, now, expiresAt)) return Optional.empty();","Seat pehle se HELD/BOOKED: user ko \"seat just taken\" dikhao"],["            Hold hold = new Hold(holdId, showId, userId, List.copyOf(seatIds), expiresAt);",""],["            holds.put(holdId, hold);",""],["            return Optional.of(hold);",""],["        }",""],["",""],["        Booking confirmBooking(String holdId, String paymentRef) {","Payment success webhook yahan aata hai (kabhi do baar bhi)"],["            Booking existing = bookingsByHold.get(holdId);",""],["            if (existing != null) return existing;","Duplicate webhook: naya booking nahi, purana wapas"],["            Hold hold = holds.get(holdId);",""],["            if (hold == null) throw new IllegalArgumentException(\"Unknown hold \" + holdId);",""],["            if (!shows.get(hold.showId()).confirm(hold, clock.get())) {",""],["                throw new IllegalStateException(\"Hold \" + holdId + \" expired; refund payment \" + paymentRef);","Late payment: seats chali gayi, auto-refund"],["            }",""],["            return bookingsByHold.computeIfAbsent(holdId, id -> new Booking(\"B\" + ids.incrementAndGet(), id, paymentRef, hold.seatIds()));",""],["        }",""],["",""],["        int releaseExpiredHolds() {","Scheduler har minute chalata hai (lazy expiry ka backup)"],["            int total = 0;",""],["            for (Show show : shows.values()) total += show.releaseExpiredHolds(clock.get());",""],["            return total;",""],["        }",""],["",""],["        String seatMap(String showId) { return shows.get(showId).seatMap(); }",""],["    }",""],["",""],["    public static void main(String[] args) throws Exception {",""],["        Instant[] now = {Instant.parse(\"2026-10-07T18:00:00Z\")};",""],["        BookingService service = new BookingService(() -> now[0]);",""],["        service.addShow(new Show(\"pvr-9pm\", List.of(\"A1\", \"A2\", \"A3\", \"A4\")));",""],["",""],["        ExecutorService users = Executors.newFixedThreadPool(2);","Do users ek hi seat A2 pe ek saath"],["        Future<Optional<Hold>> rahul = users.submit(() -> service.holdSeats(\"pvr-9pm\", List.of(\"A1\", \"A2\"), \"rahul\"));",""],["        Future<Optional<Hold>> priya = users.submit(() -> service.holdSeats(\"pvr-9pm\", List.of(\"A2\", \"A3\"), \"priya\"));",""],["        Optional<Hold> rahulHold = rahul.get();",""],["        Optional<Hold> priyaHold = priya.get();",""],["        users.shutdown();",""],["        System.out.println(\"rahul: \" + rahulHold.map(Hold::holdId).orElse(\"FAILED\") + \", priya: \" + priyaHold.map(Hold::holdId).orElse(\"FAILED\") + \" (sirf ek jeetega)\");",""],["        System.out.println(\"seats: \" + service.seatMap(\"pvr-9pm\"));",""],["",""],["        Hold winner = rahulHold.or(() -> priyaHold).orElseThrow();",""],["        Booking first = service.confirmBooking(winner.holdId(), \"pay_123\");",""],["        Booking again = service.confirmBooking(winner.holdId(), \"pay_123\");","Payment gateway ne webhook retry kiya"],["        System.out.println(\"booking \" + first.bookingId() + \", duplicate webhook gave same booking? \" + (first == again));",""],["        System.out.println(\"seats: \" + service.seatMap(\"pvr-9pm\"));",""],["",""],["        Optional<Hold> amitHold = service.holdSeats(\"pvr-9pm\", List.of(\"A4\"), \"amit\");",""],["        now[0] = now[0].plus(Duration.ofMinutes(9));","Amit ne 9 minute tak pay nahi kiya"],["        System.out.println(\"expired holds released: \" + service.releaseExpiredHolds());",""],["        try {",""],["            service.confirmBooking(amitHold.orElseThrow().holdId(), \"pay_999\");",""],["        } catch (IllegalStateException e) {",""],["            System.out.println(e.getMessage());",""],["        }",""],["        System.out.println(\"seats: \" + service.seatMap(\"pvr-9pm\"));",""],["    }",""],["}",""]]},"NearbySearchDemo":{"file":"NearbySearchDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.Comparator;",""],["import java.util.List;",""],["",""],["public class NearbySearchDemo {",""],["",""],["    record Business(String id, String name, String category, double lat, double lng, double rating) {}",""],["",""],["    static final String BASE32 = \"0123456789bcdefghjkmnpqrstuvwxyz\";",""],["",""],["    static String geohash(double lat, double lng, int precision) {","Lat/lng ko bits me interleave karke base32: same prefix = paas-paas (mostly)"],["        double[] latR = {-90, 90}, lngR = {-180, 180};",""],["        StringBuilder sb = new StringBuilder();",""],["        boolean even = true;",""],["        int bit = 0, ch = 0;",""],["        while (sb.length() < precision) {",""],["            double[] r = even ? lngR : latR;",""],["            double v = even ? lng : lat;",""],["            double mid = (r[0] + r[1]) / 2;",""],["            if (v >= mid) { ch = (ch << 1) | 1; r[0] = mid; } else { ch = ch << 1; r[1] = mid; }","Har bit range ko aadha karti hai"],["            even = !even;",""],["            if (++bit == 5) {",""],["                sb.append(BASE32.charAt(ch));",""],["                bit = 0;",""],["                ch = 0;",""],["            }",""],["        }",""],["        return sb.toString();",""],["    }",""],["",""],["    static double haversineKm(double lat1, double lng1, double lat2, double lng2) {",""],["        double dLat = Math.toRadians(lat2 - lat1), dLng = Math.toRadians(lng2 - lng1);",""],["        double a = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(Math.toRadians(lat1)) * Math.cos(Math.toRadians(lat2)) * Math.pow(Math.sin(dLng / 2), 2);",""],["        return 2 * 6371 * Math.asin(Math.sqrt(a));",""],["    }",""],["",""],["    static final class QuadTree {","Dense area (MG Road) me chhote cells, khaali area me bade: density-adaptive"],["        static final int CAPACITY = 3;","Real: ~100-500 businesses per leaf"],["        final double minLat, minLng, maxLat, maxLng;",""],["        final int depth;",""],["        private final List<Business> items = new ArrayList<>();",""],["        private QuadTree[] children;",""],["",""],["        QuadTree(double minLat, double minLng, double maxLat, double maxLng, int depth) {",""],["            this.minLat = minLat;",""],["            this.minLng = minLng;",""],["            this.maxLat = maxLat;",""],["            this.maxLng = maxLng;",""],["            this.depth = depth;",""],["        }",""],["",""],["        boolean contains(Business b) { return b.lat() >= minLat && b.lat() < maxLat && b.lng() >= minLng && b.lng() < maxLng; }",""],["",""],["        boolean insert(Business b) {",""],["            if (!contains(b)) return false;",""],["            if (children == null) {",""],["                if (items.size() < CAPACITY || depth >= 12) {",""],["                    items.add(b);",""],["                    return true;",""],["                }",""],["                split();","Leaf full: 4 children me baanto"],["            }",""],["            for (QuadTree c : children) if (c.insert(b)) return true;",""],["            return false;",""],["        }",""],["",""],["        private void split() {",""],["            double midLat = (minLat + maxLat) / 2, midLng = (minLng + maxLng) / 2;",""],["            children = new QuadTree[]{",""],["                    new QuadTree(minLat, minLng, midLat, midLng, depth + 1), new QuadTree(minLat, midLng, midLat, maxLng, depth + 1),",""],["                    new QuadTree(midLat, minLng, maxLat, midLng, depth + 1), new QuadTree(midLat, midLng, maxLat, maxLng, depth + 1)};",""],["            for (Business b : items) for (QuadTree c : children) if (c.insert(b)) break;",""],["            items.clear();",""],["        }",""],["",""],["        void queryBox(double qMinLat, double qMinLng, double qMaxLat, double qMaxLng, List<Business> out, int[] visited) {",""],["            if (qMaxLat < minLat || qMinLat >= maxLat || qMaxLng < minLng || qMinLng >= maxLng) return;","Box overlap nahi: poora subtree skip (pruning)"],["            visited[0]++;",""],["            if (children == null) {",""],["                for (Business b : items) if (b.lat() >= qMinLat && b.lat() <= qMaxLat && b.lng() >= qMinLng && b.lng() <= qMaxLng) out.add(b);",""],["                return;",""],["            }",""],["            for (QuadTree c : children) c.queryBox(qMinLat, qMinLng, qMaxLat, qMaxLng, out, visited);",""],["        }",""],["",""],["        int nodeCount() {",""],["            int n = 1;",""],["            if (children != null) for (QuadTree c : children) n += c.nodeCount();",""],["            return n;",""],["        }",""],["    }",""],["",""],["    static List<String> searchNearby(QuadTree index, double lat, double lng, double radiusKm, String category, int limit) {",""],["        double dLat = radiusKm / 111.0;","1 degree latitude ≈ 111 km"],["        double dLng = radiusKm / (111.0 * Math.cos(Math.toRadians(lat)));","Longitude degree equator se door chhota hota hai"],["        List<Business> candidates = new ArrayList<>();",""],["        int[] visited = {0};",""],["        index.queryBox(lat - dLat, lng - dLng, lat + dLat, lng + dLng, candidates, visited);","1) Box se candidates (sasta)"],["        List<String> out = candidates.stream()",""],["                .filter(b -> category == null || b.category().equals(category))",""],["                .filter(b -> haversineKm(lat, lng, b.lat(), b.lng()) <= radiusKm)","2) Exact circle filter (box ke corners hatao)"],["                .sorted(Comparator.comparingDouble((Business b) -> -b.rating() / (1 + haversineKm(lat, lng, b.lat(), b.lng()))))","3) Rank: rating vs distance"],["                .limit(limit)",""],["                .map(b -> String.format(\"%s (%.1f km, rating %.1f)\", b.name(), haversineKm(lat, lng, b.lat(), b.lng()), b.rating()))",""],["                .toList();",""],["        System.out.println(\"   visited \" + visited[0] + \" quadtree nodes, \" + candidates.size() + \" box candidates\");",""],["        return out;",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        QuadTree index = new QuadTree(12.80, 77.45, 13.15, 77.80, 0);","Bengaluru bounding box"],["        List<Business> data = List.of(",""],["                new Business(\"b1\", \"Filter Coffee House\", \"cafe\", 12.9760, 77.6070, 4.6), new Business(\"b2\", \"Dosa Corner\", \"restaurant\", 12.9748, 77.6082, 4.2),",""],["                new Business(\"b3\", \"Biryani Bhavan\", \"restaurant\", 12.9771, 77.6049, 4.4), new Business(\"b4\", \"Book Nook Cafe\", \"cafe\", 12.9739, 77.6101, 4.1),",""],["                new Business(\"b5\", \"Idli Express\", \"restaurant\", 12.9722, 77.6409, 4.5), new Business(\"b6\", \"Brew Lab\", \"cafe\", 12.9711, 77.6421, 4.8),",""],["                new Business(\"b7\", \"Momo Stop\", \"restaurant\", 12.9355, 77.6241, 4.0), new Business(\"b8\", \"Roast Republic\", \"cafe\", 12.9349, 77.6255, 4.3),",""],["                new Business(\"b9\", \"Tech Park Canteen\", \"restaurant\", 12.9698, 77.7500, 3.9), new Business(\"b10\", \"Lakeview Cafe\", \"cafe\", 13.0358, 77.5970, 4.4));",""],["        data.forEach(index::insert);",""],["        double lat = 12.9756, lng = 77.6066;","User MG Road pe"],["        System.out.println(\"user geohash(6) = \" + geohash(lat, lng, 6) + \", Filter Coffee House = \" + geohash(12.9760, 77.6070, 6) + \" (same prefix = paas)\");",""],["        System.out.println(\"quadtree nodes: \" + index.nodeCount());",""],["        System.out.println(\"cafes within 2 km: \" + searchNearby(index, lat, lng, 2, \"cafe\", 5));",""],["        System.out.println(\"anything within 5 km: \" + searchNearby(index, lat, lng, 5, null, 5));",""],["    }",""],["}",""]]},"NewsFeedDemo":{"file":"NewsFeedDemo.java","lines":[["import java.util.ArrayDeque;",""],["import java.util.ArrayList;",""],["import java.util.Comparator;",""],["import java.util.Deque;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Set;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.concurrent.ConcurrentLinkedDeque;",""],["import java.util.concurrent.atomic.AtomicLong;",""],["",""],["public class NewsFeedDemo {",""],["",""],["    record Post(long postId, String authorId, String caption, long createdAt) {}",""],["",""],["    static final class FollowGraph {","Graph service: kaun kisko follow karta hai (real: sharded DB / graph store)"],["        private final Map<String, Set<String>> followers = new ConcurrentHashMap<>();",""],["        private final Map<String, Set<String>> following = new ConcurrentHashMap<>();",""],["",""],["        void follow(String follower, String followee) {",""],["            followers.computeIfAbsent(followee, k -> ConcurrentHashMap.newKeySet()).add(follower);",""],["            following.computeIfAbsent(follower, k -> ConcurrentHashMap.newKeySet()).add(followee);",""],["        }",""],["",""],["        Set<String> followersOf(String user) { return followers.getOrDefault(user, Set.of()); }",""],["",""],["        Set<String> followingOf(String user) { return following.getOrDefault(user, Set.of()); }",""],["    }",""],["",""],["    static final class FeedService {",""],["        private static final int CELEBRITY_THRESHOLD = 3;","Demo me 3; real me ~10K+ followers = celebrity (push nahi, pull)"],["        private static final int FEED_CACHE_SIZE = 500;","Har user ke precomputed feed me sirf latest 500 post IDs (Redis list)"],["        private final FollowGraph graph;",""],["        private final Map<Long, Post> postStore = new ConcurrentHashMap<>();","Posts table (real: sharded by author; media S3 + CDN pe)"],["        private final Map<String, Deque<Long>> feedCache = new ConcurrentHashMap<>();","userId -> newest-first post IDs (fan-out on write ka result)"],["        private final Map<String, Deque<Long>> postsByAuthor = new ConcurrentHashMap<>();",""],["        private final AtomicLong postIds = new AtomicLong(1000);",""],["        private final AtomicLong logicalTime = new AtomicLong();",""],["",""],["        FeedService(FollowGraph graph) { this.graph = graph; }",""],["",""],["        boolean isCelebrity(String userId) { return graph.followersOf(userId).size() >= CELEBRITY_THRESHOLD; }",""],["",""],["        Post publishPost(String authorId, String caption) {",""],["            Post post = new Post(postIds.incrementAndGet(), authorId, caption, logicalTime.incrementAndGet());",""],["            postStore.put(post.postId(), post);","1) Post durable save"],["            postsByAuthor.computeIfAbsent(authorId, k -> new ConcurrentLinkedDeque<>()).addFirst(post.postId());",""],["            if (!isCelebrity(authorId)) fanOutToFollowers(post);","2) Normal user: followers ke feed me push (fan-out on write)"],["            return post;","Celebrity: fan-out nahi; followers read ke time pull karenge"],["        }",""],["",""],["        private void fanOutToFollowers(Post post) {","Real me async (Kafka + workers); yahan simple loop"],["            for (String follower : graph.followersOf(post.authorId())) {",""],["                Deque<Long> feed = feedCache.computeIfAbsent(follower, k -> new ConcurrentLinkedDeque<>());",""],["                feed.addFirst(post.postId());",""],["                while (feed.size() > FEED_CACHE_SIZE) feed.pollLast();","Cap: feed cache memory bounded rehti hai"],["            }",""],["        }",""],["",""],["        List<Post> getNewsFeed(String userId, int limit) {","READ path: precomputed (push) + celebrity posts (pull) ka merge"],["            List<Post> candidates = new ArrayList<>();",""],["            for (Long id : feedCache.getOrDefault(userId, new ArrayDeque<>())) candidates.add(postStore.get(id));",""],["            for (String followee : graph.followingOf(userId)) {",""],["                if (isCelebrity(followee)) {","Celebrity ke latest posts read time pe (ye hot cache me hote hain)"],["                    postsByAuthor.getOrDefault(followee, new ArrayDeque<>()).stream().limit(limit).forEach(id -> candidates.add(postStore.get(id)));",""],["                }",""],["            }",""],["            return candidates.stream()",""],["                    .distinct()","Agar koi user beech me celebrity bana to same post dono raaston se aa sakti hai: dedup"],["                    .sorted(Comparator.comparingLong(Post::createdAt).reversed())","Ranking: yahan time se; real me ML ranking (engagement prediction)"],["                    .limit(limit)",""],["                    .toList();",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        FollowGraph graph = new FollowGraph();",""],["        for (String fan : List.of(\"u1\", \"u2\", \"u3\", \"u4\")) graph.follow(fan, \"virat\");","virat ke 4 followers = celebrity (demo threshold 3)"],["        graph.follow(\"u1\", \"neha\");",""],["        graph.follow(\"u2\", \"neha\");","neha normal user (2 followers)"],["",""],["        FeedService feeds = new FeedService(graph);",""],["        feeds.publishPost(\"neha\", \"Sunset at Marine Drive\");",""],["        feeds.publishPost(\"virat\", \"Practice session\");",""],["        feeds.publishPost(\"neha\", \"Chai time\");",""],["",""],["        System.out.println(\"virat celebrity? \" + feeds.isCelebrity(\"virat\") + \", neha celebrity? \" + feeds.isCelebrity(\"neha\"));",""],["        feeds.getNewsFeed(\"u1\", 10).forEach(p -> System.out.println(\"u1 feed: \" + p.authorId() + \" - \" + p.caption()));",""],["        System.out.println(\"u3 feed: \" + feeds.getNewsFeed(\"u3\", 10).stream().map(Post::caption).toList());",""],["    }",""],["}",""]]},"NotificationServiceDemo":{"file":"NotificationServiceDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.Collections;",""],["import java.util.EnumMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Set;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.concurrent.ThreadLocalRandom;",""],["",""],["public class NotificationServiceDemo {",""],["",""],["    enum Channel { PUSH, SMS, EMAIL }",""],["",""],["    enum Priority { HIGH, LOW }","OTP / transactional = HIGH topic, marketing = LOW topic: OTP kabhi promo ke peeche nahi atakta"],["",""],["    enum DeliveryStatus { SENT, DEAD_LETTERED, SKIPPED_DUPLICATE, SKIPPED_OPTED_OUT }",""],["",""],["    record NotificationRequest(String idempotencyKey, String userId, Channel channel, String templateId,",""],["                               Map<String, String> params, Priority priority) {}",""],["",""],["    static final class DeliveryException extends Exception {",""],["        final boolean retryable;","Timeout / 503 = retryable; invalid number = permanent (retry bekaar)"],["",""],["        DeliveryException(String message, boolean retryable) {",""],["            super(message);",""],["            this.retryable = retryable;",""],["        }",""],["    }",""],["",""],["    interface ChannelSender {","Har channel ek interface ke peeche: naya channel (WhatsApp) = nayi class"],["        void send(String userId, String renderedMessage) throws DeliveryException;",""],["    }",""],["",""],["    static final class SmsSender implements ChannelSender {",""],["        private int callsLeftToFail;","Demo ke liye: pehli N calls fail karke retry dikhate hain"],["",""],["        SmsSender(int failFirstN) { this.callsLeftToFail = failFirstN; }",""],["",""],["        @Override",""],["        public void send(String userId, String message) throws DeliveryException {",""],["            if (callsLeftToFail-- > 0) throw new DeliveryException(\"SMS provider timeout\", true);",""],["            System.out.println(\"  SMS -> \" + userId + \": \" + message);",""],["        }",""],["    }",""],["",""],["    static final class EmailSender implements ChannelSender {",""],["        @Override",""],["        public void send(String userId, String message) { System.out.println(\"  EMAIL -> \" + userId + \": \" + message); }",""],["    }",""],["",""],["    static final class TemplateEngine {",""],["        private final Map<String, String> templates = Map.of(",""],["                \"OTP\", \"Aapka OTP {code} hai. 5 min me expire hoga.\",",""],["                \"SALE\", \"Diwali sale: {discount}% off!\",",""],["                \"ORDER_SHIPPED\", \"Order {orderId} ship ho gaya!\");",""],["",""],["        String render(String templateId, Map<String, String> params) {",""],["            String text = templates.get(templateId);",""],["            if (text == null) throw new IllegalArgumentException(\"Unknown template \" + templateId);",""],["            for (Map.Entry<String, String> e : params.entrySet()) {",""],["                text = text.replace(\"{\" + e.getKey() + \"}\", e.getValue());","Simple placeholder replace; real me Mustache/Freemarker + language versions"],["            }",""],["            return text;",""],["        }",""],["    }",""],["",""],["    static final class RetryPolicy {",""],["        final int maxAttempts;",""],["        final long baseDelayMillis;",""],["        final long maxDelayMillis;",""],["",""],["        RetryPolicy(int maxAttempts, long baseDelayMillis, long maxDelayMillis) {",""],["            this.maxAttempts = maxAttempts;",""],["            this.baseDelayMillis = baseDelayMillis;",""],["            this.maxDelayMillis = maxDelayMillis;",""],["        }",""],["",""],["        long computeBackoffMillis(int attempt) {",""],["            long exponential = Math.min(maxDelayMillis, baseDelayMillis * (1L << Math.min(attempt - 1, 20)));",""],["            return exponential / 2 + ThreadLocalRandom.current().nextLong(exponential / 2 + 1);","Exponential backoff + jitter: provider ko recover hone ka time, sab retries ek saath nahi"],["        }",""],["    }",""],["",""],["    static final class NotificationService {",""],["        private final Map<Channel, ChannelSender> senders;","Registry / factory: channel -> sender"],["        private final TemplateEngine templates = new TemplateEngine();",""],["        private final RetryPolicy retryPolicy;",""],["        private final Set<String> processedKeys = ConcurrentHashMap.newKeySet();","Redis SETNX stand-in: idempotency keys (TTL 24h)"],["        private final Map<String, Set<Channel>> optedOutChannels = new ConcurrentHashMap<>();","User preferences (DB + cache)"],["        private final List<NotificationRequest> deadLetterQueue = Collections.synchronizedList(new ArrayList<>());",""],["",""],["        NotificationService(Map<Channel, ChannelSender> senders, RetryPolicy retryPolicy) {",""],["            this.senders = new EnumMap<>(senders);",""],["            this.retryPolicy = retryPolicy;",""],["        }",""],["",""],["        void optOut(String userId, Channel channel) {",""],["            optedOutChannels.computeIfAbsent(userId, k -> ConcurrentHashMap.newKeySet()).add(channel);",""],["        }",""],["",""],["        DeliveryStatus sendNotification(NotificationRequest request) throws InterruptedException {",""],["            if (!processedKeys.add(request.idempotencyKey())) {","add() false = key pehle se: same event dobara aaya, user ko double SMS nahi"],["                return DeliveryStatus.SKIPPED_DUPLICATE;",""],["            }",""],["            if (request.priority() == Priority.LOW && isOptedOut(request.userId(), request.channel())) {","Marketing opt-out respect; OTP jaisa transactional phir bhi jaata hai"],["                return DeliveryStatus.SKIPPED_OPTED_OUT;",""],["            }",""],["            String message = templates.render(request.templateId(), request.params());",""],["            return dispatchWithRetry(request, message);",""],["        }",""],["",""],["        private DeliveryStatus dispatchWithRetry(NotificationRequest request, String message) throws InterruptedException {",""],["            ChannelSender sender = senders.get(request.channel());",""],["            for (int attempt = 1; attempt <= retryPolicy.maxAttempts; attempt++) {",""],["                try {",""],["                    sender.send(request.userId(), message);",""],["                    return DeliveryStatus.SENT;",""],["                } catch (DeliveryException e) {",""],["                    if (!e.retryable) break;","Permanent error: retry mat karo, seedha DLQ"],["                    long wait = retryPolicy.computeBackoffMillis(attempt);",""],["                    System.out.println(\"  attempt \" + attempt + \" failed (\" + e.getMessage() + \"), retry in \" + wait + \" ms\");",""],["                    if (attempt < retryPolicy.maxAttempts) Thread.sleep(wait);","Real system me sleep nahi: message delay ke saath retry-topic me, worker free rehta hai"],["                }",""],["            }",""],["            deadLetterQueue.add(request);","Max attempts ke baad DLQ: alert + replay; main pipeline nahi rukti"],["            return DeliveryStatus.DEAD_LETTERED;",""],["        }",""],["",""],["        private boolean isOptedOut(String userId, Channel channel) {",""],["            return optedOutChannels.getOrDefault(userId, Set.of()).contains(channel);",""],["        }",""],["",""],["        int deadLetterCount() { return deadLetterQueue.size(); }",""],["    }",""],["",""],["    public static void main(String[] args) throws InterruptedException {",""],["        Map<Channel, ChannelSender> senders = Map.of(Channel.SMS, new SmsSender(2), Channel.EMAIL, new EmailSender());",""],["        NotificationService service = new NotificationService(senders, new RetryPolicy(4, 20, 200));",""],["",""],["        NotificationRequest otp = new NotificationRequest(\"otp-user1-8841\", \"user1\", Channel.SMS, \"OTP\", Map.of(\"code\", \"482913\"), Priority.HIGH);",""],["        System.out.println(\"OTP -> \" + service.sendNotification(otp));","Pehle 2 attempts fail, teesra success"],["        System.out.println(\"OTP again, same key -> \" + service.sendNotification(otp));",""],["",""],["        service.optOut(\"user2\", Channel.EMAIL);",""],["        NotificationRequest promo = new NotificationRequest(\"sale-u2-diwali\", \"user2\", Channel.EMAIL, \"SALE\", Map.of(\"discount\", \"40\"), Priority.LOW);",""],["        System.out.println(\"promo to opted-out user -> \" + service.sendNotification(promo));",""],["",""],["        NotificationRequest shipped = new NotificationRequest(\"ship-ord78\", \"user3\", Channel.EMAIL, \"ORDER_SHIPPED\", Map.of(\"orderId\", \"#78\"), Priority.HIGH);",""],["        System.out.println(\"order shipped -> \" + service.sendNotification(shipped));",""],["",""],["        NotificationService providerDown = new NotificationService(Map.of(Channel.SMS, new SmsSender(10)), new RetryPolicy(3, 10, 100));",""],["        NotificationRequest otp2 = new NotificationRequest(\"otp-user9-1\", \"user9\", Channel.SMS, \"OTP\", Map.of(\"code\", \"111111\"), Priority.HIGH);",""],["        System.out.println(\"provider down -> \" + providerDown.sendNotification(otp2) + \", DLQ size = \" + providerDown.deadLetterCount());",""],["    }",""],["}",""]]},"ParkingLotDemo":{"file":"ParkingLotDemo.java","lines":[["import java.time.Duration;",""],["import java.time.Instant;",""],["import java.util.ArrayList;",""],["import java.util.EnumMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Optional;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.concurrent.ExecutorService;",""],["import java.util.concurrent.Executors;",""],["import java.util.concurrent.Future;",""],["import java.util.concurrent.atomic.AtomicBoolean;",""],["import java.util.concurrent.atomic.AtomicLong;",""],["",""],["public class ParkingLotDemo {",""],["",""],["    enum VehicleType { BIKE, CAR, TRUCK }",""],["",""],["    enum SpotSize { SMALL, MEDIUM, LARGE }",""],["",""],["    record Vehicle(String plateNumber, VehicleType type) {}",""],["",""],["    static SpotSize requiredSpotSize(VehicleType type) {","Mapping ek jagah: naya vehicle type (EV) aaye to sirf yahan badlo"],["        return switch (type) {",""],["            case BIKE -> SpotSize.SMALL;",""],["            case CAR -> SpotSize.MEDIUM;",""],["            case TRUCK -> SpotSize.LARGE;",""],["        };",""],["    }",""],["",""],["    static final class ParkingSpot {",""],["        final String spotId;",""],["        final int floor;",""],["        final SpotSize size;",""],["        private final AtomicBoolean occupied = new AtomicBoolean(false);","AtomicBoolean: do gates same spot kabhi nahi le sakte"],["",""],["        ParkingSpot(String spotId, int floor, SpotSize size) {",""],["            this.spotId = spotId;",""],["            this.floor = floor;",""],["            this.size = size;",""],["        }",""],["",""],["        boolean tryOccupy() { return occupied.compareAndSet(false, true); }","CAS false -> true: sirf ek thread jeetega, haarne wala agla spot dhoondhega"],["",""],["        void release() { occupied.set(false); }",""],["",""],["        boolean isFree() { return !occupied.get(); }",""],["    }",""],["",""],["    record Ticket(String ticketId, Vehicle vehicle, ParkingSpot spot, Instant entryTime) {}",""],["",""],["    interface SpotAllocationStrategy {","Strategy: nearest-first, floor-wise, EV-first; runtime pe swap"],["        Optional<ParkingSpot> findSpot(List<ParkingSpot> spots, SpotSize size);",""],["    }",""],["",""],["    static final class NearestFirstStrategy implements SpotAllocationStrategy {",""],["        @Override",""],["        public Optional<ParkingSpot> findSpot(List<ParkingSpot> spots, SpotSize size) {",""],["            for (ParkingSpot spot : spots) {","List gate se distance ke order me sorted hai"],["                if (spot.size == size && spot.isFree() && spot.tryOccupy()) return Optional.of(spot);","isFree() sirf fast filter; asli guarantee tryOccupy() ka CAS deta hai"],["            }",""],["            return Optional.empty();",""],["        }",""],["    }",""],["",""],["    interface PricingStrategy {",""],["        long calculateFeePaise(VehicleType type, Duration parked);",""],["    }",""],["",""],["    static final class HourlyPricing implements PricingStrategy {",""],["        private static final Map<VehicleType, Long> RATE_PER_HOUR_PAISE =",""],["                Map.of(VehicleType.BIKE, 2_000L, VehicleType.CAR, 5_000L, VehicleType.TRUCK, 10_000L);","Rates paise me (long): double se rounding bugs nahi"],["",""],["        @Override",""],["        public long calculateFeePaise(VehicleType type, Duration parked) {",""],["            long hours = Math.max(1, (parked.toMinutes() + 59) / 60);","Ceil to hours, minimum 1 hour charge"],["            return hours * RATE_PER_HOUR_PAISE.get(type);",""],["        }",""],["    }",""],["",""],["    static final class ParkingLot {",""],["        private final List<ParkingSpot> spots;",""],["        private final SpotAllocationStrategy allocationStrategy;",""],["        private final PricingStrategy pricingStrategy;",""],["        private final Map<String, Ticket> activeTickets = new ConcurrentHashMap<>();","ticketId -> Ticket (real: tickets table)"],["        private final AtomicLong ticketSequence = new AtomicLong(1000);",""],["",""],["        ParkingLot(List<ParkingSpot> spots, SpotAllocationStrategy allocationStrategy, PricingStrategy pricingStrategy) {","Strategies bahar se inject: Singleton nahi, isliye testing aur multi-lot easy"],["            this.spots = List.copyOf(spots);",""],["            this.allocationStrategy = allocationStrategy;",""],["            this.pricingStrategy = pricingStrategy;",""],["        }",""],["",""],["        Ticket parkVehicle(Vehicle vehicle, Instant now) {",""],["            SpotSize size = requiredSpotSize(vehicle.type());",""],["            ParkingSpot spot = allocationStrategy.findSpot(spots, size)",""],["                    .orElseThrow(() -> new IllegalStateException(\"Parking full for \" + size));","Spot nahi mila: gate pe FULL"],["            Ticket ticket = new Ticket(\"T\" + ticketSequence.incrementAndGet(), vehicle, spot, now);",""],["            activeTickets.put(ticket.ticketId(), ticket);",""],["            return ticket;",""],["        }",""],["",""],["        long unparkVehicle(String ticketId, Instant now) {",""],["            Ticket ticket = activeTickets.remove(ticketId);","remove() atomic: same ticket se do baar exit nahi"],["            if (ticket == null) throw new IllegalArgumentException(\"Invalid or already used ticket \" + ticketId);",""],["            long feePaise = pricingStrategy.calculateFeePaise(ticket.vehicle().type(), Duration.between(ticket.entryTime(), now));",""],["            ticket.spot().release();","Spot wapas free (real flow me payment success ke baad)"],["            return feePaise;",""],["        }",""],["",""],["        Map<SpotSize, Long> availableSpotsBySize() {","Display board ke liye: har size ke free spots"],["            Map<SpotSize, Long> counts = new EnumMap<>(SpotSize.class);",""],["            for (ParkingSpot spot : spots) if (spot.isFree()) counts.merge(spot.size, 1L, Long::sum);",""],["            return counts;",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) throws Exception {",""],["        List<ParkingSpot> spots = new ArrayList<>();",""],["        for (int floor = 0; floor < 2; floor++) {",""],["            spots.add(new ParkingSpot(\"F\" + floor + \"-S1\", floor, SpotSize.SMALL));",""],["            spots.add(new ParkingSpot(\"F\" + floor + \"-M1\", floor, SpotSize.MEDIUM));",""],["            spots.add(new ParkingSpot(\"F\" + floor + \"-L1\", floor, SpotSize.LARGE));",""],["        }",""],["        ParkingLot lot = new ParkingLot(spots, new NearestFirstStrategy(), new HourlyPricing());",""],["        Instant t0 = Instant.parse(\"2026-10-07T09:00:00Z\");",""],["",""],["        Ticket car = lot.parkVehicle(new Vehicle(\"MH12AB1234\", VehicleType.CAR), t0);",""],["        System.out.println(\"parked at \" + car.spot().spotId + \", ticket \" + car.ticketId());",""],["        System.out.println(\"free: \" + lot.availableSpotsBySize());",""],["",""],["        ExecutorService gates = Executors.newFixedThreadPool(3);","3 gates ek saath, bacha sirf 1 MEDIUM spot"],["        List<Future<String>> results = new ArrayList<>();",""],["        for (String plate : List.of(\"KA01XY0001\", \"DL05ZZ0002\", \"TN09QQ0003\")) {",""],["            results.add(gates.submit(() -> {",""],["                try {",""],["                    return plate + \" -> \" + lot.parkVehicle(new Vehicle(plate, VehicleType.CAR), t0).spot().spotId;",""],["                } catch (IllegalStateException e) {",""],["                    return plate + \" -> \" + e.getMessage();",""],["                }",""],["            }));",""],["        }",""],["        for (Future<String> f : results) System.out.println(f.get());","Sirf ek ko F1-M1 milega, baaki do ko \"Parking full\""],["        gates.shutdown();",""],["",""],["        long fee = lot.unparkVehicle(car.ticketId(), t0.plus(Duration.ofMinutes(150)));","2.5 hours = 3 hours ka charge"],["        System.out.println(\"fee for 2h30m CAR = Rs \" + fee / 100);",""],["        System.out.println(\"free: \" + lot.availableSpotsBySize());",""],["    }",""],["}",""]]},"PaymentLedgerDemo":{"file":"PaymentLedgerDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.HashMap;",""],["import java.util.HashSet;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Optional;",""],["import java.util.Set;",""],["import java.util.TreeMap;",""],["import java.util.concurrent.TimeoutException;",""],["",""],["public class PaymentLedgerDemo {",""],["",""],["    record Entry(String account, long amountPaise) {}","+ve = paisa is account me aaya, -ve = gaya"],["",""],["    static final class Ledger {","Double-entry, append-only: har transaction ke entries ka sum 0 (paisa na banta, na gayab)"],["        private final List<String> journal = new ArrayList<>();",""],["        private final Set<String> postedTxnIds = new HashSet<>();",""],["        private final Map<String, Long> balances = new TreeMap<>();","Derived; journal se kabhi bhi recompute"],["",""],["        synchronized boolean post(String txnId, List<Entry> entries) {",""],["            if (!postedTxnIds.add(txnId)) return false;","Same txn dobara (retry/replay) = no-op"],["            long sum = entries.stream().mapToLong(Entry::amountPaise).sum();",""],["            if (sum != 0) {",""],["                postedTxnIds.remove(txnId);",""],["                throw new IllegalArgumentException(\"unbalanced txn \" + txnId + \" sum=\" + sum);","Bug ko yahin pakdo, books kabhi unbalanced nahi"],["            }",""],["            entries.forEach(e -> {",""],["                balances.merge(e.account(), e.amountPaise(), Long::sum);",""],["                journal.add(txnId + \" \" + e.account() + \" \" + e.amountPaise());",""],["            });",""],["            return true;",""],["        }",""],["",""],["        synchronized long balance(String account) { return balances.getOrDefault(account, 0L); }",""],["",""],["        synchronized long totalOfAllAccounts() { return balances.values().stream().mapToLong(Long::longValue).sum(); }","Invariant: hamesha 0"],["",""],["        synchronized boolean hasTxn(String txnId) { return postedTxnIds.contains(txnId); }",""],["",""],["        synchronized Map<String, Long> balances() { return new TreeMap<>(balances); }",""],["    }",""],["",""],["    static final class PspSimulator {","External payment gateway (Razorpay/Stripe jaisa)"],["        private final Map<String, Long> chargesByKey = new LinkedHashMap<>();",""],["        boolean timeoutAfterChargeOnce;",""],["",""],["        String charge(String idempotencyKey, long amountPaise) throws TimeoutException {",""],["            chargesByKey.putIfAbsent(idempotencyKey, amountPaise);","PSP bhi idempotency key respect karta hai"],["            if (timeoutAfterChargeOnce) {","Paisa kat gaya, par response raste me kho gaya"],["                timeoutAfterChargeOnce = false;",""],["                throw new TimeoutException(\"PSP response timeout\");",""],["            }",""],["            return \"SUCCEEDED\";",""],["        }",""],["",""],["        Optional<String> status(String idempotencyKey) { return chargesByKey.containsKey(idempotencyKey) ? Optional.of(\"SUCCEEDED\") : Optional.empty(); }",""],["",""],["        Map<String, Long> settlementReport() { return new LinkedHashMap<>(chargesByKey); }","Daily settlement file"],["    }",""],["",""],["    static final class PaymentService {",""],["        static final long FEE_BPS = 300;","3% platform fee (basis points)"],["        private final Ledger ledger;",""],["        private final PspSimulator psp;",""],["        private final Map<String, String> paymentState = new HashMap<>();","payments table: key -> state machine"],["        boolean crashBeforeLedgerOnce;",""],["",""],["        PaymentService(Ledger ledger, PspSimulator psp) {",""],["            this.ledger = ledger;",""],["            this.psp = psp;",""],["        }",""],["",""],["        String payByCard(String idempotencyKey, String merchant, long amountPaise) {",""],["            String existing = paymentState.get(idempotencyKey);",""],["            if (\"SUCCEEDED\".equals(existing)) return \"SUCCEEDED (duplicate request, no new charge)\";","User ne Pay do baar dabaya"],["            paymentState.put(idempotencyKey, \"PROCESSING\");",""],["            String result;",""],["            try {",""],["                result = psp.charge(idempotencyKey, amountPaise);",""],["            } catch (TimeoutException e) {",""],["                paymentState.put(idempotencyKey, \"UNKNOWN\");","Timeout = pata nahi paisa kata ya nahi: blind retry = double charge risk"],["                result = psp.status(idempotencyKey).orElse(\"NOT_FOUND\");","Pehle status poochho; mila to wahi, nahi to same key se retry safe"],["            }",""],["            if (!\"SUCCEEDED\".equals(result)) {",""],["                paymentState.put(idempotencyKey, \"FAILED\");",""],["                return \"FAILED\";",""],["            }",""],["            if (crashBeforeLedgerOnce) {","PSP ne charge kiya, hamara service ledger likhne se pehle crash"],["                crashBeforeLedgerOnce = false;",""],["                return \"CRASHED before ledger (reconciliation will catch it)\";",""],["            }",""],["            postCardPayment(idempotencyKey, merchant, amountPaise);",""],["            paymentState.put(idempotencyKey, \"SUCCEEDED\");",""],["            return \"SUCCEEDED\";",""],["        }",""],["",""],["        void postCardPayment(String key, String merchant, long amount) {",""],["            long fee = amount * FEE_BPS / 10_000;",""],["            ledger.post(\"pay:\" + key, List.of(",""],["                    new Entry(\"external:psp\", -amount),","Paisa bahar (customer ke card) se aaya"],["                    new Entry(\"merchant:\" + merchant, amount - fee),","Merchant ko dena hai"],["                    new Entry(\"platform:fees\", fee)));","Hamari kamai"],["        }",""],["",""],["        String refund(String key, String merchant, long amount) {",""],["            long fee = amount * FEE_BPS / 10_000;",""],["            boolean posted = ledger.post(\"refund:\" + key, List.of(","Refund = reversal entries; original kabhi edit/delete nahi"],["                    new Entry(\"external:psp\", amount), new Entry(\"merchant:\" + merchant, -(amount - fee)), new Entry(\"platform:fees\", -fee)));",""],["            return posted ? \"REFUNDED\" : \"already refunded\";",""],["        }",""],["",""],["        String walletTransfer(String txnId, String from, String to, long amount) {",""],["            synchronized (ledger) {","Check + debit ek atomic step (DB me: SELECT ... FOR UPDATE ya conditional UPDATE)"],["                if (ledger.balance(from) < amount) return \"DECLINED: insufficient balance\";",""],["                ledger.post(txnId, List.of(new Entry(from, -amount), new Entry(to, amount)));",""],["                return \"OK\";",""],["            }",""],["        }",""],["",""],["        List<String> reconcile(Map<String, Long> pspReport) {","PSP ki settlement file vs hamara ledger"],["            List<String> issues = new ArrayList<>();",""],["            pspReport.forEach((key, amount) -> {",""],["                if (!ledger.hasTxn(\"pay:\" + key)) issues.add(\"PSP charged \" + key + \" Rs \" + amount / 100 + \" but ledger missing\");",""],["            });",""],["            return issues;",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Ledger ledger = new Ledger();",""],["        PspSimulator psp = new PspSimulator();",""],["        PaymentService payments = new PaymentService(ledger, psp);",""],["",""],["        System.out.println(\"order-1 pay: \" + payments.payByCard(\"order-1\", \"biryani-house\", 45_000));",""],["        System.out.println(\"order-1 again: \" + payments.payByCard(\"order-1\", \"biryani-house\", 45_000));",""],["        psp.timeoutAfterChargeOnce = true;",""],["        System.out.println(\"order-2 (PSP timeout after charge): \" + payments.payByCard(\"order-2\", \"pizza-point\", 60_000));",""],["",""],["        ledger.post(\"topup:asha-1\", List.of(new Entry(\"external:psp\", -100_000), new Entry(\"wallet:asha\", 100_000)));","UPI se wallet top-up ₹1000"],["        System.out.println(\"wallet pay 300: \" + payments.walletTransfer(\"wpay:1\", \"wallet:asha\", \"merchant:biryani-house\", 30_000));",""],["        System.out.println(\"wallet pay 900: \" + payments.walletTransfer(\"wpay:2\", \"wallet:asha\", \"merchant:biryani-house\", 90_000));",""],["        System.out.println(\"refund order-1: \" + payments.refund(\"order-1\", \"biryani-house\", 45_000));",""],["",""],["        payments.crashBeforeLedgerOnce = true;",""],["        System.out.println(\"order-3: \" + payments.payByCard(\"order-3\", \"pizza-point\", 20_000));",""],["        System.out.println(\"reconciliation: \" + payments.reconcile(psp.settlementReport()));",""],["        System.out.println(\"balances: \" + ledger.balances());",""],["        System.out.println(\"sum of all accounts = \" + ledger.totalOfAllAccounts() + \" (must be 0)\");",""],["    }",""],["}",""]]},"RaftClusterDemo":{"file":"RaftClusterDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["",""],["public class RaftClusterDemo {","Single-threaded simulation: Raft ke rules dikhane ke liye, network/timers nahi"],["",""],["    enum Role { FOLLOWER, CANDIDATE, LEADER }",""],["",""],["    record LogEntry(int term, String command) {",""],["        @Override",""],["        public String toString() { return \"t\" + term + \":\" + command; }",""],["    }",""],["",""],["    static final class RaftNode {",""],["        final String id;",""],["        Role role = Role.FOLLOWER;",""],["        int currentTerm = 0;","Term = logical clock; har election pe badhta hai, kabhi peeche nahi jaata"],["        String votedFor;","Ek term me sirf EK vote: isi se ek term me do leaders impossible"],["        final List<LogEntry> log = new ArrayList<>();",""],["        int commitIndex = -1;","Is index tak ke entries majority pe hain = committed (pakke)"],["        int lastApplied = -1;",""],["        final List<String> stateMachine = new ArrayList<>();","Committed commands isi order me apply: har node ka same state"],["        boolean alive = true;",""],["        int partition = 0;","Network partition simulate: same number = baat kar sakte hain"],["",""],["        RaftNode(String id) { this.id = id; }",""],["",""],["        int lastLogIndex() { return log.size() - 1; }",""],["",""],["        int lastLogTerm() { return log.isEmpty() ? 0 : log.get(log.size() - 1).term(); }",""],["",""],["        void becomeFollower(int term) {",""],["            if (term > currentTerm) {","Bada term dikha = main purana hoon: term update, vote reset"],["                currentTerm = term;",""],["                votedFor = null;",""],["            }",""],["            role = Role.FOLLOWER;",""],["        }",""],["",""],["        void applyCommitted() {",""],["            while (lastApplied < commitIndex) {",""],["                lastApplied++;",""],["                stateMachine.add(log.get(lastApplied).command());",""],["            }",""],["        }",""],["",""],["        boolean handleRequestVote(int term, String candidateId, int candLastIndex, int candLastTerm) {",""],["            if (term < currentTerm) return false;","Purane term ka candidate: seedha mana"],["            if (term > currentTerm) becomeFollower(term);",""],["            boolean logUpToDate = candLastTerm > lastLogTerm()",""],["                    || (candLastTerm == lastLogTerm() && candLastIndex >= lastLogIndex());","Election restriction: candidate ka log mere jitna naya ho, tabhi vote; isi se committed data kabhi lost nahi"],["            if ((votedFor == null || votedFor.equals(candidateId)) && logUpToDate) {",""],["                votedFor = candidateId;",""],["                return true;",""],["            }",""],["            return false;",""],["        }",""],["",""],["        String describe() {",""],["            return String.format(\"%s %-9s term=%d log=%s applied=%s%s\", id, role, currentTerm, log, stateMachine, alive ? \"\" : \" (DOWN)\");",""],["        }",""],["    }",""],["",""],["    static final class Cluster {",""],["        final Map<String, RaftNode> nodes = new LinkedHashMap<>();",""],["",""],["        Cluster(String... ids) {",""],["            for (String id : ids) nodes.put(id, new RaftNode(id));",""],["        }",""],["",""],["        RaftNode node(String id) { return nodes.get(id); }",""],["",""],["        int majority() { return nodes.size() / 2 + 1; }","5 nodes: majority 3, yaani 2 failures tak system chalta hai"],["",""],["        boolean canTalk(RaftNode a, RaftNode b) { return a.alive && b.alive && a.partition == b.partition; }",""],["",""],["        boolean startElection(String candidateId) {","Election timeout (150-300 ms random) khatam hone par follower candidate banta hai"],["            RaftNode candidate = node(candidateId);",""],["            candidate.currentTerm++;",""],["            candidate.role = Role.CANDIDATE;",""],["            candidate.votedFor = candidate.id;","Pehla vote khud ko"],["            int votes = 1;",""],["            for (RaftNode peer : nodes.values()) {",""],["                if (peer == candidate || !canTalk(candidate, peer)) continue;",""],["                if (peer.handleRequestVote(candidate.currentTerm, candidate.id, candidate.lastLogIndex(), candidate.lastLogTerm())) {",""],["                    votes++;",""],["                } else if (peer.currentTerm > candidate.currentTerm) {",""],["                    candidate.becomeFollower(peer.currentTerm);",""],["                    return false;",""],["                }",""],["            }",""],["            if (votes >= majority()) {","Majority vote = leader; minority partition me ye kabhi nahi hoga"],["                candidate.role = Role.LEADER;",""],["                heartbeat(candidateId);",""],["                return true;",""],["            }",""],["            candidate.role = Role.FOLLOWER;","Haar gaya; real Raft me random timeout ke baad dobara try (split vote se bachne ke liye)"],["            return false;",""],["        }",""],["",""],["        boolean replicateTo(RaftNode leader, RaftNode follower) {","AppendEntries RPC (heartbeat bhi yahi)"],["            if (!canTalk(leader, follower)) return false;",""],["            if (follower.currentTerm > leader.currentTerm) {","Follower ka term bada: ye leader purana (stale) hai, step down"],["                leader.becomeFollower(follower.currentTerm);
