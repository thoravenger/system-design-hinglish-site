"        }",""],["",""],["        void removeServer(String server) {",""],["            for (int i = 0; i < virtualNodesPerServer; i++) {",""],["                ring.remove(hash(server + \"#vn\" + i));","Server hata: uski keys ring pe agle servers me bikhar jaati hain"],["            }",""],["        }",""],["",""],["        String getServerForKey(String key) {",""],["            if (ring.isEmpty()) throw new IllegalStateException(\"No servers in ring\");",""],["            Map.Entry<Long, String> owner = ring.ceilingEntry(hash(key));","Key ke hash se clockwise pehla virtual node = owner"],["            return (owner != null ? owner : ring.firstEntry()).getValue();","Ring ke end se aage: wrap-around, pehla node"],["        }",""],["",""],["        static long hash(String value) {",""],["            try {",""],["                byte[] digest = MessageDigest.getInstance(\"MD5\").digest(value.getBytes(StandardCharsets.UTF_8));","MD5 sirf achhe spread ke liye; production me Murmur3/xxHash fast hain"],["                long h = 0;",""],["                for (int i = 0; i < 8; i++) h = (h << 8) | (digest[i] & 0xFF);","Pehle 8 bytes ko 64-bit long me pack karo"],["                return h;",""],["            } catch (NoSuchAlgorithmException e) {",""],["                throw new IllegalStateException(e);",""],["            }",""],["        }",""],["    }",""],["",""],["    static Map<String, String> assignKeys(ConsistentHashRing ring, List<String> keys) {",""],["        Map<String, String> owners = new HashMap<>();",""],["        for (String key : keys) owners.put(key, ring.getServerForKey(key));",""],["        return owners;",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        ConsistentHashRing ring = new ConsistentHashRing(100);",""],["        for (String s : List.of(\"cache-A\", \"cache-B\", \"cache-C\")) ring.addServer(s);",""],["        List<String> keys = new ArrayList<>();",""],["        for (int i = 0; i < 10_000; i++) keys.add(\"user:\" + i);",""],["",""],["        Map<String, String> before = assignKeys(ring, keys);",""],["        ring.addServer(\"cache-D\");","Naya server: sirf ~25% keys move honi chahiye"],["        Map<String, String> after = assignKeys(ring, keys);",""],["        long moved = keys.stream().filter(k -> !before.get(k).equals(after.get(k))).count();",""],["        System.out.printf(\"consistent hashing: moved %d of %d keys (%.1f%%)%n\", moved, keys.size(), moved * 100.0 / keys.size());",""],["",""],["        Map<String, Long> load = new TreeMap<>();",""],["        after.values().forEach(server -> load.merge(server, 1L, Long::sum));",""],["        System.out.println(\"load per server: \" + load);","Virtual nodes ki wajah se load roughly barabar"],["",""],["        long movedModulo = keys.stream()",""],["                .filter(k -> Math.floorMod(k.hashCode(), 3) != Math.floorMod(k.hashCode(), 4))","Comparison: hash % 3 vs hash % 4"],["                .count();",""],["        System.out.printf(\"modulo hashing 3 -> 4 servers would move: %.1f%%%n\", movedModulo * 100.0 / keys.size());",""],["    }",""],["}",""]]},"DesignPatternsDemo":{"file":"DesignPatternsDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.HashMap;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.function.Consumer;",""],["",""],["public class DesignPatternsDemo {",""],["",""],["    // 1) Singleton: holder idiom (lazy + thread-safe, bina lock ke)",""],["    static final class AppConfig {",""],["        private final Map<String, String> properties = new HashMap<>();",""],["",""],["        private AppConfig() { properties.put(\"region\", \"ap-south-1\"); }","Private constructor: bahar se new AppConfig() nahi ho sakta"],["",""],["        private static final class Holder {","Holder class pehli getInstance() call pe load hoti hai: lazy, aur JVM class-loading thread-safe hai"],["            static final AppConfig INSTANCE = new AppConfig();",""],["        }",""],["",""],["        static AppConfig getInstance() { return Holder.INSTANCE; }",""],["",""],["        String get(String key) { return properties.get(key); }",""],["    }",""],["",""],["    // 2) Builder: bahut saare optional params, immutable object",""],["    static final class HttpRequest {",""],["        private final String url;",""],["        private final String method;",""],["        private final Map<String, String> headers;",""],["        private final int timeoutMillis;",""],["",""],["        private HttpRequest(Builder b) {",""],["            this.url = b.url;",""],["            this.method = b.method;",""],["            this.headers = Map.copyOf(b.headers);","Immutable copy: object banne ke baad koi headers nahi badal sakta"],["            this.timeoutMillis = b.timeoutMillis;",""],["        }",""],["",""],["        static Builder newBuilder(String url) { return new Builder(url); }",""],["",""],["        @Override",""],["        public String toString() { return method + \" \" + url + \" headers=\" + headers + \" timeout=\" + timeoutMillis + \"ms\"; }",""],["",""],["        static final class Builder {",""],["            private final String url;",""],["            private String method = \"GET\";","Defaults builder me: caller sirf zaroori cheezein set karta hai"],["            private final Map<String, String> headers = new LinkedHashMap<>();",""],["            private int timeoutMillis = 2000;",""],["",""],["            private Builder(String url) { this.url = url; }",""],["",""],["            Builder method(String method) { this.method = method; return this; }","\"return this\" = chaining: .method(..).header(..).build()"],["",""],["            Builder header(String key, String value) { headers.put(key, value); return this; }",""],["",""],["            Builder timeoutMillis(int timeoutMillis) { this.timeoutMillis = timeoutMillis; return this; }",""],["",""],["            HttpRequest build() {",""],["                if (timeoutMillis <= 0) throw new IllegalArgumentException(\"timeout must be > 0\");","Saari validation build() me ek jagah"],["                return new HttpRequest(this);",""],["            }",""],["        }",""],["    }",""],["",""],["    // 3) Strategy: algorithm runtime pe swap",""],["    interface DiscountStrategy { long applyDiscount(long amountPaise); }",""],["",""],["    static final DiscountStrategy NO_DISCOUNT = amount -> amount;",""],["    static final DiscountStrategy FESTIVE_TEN_PERCENT = amount -> amount - amount / 10;","Lambda as strategy: if-else chain ki jagah behaviour object pass karo"],["",""],["    // 4) Factory: creation logic ek jagah",""],["    interface Notifier { String send(String to, String message); }",""],["",""],["    static Notifier createNotifier(String channel) {","Factory: caller ko concrete class pata hone ki zaroorat nahi"],["        return switch (channel) {",""],["            case \"SMS\" -> (to, msg) -> \"SMS to \" + to + \": \" + msg;",""],["            case \"EMAIL\" -> (to, msg) -> \"EMAIL to \" + to + \": \" + msg;",""],["            default -> throw new IllegalArgumentException(\"Unknown channel: \" + channel);",""],["        };",""],["    }",""],["",""],["    // 5) Observer: publisher aur listeners decoupled",""],["    static final class OrderEventBus {",""],["        private final List<Consumer<String>> listeners = new ArrayList<>();",""],["",""],["        void subscribe(Consumer<String> listener) { listeners.add(listener); }",""],["",""],["        void publish(String event) { listeners.forEach(listener -> listener.accept(event)); }","Publisher ko nahi pata kaun sun raha: naya listener = publisher me zero change"],["    }",""],["",""],["    // 6) Decorator: wrap karke behaviour add",""],["    static Notifier withLogging(Notifier inner) {","Original object wrap karke logging/metrics jodo, uski class badle bina"],["        return (to, msg) -> {",""],["            System.out.println(\"[log] sending to \" + to);",""],["            return inner.send(to, msg);",""],["        };",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        System.out.println(\"region = \" + AppConfig.getInstance().get(\"region\") + \", same instance? \" + (AppConfig.getInstance() == AppConfig.getInstance()));",""],["",""],["        HttpRequest request = HttpRequest.newBuilder(\"https://api.example.com/orders\")",""],["                .method(\"POST\")",""],["                .header(\"Idempotency-Key\", \"abc-123\")",""],["                .timeoutMillis(1500)",""],["                .build();",""],["        System.out.println(request);",""],["",""],["        long cartPaise = 120_000;",""],["        for (DiscountStrategy strategy : List.of(NO_DISCOUNT, FESTIVE_TEN_PERCENT)) {",""],["            System.out.println(\"payable = \" + strategy.applyDiscount(cartPaise));",""],["        }",""],["",""],["        Notifier sms = withLogging(createNotifier(\"SMS\"));",""],["        OrderEventBus bus = new OrderEventBus();",""],["        bus.subscribe(event -> System.out.println(sms.send(\"+91-98xxxxxx01\", event)));",""],["        bus.subscribe(event -> System.out.println(\"analytics got: \" + event));",""],["        bus.publish(\"ORDER_PLACED #42\");",""],["    }",""],["}",""]]},"FileSyncDemo":{"file":"FileSyncDemo.java","lines":[["import java.nio.charset.StandardCharsets;",""],["import java.security.MessageDigest;",""],["import java.security.NoSuchAlgorithmException;",""],["import java.util.ArrayList;",""],["import java.util.Arrays;",""],["import java.util.HashMap;",""],["import java.util.HexFormat;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.TreeMap;",""],["",""],["public class FileSyncDemo {",""],["",""],["    static final int BLOCK_SIZE = 8;","Demo me 8 bytes; real Dropbox ~4 MB blocks"],["",""],["    static String sha(byte[] data) {",""],["        try {",""],["            return HexFormat.of().formatHex(MessageDigest.getInstance(\"SHA-256\").digest(data)).substring(0, 10);",""],["        } catch (NoSuchAlgorithmException e) {",""],["            throw new IllegalStateException(e);",""],["        }",""],["    }",""],["",""],["    static List<byte[]> chunk(byte[] content) {","Fixed-size chunking (simple); content-defined chunking insert-shift problem solve karta hai"],["        List<byte[]> blocks = new ArrayList<>();",""],["        for (int i = 0; i < content.length; i += BLOCK_SIZE) blocks.add(Arrays.copyOfRange(content, i, Math.min(content.length, i + BLOCK_SIZE)));",""],["        return blocks;",""],["    }",""],["",""],["    static final class BlockStore {","S3 jaisa content-addressed store: key = hash(block)"],["        private final Map<String, byte[]> blocks = new HashMap<>();",""],["        int uploads;",""],["",""],["        List<String> missing(List<String> hashes) { return hashes.stream().filter(h -> !blocks.containsKey(h)).distinct().toList(); }","Client ko sirf ye upload karne hain"],["",""],["        void put(String hash, byte[] data) {",""],["            if (!sha(data).equals(hash)) throw new IllegalArgumentException(\"corrupt block\");","Server dobara hash check karta hai"],["            blocks.putIfAbsent(hash, data);",""],["            uploads++;",""],["        }",""],["",""],["        byte[] get(String hash) { return blocks.get(hash); }",""],["    }",""],["",""],["    record FileVersion(int version, List<String> blockHashes, String device) {}",""],["",""],["    static final class MetadataService {","SQL: files(path, version, block list) + change journal"],["        final Map<String, FileVersion> head = new TreeMap<>();",""],["        final List<String> journal = new ArrayList<>();","Har commit ek entry: devices cursor se \"kya badla\" poochte hain"],["",""],["        String commit(String path, int baseVersion, List<String> hashes, String device) {",""],["            FileVersion current = head.get(path);",""],["            int currentVersion = current == null ? 0 : current.version();",""],["            if (currentVersion != baseVersion) {","Optimistic concurrency: kisi aur ne beech me badla = conflict"],["                String conflictPath = path.replace(\".txt\", \" (conflicted copy, \" + device + \").txt\");",""],["                head.put(conflictPath, new FileVersion(1, hashes, device));","Dropbox style: merge nahi, dono copies rakho, user decide kare"],["                journal.add(\"CONFLICT \" + conflictPath);",""],["                return conflictPath;",""],["            }",""],["            head.put(path, new FileVersion(currentVersion + 1, hashes, device));",""],["            journal.add(\"UPDATE \" + path + \" v\" + (currentVersion + 1));",""],["            return path;",""],["        }",""],["    }",""],["",""],["    static final class SyncClient {",""],["        final String device;",""],["        final Map<String, FileVersion> localVersions = new HashMap<>();",""],["        int blocksDownloaded;",""],["",""],["        SyncClient(String device) { this.device = device; }",""],["",""],["        String save(String path, String text, BlockStore store, MetadataService meta) {",""],["            List<byte[]> blocks = chunk(text.getBytes(StandardCharsets.UTF_8));",""],["            List<String> hashes = blocks.stream().map(FileSyncDemo::sha).toList();",""],["            List<String> missing = store.missing(hashes);","1) Server se pucho kaunse blocks nahi hain"],["            for (int i = 0; i < blocks.size(); i++) if (missing.contains(hashes.get(i))) store.put(hashes.get(i), blocks.get(i));","2) Sirf missing upload (delta sync + dedup)"],["            int base = localVersions.containsKey(path) ? localVersions.get(path).version() : 0;",""],["            String committedAs = meta.commit(path, base, hashes, device);","3) Metadata commit (blocks pehle, metadata baad me: half file kabhi visible nahi)"],["            if (committedAs.equals(path)) localVersions.put(path, meta.head.get(path));",""],["            return committedAs + \" (uploaded \" + missing.size() + \"/\" + blocks.size() + \" blocks)\";",""],["        }",""],["",""],["        String pull(String path, BlockStore store, MetadataService meta) {",""],["            FileVersion server = meta.head.get(path);",""],["            FileVersion mine = localVersions.get(path);",""],["            List<String> have = mine == null ? List.of() : mine.blockHashes();",""],["            StringBuilder content = new StringBuilder();",""],["            for (String h : server.blockHashes()) {",""],["                if (!have.contains(h)) blocksDownloaded++;","Sirf naye blocks download"],["                content.append(new String(store.get(h), StandardCharsets.UTF_8));",""],["            }",""],["            localVersions.put(path, server);",""],["            return content.toString();",""],["        }",""],["    }",""],["",""],["    static int changedBlocks(String before, String after) {",""],["        List<String> a = chunk(before.getBytes(StandardCharsets.UTF_8)).stream().map(FileSyncDemo::sha).toList();",""],["        List<String> b = chunk(after.getBytes(StandardCharsets.UTF_8)).stream().map(FileSyncDemo::sha).toList();",""],["        return (int) b.stream().filter(h -> !a.contains(h)).count();",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        BlockStore store = new BlockStore();",""],["        MetadataService meta = new MetadataService();",""],["        SyncClient laptop = new SyncClient(\"laptop\");",""],["        SyncClient phone = new SyncClient(\"phone\");",""],["",""],["        String v1 = \"Q3 plan: hire 4 SDEs, launch UPI.\";",""],["        System.out.println(\"laptop save v1: \" + laptop.save(\"report.txt\", v1, store, meta));",""],["        System.out.println(\"phone pull: \" + phone.pull(\"report.txt\", store, meta) + \" | blocks downloaded \" + phone.blocksDownloaded);",""],["        String v2 = \"Q3 plan: hire 6 SDEs, launch UPI.\";",""],["        System.out.println(\"laptop save v2 (1 char changed): \" + laptop.save(\"report.txt\", v2, store, meta));",""],["        phone.pull(\"report.txt\", store, meta);",""],["        System.out.println(\"phone downloaded total blocks \" + phone.blocksDownloaded + \" (only the changed one)\");",""],["",""],["        System.out.println(\"fixed-size chunking: replace edit changes \" + changedBlocks(v1, v2) + \" block, insert at start changes \"",""],["                + changedBlocks(v1, \">\" + v1) + \" blocks (content-defined chunking fixes this)\");",""],["",""],["        laptop.save(\"report.txt\", \"Q3 plan: hire 6 SDEs, launch UPI + cards.\", store, meta);","Laptop ne offline edit sync kiya"],["        System.out.println(\"phone offline edit on old base: \" + phone.save(\"report.txt\", \"Q3 plan: hire 6 SDEs, launch UPI in Pune.\", store, meta));",""],["        SyncClient colleague = new SyncClient(\"colleague\");",""],["        System.out.println(\"colleague uploads identical file: \" + colleague.save(\"copy-of-report.txt\", v1, store, meta));","Dedup: same blocks already stored"],["        System.out.println(\"journal: \" + meta.journal);",""],["    }",""],["}",""]]},"FoodDeliveryDemo":{"file":"FoodDeliveryDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.Comparator;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Optional;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.concurrent.CopyOnWriteArrayList;",""],["import java.util.concurrent.atomic.AtomicLong;",""],["import java.util.concurrent.atomic.AtomicReference;",""],["",""],["public class FoodDeliveryDemo {",""],["",""],["    enum OrderStatus {","State pattern (enum style): har state ke allowed next states yahin; galat transition reject"],["        PLACED, ACCEPTED, PREPARING, PICKED_UP, DELIVERED, CANCELLED;",""],["",""],["        boolean canTransitionTo(OrderStatus next) {",""],["            return switch (this) {",""],["                case PLACED -> next == ACCEPTED || next == CANCELLED;",""],["                case ACCEPTED -> next == PREPARING || next == CANCELLED;",""],["                case PREPARING -> next == PICKED_UP;","Khana banna shuru = ab cancel nahi (business rule)"],["                case PICKED_UP -> next == DELIVERED;",""],["                case DELIVERED, CANCELLED -> false;","Terminal states: aage koi transition nahi"],["            };",""],["        }",""],["    }",""],["",""],["    record OrderEvent(String orderId, OrderStatus from, OrderStatus to, long version) {}",""],["",""],["    interface OrderEventListener {","Observer: notification, dispatch, analytics sab listeners; OrderService unhe nahi jaanta"],["        void onEvent(OrderEvent event);",""],["    }",""],["",""],["    static final class Order {",""],["        final String orderId;",""],["        final String customerId;",""],["        final String restaurantId;",""],["        final long amountPaise;",""],["        private OrderStatus status = OrderStatus.PLACED;",""],["        private long version = 0;","Optimistic locking version (DB column)"],["        String partnerId;",""],["",""],["        Order(String orderId, String customerId, String restaurantId, long amountPaise) {",""],["            this.orderId = orderId;",""],["            this.customerId = customerId;",""],["            this.restaurantId = restaurantId;",""],["            this.amountPaise = amountPaise;",""],["        }",""],["    }",""],["",""],["    static final class DeliveryPartner {",""],["        final String partnerId;",""],["        final double distanceKm;",""],["        final AtomicReference<String> currentOrder = new AtomicReference<>(null);","null = free; CAS se ek partner ko ek hi order"],["",""],["        DeliveryPartner(String partnerId, double distanceKm) {",""],["            this.partnerId = partnerId;",""],["            this.distanceKm = distanceKm;",""],["        }",""],["    }",""],["",""],["    static final class OrderService {",""],["        private final Map<String, Order> orders = new ConcurrentHashMap<>();",""],["        private final Map<String, String> orderIdByIdempotencyKey = new ConcurrentHashMap<>();","Same \"Place order\" tap do baar = ek hi order"],["        private final List<OrderEventListener> listeners = new CopyOnWriteArrayList<>();",""],["        private final List<DeliveryPartner> partners = new CopyOnWriteArrayList<>();",""],["        private final AtomicLong ids = new AtomicLong(5000);",""],["",""],["        void subscribe(OrderEventListener listener) { listeners.add(listener); }",""],["",""],["        void registerPartner(DeliveryPartner partner) { partners.add(partner); }",""],["",""],["        Order placeOrder(String idempotencyKey, String customerId, String restaurantId, long amountPaise) {",""],["            String orderId = orderIdByIdempotencyKey.computeIfAbsent(idempotencyKey, key -> {","computeIfAbsent atomic: parallel retries me se ek hi order banega"],["                Order order = new Order(\"ORD\" + ids.incrementAndGet(), customerId, restaurantId, amountPaise);",""],["                orders.put(order.orderId, order);",""],["                return order.orderId;",""],["            });",""],["            return orders.get(orderId);",""],["        }",""],["",""],["        boolean updateOrderStatus(String orderId, OrderStatus next) {",""],["            Order order = orders.get(orderId);",""],["            OrderEvent event;",""],["            synchronized (order) {","Per-order lock: alag orders parallel; DB me: UPDATE ... WHERE id=? AND version=?"],["                if (!order.status.canTransitionTo(next)) {",""],["                    System.out.println(\"  rejected \" + order.status + \" -> \" + next + \" for \" + orderId);","Invalid transition reject (e.g. PREPARING -> CANCELLED)"],["                    return false;",""],["                }",""],["                OrderStatus previous = order.status;",""],["                order.status = next;",""],["                order.version++;",""],["                event = new OrderEvent(orderId, previous, next, order.version);",""],["            }",""],["            listeners.forEach(listener -> listener.onEvent(event));","Lock ke bahar notify: slow listener lock hold na kare (real: outbox -> Kafka)"],["            return true;",""],["        }",""],["",""],["        Optional<DeliveryPartner> assignDeliveryPartner(String orderId) {",""],["            List<DeliveryPartner> byDistance = new ArrayList<>(partners);",""],["            byDistance.sort(Comparator.comparingDouble(p -> p.distanceKm));","Nearest pehle (real: rider ETA vs food-ready time + batching)"],["            for (DeliveryPartner partner : byDistance) {",""],["                if (partner.currentOrder.compareAndSet(null, orderId)) {","CAS: do orders ek hi rider ko assign nahi ho sakte"],["                    orders.get(orderId).partnerId = partner.partnerId;",""],["                    return Optional.of(partner);",""],["                }",""],["            }",""],["            return Optional.empty();",""],["        }",""],["",""],["        void releasePartnerFor(String orderId) {",""],["            partners.forEach(p -> p.currentOrder.compareAndSet(orderId, null));",""],["        }",""],["",""],["        void cancelWithCompensation(String orderId, String reason) {","Saga compensation: cancel = payment void/refund + rider free"],["            if (updateOrderStatus(orderId, OrderStatus.CANCELLED)) {",""],["                System.out.println(\"  refund Rs \" + orders.get(orderId).amountPaise / 100 + \" for \" + orderId + \" (\" + reason + \")\");",""],["                releasePartnerFor(orderId);",""],["            }",""],["        }",""],["",""],["        OrderStatus statusOf(String orderId) {",""],["            Order order = orders.get(orderId);",""],["            synchronized (order) { return order.status; }",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        OrderService service = new OrderService();",""],["        service.subscribe(e -> System.out.println(\"  [notify customer] \" + e.orderId() + \" is \" + e.to()));",""],["        service.subscribe(e -> { if (e.to() == OrderStatus.DELIVERED) service.releasePartnerFor(e.orderId()); });","Delivery ke baad rider free"],["        service.registerPartner(new DeliveryPartner(\"rider-7\", 1.2));",""],["        service.registerPartner(new DeliveryPartner(\"rider-3\", 0.4));",""],["",""],["        Order order = service.placeOrder(\"tap-abc-1\", \"cust-9\", \"biryani-house\", 45_000);",""],["        Order duplicate = service.placeOrder(\"tap-abc-1\", \"cust-9\", \"biryani-house\", 45_000);","Double tap / network retry"],["        System.out.println(\"placed \" + order.orderId + \", duplicate tap same order? \" + (order == duplicate));",""],["",""],["        service.updateOrderStatus(order.orderId, OrderStatus.ACCEPTED);",""],["        System.out.println(\"assigned: \" + service.assignDeliveryPartner(order.orderId).map(p -> p.partnerId).orElse(\"none\"));",""],["        service.updateOrderStatus(order.orderId, OrderStatus.PREPARING);",""],["        service.updateOrderStatus(order.orderId, OrderStatus.CANCELLED);","Ban raha khana cancel nahi: rejected"],["        service.updateOrderStatus(order.orderId, OrderStatus.PICKED_UP);",""],["        service.updateOrderStatus(order.orderId, OrderStatus.DELIVERED);",""],["",""],["        Order second = service.placeOrder(\"tap-xyz-2\", \"cust-4\", \"pizza-point\", 60_000);",""],["        service.cancelWithCompensation(second.orderId, \"restaurant rejected\");","Restaurant ne mana kiya: compensation chala"],["        System.out.println(second.orderId + \" final status = \" + service.statusOf(second.orderId));",""],["    }",""],["}",""]]},"HotelBookingDemo":{"file":"HotelBookingDemo.java","lines":[["import java.time.LocalDate;",""],["import java.util.ArrayList;",""],["import java.util.HashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.TreeMap;",""],["import java.util.concurrent.CountDownLatch;",""],["import java.util.concurrent.ExecutorService;",""],["import java.util.concurrent.Executors;",""],["import java.util.concurrent.Future;",""],["",""],["public class HotelBookingDemo {",""],["",""],["    static final class RoomInventory {","Table: room_type_inventory(hotel, room_type, date, total, reserved) — ek row per night"],["        final int total;",""],["        int reserved;",""],["",""],["        RoomInventory(int total) { this.total = total; }",""],["    }",""],["",""],["    static final class InventoryStore {",""],["        private final Map<String, Map<LocalDate, RoomInventory>> byRoomType = new HashMap<>();",""],["",""],["        void addInventory(String hotelRoomType, LocalDate from, int nights, int rooms) {",""],["            Map<LocalDate, RoomInventory> m = byRoomType.computeIfAbsent(hotelRoomType, k -> new TreeMap<>());",""],["            for (int i = 0; i < nights; i++) m.put(from.plusDays(i), new RoomInventory(rooms));",""],["        }",""],["",""],["        synchronized boolean reserveNights(String hotelRoomType, LocalDate checkIn, LocalDate checkOut, int rooms, double overbookFactor) {","Ek DB transaction jaisa: saari nights ya kuch nahi"],["            Map<LocalDate, RoomInventory> m = byRoomType.get(hotelRoomType);",""],["            List<RoomInventory> nights = new ArrayList<>();",""],["            for (LocalDate d = checkIn; d.isBefore(checkOut); d = d.plusDays(1)) {","checkOut wali raat count nahi (guest us din nikalta hai)"],["                RoomInventory inv = m.get(d);",""],["                if (inv == null || inv.reserved + rooms > Math.floor(inv.total * overbookFactor)) return false;","= UPDATE ... WHERE reserved + :n <= total * 1.1; affected rows != nights ho to ROLLBACK"],["                nights.add(inv);",""],["            }",""],["            nights.forEach(inv -> inv.reserved += rooms);",""],["            return true;",""],["        }",""],["",""],["        synchronized void releaseNights(String hotelRoomType, LocalDate checkIn, LocalDate checkOut, int rooms) {",""],["            for (LocalDate d = checkIn; d.isBefore(checkOut); d = d.plusDays(1)) byRoomType.get(hotelRoomType).get(d).reserved -= rooms;",""],["        }",""],["",""],["        synchronized String describe(String hotelRoomType) {",""],["            StringBuilder sb = new StringBuilder();",""],["            byRoomType.get(hotelRoomType).forEach((d, inv) -> sb.append(d.getDayOfMonth()).append(\"Oct:\").append(inv.reserved).append('/').append(inv.total).append(\"  \"));",""],["            return sb.toString().trim();",""],["        }",""],["    }",""],["",""],["    enum Status { PENDING_PAYMENT, CONFIRMED, CANCELLED }",""],["",""],["    record Reservation(String reservationId, String guest, String hotelRoomType, LocalDate checkIn, LocalDate checkOut, int rooms, Status status) {}",""],["",""],["    static final class ReservationService {",""],["        private final InventoryStore inventory;",""],["        private final Map<String, Reservation> reservations = new HashMap<>();","reservationId = idempotency key (booking page khulte hi generate)"],["        private final Map<String, Double> overbookByRoomType = new HashMap<>();",""],["",""],["        ReservationService(InventoryStore inventory) { this.inventory = inventory; }",""],["",""],["        void setOverbooking(String hotelRoomType, double factor) { overbookByRoomType.put(hotelRoomType, factor); }","Hotels 5-10% no-shows ke hisaab se overbook karte hain"],["",""],["        synchronized Reservation reserve(String reservationId, String guest, String hotelRoomType, LocalDate in, LocalDate out, int rooms) {",""],["            Reservation existing = reservations.get(reservationId);",""],["            if (existing != null) return existing;","Double click / retry: same reservation wapas, inventory dobara nahi ghat-ti"],["            boolean ok = inventory.reserveNights(hotelRoomType, in, out, rooms, overbookByRoomType.getOrDefault(hotelRoomType, 1.0));",""],["            if (!ok) throw new IllegalStateException(\"SOLD OUT for \" + guest + \" \" + in + \"..\" + out);",""],["            Reservation r = new Reservation(reservationId, guest, hotelRoomType, in, out, rooms, Status.PENDING_PAYMENT);",""],["            reservations.put(reservationId, r);",""],["            return r;",""],["        }",""],["",""],["        synchronized Reservation confirm(String reservationId) {",""],["            Reservation r = reservations.get(reservationId);",""],["            Reservation c = new Reservation(r.reservationId(), r.guest(), r.hotelRoomType(), r.checkIn(), r.checkOut(), r.rooms(), Status.CONFIRMED);",""],["            reservations.put(reservationId, c);",""],["            return c;",""],["        }",""],["",""],["        synchronized void cancel(String reservationId) {",""],["            Reservation r = reservations.get(reservationId);",""],["            if (r == null || r.status() == Status.CANCELLED) return;",""],["            inventory.releaseNights(r.hotelRoomType(), r.checkIn(), r.checkOut(), r.rooms());","Cancel = inventory wapas"],["            reservations.put(reservationId, new Reservation(r.reservationId(), r.guest(), r.hotelRoomType(), r.checkIn(), r.checkOut(), r.rooms(), Status.CANCELLED));",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) throws Exception {",""],["        InventoryStore inventory = new InventoryStore();",""],["        LocalDate oct10 = LocalDate.of(2026, 10, 10);",""],["        inventory.addInventory(\"goa-sea-view|DELUXE\", oct10, 4, 2);","10-13 Oct, 2 deluxe rooms"],["        ReservationService service = new ReservationService(inventory);",""],["",""],["        Reservation asha = service.reserve(\"R-asha-1\", \"asha\", \"goa-sea-view|DELUXE\", oct10, oct10.plusDays(2), 1);",""],["        service.reserve(\"R-asha-1\", \"asha\", \"goa-sea-view|DELUXE\", oct10, oct10.plusDays(2), 1);","Same id dobara (double click)"],["        service.confirm(asha.reservationId());",""],["        System.out.println(\"after asha (10-12 Oct, retried once): \" + inventory.describe(\"goa-sea-view|DELUXE\"));",""],["",""],["        ExecutorService pool = Executors.newFixedThreadPool(2);",""],["        CountDownLatch start = new CountDownLatch(1);",""],["        Future<String> ravi = pool.submit(() -> { start.await(); return attempt(service, \"R-ravi\", \"ravi\", oct10.plusDays(1), oct10.plusDays(3)); });",""],["        Future<String> meera = pool.submit(() -> { start.await(); return attempt(service, \"R-meera\", \"meera\", oct10.plusDays(1), oct10.plusDays(2)); });",""],["        start.countDown();","Dono ek saath: 11 Oct ki aakhri room"],["        String r1 = ravi.get(), r2 = meera.get();",""],["        pool.shutdown();",""],["        System.out.println(\"race for last room on 11 Oct: ravi=\" + r1 + \", meera=\" + r2 + \" | exactly one won? \" + (r1.equals(\"OK\") ^ r2.equals(\"OK\")));",""],["        System.out.println(\"inventory: \" + inventory.describe(\"goa-sea-view|DELUXE\"));",""],["",""],["        service.cancel(\"R-asha-1\");",""],["        System.out.println(\"after asha cancels: \" + inventory.describe(\"goa-sea-view|DELUXE\"));",""],["",""],["        inventory.addInventory(\"big-hotel|STANDARD\", oct10, 1, 10);",""],["        service.setOverbooking(\"big-hotel|STANDARD\", 1.1);","10% overbooking: 11 tak bookings"],["        int booked = 0;",""],["        for (int i = 1; i <= 12; i++) {",""],["            if (attempt(service, \"R-b\" + i, \"guest\" + i, oct10, oct10.plusDays(1), \"big-hotel|STANDARD\").equals(\"OK\")) booked++;",""],["        }",""],["        System.out.println(\"10-room hotel with 10% overbooking accepted \" + booked + \" bookings\");",""],["    }",""],["",""],["    static String attempt(ReservationService s, String id, String guest, LocalDate in, LocalDate out) { return attempt(s, id, guest, in, out, \"goa-sea-view|DELUXE\"); }",""],["",""],["    static String attempt(ReservationService s, String id, String guest, LocalDate in, LocalDate out, String roomType) {",""],["        try {",""],["            s.reserve(id, guest, roomType, in, out, 1);",""],["            return \"OK\";",""],["        } catch (IllegalStateException e) {",""],["            return \"SOLD_OUT\";",""],["        }",""],["    }",""],["}",""]]},"InvertedIndexDemo":{"file":"InvertedIndexDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.BitSet;",""],["import java.util.Comparator;",""],["import java.util.HashMap;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.PriorityQueue;",""],["import java.util.Set;",""],["import java.util.TreeMap;",""],["",""],["public class InvertedIndexDemo {",""],["",""],["    static final Set<String> STOPWORDS = Set.of(\"the\", \"a\", \"an\", \"of\", \"in\", \"and\", \"to\", \"for\", \"is\", \"when\", \"using\", \"uses\");",""],["",""],["    static List<String> analyze(String text) {","Analyzer: lowercase + tokenize + stopwords hatao (real: stemming, synonyms bhi)"],["        List<String> tokens = new ArrayList<>();",""],["        for (String raw : text.toLowerCase().split(\"[^a-z0-9]+\")) {",""],["            if (!raw.isBlank() && !STOPWORDS.contains(raw)) tokens.add(raw);",""],["        }",""],["        return tokens;",""],["    }",""],["",""],["    record Hit(int docId, double score) {}",""],["",""],["    static final class Shard {",""],["        final String name;",""],["        private final Map<String, Map<Integer, List<Integer>>> postings = new TreeMap<>();","Inverted index: term -> (docId -> positions)"],["        private final Map<Integer, Integer> docLength = new HashMap<>();",""],["        private final Map<Integer, String> stored = new HashMap<>();",""],["        private final BitSet deleted = new BitSet();","Lucene jaisa: delete = bit mark, physical removal segment merge pe"],["",""],["        Shard(String name) { this.name = name; }",""],["",""],["        void indexDocument(int docId, String text) {",""],["            List<String> tokens = analyze(text);",""],["            for (int pos = 0; pos < tokens.size(); pos++) {",""],["                postings.computeIfAbsent(tokens.get(pos), t -> new TreeMap<>())",""],["                        .computeIfAbsent(docId, d -> new ArrayList<>()).add(pos);","Positions bhi rakhe: phrase query ke liye"],["            }",""],["            docLength.put(docId, tokens.size());",""],["            stored.put(docId, text);",""],["        }",""],["",""],["        void deleteDocument(int docId) { deleted.set(docId); }",""],["",""],["        int liveDocs() { return (int) docLength.keySet().stream().filter(d -> !deleted.get(d)).count(); }",""],["",""],["        double avgDocLength() { return docLength.values().stream().mapToInt(Integer::intValue).average().orElse(1); }",""],["",""],["        List<Hit> searchBm25(String query, int k) {","BM25: rare term + zyada frequency + chhota doc = high score"],["            final double k1 = 1.2, b = 0.75;",""],["            Map<Integer, Double> scores = new HashMap<>();",""],["            int n = liveDocs();",""],["            for (String term : analyze(query)) {",""],["                Map<Integer, List<Integer>> plist = postings.getOrDefault(term, Map.of());",""],["                long df = plist.keySet().stream().filter(d -> !deleted.get(d)).count();",""],["                if (df == 0) continue;",""],["                double idf = Math.log(1 + (n - df + 0.5) / (df + 0.5));","IDF: kam documents me aane wala term zyada important"],["                for (Map.Entry<Integer, List<Integer>> e : plist.entrySet()) {",""],["                    if (deleted.get(e.getKey())) continue;","Deleted docs query time pe skip"],["                    int tf = e.getValue().size();",""],["                    double norm = tf * (k1 + 1) / (tf + k1 * (1 - b + b * docLength.get(e.getKey()) / avgDocLength()));","Term frequency saturate hoti hai (k1) aur lambe docs penalize (b)"],["                    scores.merge(e.getKey(), idf * norm, Double::sum);",""],["                }",""],["            }",""],["            return topK(scores, k);",""],["        }",""],["",""],["        List<Integer> phraseSearch(String phrase) {","\"event time\" exact sequence: positions consecutive hon"],["            List<String> terms = analyze(phrase);",""],["            List<Integer> result = new ArrayList<>();",""],["            if (terms.isEmpty()) return result;",""],["            for (Map.Entry<Integer, List<Integer>> first : postings.getOrDefault(terms.get(0), Map.of()).entrySet()) {",""],["                int doc = first.getKey();",""],["                if (deleted.get(doc)) continue;",""],["                for (int start : first.getValue()) {",""],["                    boolean all = true;",""],["                    for (int i = 1; i < terms.size() && all; i++) {",""],["                        List<Integer> pos = postings.getOrDefault(terms.get(i), Map.of()).get(doc);",""],["                        all = pos != null && pos.contains(start + i);",""],["                    }",""],["                    if (all) {",""],["                        result.add(doc);",""],["                        break;",""],["                    }",""],["                }",""],["            }",""],["            return result;",""],["        }",""],["",""],["        String doc(int id) { return stored.get(id); }",""],["    }",""],["",""],["    static List<Hit> topK(Map<Integer, Double> scores, int k) {",""],["        PriorityQueue<Hit> heap = new PriorityQueue<>(Comparator.comparingDouble(Hit::score));","Min-heap of size k: O(n log k)"],["        scores.forEach((doc, s) -> {",""],["            heap.add(new Hit(doc, s));",""],["            if (heap.size() > k) heap.poll();",""],["        });",""],["        List<Hit> out = new ArrayList<>(heap);",""],["        out.sort(Comparator.comparingDouble(Hit::score).reversed());",""],["        return out;",""],["    }",""],["",""],["    static final class SearchCluster {","Document-partitioned: har shard ke paas kuch docs ka poora index"],["        final List<Shard> shards = List.of(new Shard(\"shard-0\"), new Shard(\"shard-1\"));",""],["",""],["        Shard shardFor(int docId) { return shards.get(docId % shards.size()); }",""],["",""],["        void index(int docId, String text) { shardFor(docId).indexDocument(docId, text); }",""],["",""],["        void delete(int docId) { shardFor(docId).deleteDocument(docId); }",""],["",""],["        List<Hit> search(String query, int k) {","Scatter-gather: har shard se top-k, coordinator merge karta hai"],["            Map<Integer, Double> merged = new LinkedHashMap<>();",""],["            for (Shard s : shards) s.searchBm25(query, k).forEach(h -> merged.put(h.docId(), h.score()));",""],["            return topK(merged, k);","Note: har shard apni local IDF use karta hai; bahut chhote shards me scores thode alag (DFS mode fix karta hai)"],["        }",""],["",""],["        String doc(int id) { return shardFor(id).doc(id); }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        SearchCluster cluster = new SearchCluster();",""],["        String[] docs = {",""],["                \"Kafka stores events in an append only log\",",""],["                \"Flink processes events using event time and watermarks\",",""],["                \"Redis sorted sets power real time leaderboards\",",""],["                \"Event time windows handle late events in stream processing\",",""],["                \"Cassandra uses an LSM tree for fast writes\",",""],["                \"Watermarks tell the stream processor when a window is complete\"};",""],["        for (int i = 0; i < docs.length; i++) cluster.index(i + 1, docs[i]);",""],["",""],["        System.out.println(\"analyze -> \" + analyze(\"Event Time windows handle LATE events\"));",""],["        System.out.println(\"2 shards (local IDF):\");",""],["        for (Hit h : cluster.search(\"event time\", 3)) System.out.printf(\"  %.3f  doc%d  %s%n\", h.score(), h.docId(), cluster.doc(h.docId()));",""],["        Shard single = new Shard(\"all-docs\");","Comparison: ek hi index me saare docs = global IDF"],["        for (int i = 0; i < docs.length; i++) single.indexDocument(i + 1, docs[i]);",""],["        System.out.println(\"1 index (global IDF):\");",""],["        for (Hit h : single.searchBm25(\"event time\", 3)) System.out.printf(\"  %.3f  doc%d  %s%n\", h.score(), h.docId(), single.doc(h.docId()));","Yahan doc4 doc3 se upar: sharded result me farak local IDF ki wajah se tha"],["        List<Integer> phrase = new ArrayList<>();",""],["        for (Shard s : cluster.shards) phrase.addAll(s.phraseSearch(\"event time\"));",""],["        System.out.println(\"phrase \\\"event time\\\" -> docs \" + phrase);","\"real time\" wala doc3 phrase match nahi karega"],["        cluster.delete(4);",""],["        System.out.println(\"after deleting doc4, top hit = doc\" + cluster.search(\"event time\", 1).get(0).docId());",""],["    }",""],["}",""]]},"JobSchedulerDemo":{"file":"JobSchedulerDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.Comparator;",""],["import java.util.HashSet;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Set;",""],["import java.util.function.Predicate;",""],["",""],["public class JobSchedulerDemo {",""],["",""],["    enum Status { SCHEDULED, RUNNING, RETRY_WAIT, SUCCEEDED, DEAD }",""],["",""],["    static final class Job {",""],["        final String id;",""],["        final long intervalSec;","0 = one-time job; >0 = recurring"],["        final int maxAttempts;",""],["        long nextRunAt;",""],["        Status status = Status.SCHEDULED;",""],["        String leaseOwner;",""],["        long leaseUntil;",""],["        int attempts;",""],["",""],["        Job(String id, long firstRunAt, long intervalSec, int maxAttempts) {",""],["            this.id = id;",""],["            this.nextRunAt = firstRunAt;",""],["            this.intervalSec = intervalSec;",""],["            this.maxAttempts = maxAttempts;",""],["        }",""],["",""],["        String executionKey() { return id + \"@\" + nextRunAt; }","Har scheduled run ka unique key: side effects isi se idempotent"],["    }",""],["",""],["    static final class JobStore {","SQL jobs table ka stand-in; methods = atomic UPDATE statements"],["        private final Map<String, Job> jobs = new LinkedHashMap<>();",""],["",""],["        synchronized void schedule(Job job) { jobs.put(job.id, job); }",""],["",""],["        synchronized List<Job> claimDueJobs(String workerId, long now, int limit, long leaseSec) {","= SELECT ... WHERE due ... FOR UPDATE SKIP LOCKED LIMIT n, phir lease set"],["            List<Job> claimed = new ArrayList<>();",""],["            jobs.values().stream()",""],["                    .filter(j -> ((j.status == Status.SCHEDULED || j.status == Status.RETRY_WAIT) && j.nextRunAt <= now)",""],["                            || (j.status == Status.RUNNING && j.leaseUntil < now))","Expired lease = worker mar gaya: job dobara claim ho sakti hai"],["                    .sorted(Comparator.comparingLong(j -> j.nextRunAt))",""],["                    .limit(limit)",""],["                    .forEach(j -> {",""],["                        j.status = Status.RUNNING;",""],["                        j.leaseOwner = workerId;",""],["                        j.leaseUntil = now + leaseSec;","Lease: worker zinda rahe to heartbeat se extend karta hai"],["                        j.attempts++;",""],["                        claimed.add(j);",""],["                    });",""],["            return claimed;",""],["        }",""],["",""],["        synchronized boolean complete(Job job, String workerId, long now) {",""],["            if (!workerId.equals(job.leaseOwner) || job.status != Status.RUNNING) return false;","Lease kisi aur ke paas: purana worker result commit nahi kar sakta (fencing)"],["            if (job.intervalSec > 0) {",""],["                job.nextRunAt = Math.max(job.nextRunAt + job.intervalSec, now);","Recurring: agla run; downtime ke baad saare missed runs ek saath nahi"],["                job.status = Status.SCHEDULED;",""],["                job.attempts = 0;",""],["            } else {",""],["                job.status = Status.SUCCEEDED;",""],["            }",""],["            job.leaseOwner = null;",""],["            return true;",""],["        }",""],["",""],["        synchronized void fail(Job job, String workerId, long now) {",""],["            if (!workerId.equals(job.leaseOwner)) return;",""],["            job.leaseOwner = null;",""],["            if (job.attempts >= job.maxAttempts) {",""],["                job.status = Status.DEAD;","DLQ: alert + manual fix; baaki jobs nahi rukte"],["            } else {",""],["                job.status = Status.RETRY_WAIT;",""],["                job.nextRunAt = now + (1L << job.attempts);","Exponential backoff: 2s, 4s, 8s ..."],["            }",""],["        }",""],["",""],["        synchronized String describe() {",""],["            StringBuilder sb = new StringBuilder();",""],["            jobs.values().forEach(j -> sb.append(String.format(\"%n   %-18s %-10s next=%-4d attempts=%d\", j.id, j.status, j.nextRunAt, j.attempts)));",""],["            return sb.toString();",""],["        }",""],["    }",""],["",""],["    static final class PaymentService {","Downstream ko executionKey se dedup karna aana chahiye"],["        final Set<String> processedKeys = new HashSet<>();",""],["        int charges;",""],["",""],["        void charge(String executionKey) {",""],["            if (processedKeys.add(executionKey)) charges++;","Same key dobara = no-op: at-least-once job + idempotent effect"],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        JobStore store = new JobStore();",""],["        PaymentService payments = new PaymentService();",""],["        store.schedule(new Job(\"daily-report\", 0, 60, 3));",""],["        store.schedule(new Job(\"flaky-export\", 0, 0, 4));",""],["        store.schedule(new Job(\"poison-job\", 0, 0, 3));",""],["        store.schedule(new Job(\"charge-invoice-42\", 5, 0, 3));",""],["",""],["        int[] flakyCalls = {0};",""],["        Predicate<Job> runJob = job -> switch (job.id) {","Business logic: true = success"],["            case \"flaky-export\" -> ++flakyCalls[0] >= 3;","Pehli do baar fail, teesri baar success"],["            case \"poison-job\" -> false;","Hamesha fail (bad input)"],["            case \"charge-invoice-42\" -> { payments.charge(job.executionKey()); yield true; }",""],["            default -> true;",""],["        };",""],["",""],["        Job zombieClaim = null;",""],["        for (long t : new long[]{0, 2, 5, 6, 14, 40, 60}) {",""],["            String worker = t == 5 ? \"worker-A\" : \"worker-B\";",""],["            for (Job job : store.claimDueJobs(worker, t, 10, 30)) {",""],["                if (t == 5 && job.id.equals(\"charge-invoice-42\")) {","worker-A ne charge kar diya, phir complete() se pehle crash"],["                    payments.charge(job.executionKey());",""],["                    zombieClaim = job;",""],["                    System.out.println(\"t=\" + t + \" \" + worker + \" charged invoice-42 then CRASHED (lease till \" + job.leaseUntil + \")\");",""],["                    continue;",""],["                }",""],["                int attempt = job.attempts;",""],["                boolean ok = runJob.test(job);",""],["                if (ok) store.complete(job, worker, t); else store.fail(job, worker, t);",""],["                System.out.println(\"t=\" + t + \" \" + worker + \" ran \" + job.id + \" attempt \" + attempt + \" -> \" + (ok ? \"ok\" : \"fail\"));",""],["            }",""],["        }",""],["        System.out.println(\"zombie worker-A tries to complete invoice-42: \" + store.complete(zombieClaim, \"worker-A\", 41));","Lease ab worker-B ka tha aur job done: purane worker ka result reject"],["        System.out.println(\"invoice charges = \" + payments.charges + \" (executed twice, charged once)\");",""],["        System.out.println(\"jobs:\" + store.describe());",""],["    }",""],["}",""]]},"KeyValueStoreDemo":{"file":"KeyValueStoreDemo.java","lines":[["import java.nio.charset.StandardCharsets;",""],["import java.security.MessageDigest;",""],["import java.security.NoSuchAlgorithmException;",""],["import java.util.ArrayList;",""],["import java.util.Collection;",""],["import java.util.Comparator;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Optional;",""],["import java.util.TreeMap;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["",""],["public class KeyValueStoreDemo {",""],["",""],["    record VersionedValue(String value, long timestamp) {}","Har write ke saath version; conflict pe latest jeetega (last-write-wins)"],["",""],["    record Hint(String key, VersionedValue value) {}","Down node ke liye rakha hua write"],["",""],["    static final class StorageNode {",""],["        final String name;",""],["        private final Map<String, VersionedValue> data = new ConcurrentHashMap<>();","Real node: commit log + memtable + SSTables (LSM tree)"],["        volatile boolean alive = true;",""],["",""],["        StorageNode(String name) { this.name = name; }",""],["",""],["        boolean write(String key, VersionedValue incoming) {",""],["            if (!alive) return false;","Down node ack nahi karta"],["            data.merge(key, incoming, (old, neu) -> neu.timestamp() >= old.timestamp() ? neu : old);","Purana version naye ko overwrite na kare (out-of-order delivery safe)"],["            return true;",""],["        }",""],["",""],["        Optional<VersionedValue> read(String key) {",""],["            return alive ? Optional.ofNullable(data.get(key)) : Optional.empty();",""],["        }",""],["    }",""],["",""],["    static final class HashRing {",""],["        private final TreeMap<Long, StorageNode> ring = new TreeMap<>();",""],["",""],["        void addNode(StorageNode node, int virtualNodes) {",""],["            for (int i = 0; i < virtualNodes; i++) ring.put(hash(node.name + \"#\" + i), node);",""],["        }",""],["",""],["        List<StorageNode> preferenceList(String key, int n) {","Key se clockwise agle N DISTINCT physical nodes = replicas"],["            List<StorageNode> replicas = new ArrayList<>();",""],["            long h = hash(key);",""],["            List<Collection<StorageNode>> walk = List.of(ring.tailMap(h, true).values(), ring.headMap(h, false).values());","Ring: pehle key ke aage, phir wrap-around shuru se"],["            for (Collection<StorageNode> part : walk) {",""],["                for (StorageNode node : part) {",""],["                    if (!replicas.contains(node)) replicas.add(node);","Same physical node ke doosre vnodes skip"],["                    if (replicas.size() == n) return replicas;",""],["                }",""],["            }",""],["            return replicas;",""],["        }",""],["",""],["        static long hash(String s) {",""],["            try {",""],["                byte[] d = MessageDigest.getInstance(\"MD5\").digest(s.getBytes(StandardCharsets.UTF_8));",""],["                long h = 0;",""],["                for (int i = 0; i < 8; i++) h = (h << 8) | (d[i] & 0xFF);",""],["                return h;",""],["            } catch (NoSuchAlgorithmException e) {",""],["                throw new IllegalStateException(e);",""],["            }",""],["        }",""],["    }",""],["",""],["    static final class KeyValueStore {",""],["        private final HashRing ring;",""],["        private final int replicationFactor;",""],["        private final int writeQuorum;",""],["        private final int readQuorum;",""],["        private final Map<String, List<Hint>> hintsByNode = new ConcurrentHashMap<>();","Hinted handoff: down node ke pending writes"],["        private long logicalClock = 0;","Demo clock; real me hybrid logical clocks ya vector clocks"],["",""],["        KeyValueStore(HashRing ring, int n, int w, int r) {","N replicas, W write acks, R read replies; R + W > N ho to read latest write dekhega"],["            this.ring = ring;",""],["            this.replicationFactor = n;",""],["            this.writeQuorum = w;",""],["            this.readQuorum = r;",""],["        }",""],["",""],["        synchronized boolean put(String key, String value) {",""],["            VersionedValue version = new VersionedValue(value, ++logicalClock);",""],["            int acks = 0;",""],["            for (StorageNode node : ring.preferenceList(key, replicationFactor)) {",""],["                if (node.write(key, version)) {",""],["                    acks++;",""],["                } else {",""],["                    hintsByNode.computeIfAbsent(node.name, k -> new ArrayList<>()).add(new Hint(key, version));","Node down: hint rakho, wapas aane pe deliver"],["                }",""],["            }",""],["            return acks >= writeQuorum;","W acks mile = success; baaki replicas eventually sync"],["        }",""],["",""],["        Optional<String> get(String key) {",""],["            List<StorageNode> replicas = ring.preferenceList(key, replicationFactor);",""],["            List<VersionedValue> replies = new ArrayList<>();",""],["            for (StorageNode node : replicas) node.read(key).ifPresent(replies::add);",""],["            if (replies.size() < readQuorum) {","R replies nahi mile: error (consistency choose ki) ya stale answer (availability) — config decision"],["                throw new IllegalStateException(\"Read quorum failed: \" + replies.size() + \"/\" + readQuorum);",""],["            }",""],["            VersionedValue latest = replies.stream().max(Comparator.comparingLong(VersionedValue::timestamp)).orElseThrow();","Sabse naya version jeeta"],["            readRepair(key, latest, replicas);",""],["            return Optional.of(latest.value());",""],["        }",""],["",""],["        private void readRepair(String key, VersionedValue latest, List<StorageNode> replicas) {","Purane replicas ko latest version bhej do (background me)"],["            for (StorageNode node : replicas) {",""],["                Optional<VersionedValue> current = node.read(key);",""],["                if (node.alive && (current.isEmpty() || current.get().timestamp() < latest.timestamp())) node.write(key, latest);",""],["            }",""],["        }",""],["",""],["        void recoverNode(StorageNode node) {","Node wapas aaya: uske hints replay karo"],["            node.alive = true;",""],["            List<Hint> pending = hintsByNode.remove(node.name);",""],["            if (pending != null) pending.forEach(h -> node.write(h.key(), h.value()));",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        HashRing ring = new HashRing();",""],["        for (String name : List.of(\"A\", \"B\", \"C\", \"D\")) ring.addNode(new StorageNode(name), 50);",""],["        KeyValueStore store = new KeyValueStore(ring, 3, 2, 2);","N=3, W=2, R=2: 2 + 2 > 3"],["",""],["        String key = \"cart:user42\";",""],["        List<StorageNode> replicas = ring.preferenceList(key, 3);",""],["        System.out.println(\"replicas for \" + key + \" = \" + replicas.stream().map(n -> n.name).toList());",""],["        System.out.println(\"put v1 ok? \" + store.put(key, \"[shoes]\"));",""],["",""],["        StorageNode down = replicas.get(2);",""],["        down.alive = false;","Ek replica down"],["        System.out.println(down.name + \" down; put v2 ok? \" + store.put(key, \"[shoes, watch]\"));","2 acks mil gaye (W=2): success"],["        System.out.println(\"get = \" + store.get(key).orElse(\"-\"));",""],["        store.recoverNode(down);",""],["        System.out.println(down.name + \" recovered, hinted handoff gave it: \" + down.read(key).map(VersionedValue::value).orElse(\"-\"));",""],["",""],["        replicas.get(0).alive = false;",""],["        replicas.get(1).alive = false;","Ab 2 replicas down: R=2 possible nahi"],["        try {",""],["            store.get(key);",""],["        } catch (IllegalStateException e) {",""],["            System.out.println(\"2 replicas down -> \" + e.getMessage());",""],["        }",""],["    }",""],["}",""]]},"LeaderboardDemo":{"file":"LeaderboardDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.Comparator;",""],["import java.util.HashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.TreeSet;",""],["",""],["public class LeaderboardDemo {",""],["",""],["    record Entry(String userId, long score, long reachedAtMs) {}","reachedAt: tie-break, jo pehle pahuncha wo upar"],["",""],["    static final Comparator<Entry> RANKING = Comparator.comparingLong(Entry::score).reversed()",""],["            .thenComparingLong(Entry::reachedAtMs)",""],["            .thenComparing(Entry::userId);","Total order: do entries kabhi \"equal\" nahi (TreeSet me lost nahi hongi)"],["",""],["    static final class Leaderboard {","Redis sorted set (ZSET) ka stand-in: skip list + hash map"],["        private final TreeSet<Entry> ordered = new TreeSet<>(RANKING);","Sorted by score: top-N O(N)"],["        private final Map<String, Entry> byUser = new HashMap<>();","userId -> current entry: O(1) lookup"],["",""],["        synchronized long addScore(String userId, long delta, long nowMs) {","ZINCRBY: atomic increment"],["            Entry old = byUser.get(userId);",""],["            if (old != null) ordered.remove(old);","Score badla = position badli: hatao, naye score ke saath dobara daalo"],["            Entry updated = new Entry(userId, (old == null ? 0 : old.score()) + delta, nowMs);",""],["            ordered.add(updated);",""],["            byUser.put(userId, updated);",""],["            return updated.score();",""],["        }",""],["",""],["        synchronized List<Entry> top(int n) { return ordered.stream().limit(n).toList(); }","ZREVRANGE 0 n-1"],["",""],["        synchronized int rankOf(String userId) {","ZREVRANK: Redis me skip list spans se O(log n); yahan headSet O(rank)"],["            Entry e = byUser.get(userId);",""],["            return e == null ? -1 : ordered.headSet(e).size() + 1;",""],["        }",""],["",""],["        synchronized List<String> around(String userId, int k) {","\"Mere aas-paas\" view: upar k, neeche k"],["            Entry me = byUser.get(userId);",""],["            List<String> out = new ArrayList<>();",""],["            ordered.headSet(me, false).descendingSet().stream().limit(k).forEach(e -> out.add(0, e.userId() + \":\" + e.score()));",""],["            out.add(\"[\" + me.userId() + \":\" + me.score() + \"]\");",""],["            ordered.tailSet(me, false).stream().limit(k).forEach(e -> out.add(e.userId() + \":\" + e.score()));",""],["            return out;",""],["        }",""],["",""],["        synchronized Map<String, Long> snapshot() {",""],["            Map<String, Long> m = new HashMap<>();",""],["            byUser.forEach((u, e) -> m.put(u, e.score()));",""],["            return m;",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Map<String, Long> durableScores = new HashMap<>();","DB = source of truth (har update yahan bhi, async OK)"],["        Leaderboard weekly = new Leaderboard();","Key: \"lb:weekly:2026-W41\" (har hafte nayi key, purani TTL se expire)"],["        String[][] events = {{\"asha\", \"50\"}, {\"ravi\", \"70\"}, {\"meera\", \"70\"}, {\"kabir\", \"30\"}, {\"zoya\", \"90\"}, {\"asha\", \"25\"}, {\"dev\", \"10\"}, {\"kabir\", \"45\"}};",""],["        long t = 1_000;",""],["        for (String[] ev : events) {",""],["            long score = weekly.addScore(ev[0], Long.parseLong(ev[1]), t += 10);",""],["            durableScores.put(ev[0], score);",""],["        }",""],["        System.out.println(\"top 3: \" + weekly.top(3));",""],["        System.out.println(\"ravi vs meera both 70: ravi rank \" + weekly.rankOf(\"ravi\") + \", meera rank \" + weekly.rankOf(\"meera\") + \" (ravi reached first)\");",""],["        System.out.println(\"around kabir: \" + weekly.around(\"kabir\", 1));",""],["",""],["        Leaderboard rebuilt = new Leaderboard();","Redis node gaya: DB/Kafka se rebuild"],["        durableScores.forEach((u, s) -> rebuilt.addScore(u, s, 0));",""],["        System.out.println(\"rebuilt scores match? \" + rebuilt.snapshot().equals(weekly.snapshot()) + \" (tie-break times lost unless stored too)\");",""],["    }",""],["}",""]]},"LoadBalancerDemo":{"file":"LoadBalancerDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.Comparator;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.TreeMap;",""],["import java.util.concurrent.ThreadLocalRandom;",""],["import java.util.concurrent.atomic.AtomicBoolean;",""],["import java.util.concurrent.atomic.AtomicInteger;",""],["import java.util.function.Predicate;",""],["",""],["public class LoadBalancerDemo {",""],["",""],["    static final class Server {",""],["        final String id;",""],["        final int weight;","Bada machine = zyada weight = zyada traffic"],["        final AtomicBoolean healthy = new AtomicBoolean(true);",""],["        final AtomicInteger activeConnections = new AtomicInteger();",""],["        final AtomicInteger consecutiveFailures = new AtomicInteger();",""],["",""],["        Server(String id, int weight) {",""],["            this.id = id;",""],["            this.weight = weight;",""],["        }",""],["    }",""],["",""],["    interface LoadBalancingStrategy {","Strategy: algorithm config se badlo, LB code same"],["        Server select(List<Server> healthyServers, String clientKey);",""],["    }",""],["",""],["    static final class RoundRobinStrategy implements LoadBalancingStrategy {",""],["        private final AtomicInteger counter = new AtomicInteger();",""],["",""],["        @Override",""],["        public Server select(List<Server> servers, String clientKey) {",""],["            return servers.get(Math.floorMod(counter.getAndIncrement(), servers.size()));","floorMod: counter overflow hoke negative ho to bhi valid index"],["        }",""],["    }",""],["",""],["    static final class LeastConnectionsStrategy implements LoadBalancingStrategy {",""],["        @Override",""],["        public Server select(List<Server> servers, String clientKey) {",""],["            return servers.stream()",""],["                    .min(Comparator.comparingDouble(s -> s.activeConnections.get() / (double) s.weight))","Weight se normalise: bada server zyada connections le"],["                    .orElseThrow();",""],["        }",""],["    }",""],["",""],["    static final class PowerOfTwoChoicesStrategy implements LoadBalancingStrategy {",""],["        @Override",""],["        public Server select(List<Server> servers, String clientKey) {",""],["            if (servers.size() == 1) return servers.get(0);",""],["            ThreadLocalRandom random = ThreadLocalRandom.current();",""],["            Server a = servers.get(random.nextInt(servers.size()));",""],["            Server b = servers.get(random.nextInt(servers.size()));",""],["            return a.activeConnections.get() <= b.activeConnections.get() ? a : b;","Random 2 me se kam load wala: poora scan nahi, phir bhi hotspots kam"],["        }",""],["    }",""],["",""],["    static final class LoadBalancer {",""],["        private static final int FAILURES_TO_EJECT = 3;",""],["        private final List<Server> servers;",""],["        private volatile LoadBalancingStrategy strategy;","volatile: strategy runtime pe badle to sab threads ko turant dikhe"],["",""],["        LoadBalancer(List<Server> servers, LoadBalancingStrategy strategy) {",""],["            this.servers = List.copyOf(servers);",""],["            this.strategy = strategy;",""],["        }",""],["",""],["        void setStrategy(LoadBalancingStrategy strategy) { this.strategy = strategy; }",""],["",""],["        Server routeRequest(String clientKey) {",""],["            List<Server> healthy = servers.stream().filter(s -> s.healthy.get()).toList();","Sirf healthy servers pe routing"],["            if (healthy.isEmpty()) throw new IllegalStateException(\"503: no healthy backend\");",""],["            Server chosen = strategy.select(healthy, clientKey);",""],["            chosen.activeConnections.incrementAndGet();","Active count badhao (least-connections isi pe chalta hai)"],["            return chosen;",""],["        }",""],["",""],["        void completeRequest(Server server, boolean success) {",""],["            server.activeConnections.decrementAndGet();",""],["            if (success) {",""],["                server.consecutiveFailures.set(0);",""],["            } else if (server.consecutiveFailures.incrementAndGet() >= FAILURES_TO_EJECT) {",""],["                markUnhealthy(server);","Passive health check: real traffic ke lagatar errors pe rotation se bahar"],["            }",""],["        }",""],["",""],["        void runActiveHealthCheck(Predicate<Server> pingHealthEndpoint) {","Active check: har kuch second /health ping; theek hua to wapas rotation me"],["            for (Server s : servers) {",""],["                boolean ok = pingHealthEndpoint.test(s);",""],["                if (ok && s.healthy.compareAndSet(false, true)) {",""],["                    s.consecutiveFailures.set(0);",""],["                    System.out.println(\"  restored \" + s.id);",""],["                }",""],["                if (!ok) markUnhealthy(s);",""],["            }",""],["        }",""],["",""],["        private void markUnhealthy(Server s) {",""],["            if (s.healthy.compareAndSet(true, false)) System.out.println(\"  ejected \" + s.id);",""],["        }",""],["    }",""],["",""],["    static Map<String, Integer> distribution(LoadBalancer lb, int requests, boolean releaseImmediately) {",""],["        Map<String, Integer> counts = new TreeMap<>();",""],["        List<Server> held = new ArrayList<>();",""],["        for (int i = 0; i < requests; i++) {",""],["            Server s = lb.routeRequest(\"client-\" + i);",""],["            counts.merge(s.id, 1, Integer::sum);",""],["            if (releaseImmediately) lb.completeRequest(s, true); else held.add(s);","Hold = long-lived connection (WebSocket) simulate"],["        }",""],["        held.forEach(s -> lb.completeRequest(s, true));",""],["        return counts;",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Server app1 = new Server(\"app-1\", 1);",""],["        Server app2 = new Server(\"app-2\", 1);",""],["        Server app3 = new Server(\"app-3\", 2);",""],["        LoadBalancer lb = new LoadBalancer(List.of(app1, app2, app3), new RoundRobinStrategy());",""],["        System.out.println(\"round robin, 9 requests: \" + distribution(lb, 9, true));",""],["",""],["        lb.setStrategy(new LeastConnectionsStrategy());",""],["        System.out.println(\"least-connections (weighted), 8 long-lived: \" + distribution(lb, 8, false));","app-3 (weight 2) ko double connections"],["",""],["        lb.setStrategy(new RoundRobinStrategy());",""],["        for (int i = 0; i < 9; i++) {",""],["            Server s = lb.routeRequest(\"c\" + i);",""],["            lb.completeRequest(s, s != app2);","app-2 ke saare responses 5xx"],["        }",""],["        System.out.println(\"after app-2 errors: \" + distribution(lb, 6, true));",""],["        lb.runActiveHealthCheck(s -> true);","app-2 theek: /health 200"],["        System.out.println(\"after recovery: \" + distribution(lb, 6, true));",""],["",""],["        lb.setStrategy(new PowerOfTwoChoicesStrategy());",""],["        System.out.println(\"power of two choices, 300 long-lived: \" + distribution(lb, 300, false));",""],["    }",""],["}",""]]},"LruCacheDemo":{"file":"LruCacheDemo.java","lines":[["import java.util.HashMap;",""],["import java.util.Map;",""],["import java.util.concurrent.locks.ReentrantLock;",""],["",""],["public class LruCacheDemo {",""],["",""],["    static final class LRUCache<K, V> {",""],["        private static final class Node<K, V> {","Doubly linked list node: prev + next se O(1) me kahin se bhi nikal sakte hain"],["            final K key;",""],["            V value;",""],["            Node<K, V> prev;",""],["            Node<K, V> next;",""],["",""],["            Node(K key, V value) {",""],["                this.key = key;",""],["                this.value = value;",""],["            }",""],["        }",""],["",""],["        private final int capacity;",""],["        private final Map<K, Node<K, V>> index = new HashMap<>();","HashMap: key -> node, O(1) lookup"],["        private final Node<K, V> head = new Node<>(null, null);","Sentinel head: most recently used iske turant baad"],["        private final Node<K, V> tail = new Node<>(null, null);","Sentinel tail: least recently used iske turant pehle; sentinels se null-checks khatam"],["        private final ReentrantLock lock = new ReentrantLock();","get() bhi order badalta hai (write!), isliye ReadWriteLock ka read-lock galat; ek exclusive lock"],["        private long hits;",""],["        private long misses;",""],["        private long evictions;",""],["",""],["        LRUCache(int capacity) {",""],["            if (capacity <= 0) throw new IllegalArgumentException(\"capacity must be > 0\");",""],["            this.capacity = capacity;",""],["            head.next = tail;",""],["            tail.prev = head;",""],["        }",""],["",""],["        V get(K key) {",""],["            lock.lock();",""],["            try {",""],["                Node<K, V> node = index.get(key);",""],["                if (node == null) {","Miss: caller DB se load karke put() karega (cache-aside)"],["                    misses++;",""],["                    return null;",""],["                }",""],["                hits++;",""],["                moveToFront(node);","Access hua = ab ye most recently used"],["                return node.value;",""],["            } finally {",""],["                lock.unlock();","finally me unlock: exception aaye tab bhi"],["            }",""],["        }",""],["",""],["        void put(K key, V value) {",""],["            lock.lock();",""],["            try {",""],["                Node<K, V> node = index.get(key);",""],["                if (node != null) {","Key pehle se: value update + front pe"],["                    node.value = value;",""],["                    moveToFront(node);",""],["                    return;",""],["                }",""],["                if (index.size() == capacity) evictLeastRecentlyUsed();","Full: pehle jagah banao"],["                Node<K, V> fresh = new Node<>(key, value);",""],["                index.put(key, fresh);",""],["                addAfterHead(fresh);",""],["            } finally {",""],["                lock.unlock();",""],["            }",""],["        }",""],["",""],["        private void moveToFront(Node<K, V> node) {",""],["            unlink(node);",""],["            addAfterHead(node);",""],["        }",""],["",""],["        private void addAfterHead(Node<K, V> node) {","Sirf 4 pointer updates: O(1)"],["            node.prev = head;",""],["            node.next = head.next;",""],["            head.next.prev = node;",""],["            head.next = node;",""],["        }",""],["",""],["        private void unlink(Node<K, V> node) {",""],["            node.prev.next = node.next;","Pichhla node seedha agle se jud gaya: beech wala list se bahar"],["            node.next.prev = node.prev;",""],["        }",""],["",""],["        private void evictLeastRecentlyUsed() {",""],["            Node<K, V> lru = tail.prev;","Tail ke pehle wala = sabse purana access"],["            unlink(lru);",""],["            index.remove(lru.key);","Node me key isliye rakhi thi: map se bhi O(1) me hata sakein"],["            evictions++;",""],["        }",""],["",""],["        String orderMostRecentFirst() {",""],["            lock.lock();",""],["            try {",""],["                StringBuilder sb = new StringBuilder(\"[\");",""],["                for (Node<K, V> n = head.next; n != tail; n = n.next) {",""],["                    sb.append(n.key).append(n.next != tail ? \", \" : \"\");",""],["                }",""],["                return sb.append(\"]\").toString();",""],["            } finally {",""],["                lock.unlock();",""],["            }",""],["        }",""],["",""],["        String stats() {",""],["            lock.lock();",""],["            try {",""],["                return \"size=\" + index.size() + \" hits=\" + hits + \" misses=\" + misses + \" evictions=\" + evictions;",""],["            } finally {",""],["                lock.unlock();",""],["            }",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) throws InterruptedException {",""],["        LRUCache<String, String> cache = new LRUCache<>(3);",""],["        cache.put(\"u1\", \"Asha\");",""],["        cache.put(\"u2\", \"Ravi\");",""],["        cache.put(\"u3\", \"Meera\");",""],["        System.out.println(\"order (MRU first) \" + cache.orderMostRecentFirst());",""],["        cache.get(\"u1\");","u1 ab most recently used"],["        System.out.println(\"after get(u1)     \" + cache.orderMostRecentFirst());",""],["        cache.put(\"u4\", \"Kabir\");","Full: LRU = u2 evict hoga"],["        System.out.println(\"after put(u4)     \" + cache.orderMostRecentFirst() + \", get(u2) = \" + cache.get(\"u2\"));",""],["",""],["        LRUCache<Integer, Integer> shared = new LRUCache<>(100);",""],["        Thread[] workers = new Thread[4];",""],["        for (int t = 0; t < workers.length; t++) {",""],["            final int offset = t * 1000;",""],["            workers[t] = new Thread(() -> {",""],["                for (int i = 0; i < 10_000; i++) {",""],["                    int key = offset + (i % 20);","Har thread 20 hot keys; 4 x 20 = 80 < capacity, isliye warm-up ke baad sab hits"],["                    if (shared.get(key) == null) shared.put(key, key);","Cache-aside pattern: miss pe load + put"],["                }",""],["            });",""],["            workers[t].start();",""],["        }",""],["        for (Thread w : workers) w.join();",""],["        System.out.println(\"4 threads finished without corruption: \" + shared.stats());",""],["    }",""],["}",""]]},"MetricsTsdbDemo":{"file":"MetricsTsdbDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.HashMap;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.TreeMap;",""],["",""],["public class MetricsTsdbDemo {",""],["",""],["    record Sample(long tsSec, double value) {}",""],["",""],["    static final class Tsdb {",""],["        private final Map<String, Integer> seriesIdByKey = new HashMap<>();","Index: \"cpu{host=h1}\" -> series id (real: inverted index label -> series)"],["        private final Map<Integer, List<Sample>> samples = new HashMap<>();",""],["        private final Map<String, Integer> seriesPerMetric = new HashMap<>();",""],["        private final int maxSeriesPerMetric;",""],["        int droppedSamples;",""],["",""],["        Tsdb(int maxSeriesPerMetric) { this.maxSeriesPerMetric = maxSeriesPerMetric; }",""],["",""],["        static String seriesKey(String metric, Map<String, String> labels) {",""],["            return metric + new TreeMap<>(labels);","Labels sorted: {a=1,b=2} aur {b=2,a=1} same series"],["        }",""],["",""],["        boolean append(String metric, Map<String, String> labels, long ts, double value) {",""],["            String key = seriesKey(metric, labels);",""],["            Integer id = seriesIdByKey.get(key);",""],["            if (id == null) {",""],["                if (seriesPerMetric.getOrDefault(metric, 0) >= maxSeriesPerMetric) {","Cardinality guard: user_id jaisa label har user ke liye naya series banata = TSDB memory blast"],["                    droppedSamples++;",""],["                    return false;",""],["                }",""],["                id = seriesIdByKey.size() + 1;",""],["                seriesIdByKey.put(key, id);",""],["                seriesPerMetric.merge(metric, 1, Integer::sum);",""],["            }",""],["            samples.computeIfAbsent(id, k -> new ArrayList<>()).add(new Sample(ts, value));","Append-only, time-ordered (real: in-memory head block, phir immutable blocks)"],["            return true;",""],["        }",""],["",""],["        List<Sample> range(String metric, Map<String, String> labels, long from, long to) {",""],["            Integer id = seriesIdByKey.get(seriesKey(metric, labels));",""],["            if (id == null) return List.of();",""],["            return samples.get(id).stream().filter(s -> s.tsSec() >= from && s.tsSec() < to).toList();",""],["        }",""],["",""],["        Map<Long, Double> downsampleAvg(String metric, Map<String, String> labels, long bucketSec) {","Purana data 1-min/1-hour averages me: storage kam, long-range dashboards fast"],["            Map<Long, double[]> acc = new TreeMap<>();",""],["            for (Sample s : range(metric, labels, 0, Long.MAX_VALUE)) {",""],["                double[] a = acc.computeIfAbsent(s.tsSec() / bucketSec * bucketSec, k -> new double[2]);",""],["                a[0] += s.value();",""],["                a[1]++;",""],["            }",""],["            Map<Long, Double> out = new TreeMap<>();",""],["            acc.forEach((b, a) -> out.put(b, a[0] / a[1]));",""],["            return out;",""],["        }",""],["",""],["        int estimateCompressedBits(String metric, Map<String, String> labels) {","Gorilla-style estimate: delta-of-delta timestamps + XOR values"],["            List<Sample> list = range(metric, labels, 0, Long.MAX_VALUE);",""],["            int bits = 128;","Pehla
