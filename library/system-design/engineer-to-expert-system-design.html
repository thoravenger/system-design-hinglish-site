",""],["                return false;",""],["            }",""],["            follower.becomeFollower(leader.currentTerm);",""],["            int match = 0;",""],["            while (match < follower.log.size() && match < leader.log.size()",""],["                    && follower.log.get(match).term() == leader.log.get(match).term()) {",""],["                match++;","Log matching: same index + same term = us point tak poora log same"],["            }",""],["            while (follower.log.size() > match) follower.log.remove(follower.log.size() - 1);","Conflict ke baad wale uncommitted entries hatao: leader ka log hi sach"],["            follower.log.addAll(leader.log.subList(match, leader.log.size()));",""],["            follower.commitIndex = Math.max(follower.commitIndex, Math.min(leader.commitIndex, follower.lastLogIndex()));",""],["            follower.applyCommitted();",""],["            return true;",""],["        }",""],["",""],["        boolean clientWrite(String leaderId, String command) {",""],["            RaftNode leader = node(leaderId);",""],["            if (!leader.alive || leader.role != Role.LEADER) return false;",""],["            leader.log.add(new LogEntry(leader.currentTerm, command));","1) Leader apne log me append"],["            int index = leader.lastLogIndex();",""],["            int acks = 1;",""],["            for (RaftNode follower : nodes.values()) {",""],["                if (follower == leader) continue;",""],["                if (replicateTo(leader, follower)) acks++;","2) Followers ko bhejo"],["                if (leader.role != Role.LEADER) return false;",""],["            }",""],["            if (acks >= majority() && leader.log.get(index).term() == leader.currentTerm) {","3) Majority ke paas = committed; sirf apne term ka entry count karke commit (Raft safety rule)"],["                leader.commitIndex = index;",""],["                leader.applyCommitted();",""],["                heartbeat(leaderId);","4) Agle heartbeat se followers ko naya commitIndex"],["                return true;",""],["            }",""],["            return false;","Majority nahi mili: client ko success NAHI bolte"],["        }",""],["",""],["        void heartbeat(String leaderId) {",""],["            RaftNode leader = node(leaderId);",""],["            for (RaftNode follower : nodes.values()) {",""],["                if (follower != leader && leader.role == Role.LEADER) replicateTo(leader, follower);",""],["            }",""],["        }",""],["",""],["        void partition(int group, String... ids) { for (String id : ids) node(id).partition = group; }",""],["",""],["        void heal() { nodes.values().forEach(n -> n.partition = 0); }",""],["",""],["        void print(String title) {",""],["            System.out.println(\"-- \" + title);",""],["            nodes.values().forEach(n -> System.out.println(\"   \" + n.describe()));",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Cluster cluster = new Cluster(\"N1\", \"N2\", \"N3\", \"N4\", \"N5\");",""],["        System.out.println(\"N1 election: \" + cluster.startElection(\"N1\"));",""],["        System.out.println(\"write x=1 committed? \" + cluster.clientWrite(\"N1\", \"x=1\"));",""],["",""],["        cluster.partition(1, \"N1\", \"N2\");","Network toota: {N1, N2} minority, {N3, N4, N5} majority"],["        System.out.println(\"old leader N1 writes x=2 in minority, committed? \" + cluster.clientWrite(\"N1\", \"x=2\"));",""],["        System.out.println(\"N3 election in majority: \" + cluster.startElection(\"N3\"));",""],["        System.out.println(\"new leader N3 writes x=3, committed? \" + cluster.clientWrite(\"N3\", \"x=3\"));",""],["        cluster.print(\"during partition (two 'leaders', sirf ek commit kar sakta hai)\");",""],["",""],["        cluster.heal();",""],["        cluster.heartbeat(\"N1\");","Purana leader N1 bada term dekhkar khud follower ban jaata hai"],["        cluster.heartbeat(\"N3\");","N3 ka log N1, N2 pe overwrite: uncommitted x=2 hamesha ke liye gaya"],["        cluster.print(\"after heal\");",""],["",""],["        cluster.node(\"N2\").alive = false;",""],["        System.out.println(\"N2 down; write x=4 committed? \" + cluster.clientWrite(\"N3\", \"x=4\"));",""],["        cluster.node(\"N2\").alive = true;","N2 wapas, par uske log me x=4 nahi"],["        cluster.node(\"N3\").alive = false;","Leader N3 crash"],["        System.out.println(\"stale N2 tries election: \" + cluster.startElection(\"N2\") + \" (log purana, votes nahi mile)\");",""],["        System.out.println(\"N4 tries election: \" + cluster.startElection(\"N4\"));",""],["        System.out.println(\"N4 writes x=5, committed? \" + cluster.clientWrite(\"N4\", \"x=5\"));",""],["        cluster.node(\"N3\").alive = true;",""],["        cluster.heartbeat(\"N4\");",""],["        cluster.print(\"final (committed x=4 survived leader crash)\");",""],["    }",""],["}",""]]},"RateLimiterDemo":{"file":"RateLimiterDemo.java","lines":[["import java.util.Map;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.function.LongSupplier;",""],["",""],["public class RateLimiterDemo {",""],["",""],["    interface RateLimiter {","Strategy pattern: algorithm badalna ho to sirf implementation badlo, callers same"],["        boolean allowRequest(String clientId);",""],["    }",""],["",""],["    static final class TokenBucketRateLimiter implements RateLimiter {",""],["        private final long capacity;","Bucket size = max burst (ek saath kitni requests)"],["        private final double refillTokensPerNano;","Refill speed, e.g. 1 token/second"],["        private final LongSupplier clock;","Clock inject kiya: test me fake time, production me System::nanoTime"],["        private final Map<String, TokenBucket> buckets = new ConcurrentHashMap<>();","Har client (userId / API key / IP) ka alag bucket"],["",""],["        TokenBucketRateLimiter(long capacity, double refillTokensPerSecond, LongSupplier clock) {",""],["            this.capacity = capacity;",""],["            this.refillTokensPerNano = refillTokensPerSecond / 1_000_000_000.0;",""],["            this.clock = clock;",""],["        }",""],["",""],["        @Override",""],["        public boolean allowRequest(String clientId) {",""],["            long now = clock.getAsLong();",""],["            TokenBucket bucket = buckets.computeIfAbsent(clientId, id -> new TokenBucket(capacity, now));","Pehli request pe full bucket (computeIfAbsent atomic hai)"],["            return bucket.tryConsume(capacity, refillTokensPerNano, now);",""],["        }",""],["",""],["        static final class TokenBucket {",""],["            private double tokens;",""],["            private long lastRefillNanos;",""],["",""],["            TokenBucket(long initialTokens, long nowNanos) {",""],["                this.tokens = initialTokens;",""],["                this.lastRefillNanos = nowNanos;",""],["            }",""],["",""],["            synchronized boolean tryConsume(long capacity, double refillPerNano, long nowNanos) {","Lock sirf is bucket pe: alag users ek doosre ko block nahi karte"],["                refillTokens(capacity, refillPerNano, nowNanos);",""],["                if (tokens >= 1) {","Token hai: allow aur ek token kharch"],["                    tokens -= 1;",""],["                    return true;",""],["                }",""],["                return false;","Bucket khaali: caller 429 Too Many Requests bhejega"],["            }",""],["",""],["            private void refillTokens(long capacity, double refillPerNano, long nowNanos) {",""],["                long elapsed = nowNanos - lastRefillNanos;",""],["                if (elapsed <= 0) return;",""],["                tokens = Math.min(capacity, tokens + elapsed * refillPerNano);","Lazy refill: koi timer thread nahi; elapsed time se tokens jodo, capacity tak"],["                lastRefillNanos = nowNanos;",""],["            }",""],["        }",""],["    }",""],["",""],["    static final class SlidingWindowCounterRateLimiter implements RateLimiter {",""],["        private final long limit;",""],["        private final long windowNanos;",""],["        private final LongSupplier clock;",""],["        private final Map<String, WindowState> windows = new ConcurrentHashMap<>();",""],["",""],["        SlidingWindowCounterRateLimiter(long limit, long windowMillis, LongSupplier clock) {",""],["            this.limit = limit;",""],["            this.windowNanos = windowMillis * 1_000_000L;",""],["            this.clock = clock;",""],["        }",""],["",""],["        @Override",""],["        public boolean allowRequest(String clientId) {",""],["            long now = clock.getAsLong();",""],["            WindowState state = windows.computeIfAbsent(clientId, id -> new WindowState());",""],["            synchronized (state) {",""],["                long currentWindow = now / windowNanos;","Fixed window ka index (e.g. har minute ek window)"],["                if (currentWindow != state.windowIndex) {",""],["                    state.previousCount = (currentWindow == state.windowIndex + 1) ? state.currentCount : 0;","Window badli: current count ab previous (beech me gap ho to 0)"],["                    state.currentCount = 0;",""],["                    state.windowIndex = currentWindow;",""],["                }",""],["                double elapsedFraction = (now % windowNanos) / (double) windowNanos;",""],["                double estimated = state.previousCount * (1 - elapsedFraction) + state.currentCount;","Weighted estimate: pichhli window ka bacha hissa + current; window boundary pe 2x burst wali problem khatam"],["                if (estimated >= limit) return false;",""],["                state.currentCount++;",""],["                return true;",""],["            }",""],["        }",""],["",""],["        static final class WindowState {",""],["            long windowIndex = -1;",""],["            long previousCount;",""],["            long currentCount;",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        long[] fakeNow = {0L};",""],["        LongSupplier fakeClock = () -> fakeNow[0];","Deterministic demo: time hum khud aage badhayenge"],["",""],["        RateLimiter tokenBucket = new TokenBucketRateLimiter(5, 1.0, fakeClock);","Burst 5, refill 1 token/second"],["        StringBuilder results = new StringBuilder();",""],["        for (int i = 0; i < 7; i++) results.append(tokenBucket.allowRequest(\"user-42\") ? \"Y\" : \"N\");",""],["        System.out.println(\"burst of 7 -> \" + results);","Expected YYYYYNN: 5 allow, phir 429"],["",""],["        fakeNow[0] += 2_000_000_000L;","2 second baad: 2 tokens wapas"],["        results.setLength(0);",""],["        for (int i = 0; i < 3; i++) results.append(tokenBucket.allowRequest(\"user-42\") ? \"Y\" : \"N\");",""],["        System.out.println(\"after 2s -> \" + results);",""],["        System.out.println(\"other user allowed? \" + tokenBucket.allowRequest(\"user-7\"));","Alag user ka alag bucket"],["",""],["        fakeNow[0] = 0;",""],["        RateLimiter sliding = new SlidingWindowCounterRateLimiter(10, 60_000, fakeClock);","10 requests per minute"],["        int allowed = 0;",""],["        for (int i = 0; i < 15; i++) if (sliding.allowRequest(\"api-key-1\")) allowed++;",""],["        System.out.println(\"sliding window, first minute: allowed \" + allowed + \" of 15\");",""],["        fakeNow[0] = 90_000_000_000L;","t = 90s: agli window ka 50% beet chuka"],["        allowed = 0;",""],["        for (int i = 0; i < 15; i++) if (sliding.allowRequest(\"api-key-1\")) allowed++;",""],["        System.out.println(\"at t=90s: allowed \" + allowed + \" (previous window counted at 50%)\");",""],["    }",""],["}",""]]},"ReplicationFailoverDemo":{"file":"ReplicationFailoverDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.HashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["",""],["public class ReplicationFailoverDemo {",""],["",""],["    record WalRecord(long lsn, String key, String value) {}","LSN = Log Sequence Number: WAL me record ki position"],["",""],["    static final class Primary {",""],["        final List<WalRecord> wal = new ArrayList<>();","Write-ahead log: replication isi log ko ship karta hai"],["        final Map<String, String> data = new HashMap<>();",""],["        boolean alive = true;",""],["",""],["        long write(String key, String value) {",""],["            if (!alive) throw new IllegalStateException(\"primary down\");",""],["            long lsn = wal.size() + 1;",""],["            wal.add(new WalRecord(lsn, key, value));","Pehle WAL, phir data: crash ke baad WAL se recover"],["            data.put(key, value);",""],["            return lsn;",""],["        }",""],["",""],["        long lastLsn() { return wal.size(); }",""],["    }",""],["",""],["    static final class Replica {",""],["        final String name;",""],["        final Map<String, String> data = new HashMap<>();",""],["        long appliedLsn = 0;",""],["",""],["        Replica(String name) { this.name = name; }",""],["",""],["        int pullFrom(Primary primary, int maxRecords) {","Async replication: replica apni speed se WAL padhta hai, isliye lag aata hai"],["            int applied = 0;",""],["            while (applied < maxRecords && appliedLsn < primary.wal.size()) {",""],["                WalRecord r = primary.wal.get((int) appliedLsn);",""],["                data.put(r.key(), r.value());",""],["                appliedLsn = r.lsn();",""],["                applied++;",""],["            }",""],["            return applied;",""],["        }",""],["    }",""],["",""],["    static final class ReadRouter {","Read-your-writes: user ka last write LSN yaad rakho"],["        private final Primary primary;",""],["        private final Replica replica;",""],["        private final Map<String, Long> lastWriteLsnByUser = new HashMap<>();","Real me session token / cookie me rakhte hain"],["",""],["        ReadRouter(Primary primary, Replica replica) {",""],["            this.primary = primary;",""],["            this.replica = replica;",""],["        }",""],["",""],["        void recordWrite(String userId, long lsn) { lastWriteLsnByUser.merge(userId, lsn, Math::max); }",""],["",""],["        String read(String userId, String key) {",""],["            long needed = lastWriteLsnByUser.getOrDefault(userId, 0L);",""],["            if (replica.appliedLsn >= needed) {","Replica ne user ka write dekh liya: replica se padho (sasta)"],["                return replica.data.get(key) + \" (from replica)\";",""],["            }",""],["            return primary.data.get(key) + \" (from primary: replica lag \" + (needed - replica.appliedLsn) + \" records)\";","Replica peeche hai: is user ke liye primary"],["        }",""],["    }",""],["",""],["    static final class FencedStorage {","Shared storage jo purane leader ko pehchaan sake"],["        private long highestTokenSeen = 0;",""],["        final List<String> writes = new ArrayList<>();",""],["",""],["        synchronized boolean write(long fencingToken, String writer, String value) {",""],["            if (fencingToken < highestTokenSeen) {","Purana token = purana leader (GC pause / partition se laut aaya): reject"],["                System.out.println(\"   storage REJECTED \" + writer + \" (token \" + fencingToken + \" < \" + highestTokenSeen + \")\");",""],["                return false;",""],["            }",""],["            highestTokenSeen = fencingToken;",""],["            writes.add(writer + \":\" + value);",""],["            return true;",""],["        }",""],["    }",""],["",""],["    static final class LeaseService {","ZooKeeper / etcd jaisa: har naye lock/lease pe badhta hua token"],["        private long nextToken = 33;",""],["",""],["        synchronized long acquireLease(String owner) {",""],["            long token = nextToken++;",""],["            System.out.println(\"   lease granted to \" + owner + \" with fencing token \" + token);",""],["            return token;",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        Primary primary = new Primary();",""],["        Replica replica = new Replica(\"replica-1\");",""],["        ReadRouter router = new ReadRouter(primary, replica);",""],["",""],["        primary.write(\"user:7:name\", \"Asha\");",""],["        replica.pullFrom(primary, 10);",""],["        long lsn = primary.write(\"user:42:name\", \"Ravi Kumar\");","User 42 ne naam update kiya"],["        router.recordWrite(\"user42\", lsn);",""],["        System.out.println(\"replica applied LSN \" + replica.appliedLsn + \", primary LSN \" + primary.lastLsn());",""],["        System.out.println(\"naive replica read for user42: \" + replica.data.get(\"user:42:name\"));","null: apna hi update nahi dikha (bad UX)"],["        System.out.println(\"router read for user42: \" + router.read(\"user42\", \"user:42:name\"));",""],["        System.out.println(\"router read for user7:  \" + router.read(\"user7\", \"user:7:name\"));",""],["        replica.pullFrom(primary, 10);",""],["        System.out.println(\"after catch-up, user42: \" + router.read(\"user42\", \"user:42:name\"));",""],["",""],["        primary.write(\"order:9:status\", \"PAID\");",""],["        replica.pullFrom(primary, 10);",""],["        primary.write(\"order:10:status\", \"PAID\");","Ye write replica tak pahunchne se pehle hi..."],["        primary.alive = false;","...primary crash"],["        long lost = primary.lastLsn() - replica.appliedLsn;",""],["        System.out.println(\"primary crashed; promote \" + replica.name + \" at LSN \" + replica.appliedLsn",""],["                + \"; acknowledged writes lost (RPO) = \" + lost + \" -> \" + (replica.data.containsKey(\"order:10:status\") ? \"kept\" : \"order:10 missing\"));",""],["",""],["        LeaseService leases = new LeaseService();",""],["        FencedStorage storage = new FencedStorage();",""],["        long oldToken = leases.acquireLease(\"leader-A\");",""],["        storage.write(oldToken, \"leader-A\", \"batch-1\");",""],["        System.out.println(\"   leader-A pauses (long GC) ... lease expires\");",""],["        long newToken = leases.acquireLease(\"leader-B\");","Lease expire hone par naya leader"],["        storage.write(newToken, \"leader-B\", \"batch-2\");",""],["        storage.write(oldToken, \"leader-A\", \"batch-1-retry\");","Purana leader jaag ke likhne aaya: fencing token ne roka"],["        System.out.println(\"storage writes = \" + storage.writes);",""],["    }",""],["}",""]]},"RideMatchingDemo":{"file":"RideMatchingDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.Comparator;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Optional;",""],["import java.util.Set;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.concurrent.atomic.AtomicLong;",""],["import java.util.concurrent.atomic.AtomicReference;",""],["import java.util.function.Predicate;",""],["",""],["public class RideMatchingDemo {",""],["",""],["    enum DriverState { AVAILABLE, OFFERED, ON_TRIP }",""],["",""],["    record Location(double lat, double lng) {}",""],["",""],["    static final class Driver {",""],["        final String driverId;",""],["        volatile Location location;",""],["        final AtomicReference<DriverState> state = new AtomicReference<>(DriverState.AVAILABLE);","Atomic state: ek driver ko ek time pe ek hi ride offer"],["",""],["        Driver(String driverId, Location location) {",""],["            this.driverId = driverId;",""],["            this.location = location;",""],["        }",""],["    }",""],["",""],["    static final class GeoGrid {","Simple grid index (geohash jaisa idea): duniya ko ~1 km cells me baanto"],["        private static final double CELL_DEGREES = 0.01;","0.01 degree ≈ 1.1 km latitude; real systems geohash / H3 / S2 use karte hain"],["",""],["        static long row(Location l) { return (long) Math.floor(l.lat() / CELL_DEGREES); }",""],["",""],["        static long col(Location l) { return (long) Math.floor(l.lng() / CELL_DEGREES); }",""],["",""],["        static String cellKey(Location l) { return row(l) + \":\" + col(l); }",""],["",""],["        static List<String> nearbyCells(Location l, int ring) {","Apna cell + padosi cells (ring=1 -> 3x3), taaki cell boundary pe khada driver miss na ho"],["            List<String> cells = new ArrayList<>();",""],["            for (long r = row(l) - ring; r <= row(l) + ring; r++) {",""],["                for (long c = col(l) - ring; c <= col(l) + ring; c++) cells.add(r + \":\" + c);",""],["            }",""],["            return cells;",""],["        }",""],["    }",""],["",""],["    static double haversineKm(Location a, Location b) {","Earth pe do points ki seedhi doori (real ETA ke liye road graph + traffic)"],["        double dLat = Math.toRadians(b.lat() - a.lat());",""],["        double dLng = Math.toRadians(b.lng() - a.lng());",""],["        double h = Math.sin(dLat / 2) * Math.sin(dLat / 2)",""],["                + Math.cos(Math.toRadians(a.lat())) * Math.cos(Math.toRadians(b.lat())) * Math.sin(dLng / 2) * Math.sin(dLng / 2);",""],["        return 2 * 6371.0 * Math.asin(Math.sqrt(h));",""],["    }",""],["",""],["    static final class DriverLocationIndex {","Redis GEO / in-memory index ka stand-in: cell -> drivers"],["        private final Map<String, Set<String>> driversByCell = new ConcurrentHashMap<>();",""],["        private final Map<String, Driver> drivers = new ConcurrentHashMap<>();",""],["",""],["        void updateDriverLocation(String driverId, Location newLocation) {","Driver app har ~4 sec bhejta hai: write rate bahut high, isliye memory me (har update DB me nahi)"],["            Driver driver = drivers.computeIfAbsent(driverId, id -> new Driver(id, newLocation));",""],["            String oldCell = GeoGrid.cellKey(driver.location);",""],["            String newCell = GeoGrid.cellKey(newLocation);",""],["            driver.location = newLocation;",""],["            if (!oldCell.equals(newCell)) {",""],["                Set<String> old = driversByCell.get(oldCell);",""],["                if (old != null) old.remove(driverId);","Cell badla: purane cell se hatao"],["            }",""],["            driversByCell.computeIfAbsent(newCell, k -> ConcurrentHashMap.newKeySet()).add(driverId);",""],["        }",""],["",""],["        List<Driver> findNearbyAvailableDrivers(Location pickup, double radiusKm, int limit) {",""],["            List<Driver> result = new ArrayList<>();",""],["            for (String cell : GeoGrid.nearbyCells(pickup, 1)) {",""],["                for (String id : driversByCell.getOrDefault(cell, Set.of())) {",""],["                    Driver d = drivers.get(id);",""],["                    if (d.state.get() == DriverState.AVAILABLE && haversineKm(pickup, d.location) <= radiusKm) result.add(d);",""],["                }",""],["            }",""],["            result.sort(Comparator.comparingDouble(d -> haversineKm(pickup, d.location)));","Nearest pehle (real ranking: ETA, rating, acceptance rate)"],["            return result.subList(0, Math.min(limit, result.size()));",""],["        }",""],["",""],["        Driver get(String driverId) { return drivers.get(driverId); }",""],["    }",""],["",""],["    record Trip(String tripId, String riderId, String driverId) {}",""],["",""],["    static final class RideMatchingService {",""],["        private final DriverLocationIndex index;",""],["        private final Map<String, Trip> trips = new ConcurrentHashMap<>();",""],["        private final AtomicLong tripSeq = new AtomicLong();",""],["",""],["        RideMatchingService(DriverLocationIndex index) { this.index = index; }",""],["",""],["        Optional<Trip> requestRide(String riderId, Location pickup, Predicate<Driver> driverAccepts) {",""],["            for (Driver driver : index.findNearbyAvailableDrivers(pickup, 3.0, 5)) {",""],["                if (!driver.state.compareAndSet(DriverState.AVAILABLE, DriverState.OFFERED)) continue;","CAS: do riders ek hi driver ko ek saath offer nahi kar sakte"],["                if (driverAccepts.test(driver)) {","Driver app pe offer (real: 15 sec timeout)"],["                    driver.state.set(DriverState.ON_TRIP);",""],["                    Trip trip = new Trip(\"T\" + tripSeq.incrementAndGet(), riderId, driver.driverId);",""],["                    trips.put(trip.tripId(), trip);",""],["                    return Optional.of(trip);",""],["                }",""],["                driver.state.set(DriverState.AVAILABLE);","Decline ya timeout: driver wapas available, agla driver try"],["            }",""],["            return Optional.empty();","Koi nahi mila: radius badhao ya \"no cabs nearby\""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        DriverLocationIndex index = new DriverLocationIndex();",""],["        Location pickup = new Location(12.9716, 77.5946);","Bengaluru, MG Road"],["        index.updateDriverLocation(\"d1\", new Location(12.9750, 77.6000));",""],["        index.updateDriverLocation(\"d2\", new Location(12.9700, 77.5900));",""],["        index.updateDriverLocation(\"d3\", new Location(13.0500, 77.7000));","~14 km door: radius ke bahar"],["        index.updateDriverLocation(\"d2\", new Location(12.9712, 77.5941));","d2 paas aaya (location update)"],["",""],["        List<String> nearby = index.findNearbyAvailableDrivers(pickup, 3.0, 5).stream()",""],["                .map(d -> d.driverId + String.format(\" (%.2f km)\", haversineKm(pickup, d.location)))",""],["                .toList();",""],["        System.out.println(\"pickup cell \" + GeoGrid.cellKey(pickup) + \", nearby available: \" + nearby);",""],["",""],["        RideMatchingService matching = new RideMatchingService(index);",""],["        Trip trip = matching.requestRide(\"rider-1\", pickup, d -> !d.driverId.equals(\"d2\")).orElseThrow();","d2 (sabse paas) decline karta hai"],["        System.out.println(\"rider-1 trip \" + trip + \" | d2=\" + index.get(\"d2\").state.get() + \" d1=\" + index.get(\"d1\").state.get());",""],["        System.out.println(\"rider-2 got: \" + matching.requestRide(\"rider-2\", pickup, d -> true).map(Trip::driverId).orElse(\"no driver\"));",""],["        System.out.println(\"rider-3 got: \" + matching.requestRide(\"rider-3\", pickup, d -> true).map(Trip::driverId).orElse(\"no driver nearby\"));",""],["    }",""],["}",""]]},"SnowflakeIdDemo":{"file":"SnowflakeIdDemo.java","lines":[["import java.time.Instant;",""],["import java.util.HashSet;",""],["import java.util.Set;",""],["",""],["public class SnowflakeIdDemo {",""],["",""],["    static class SnowflakeIdGenerator {",""],["        private static final long CUSTOM_EPOCH = 1704067200000L;","1 Jan 2024 UTC: apna epoch rakhne se 41 bits ~69 saal chalenge"],["        private static final int MACHINE_BITS = 10;","10 bits = 1024 machines"],["        private static final int SEQUENCE_BITS = 12;","12 bits = ek machine ek millisecond me 4096 IDs"],["        private static final long MAX_MACHINE_ID = (1L << MACHINE_BITS) - 1;",""],["        private static final long MAX_SEQUENCE = (1L << SEQUENCE_BITS) - 1;",""],["",""],["        private final long machineId;",""],["        private long lastTimestamp = -1L;",""],["        private long sequence = 0L;",""],["",""],["        SnowflakeIdGenerator(long machineId) {",""],["            if (machineId < 0 || machineId > MAX_MACHINE_ID) {","Machine id unique hona chahiye (ZooKeeper/K8s ordinal se), warna do machines same ID bana dengi"],["                throw new IllegalArgumentException(\"machineId out of range: \" + machineId);",""],["            }",""],["            this.machineId = machineId;",""],["        }",""],["",""],["        synchronized long nextId() {","synchronized: ek JVM ke threads same sequence number na le lein"],["            long now = currentTimeMillis();",""],["            if (now < lastTimestamp) {","Clock peeche gaya (NTP adjust): uniqueness toot sakti hai, isliye refuse + alert"],["                throw new IllegalStateException(\"Clock moved backwards by \" + (lastTimestamp - now) + \" ms\");",""],["            }",""],["            if (now == lastTimestamp) {",""],["                sequence = (sequence + 1) & MAX_SEQUENCE;","Same ms: sequence badhao; & mask se 4095 ke baad 0"],["                if (sequence == 0) now = waitForNextMillis(lastTimestamp);","Is ms ke 4096 IDs khatam: agle ms tak ruko"],["            } else {",""],["                sequence = 0;","Naya ms: sequence 0 se"],["            }",""],["            lastTimestamp = now;",""],["            return ((now - CUSTOM_EPOCH) << (MACHINE_BITS + SEQUENCE_BITS))","Layout: [41 bit time][10 bit machine][12 bit seq]; time pehle, isliye IDs time se sortable"],["                    | (machineId << SEQUENCE_BITS)",""],["                    | sequence;",""],["        }",""],["",""],["        private long waitForNextMillis(long last) {",""],["            long ts = currentTimeMillis();",""],["            while (ts <= last) ts = currentTimeMillis();","Busy-wait sirf <1 ms ka hota hai"],["            return ts;",""],["        }",""],["",""],["        long currentTimeMillis() { return System.currentTimeMillis(); }",""],["",""],["        static String explainId(long id) {","Debug helper: ID ko wapas time, machine, sequence me todo"],["            long seq = id & MAX_SEQUENCE;",""],["            long machine = (id >> SEQUENCE_BITS) & MAX_MACHINE_ID;",""],["            long ts = (id >> (MACHINE_BITS + SEQUENCE_BITS)) + CUSTOM_EPOCH;",""],["            return \"time=\" + Instant.ofEpochMilli(ts) + \" machine=\" + machine + \" seq=\" + seq;",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        SnowflakeIdGenerator generator = new SnowflakeIdGenerator(7);",""],["        long first = generator.nextId();",""],["        long second = generator.nextId();",""],["        System.out.println(first + \" -> \" + SnowflakeIdGenerator.explainId(first));",""],["        System.out.println(second + \" -> \" + SnowflakeIdGenerator.explainId(second));",""],["        System.out.println(\"second > first (time sortable)? \" + (second > first));",""],["        Set<Long> ids = new HashSet<>();",""],["        for (int i = 0; i < 100_000; i++) ids.add(generator.nextId());","1 lakh IDs tez loop me: sab unique hone chahiye"],["        System.out.println(\"100000 ids generated, unique = \" + ids.size());",""],["    }",""],["}",""]]},"SolidDemo":{"file":"SolidDemo.java","lines":[["import java.util.List;",""],["",""],["public class SolidDemo {",""],["",""],["    interface PaymentMethod {","OCP: naya payment type = nayi class; CheckoutService ka code chhedna nahi padta"],["        String name();",""],["        boolean pay(long amountPaise);","Paisa hamesha paise (long) me, double me nahi: rounding errors se bachne ke liye"],["    }",""],["",""],["    interface Refundable {","ISP: refund alag chhota interface; jo refund nahi karta wo force nahi hota"],["        boolean refund(long amountPaise);",""],["    }",""],["",""],["    static class UpiPayment implements PaymentMethod, Refundable {",""],["        public String name() { return \"UPI\"; }",""],["        public boolean pay(long amountPaise) { return amountPaise > 0; }",""],["        public boolean refund(long amountPaise) { return true; }",""],["    }",""],["",""],["    static class GiftCardPayment implements PaymentMethod {","LSP: gift card refund nahi karta, isliye Refundable implement hi nahi kiya (exception throw karke contract todna galat)"],["        private long balancePaise;",""],["",""],["        GiftCardPayment(long balancePaise) { this.balancePaise = balancePaise; }",""],["",""],["        public String name() { return \"GIFT_CARD\"; }",""],["",""],["        public boolean pay(long amountPaise) {",""],["            if (amountPaise > balancePaise) return false;",""],["            balancePaise -= amountPaise;",""],["            return true;",""],["        }",""],["    }",""],["",""],["    interface OrderRepository {","DIP: service abstraction pe depend karti hai, MySQL ya Mongo ki detail pe nahi"],["        void saveOrder(String orderId, long amountPaise, String method);",""],["    }",""],["",""],["    interface ReceiptSender {",""],["        void sendReceipt(String orderId);",""],["    }",""],["",""],["    static class CheckoutService {","SRP: sirf checkout ka flow; DB save aur receipt bhejna alag classes ka kaam"],["        private final OrderRepository repository;",""],["        private final ReceiptSender receiptSender;",""],["",""],["        CheckoutService(OrderRepository repository, ReceiptSender receiptSender) {","Constructor injection: test me fake repo/sender pass kar do"],["            this.repository = repository;",""],["            this.receiptSender = receiptSender;",""],["        }",""],["",""],["        boolean checkout(String orderId, long amountPaise, PaymentMethod method) {",""],["            if (!method.pay(amountPaise)) return false;","Polymorphism: UPI ho ya gift card, same call"],["            repository.saveOrder(orderId, amountPaise, method.name());",""],["            receiptSender.sendReceipt(orderId);",""],["            return true;",""],["        }",""],["",""],["        boolean refundIfPossible(PaymentMethod method, long amountPaise) {",""],["            return method instanceof Refundable refundable && refundable.refund(amountPaise);","Java 16+ pattern matching: type check + cast ek line me"],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        OrderRepository inMemoryRepo = (id, amount, method) -> System.out.println(\"saved \" + id + \" \" + amount + \" via \" + method);","Lambda as fake repository: na DB, na mock library"],["        ReceiptSender consoleSender = id -> System.out.println(\"receipt sent for \" + id);",""],["        CheckoutService checkout = new CheckoutService(inMemoryRepo, consoleSender);",""],["        for (PaymentMethod method : List.of(new UpiPayment(), new GiftCardPayment(50_000))) {",""],["            System.out.println(method.name() + \" checkout ok? \" + checkout.checkout(\"ORD-\" + method.name(), 49_900, method));",""],["            System.out.println(method.name() + \" refundable? \" + checkout.refundIfPossible(method, 49_900));",""],["        }",""],["    }",""],["}",""]]},"SplitwiseDemo":{"file":"SplitwiseDemo.java","lines":[["import java.util.AbstractMap;",""],["import java.util.ArrayList;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.PriorityQueue;",""],["import java.util.TreeMap;",""],["",""],["public class SplitwiseDemo {",""],["",""],["    interface SplitStrategy {","Strategy: equal / exact / percent; naya split type = nayi class, service same"],["        Map<String, Long> split(long totalPaise, List<String> participants, List<Long> values);",""],["    }",""],["",""],["    static final class EqualSplit implements SplitStrategy {",""],["        @Override",""],["        public Map<String, Long> split(long total, List<String> people, List<Long> ignored) {",""],["            Map<String, Long> shares = new LinkedHashMap<>();",""],["            long base = total / people.size();",""],["            long remainder = total % people.size();","₹1000 / 3: paise me 33334, 33333, 33333; bacha paisa ek-ek karke baanto"],["            for (int i = 0; i < people.size(); i++) shares.put(people.get(i), base + (i < remainder ? 1 : 0));",""],["            return shares;",""],["        }",""],["    }",""],["",""],["    static final class ExactSplit implements SplitStrategy {",""],["        @Override",""],["        public Map<String, Long> split(long total, List<String> people, List<Long> amounts) {",""],["            if (amounts.stream().mapToLong(Long::longValue).sum() != total) {",""],["                throw new IllegalArgumentException(\"Exact amounts must add up to total\");","Sum mismatch = galat input, save hi mat karo"],["            }",""],["            Map<String, Long> shares = new LinkedHashMap<>();",""],["            for (int i = 0; i < people.size(); i++) shares.put(people.get(i), amounts.get(i));",""],["            return shares;",""],["        }",""],["    }",""],["",""],["    static final class PercentSplit implements SplitStrategy {",""],["        @Override",""],["        public Map<String, Long> split(long total, List<String> people, List<Long> percents) {",""],["            if (percents.stream().mapToLong(Long::longValue).sum() != 100) throw new IllegalArgumentException(\"Percents must add up to 100\");",""],["            Map<String, Long> shares = new LinkedHashMap<>();",""],["            long assigned = 0;",""],["            for (int i = 0; i < people.size(); i++) {",""],["                long share = (i == people.size() - 1) ? total - assigned : total * percents.get(i) / 100;","Last person ko bacha hua: rounding ka ek bhi paisa gayab nahi"],["                shares.put(people.get(i), share);",""],["                assigned += share;",""],["            }",""],["            return shares;",""],["        }",""],["    }",""],["",""],["    record Expense(String expenseId, String paidBy, long amountPaise, Map<String, Long> shares, String note) {}",""],["",""],["    record Settlement(String from, String to, long amountPaise) {",""],["        @Override",""],["        public String toString() { return from + \" pays \" + to + \" Rs \" + amountPaise / 100 + \".\" + String.format(\"%02d\", amountPaise % 100); }",""],["    }",""],["",""],["    static final class ExpenseService {",""],["        private final List<Expense> ledger = new ArrayList<>();","Append-only ledger: expense edit nahi hota, galti = reversal entry (audit trail)"],["        private final Map<String, Long> netBalance = new TreeMap<>();","+ve = paise milne hain, -ve = dene hain (derived, ledger se rebuild ho sakta hai)"],["        private int expenseSeq = 0;",""],["",""],["        synchronized Expense addExpense(String paidBy, long amountPaise, List<String> participants, SplitStrategy strategy, List<Long> values, String note) {",""],["            Map<String, Long> shares = strategy.split(amountPaise, participants, values);",""],["            Expense expense = new Expense(\"E\" + (++expenseSeq), paidBy, amountPaise, shares, note);",""],["            ledger.add(expense);",""],["            netBalance.merge(paidBy, amountPaise, Long::sum);","Payer ne poora bill diya: +amount"],["            shares.forEach((person, share) -> netBalance.merge(person, -share, Long::sum));","Har participant ka hissa: -share (payer ka apna hissa bhi yahin cancel)"],["            return expense;",""],["        }",""],["",""],["        synchronized Map<String, Long> getNetBalances() { return new TreeMap<>(netBalance); }",""],["",""],["        synchronized List<Settlement> simplifyDebts() {","Greedy: sabse bada creditor vs sabse bada debtor; max n-1 payments"],["            PriorityQueue<Map.Entry<String, Long>> creditors = new PriorityQueue<>((a, b) -> Long.compare(b.getValue(), a.getValue()));",""],["            PriorityQueue<Map.Entry<String, Long>> debtors = new PriorityQueue<>((a, b) -> Long.compare(a.getValue(), b.getValue()));",""],["            netBalance.forEach((person, balance) -> {",""],["                if (balance > 0) creditors.add(new AbstractMap.SimpleEntry<>(person, balance));",""],["                else if (balance < 0) debtors.add(new AbstractMap.SimpleEntry<>(person, balance));",""],["            });",""],["            List<Settlement> plan = new ArrayList<>();",""],["            while (!creditors.isEmpty() && !debtors.isEmpty()) {",""],["                Map.Entry<String, Long> creditor = creditors.poll();",""],["                Map.Entry<String, Long> debtor = debtors.poll();",""],["                long amount = Math.min(creditor.getValue(), -debtor.getValue());","Dono me jo chhota, utna settle"],["                plan.add(new Settlement(debtor.getKey(), creditor.getKey(), amount));",""],["                if (creditor.getValue() - amount > 0) creditors.add(new AbstractMap.SimpleEntry<>(creditor.getKey(), creditor.getValue() - amount));","Bacha hua wapas heap me"],["                if (debtor.getValue() + amount < 0) debtors.add(new AbstractMap.SimpleEntry<>(debtor.getKey(), debtor.getValue() + amount));",""],["            }",""],["            return plan;",""],["        }",""],["",""],["        synchronized void recordPayment(String from, String to, long amountPaise) {","Settle-up bhi ledger entry hai (transfer), expense nahi"],["            netBalance.merge(from, amountPaise, Long::sum);",""],["            netBalance.merge(to, -amountPaise, Long::sum);",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        ExpenseService service = new ExpenseService();",""],["        List<String> trip = List.of(\"aman\", \"bina\", \"chetan\");",""],["        service.addExpense(\"aman\", 300_000, trip, new EqualSplit(), List.of(), \"Goa hotel\");","₹3000 hotel, barabar"],["        service.addExpense(\"bina\", 100_000, trip, new EqualSplit(), List.of(), \"Dinner\");","₹1000 / 3 = 333.34 + 333.33 + 333.33"],["        service.addExpense(\"chetan\", 60_000, List.of(\"aman\", \"chetan\"), new ExactSplit(), List.of(40_000L, 20_000L), \"Scooter\");",""],["        service.addExpense(\"aman\", 50_000, trip, new PercentSplit(), List.of(20L, 30L, 50L), \"Cab\");",""],["",""],["        System.out.println(\"net balances (paise): \" + service.getNetBalances());",""],["        List<Settlement> plan = service.simplifyDebts();",""],["        plan.forEach(s -> System.out.println(\"  \" + s));",""],["        plan.forEach(s -> service.recordPayment(s.from(), s.to(), s.amountPaise()));",""],["        System.out.println(\"after settle up: \" + service.getNetBalances());",""],["    }",""],["}",""]]},"StreamWindowDemo":{"file":"StreamWindowDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.HashSet;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Set;",""],["import java.util.TreeMap;",""],["",""],["public class StreamWindowDemo {",""],["",""],["    record ClickEvent(String eventId, String adId, long eventTimeSec) {}","eventTime = jab click hua (device pe), arrival se alag"],["",""],["    static final class TumblingWindowAggregator {",""],["        static final long WINDOW_SEC = 60;","1-minute tumbling windows: [0,60), [60,120) ..."],["        static final long MAX_OUT_OF_ORDER_SEC = 10;","Watermark = max event time dekha - 10s (\"isse purana ab shayad hi aaye\")"],["        static final long ALLOWED_LATENESS_SEC = 30;","Window fire hone ke 30s baad tak late events se correction"],["",""],["        private final Map<Long, Map<String, Long>> windows = new TreeMap<>();","State: window start -> (adId -> count)"],["        private final Set<Long> firedWindows = new HashSet<>();",""],["        private final Set<String> seenEventIds = new HashSet<>();","Dedup state (real: TTL ke saath state store)"],["        private long maxEventTime = Long.MIN_VALUE;",""],["        final Map<Long, Map<String, Long>> sink = new TreeMap<>();","Sink upsert by window key = idempotent"],["        final List<String> sideOutput = new ArrayList<>();",""],["        final List<String> log = new ArrayList<>();",""],["        int processedOffset = 0;","Kafka offset jaisa: kitne events process hue"],["",""],["        long watermark() { return maxEventTime == Long.MIN_VALUE ? Long.MIN_VALUE : maxEventTime - MAX_OUT_OF_ORDER_SEC; }",""],["",""],["        void process(ClickEvent e) {",""],["            processedOffset++;",""],["            if (!seenEventIds.add(e.eventId())) {","Retry / duplicate: dobara count nahi"],["                log.add(\"dup \" + e.eventId() + \" dropped\");",""],["                return;",""],["            }",""],["            long start = (e.eventTimeSec() / WINDOW_SEC) * WINDOW_SEC;","Event time se window: arrival time se nahi"],["            long end = start + WINDOW_SEC;",""],["            if (watermark() != Long.MIN_VALUE && end + ALLOWED_LATENESS_SEC <= watermark()) {","Bahut late: window ka state band ho chuka"],["                sideOutput.add(e.eventId() + \"@\" + e.eventTimeSec() + \"s\");",""],["                log.add(\"TOO LATE \" + e.eventId() + \" -> side output (batch reconciliation sambhalega)\");",""],["                return;",""],["            }",""],["            windows.computeIfAbsent(start, k -> new TreeMap<>()).merge(e.adId(), 1L, Long::sum);",""],["            if (firedWindows.contains(start)) {","Late but allowed: result update (correction) bhejo"],["                emit(start, \"UPDATE (late \" + e.eventId() + \")\");",""],["            }",""],["            maxEventTime = Math.max(maxEventTime, e.eventTimeSec());",""],["            fireReadyWindows();",""],["        }",""],["",""],["        private void fireReadyWindows() {",""],["            for (Long start : windows.keySet()) {",""],["                if (!firedWindows.contains(start) && start + WINDOW_SEC <= watermark()) {","Watermark window end paar = \"ab is window ka data poora maan lo\""],["                    firedWindows.add(start);",""],["                    emit(start, \"FIRE\");",""],["                }",""],["            }",""],["        }",""],["",""],["        private void emit(long start, String kind) {",""],["            Map<String, Long> counts = new TreeMap<>(windows.get(start));",""],["            sink.put(start, counts);","Upsert: same window dobara emit ho to overwrite, double nahi"],["            log.add(kind + \" [\" + start + \",\" + (start + WINDOW_SEC) + \") \" + counts + \" wm=\" + watermark());",""],["        }",""],["",""],["        Snapshot checkpoint() {","Flink checkpoint: state + offset ek saath snapshot"],["            Map<Long, Map<String, Long>> copy = new TreeMap<>();",""],["            windows.forEach((k, v) -> copy.put(k, new TreeMap<>(v)));",""],["            return new Snapshot(copy, new HashSet<>(firedWindows), new HashSet<>(seenEventIds), maxEventTime, processedOffset);",""],["        }",""],["",""],["        void restore(Snapshot s) {","Crash ke baad: state aur offset dono checkpoint se, phir wahan se replay"],["            windows.clear();",""],["            s.windows().forEach((k, v) -> windows.put(k, new TreeMap<>(v)));",""],["            firedWindows.clear();",""],["            firedWindows.addAll(s.fired());",""],["            seenEventIds.clear();",""],["            seenEventIds.addAll(s.seen());",""],["            maxEventTime = s.maxEventTime();",""],["            processedOffset = s.offset();",""],["        }",""],["    }",""],["",""],["    record Snapshot(Map<Long, Map<String, Long>> windows, Set<Long> fired, Set<String> seen, long maxEventTime, int offset) {}",""],["",""],["    static List<ClickEvent> sampleStream() {","Arrival order; event times out-of-order"],["        return List.of(",""],["                new ClickEvent(\"e1\", \"ad1\", 5), new ClickEvent(\"e2\", \"ad1\", 20), new ClickEvent(\"e3\", \"ad2\", 30),",""],["                new ClickEvent(\"e4\", \"ad1\", 58), new ClickEvent(\"e5\", \"ad1\", 65),",""],["                new ClickEvent(\"e6\", \"ad2\", 50),","Out-of-order: window [0,60) abhi fire nahi hua, isliye count ho jayega"],["                new ClickEvent(\"e7\", \"ad1\", 72),","Watermark 62 > 60: window [0,60) FIRE"],["                new ClickEvent(\"e8\", \"ad1\", 55),","Late (fire ke baad) par lateness ke andar: UPDATE"],["                new ClickEvent(\"e2\", \"ad1\", 20),","Duplicate delivery"],["                new ClickEvent(\"e9\", \"ad2\", 130),","Watermark 120: window [60,120) FIRE"],["                new ClickEvent(\"e10\", \"ad1\", 40));","Window [0,60) + 30s lateness = 90 < watermark 120: side output"],["    }",""],["",""],["    public static void main(String[] args) {",""],["        List<ClickEvent> stream = sampleStream();",""],["        TumblingWindowAggregator job = new TumblingWindowAggregator();",""],["        stream.forEach(job::process);",""],["        job.log.forEach(line -> System.out.println(\"   \" + line));",""],["        System.out.println(\"final sink = \" + job.sink + \", side output = \" + job.sideOutput);",""],["",""],["        TumblingWindowAggregator crashy = new TumblingWindowAggregator();",""],["        Snapshot checkpoint = null;",""],["        for (int i = 0; i < stream.size(); i++) {",""],["            crashy.process(stream.get(i));",""],["            if (i == 6) checkpoint = crashy.checkpoint();","e7 ke baad checkpoint"],["            if (i == 9) break;","e9 ke baad crash: checkpoint ke baad wale events ka state lost"],["        }",""],["        crashy.restore(checkpoint);",""],["        for (int i = crashy.processedOffset; i < stream.size(); i++) crashy.process(stream.get(i));","Checkpoint offset se replay"],["        System.out.println(\"after crash + restore + replay, sink equal to no-crash run? \" + crashy.sink.equals(job.sink));",""],["    }",""],["}",""]]},"TokenAuthDemo":{"file":"TokenAuthDemo.java","lines":[["import java.nio.charset.StandardCharsets;",""],["import java.security.GeneralSecurityException;",""],["import java.security.MessageDigest;",""],["import java.util.Base64;",""],["import java.util.HashMap;",""],["import java.util.LinkedHashMap;",""],["import java.util.Map;",""],["import java.util.Set;",""],["import java.util.regex.Matcher;",""],["import java.util.regex.Pattern;",""],["import javax.crypto.Mac;",""],["import javax.crypto.spec.SecretKeySpec;",""],["",""],["public class TokenAuthDemo {","Learning demo: production me tested library (Nimbus JOSE, jjwt, Spring Security) use karo"],["",""],["    record Claims(String userId, String tenantId, Set<String> roles, long expiresAt) {}",""],["",""],["    static final class TokenService {",""],["        private final Map<String, byte[]> keys = new LinkedHashMap<>();","Key ring: kid -> secret; rotation ke liye kai keys ek saath"],["        private String activeKid;",""],["",""],["        void addKey(String kid, String secret) {",""],["            keys.put(kid, secret.getBytes(StandardCharsets.UTF_8));",""],["            activeKid = kid;","Naya token naye key se sign; purane tokens purane key se verify hote rahenge"],["        }",""],["",""],["        void retireKey(String kid) { keys.remove(kid); }","Purane key ke saare tokens ab invalid"],["",""],["        String issueAccessToken(String userId, String tenantId, Set<String> roles, long nowSec, long ttlSec) {",""],["            String header = b64(\"{\\\"alg\\\":\\\"HS256\\\",\\\"kid\\\":\\\"\" + activeKid + \"\\\"}\");",""],["            String payload = b64(\"{\\\"sub\\\":\\\"\" + userId + \"\\\",\\\"tenant\\\":\\\"\" + tenantId + \"\\\",\\\"roles\\\":\\\"\" + String.join(\",\", roles)",""],["                    + \"\\\",\\\"exp\\\":\" + (nowSec + ttlSec) + \"}\");","Short TTL (5-15 min): token leak hua to bhi thodi der"],["            return header + \".\" + payload + \".\" + sign(activeKid, header + \".\" + payload);",""],["        }",""],["",""],["        Claims verify(String token, long nowSec) {",""],["            String[] parts = token.split(\"\\\\.\");",""],["            if (parts.length != 3) throw new SecurityException(\"401 malformed token\");",""],["            String kid = field(unb64(parts[0]), \"kid\");",""],["            if (!keys.containsKey(kid)) throw new SecurityException(\"401 unknown key \" + kid);","Retired key: reject"],["            byte[] expected = sign(kid, parts[0] + \".\" + parts[1]).getBytes(StandardCharsets.UTF_8);",""],["            if (!MessageDigest.isEqual(expected, parts[2].getBytes(StandardCharsets.UTF_8))) {","Constant-time compare"],["                throw new SecurityException(\"401 bad signature\");","Payload me tenant/role badla to signature match nahi karega"],["            }",""],["            String json = unb64(parts[1]);",""],["            long exp = Long.parseLong(field(json, \"exp\"));",""],["            if (nowSec >= exp) throw new SecurityException(\"401 token expired\");",""],["            return new Claims(field(json, \"sub\"), field(json, \"tenant\"), Set.of(field(json, \"roles\").split(\",\")), exp);","Verify local hai: har request pe DB/auth server call nahi (stateless)"],["        }",""],["",""],["        private String sign(String kid, String data) {",""],["            try {",""],["                Mac mac = Mac.getInstance(\"HmacSHA256\");",""],["                mac.init(new SecretKeySpec(keys.get(kid), \"HmacSHA256\"));",""],["                return Base64.getUrlEncoder().withoutPadding().encodeToString(mac.doFinal(data.getBytes(StandardCharsets.UTF_8)));",""],["            } catch (GeneralSecurityException e) {",""],["                throw new IllegalStateException(e);",""],["            }",""],["        }",""],["",""],["        private static String b64(String s) { return Base64.getUrlEncoder().withoutPadding().encodeToString(s.getBytes(StandardCharsets.UTF_8)); }",""],["",""],["        private static String unb64(String s) { return new String(Base64.getUrlDecoder().decode(s), StandardCharsets.UTF_8); }",""],["",""],["        private static String field(String json, String name) {","Sirf demo parser: real JSON parser use karo"],["            Matcher m = Pattern.compile(\"\\\"\" + name + \"\\\":\\\"?([^\\\",}]*)\").matcher(json);",""],["            if (!m.find()) throw new SecurityException(\"401 missing \" + name);",""],["            return m.group(1);",""],["        }",""],["    }",""],["",""],["    record Order(String orderId, String tenantId, String ownerId, long amountPaise) {}",""],["",""],["    static final class OrderApi {",""],["        private final TokenService tokens;",""],["        private final Map<String, Order> orders = new HashMap<>();",""],["",""],["        OrderApi(TokenService tokens) { this.tokens = tokens; }",""],["",""],["        void seed(Order o) { orders.put(o.orderId(), o); }",""],["",""],["        String getOrder(String bearerToken, String orderId, long nowSec) {",""],["            Claims claims;",""],["            try {",""],["                claims = tokens.verify(bearerToken, nowSec);","1) AuthN: tum kaun ho?"],["            } catch (SecurityException e) {",""],["                return e.getMessage();",""],["            }",""],["            Order order = orders.get(orderId);",""],["            if (order == null || !order.tenantId().equals(claims.tenantId())) {","2) Tenant isolation: doosre tenant ka data exist hi nahi karta (404, 403 nahi: existence leak nahi)"],["                return \"404 not found\";",""],["            }",""],["            boolean allowed = claims.roles().contains(\"ADMIN\") || order.ownerId().equals(claims.userId());","3) Object-level AuthZ (BOLA fix): owner ya admin hi dekh sake"],["            return allowed ? \"200 \" + order : \"403 forbidden\";",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        TokenService tokens = new TokenService();",""],["        tokens.addKey(\"k1\", \"first-secret-key-from-kms\");",""],["        OrderApi api = new OrderApi(tokens);",""],["        api.seed(new Order(\"ord-1\", \"acme\", \"u-asha\", 49_900));",""],["        api.seed(new Order(\"ord-2\", \"acme\", \"u-ravi\", 15_000));",""],["        api.seed(new Order(\"ord-9\", \"globex\", \"u-zoya\", 99_000));",""],["",""],["        long now = 1_000_000;",""],["        String asha = tokens.issueAccessToken(\"u-asha\", \"acme\", Set.of(\"USER\"), now, 900);",""],["        System.out.println(\"asha -> own order      : \" + api.getOrder(asha, \"ord-1\", now));",""],["        System.out.println(\"asha -> ravi's order   : \" + api.getOrder(asha, \"ord-2\", now));","ID badal ke doosre ka order: BOLA attack"],["        System.out.println(\"asha -> other tenant   : \" + api.getOrder(asha, \"ord-9\", now));",""],["",""],["        String[] p = asha.split(\"\\\\.\");",""],["        String forgedPayload = Base64.getUrlEncoder().withoutPadding().encodeToString(",""],["                new String(Base64.getUrlDecoder().decode(p[1]), StandardCharsets.UTF_8).replace(\"USER\", \"ADMIN\").getBytes(StandardCharsets.UTF_8));",""],["        System.out.println(\"forged ADMIN role      : \" + api.getOrder(p[0] + \".\" + forgedPayload + \".\" + p[2], \"ord-2\", now));",""],["        System.out.println(\"after 16 minutes       : \" + api.getOrder(asha, \"ord-1\", now + 960));",""],["",""],["        String admin = tokens.issueAccessToken(\"u-meera\", \"acme\", Set.of(\"ADMIN\"), now, 900);",""],["        System.out.println(\"acme admin -> ravi's   : \" + api.getOrder(admin, \"ord-2\", now));",""],["        tokens.addKey(\"k2\", \"rotated-secret-key-from-kms\");","Key rotation: k2 active, k1 abhi bhi verify karta hai"],["        System.out.println(\"old k1 token after rotation: \" + api.getOrder(asha, \"ord-1\", now + 10));",""],["        tokens.retireKey(\"k1\");",""],["        System.out.println(\"after k1 retired       : \" + api.getOrder(asha, \"ord-1\", now + 20));",""],["    }",""],["}",""]]},"UrlShortenerDemo":{"file":"UrlShortenerDemo.java","lines":[["import java.time.Duration;",""],["import java.time.Instant;",""],["import java.util.Collections;",""],["import java.util.LinkedHashMap;",""],["import java.util.Map;",""],["import java.util.Optional;",""],["import java.util.concurrent.ConcurrentHashMap;",""],["import java.util.concurrent.ConcurrentLinkedQueue;",""],["import java.util.concurrent.atomic.AtomicLong;",""],["",""],["public class UrlShortenerDemo {",""],["",""],["    static final class Base62Codec {",""],["        private static final String ALPHABET = \"0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\";","62 characters: 7 chars me 62^7 ≈ 3.5 trillion codes"],["",""],["        static String encode(long id) {",""],["            if (id == 0) return \"0\";",""],["            StringBuilder code = new StringBuilder();",""],["            while (id > 0) {",""],["                code.append(ALPHABET.charAt((int) (id % 62)));","Base conversion: remainder = agla digit"],["                id /= 62;",""],["            }",""],["            return code.reverse().toString();","Digits ulte order me bane, isliye reverse"],["        }",""],["",""],["        static long decode(String code) {",""],["            long id = 0;",""],["            for (char c : code.toCharArray()) id = id * 62 + ALPHABET.indexOf(c);","Ulta process: code se wapas number (debugging / sharding ke liye)"],["            return id;",""],["        }",""],["    }",""],["",""],["    static final class RangeIdAllocator {","Har app server central counter se 1000 IDs ki range leta hai: har ID pe network call nahi"],["        private static final long RANGE_SIZE = 1_000;",""],["        private final AtomicLong globalCounter;","Real system me ZooKeeper / DB sequence; yahan AtomicLong se simulate"],["        private long next;",""],["        private long end;",""],["",""],["        RangeIdAllocator(AtomicLong globalCounter) {",""],["            this.globalCounter = globalCounter;",""],["            fetchNewRange();",""],["        }",""],["",""],["        synchronized long nextId() {",""],["            if (next >= end) fetchNewRange();","Range khatam to nayi range lo (1000 me ek baar)"],["            return next++;",""],["        }",""],["",""],["        private void fetchNewRange() {",""],["            long start = globalCounter.getAndAdd(RANGE_SIZE);","Atomic: do servers ko kabhi same range nahi milti"],["            next = start;",""],["            end = start + RANGE_SIZE;","Server crash = bachi range waste; 3.5 trillion me ye gaps chalte hain"],["        }",""],["    }",""],["",""],["    record UrlRecord(String code, String longUrl, Instant expiresAt) {","Immutable record = DB row ka Java roop"],["        boolean isExpired(Instant now) { return expiresAt != null && now.isAfter(expiresAt); }",""],["    }",""],["",""],["    static final class LruCache<K, V> extends LinkedHashMap<K, V> {","Quick LRU: LinkedHashMap(accessOrder = true); yahan Redis ka stand-in"],["        private final int capacity;",""],["",""],["        LruCache(int capacity) {",""],["            super(16, 0.75f, true);",""],["            this.capacity = capacity;",""],["        }",""],["",""],["        @Override",""],["        protected boolean removeEldestEntry(Map.Entry<K, V> eldest) { return size() > capacity; }","Capacity cross hote hi least-recently-used entry evict"],["    }",""],["",""],["    static final class UrlShortenerService {",""],["        private final Map<String, UrlRecord> database = new ConcurrentHashMap<>();","DB stand-in: code -> record (real: DynamoDB/Cassandra, partition key = code)"],["        private final Map<String, UrlRecord> cache = Collections.synchronizedMap(new LruCache<>(10_000));","synchronizedMap kyunki LinkedHashMap khud thread-safe nahi"],["        private final ConcurrentLinkedQueue<String> clickEvents = new ConcurrentLinkedQueue<>();","Kafka stand-in: clicks async analytics ke liye"],["        private final RangeIdAllocator idAllocator;",""],["",""],["        UrlShortenerService(RangeIdAllocator idAllocator) { this.idAllocator = idAllocator; }",""],["",""],["        String shortenUrl(String longUrl, String customAlias, Duration ttl) {","WRITE path: long URL -> short code"],["            validateUrl(longUrl);",""],["            String code = customAlias != null ? customAlias : Base62Codec.encode(idAllocator.nextId());","Alias diya to wahi, warna counter -> base62 (collision-free)"],["            Instant expiresAt = ttl == null ? null : Instant.now().plus(ttl);",""],["            UrlRecord record = new UrlRecord(code, longUrl, expiresAt);",""],["            if (database.putIfAbsent(code, record) != null) {","putIfAbsent = DB ka conditional insert: alias pehle se liya hua ho to fail"],["                throw new IllegalArgumentException(\"Alias already taken: \" + code);",""],["            }",""],["            cache.put(code, record);","Cache warm: naya link aksar turant share aur click hota hai"],["            return \"https://sho.rt/\" + code;",""],["        }",""],["",""],["        Optional<String> resolveShortCode(String code) {","READ path (hot): code -> long URL; writes se ~100x zyada calls"],["            UrlRecord record = cache.get(code);","1) Cache-aside: pehle cache"],["            if (record == null) {",""],["                record = database.get(code);","2) Miss: DB / read replica se"],["                if (record == null) return Optional.empty();","Nahi mila = 404 (real me negative cache ya Bloom filter se DB bachao)"],["                cache.put(code, record);","3) Cache fill, taaki agla read fast ho"],["            }",""],["            if (record.isExpired(Instant.now())) {","Lazy expiry: read ke time expired mila to hata do"],["                deleteShortUrl(code);",""],["                return Optional.empty();",""],["            }",""],["            recordClickAsync(code);",""],["            return Optional.of(record.longUrl());",""],["        }",""],["",""],["        void updateTargetUrl(String code, String newLongUrl) {","UPDATE: pehle DB, phir cache invalidate"],["            validateUrl(newLongUrl);",""],["            database.computeIfPresent(code, (key, old) -> new UrlRecord(key, newLongUrl, old.expiresAt()));","Atomic update DB me"],["            cache.remove(code);","Cache DELETE (update nahi): agla read DB se fresh bharega"],["        }",""],["",""],["        void deleteShortUrl(String code) {",""],["            database.remove(code);",""],["            cache.remove(code);",""],["        }",""],["",""],["        private void recordClickAsync(String code) {",""],["            clickEvents.offer(code + \"@\" + Instant.now().toEpochMilli());","Redirect analytics ka wait nahi karta: event queue me, worker baad me count karega"],["        }",""],["",""],["        int pendingClickEvents() { return clickEvents.size(); }",""],["",""],["        private static void validateUrl(String url) {",""],["            if (url == null || !(url.startsWith(\"http://\") || url.startsWith(\"https://\"))) {",""],["                throw new IllegalArgumentException(\"Invalid URL: \" + url);","Sirf http/https allow: javascript: jaise abuse links block"],["            }",""],["        }",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        AtomicLong zookeeperCounter = new AtomicLong(100_000_000L);","Counter 10 crore se shuru: codes 5 chars ke, sequence kam obvious"],["        UrlShortenerService service = new UrlShortenerService(new RangeIdAllocator(zookeeperCounter));",""],["",""],["        String first = service.shortenUrl(\"https://www.amazon.in/dp/B0C1234567?ref=summer-sale\", null, Duration.ofDays(30));",""],["        String alias = service.shortenUrl(\"https://example.com/launch\", \"launch\", null);",""],["        System.out.println(first + \" , \" + alias);",""],["",""],["        String code = first.substring(first.lastIndexOf('/') + 1);",""],["        System.out.println(\"decode(\" + code + \") = \" + Base62Codec.decode(code));",""],["        System.out.println(\"resolve -> \" + service.resolveShortCode(code).orElse(\"404\"));",""],["        service.updateTargetUrl(code, \"https://www.amazon.in/dp/B0C7654321\");",""],["        System.out.println(\"after update -> \" + service.resolveShortCode(code).orElse(\"404\"));",""],["        System.out.println(\"unknown -> \" + service.resolveShortCode(\"zzzz\").orElse(\"404\"));",""],["        try {",""],["            service.shortenUrl(\"https://other.com\", \"launch\", null);",""],["        } catch (IllegalArgumentException e) {",""],["            System.out.println(e.getMessage());",""],["        }",""],["        System.out.println(\"click events queued = \" + service.pendingClickEvents());",""],["    }",""],["}",""]]},"VideoPipelineDemo":{"file":"VideoPipelineDemo.java","lines":[["import java.util.ArrayList;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.TreeMap;",""],["import java.util.stream.IntStream;",""],["",""],["public class VideoPipelineDemo {",""],["",""],["    static final class ResumableUpload {","S3 multipart jaisa: bada video parts me; network toote to sirf missing parts dobara"],["        final String uploadId;",""],["        final int totalParts;",""],["        private final Map<Integer, Integer> receivedChecksums = new TreeMap<>();",""],["",""],["        ResumableUpload(String uploadId, int totalParts) {",""],["            this.uploadId = uploadId;",""],["            this.totalParts = totalParts;",""],["        }",""],["",""],["        boolean uploadPart(int partNo, byte[] data, boolean networkDrops) {",""],["            if (networkDrops) return false;","Mobile network gaya: ye part fail"],["            receivedChecksums.put(partNo, java.util.Arrays.hashCode(data));","Har part ka checksum: corrupted part pakda jaata hai"],["            return true;",""],["        }",""],["",""],["        List<Integer> missingParts() {",""],["            return IntStream.rangeClosed(1, totalParts).filter(p -> !receivedChecksums.containsKey(p)).boxed().toList();",""],["        }",""],["",""],["        boolean complete() { return missingParts().isEmpty(); }","Saare parts aa gaye: server assemble karke \"uploaded\" event bhejta hai"],["    }",""],["",""],["    record Rendition(String name, int height, int bitrateKbps) {}",""],["",""],["    static final List<Rendition> LADDER = List.of(","Bitrate ladder: har device/network ke liye ek option"],["            new Rendition(\"240p\", 240, 400), new Rendition(\"360p\", 360, 800),",""],["            new Rendition(\"720p\", 720, 2_500), new Rendition(\"1080p\", 1_080, 5_000));",""],["",""],["    static final class TranscodeDag {","Split → (segment × rendition) parallel tasks → package → publish"],["        private final Map<String, String> taskStatus = new LinkedHashMap<>();",""],["        private final String videoId;",""],["",""],["        TranscodeDag(String videoId, int durationSec, int segmentSec) {",""],["            this.videoId = videoId;",""],["            int segments = (int) Math.ceil(durationSec / (double) segmentSec);",""],["            for (int s = 0; s < segments; s++) {",""],["                for (Rendition r : LADDER) taskStatus.put(\"seg\" + s + \"/\" + r.name(), \"PENDING\");","Har task independent: 1000 workers pe parallel, 2 ghante ka video minutes me"],["            }",""],["        }",""],["",""],["        int runAll(String crashOnTask) {",""],["            int attempts = 0;",""],["            for (Map.Entry<String, String> task : taskStatus.entrySet()) {",""],["                attempts++;",""],["                if (task.getKey().equals(crashOnTask)) {","Worker crash: task ka lease expire, queue me wapas"],["                    attempts++;","Retry; output path deterministic (videoId/seg/rendition) isliye retry idempotent"],["                }",""],["                task.setValue(\"DONE\");",""],["            }",""],["            return attempts;",""],["        }",""],["",""],["        boolean allDone() { return taskStatus.values().stream().allMatch(\"DONE\"::equals); }",""],["",""],["        String masterPlaylist() {","HLS master manifest: player isse rendition chunta hai"],["            StringBuilder sb = new StringBuilder(\"#EXTM3U\\n\");",""],["            for (Rendition r : LADDER) {",""],["                sb.append(\"#EXT-X-STREAM-INF:BANDWIDTH=\").append(r.bitrateKbps() * 1000).append(\",RESOLUTION=\").append(r.height() * 16 / 9).append('x').append(r.height()).append('\\n');",""],["                sb.append(videoId).append('/').append(r.name()).append(\"/index.m3u8\\n\");",""],["            }",""],["            return sb.toString();",""],["        }",""],["",""],["        int taskCount() { return taskStatus.size(); }",""],["    }",""],["",""],["    static Rendition chooseRendition(double measuredKbps, double bufferSec) {","Adaptive bitrate (ABR): har segment se pehle decide"],["        double safety = bufferSec < 5 ? 0.5 : 0.8;","Buffer kam = zyada conservative (rebuffering sabse bura UX)"],["        Rendition best = LADDER.get(0);",""],["        for (Rendition r : LADDER) if (r.bitrateKbps() <= measuredKbps * safety) best = r;",""],["        return best;",""],["    }",""],["",""],["    public static void main(String[] args) {",""],["        ResumableUpload upload = new ResumableUpload(\"up-77\", 5);",""],["        for (int p = 1; p <= 5; p++) upload.uploadPart(p, new byte[]{(byte) p}, p == 3);","Part 3 network drop"],["        System.out.println(\"missing after first pass: \" + upload.missingParts());",""],["        upload.missingParts().forEach(p -> upload.uploadPart(p, new byte[]{(byte) (int) p}, false));","Resume: sirf part 3"],["        System.out.println(\"upload complete? \" + upload.complete());",""],["",""],["        TranscodeDag dag = new TranscodeDag(\"v42\", 12, 4);",""],["        int attempts = dag.runAll(\"seg1/720p\");",""],["        System.out.println(\"transcode tasks \" + dag.taskCount() + \", attempts \" + attempts + \" (1 retry), all done? \" + dag.allDone());",""],["        System.out.print(dag.masterPlaylist());",""],["",""],["        double buffer = 0;",""],["        double[] bandwidthKbps = {6_000, 6_000, 1_500, 900, 3_500};",""],["        for (double bw : bandwidthKbps) {","Har segment 4s ka; download time = bitrate × 4 / bandwidth"],["            Rendition r = chooseRendition(bw, buffer);",""],["            double downloadSec = r.bitrateKbps() * 4.0 / bw;",""],["            buffer = Math.max(0, buffer - downloadSec) + 4;",""],["            System.out.printf(\"bandwidth %5.0f kbps -> %-5s buffer %.1fs%n\", bw, r.name(), buffer);",""],["        }",""],["        List<String> notes = new ArrayList<>(List.of(\"segments immutable => CDN cache forever\", \"manifest short TTL for live\"));",""],["        System.out.println(notes);",""],["    }",""],["}",""]]},"WebCrawlerDemo":{"file":"WebCrawlerDemo.java","lines":[["import java.net.URI;",""],["import java.net.URISyntaxException;",""],["import java.nio.charset.StandardCharsets;",""],["import java.security.MessageDigest;",""],["import java.security.NoSuchAlgorithmException;",""],["import java.util.ArrayDeque;",""],["import java.util.ArrayList;",""],["import java.util.BitSet;",""],["import java.util.Deque;",""],["import java.util.HashMap;",""],["import java.util.HashSet;",""],["import java.util.HexFormat;",""],["import java.util.LinkedHashMap;",""],["import java.util.List;",""],["import java.util.Map;",""],["import java.util.Optional;",""],["import java.util.Set;",""],["",""],["public class WebCrawlerDemo {",""],["",""],["    static Optional<String> normalizeUrl(String base, String href) {","Ek page ke kai URL roop: normalize karke ek banao (warna same page baar baar crawl)"],["        try {",""],["            URI u = new URI(base).resolve(href.trim());","Relative link (\"/world\") ko absolute banao"],["            String scheme = u.getScheme() == null ? \"\" : u.getScheme().toLowerCase();",""],["            if (!scheme.equals(\"http\") && !scheme.equals(\"https\")) return Optional.empty();","mailto:, javascript: wagairah skip"],["            if (u.getHost() == null) return Optional.empty();",""],["            int port = u.getPort();",""],["            boolean defaultPort = port == -1 || (scheme.equals(\"http\") && port == 80) || (scheme.equals(\"https\") && port == 443);",""],["            String path = (u.getRawPath() == null || u.getRawPath().isEmpty()) ? \"/\" : u.getRawPath();",""],["            String query = u.getRawQuery() == null ? \"\" : \"?\" + u.getRawQuery();",""],["            return Optional.of(scheme + \"://\" + u.getHost().toLowerCase() + (defaultPort ? \"\" : \":\" + port) + path + query);","Fragment (#top) hata diya: server ko kabhi jaata hi nahi"],["        } catch (URISyntaxException e) {",""],["            return Optional.empty();",""],["        }",""],["    }",""],["",""],["    static String hostOf(String url) { return URI.create(url).getHost(); }",""],["",""],["    static final class SeenUrlFilter {","Bloom filter: arabon URLs ke liye \"dekha hai?\" bahut kam memory me"],["        private final BitSet bits = new BitSet(1 << 16);",""],["",""],["        boolean addIfNew(String url) {",""],["            int h1 = url.hashCode(), h2 = (h1 >>> 15) | 1;",""],["            boolean seen = true;",""],["            for (int i = 0; i < 4; i++) {",""],["                int idx = Math.floorMod(h1 + i * h2, 1 << 16);",""],["                if (!bits.get(idx)) seen = false;",""],["                bits.set(idx);",""],["            }",""],["            return !seen;","False positive = kabhi kabhi naya URL skip ho jaayega; crawler ke liye acceptable tradeoff"],["        }",""],["    }",""],["",""],["    record FrontierEntry(String url, int depth) {}",""],["",""],["    static final class PoliteFrontier {","Per-host queues: ek site pe ek time pe ek request, beech me delay"],["        private final Map<String, Deque<FrontierEntry>> queuesByHost = new LinkedHashMap<>();",""],["        private final Map<String, Long> nextAllowedAtMs = new HashMap<>();",""],["        private final long crawlDelayMs;",""],["",""],["        PoliteFrontier(long crawlDelayMs) { this.crawlDelayMs = crawlDelayMs; }",""],["",""],["        void add(FrontierEntry e) { queuesByHost.computeIfAbsent(hostOf(e.url()), h -> new ArrayDeque<>()).add(e); }",""],["",""],["        Optional<FrontierEntry> next(long nowMs) {",""],["            for (Map.Entry<String, Deque<FrontierEntry>> q : queuesByHost.entrySet()) {",""],["                if (!q.getValue().isEmpty() && nextAllowedAtMs.getOrDefault(q.getKey(), 0L) <= nowMs) {","Is host ka delay poora: iska URL lo; warna doosre host pe kaam (fetchers idle nahi)"],["                    nextAllowedAtMs.put(q.getKey(), nowMs + crawlDelayMs);",""],["                    return Optional.of(q.getValue().poll());",""],["                }",""],["            }",""],["            return Optional.empty();",""],["        }",""],["",""],["        long nextReadyAtMs() {",""],["            long min = Long.MAX_VALUE;",""],["            for (Map.Entry<String, Deque<FrontierEntry>> q : queuesByHost.entrySet()) {",""],["                if (!q.getValue().isEmpty()) min = Math.min(min, nextAllowedAtMs.getOrDefault(q.getKey(), 0L));",""],["            }",""],["            return min;",""],["        }",""],["    }",""],["",""],["    record Page(String html, List<String> links) {}",""],["",""],["    static final class FakeWeb {","Internet ka stand-in; cal.example.net ek \"spider trap\" hai (infinite calendar)"],["        Optional<Page> fetch(String url) {",""],["            if (url.startsWith(\"https://cal.example.net/day/\")) {",""],["                int day = Integer.parseInt(url.substring(url.lastIndexOf('/') + 1));",""],["                return Optional.of(new Page(\"calendar day \" + day, List.of(\"/day/\" + (day + 1))));",""],["            }",""],["            return Optional.ofNullable(PAGES.get(url));",""],["        }",""],["",""],["        static final Map<String, Page> PAGES = Map.of(",""],["                \"https://news.example.com/\", new Page(\"<h1>News home<\/h1>\", List.of(\"/world\", \"/sports\", \"/world#top\", \"/admin/panel\", \"https://blog.example.org/\", \"mailto:editor@example.com\")),",""],["                \"https://news.example.com/world\", new Page(\"<h1>World<\/h1>\", List.of(\"/\", \"https://NEWS.example.com:443/sports\")),",""],["                \"https://news.example.com/sports\", new Page(\"<h1>Sports<\/h1>\", List.of(\"/world\")),",""],["                \"https://blog.example.org/\", new Page(\"<h1>Blog<\/h1>\", List.of(\"/post/1\", \"/post/1-amp\", \"https://cal.example.net/day/1\")),",""],["                \"https://blog.example.org/post/1\", new Page(\"<p>Same article text<\/p>\", List.of()),",""],["                \"https://blog.example.org/post/1-amp\", new Page(\"<p>Same article text<\/p>\", List.of()));","Alag URL, same content (AMP/mirror)"],["    }",""],["",""],["    static final class Crawler {",""],["        static final int MAX_DEPTH = 4;",""],["        static final int MAX_PAGES_PER_HOST = 3;","Spider trap guard: ek host se limited pages per crawl cycle"],["        private final PoliteFrontier frontier = new PoliteFrontier(1_000);",""],["        private final SeenUrlFilter seenUrls = new SeenUrlFilter();",""],["        private final Set<String> seenContentHashes = new HashSet<>();","Exact dup content; near-dup ke liye simhash"],["        private final Map<String, Integer> pagesPerHost = new HashMap<>();",""],["        private final Map<String, List<String>> robotsDisallow = Map.of(\"news.example.com\", List.of(\"/admin\"));","robots.txt (host-wise cached)"],["        private final FakeWeb web = new FakeWeb();",""],["        final List<String> stored = new ArrayList<>();",""],["        final List<String> log = new ArrayList<>();",""],["",""],["        void seed(String url) {",""],["            normalizeUrl(url, url).ifPresent(u -> { seenUrls.addIfNew(u); frontier.add(new FrontierEntry(u, 0)); });",""],["        }",""],["",""],["        void crawl(int maxFetches) {",""],["            long nowMs = 0;",""],["            int fetches = 0;",""],["            while (fetches < maxFetches) {",""],["                Optional<FrontierEntry> next = frontier.next(nowMs);",""],["                if (next.isEmpty()) {",""],["                    long ready = frontier.nextReadyAtMs();",""],["                    if (ready == Long.MAX_VALUE) break;","Frontier khaali: crawl khatam"],["                    nowMs = ready;","Sab hosts politeness delay me: intezaar"],["                    continue;",""],["                }",""],["                FrontierEntry e = next.get();",""],["                String host = hostOf(e.url());",""],["
