*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#E7EAEE; --panel:#fff; --ink:#161B22; --ink2:#5B6472; --ink3:#8A939F;
  --rule:#CFD5DD; --rule2:#E3E7EC;
  --volt:#3A2BC4; --volt-bg:#ECEAFB; --volt-dk:#241B7A;
  --flag:#A93412; --flag-bg:#FAEBE4; --flag-dk:#6E220C;
  --good:#0B6E5B; --good-bg:#E1F0EC; --good-dk:#084A3D;
  --sans:Archivo,"Segoe UI",system-ui,sans-serif;
  --mono:PlexMono,"SF Mono",Consolas,monospace;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.62;font-weight:400}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--rule)}
.brand{max-width:1180px;margin:0 auto;padding:18px 22px 12px}
.brand h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.015em}
.brand p{margin:3px 0 0;font-size:14px;color:var(--ink2)}
.railwrap{max-width:1180px;margin:0 auto;padding:0 22px}
.rail{display:flex;gap:0;overflow-x:auto;scrollbar-width:thin}
.rail-i{flex:0 0 auto;display:flex;align-items:flex-start;gap:9px;
  padding:11px 13px 13px;background:none;border:0;border-bottom:2px solid transparent;
  cursor:pointer;font-family:inherit;text-align:left;color:var(--ink2)}
.rail-i:hover{color:var(--ink)}
.rail-n{margin-right:9px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--ink3);line-height:1.35}
.rail-t{display:block;font-size:14px;font-weight:500;line-height:1.35;
  color:inherit;white-space:nowrap}
.rail-k{display:block;font-size:12.5px;color:var(--ink3);line-height:1.35}
.rail-i[aria-selected="true"]{color:var(--volt);border-bottom-color:var(--volt)}
.rail-i[aria-selected="true"] .rail-n,.rail-i[aria-selected="true"] .rail-k{color:var(--volt)}
.rail-i:focus-visible{outline:2px solid var(--volt);outline-offset:-2px}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;
  flex-wrap:wrap;align-items:flex-start}
.side{flex:0 0 252px;margin-right:34px}
.body{flex:1 1 0%;min-width:0}
@supports (display:grid){
  .shell{display:grid;grid-template-columns:252px minmax(0,1fr);gap:34px}
  .side{margin-right:0}
}
.side{position:sticky;top:132px;padding:26px 0 40px}
.side-h{font-size:13.5px;color:var(--ink3);margin:0 0 9px;padding-left:11px}
.side-i{display:block;width:100%;text-align:left;background:none;border:0;
  border-radius:6px;padding:7px 11px;margin-bottom:1px;cursor:pointer;
  font-family:inherit;font-size:14.5px;line-height:1.4;color:var(--ink2)}
.side-i:hover{background:#DDE1E7;color:var(--ink)}
.side-i[aria-current="true"]{background:var(--volt-bg);color:var(--volt-dk);font-weight:500}
.side-i:focus-visible{outline:2px solid var(--volt);outline-offset:1px}
.side-all{border-bottom:1px solid var(--rule);border-radius:6px 6px 0 0;
  padding-bottom:9px;margin-bottom:7px}
.side-mock{border-top:1px solid var(--rule);border-radius:0 0 6px 6px;
  padding-top:9px;margin-top:7px}

.body{padding:26px 0 90px;min-width:0}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  padding:26px 30px 32px}
.lede{margin:0 0 24px;padding-bottom:20px;border-bottom:1px solid var(--rule2)}
.lede h2{margin:0 0 5px;font-size:23px;font-weight:600;letter-spacing:-.015em}
.lede p{margin:0;color:var(--ink2);font-size:15px;max-width:66ch}

/* ---------- content ---------- */
.sec{scroll-margin-top:140px}
.sec + .sec{margin-top:38px;padding-top:32px;border-top:1px solid var(--rule2)}
.sec-h{margin:0 0 16px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.body h3{margin:26px 0 9px;font-size:16px;font-weight:600}
.body h3:first-child{margin-top:0}
.body p{margin:0 0 13px;max-width:70ch}
.bul,.num{margin:0 0 15px;padding-left:21px;max-width:70ch}
.bul li,.num li{margin-bottom:7px}
.bul{list-style:square}
.num li::marker{font-weight:600;color:var(--volt)}
code.ic{font-family:var(--mono);font-size:.855em;background:#EEF1F4;
  border:1px solid var(--rule2);border-radius:3px;padding:1px 4px;
  word-break:break-word}
.code{margin:0 0 17px;background:#F4F6F9;border:1px solid var(--rule2);
  border-radius:5px;padding:14px 16px;overflow-x:auto}
.code code{font-family:var(--mono);font-size:13px;line-height:1.62;
  white-space:pre;color:#232A33}

/* callouts: left rule, square corners - deliberately not cards */
.note{margin:0 0 17px;padding:11px 0 11px 15px;border-left:3px solid;max-width:70ch}
.note-t{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.note-b{font-size:15px}
.note-b p{margin:0 0 8px}.note-b p:last-child{margin:0}
.note.warn{border-color:var(--flag);background:var(--flag-bg)}
.note.warn .note-t{color:var(--flag-dk)}
.note.good{border-color:var(--good);background:var(--good-bg)}
.note.good .note-t{color:var(--good-dk)}
.note.say{border-color:var(--volt);background:var(--volt-bg)}

.rf{margin:0 0 18px}
.rf-i{padding:12px 0;border-bottom:1px solid var(--rule2)}
.rf-i:first-child{border-top:1px solid var(--rule2)}
.rf-q{margin:0 0 4px;font-weight:600;font-size:15.5px;max-width:70ch}
.rf-a{margin:0;font-size:15.5px;max-width:70ch}
.rf-f{margin:7px 0 0;font-size:14.5px;color:var(--ink2);padding-left:13px;

.tbl td:last-child,.tbl th:last-child{padding-right:0}

.dia-svg .ts{font-size:12px;font-weight:400;fill:var(--ink2)}

.n-rust .th{fill:#6E220C}.n-rust .ts{fill:#A93412}
.dia-svg .grp{fill:none;stroke:#AEB6C1;stroke-dasharray:4 4}
.dia-svg .fill-volt{fill:#C6BFF3;stroke:#3A2BC4}
.dia-svg .arr{stroke:#6B7482;stroke-width:1.4;fill:none}

.mock-top{display:flex;justify-content:space-between;align-items:baseline;
  gap:14px;margin-bottom:14px;flex-wrap:wrap}
.mock-top p{margin:0;color:var(--ink2);font-size:14.5px}
.revealer{background:none;border:1px solid var(--rule);border-radius:6px;
  padding:5px 12px;font-family:inherit;font-size:14px;color:var(--ink2);cursor:pointer}
.revealer:hover{border-color:var(--ink3);color:var(--ink)}
.mock{border-top:1px solid var(--rule2)}
.mock:last-of-type{border-bottom:1px solid var(--rule2)}
.mock-q{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;padding:14px 0;cursor:pointer;font-family:inherit;color:var(--ink)}
.mock-q:hover .mock-qt{color:var(--volt)}
.mock-q:focus-visible{outline:2px solid var(--volt);outline-offset:-2px}
.mock-tag{margin-right:12px;flex:0 0 auto;font-size:12.5px;color:var(--volt-dk);background:var(--volt-bg);
  border-radius:4px;padding:2px 8px;line-height:1.5}
.mock-qt{font-size:15.5px;font-weight:500;line-height:1.5}
.mock-mark{margin-left:auto;flex:0 0 auto;color:var(--ink3);font-size:15px;
  font-variant-numeric:tabular-nums}
.mock-a{padding:0 0 18px 0;max-width:70ch}
.mock-a p{margin:0 0 11px;font-size:15.5px}
.mock-a p:last-child{margin:0}
.mock-a{border-left:3px solid var(--good);padding-left:15px;margin-bottom:16px}

.foot{max-width:1180px;margin:0 auto;padding:0 22px 60px;color:var(--ink3);font-size:13.5px}

@media (max-width:920px){
  .shell{grid-template-columns:1fr;gap:0;padding:0 14px}
  .brand{padding:14px 16px 9px}.brand h1{font-size:19px}
  .railwrap{padding:0 8px}
  .side{position:sticky;top:0;padding:12px 0 10px;background:var(--paper);
    border-bottom:1px solid var(--rule);z-index:10}
  .side-h{display:none}
  .side nav{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
  .side-i{width:auto;flex:0 0 auto;white-space:nowrap;background:var(--panel);
    border:1px solid var(--rule);margin:0;font-size:14px;padding:6px 12px}
  .side-all,.side-mock{border:1px solid var(--rule);border-radius:6px;
    padding:6px 12px;margin:0}
  .body{padding:18px 0 60px}
  .card{padding:18px 16px 26px;border-radius:8px}
  .lede h2{font-size:20px}
  .code code{font-size:12.3px}
  .mock-q{flex-wrap:wrap;gap:8px}
}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fi .18s ease-out}
  @keyframes fi{from{opacity:0}to{opacity:1}}
}

<script>const DATA=JSON.parse("[{\"id\": \"sysdesign\", \"num\": 1, \"kind\": \"System design\", \"title\": \"EV charging platform\", \"blurb\": \"IoT + transaction + payments. Interviewer teen cheez dekhta hai: protocol samajh, stateful connections handle karna, aur paise ka correctness.\", \"sections\": [{\"id\": \"req\", \"title\": \"Requirements aur scale\", \"html\": \"\\u003ch3>Functional\\u003c/h3>\\u003cul class=\\\"bul\\\">\\u003cli>Nearby chargers dhoondho \u2014 location, connector type (CCS2 / Type2 / CHAdeMO), power rating, price ke hisaab se filter\\u003c/li>\\u003cli>Real-time availability \u2014 Available, Occupied, Faulted\\u003c/li>\\u003cli>Slot reserve karna\\u003c/li>\\u003cli>Session start aur stop \u2014 app se, RFID se, ya Plug and Charge se\\u003c/li>\\u003cli>Live monitoring \u2014 kitna kWh gaya, kitna time, kitna paisa\\u003c/li>\\u003cli>Payment aur invoice\\u003c/li>\\u003cli>CPO side: station manage, tariff set, firmware update, health monitor\\u003c/li>\\u003cli>Roaming \u2014 ek network ka user doosre network ke charger pe charge kare\\u003c/li>\\u003c/ul>\\u003ch3>Non-functional\\u003c/h3>\\u003cul class=\\\"bul\\\">\\u003cli>500K chargers, har ek ka persistent connection \u2014 \\u003cb>yahi sabse bada twist hai\\u003c/b>\\u003c/li>\\u003cli>Session start ka p99 2 second se kam\\u003c/li>\\u003cli>Billing me zero data loss \u2014 ek bhi kWh miss nahi hona chahiye\\u003c/li>\\u003cli>Charger network flaky hai (2G/4G SIM) \u2014 offline handling mandatory\\u003c/li>\\u003cli>Availability display eventual consistent chalega, par reservation aur billing strongly consistent hone chahiye\\u003c/li>\\u003c/ul>\\u003ch3>Back of the envelope\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>500K chargers deployed\\nMeter values har 15 sec   -&gt;  500K / 15  =  ~33K msg/sec\\nHeartbeat har 60 sec      -&gt;  500K / 60  =  ~8K  msg/sec\\nPeak concurrent sessions  -&gt;  ~100K\\nDiscovery search          -&gt;  ~500 QPS peak\\nEk session ka data        -&gt;  ~2KB metadata + ~100 meter readings\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Ye loud bolo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Write-heavy telemetry 33K per second hai, aur discovery read-heavy hai. In dono ko \\u003cb>alag scale\\u003c/b> karna padega \u2014 ek hi datastore dono ko theek se serve nahi karega. Ye ek line hi aapko senior dikha deti hai.\\u003c/div>\\u003c/div>\"}, {\"id\": \"arch\", \"title\": \"High level architecture\", \"html\": \"\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 470\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar1\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR1\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>EV charging platform architecture\\u003c/title>\\n\\u003cdesc>Two entry paths \u2014 user app through an API gateway, chargers through a stateful OCPP\\nWebSocket gateway \u2014 converge on core services, which persist to Postgres, Redis and Kafka.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"60\\\" y=\\\"24\\\" width=\\\"200\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"160\\\" y=\\\"47\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\ \\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"303\\\" y=\\\"281\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Reservation\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"303\\\" y=\\\"301\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">Slot booking\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"394\\\" y=\\\"258\\\" width=\\\"150\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"469\\\" y=\\\"281\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Discovery\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"469\\\" y=\\\"301\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">Geo search\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"560\\\" y=\\\"258\\\" width=\\\"138\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"629\\\" y=\\\"281\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Billing\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"629\\\" y=\\\"301\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">Rating, ledger\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"150\\\" y1=\\\"340\\\" x2=\\\"150\\\" y2=\\\"378\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar1)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"380\\\" y1=\\\"340\\\" x2=\\\"380\\\" y2=\\\"378\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar1)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"610\\\" y1=\\\"340\\\" x2=\\\"610\\\" y2=\\\"378\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar1)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"50\\\" y=\\\"382\\\" width=\\\"200\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"150\\\" y=\\\"405\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Postgres\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"150\\\" y=\\\"425\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">Sessions, tariffs\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"280\\\" y=\\\"382\\\" width=\\\"200\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"380\\\" y=\\\"405\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Redis\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"380\\\" y=\\\"425\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">Live state, geo index\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"510\\\" y=\\\"382\\\" width=\\\"200\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"610\\\" y=\\\"405\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Kafka\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"610\\\" y=\\\"425\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">Meter telemetry\\u003c/text>\\u003c/g>\\n\\u003c/svg>\\u003cfigcaption>Do entry path hain. User app normal HTTP se aata hai; chargers persistent WebSocket se. Dono core services pe milte hain, jo teen alag storage layer use karti hain.\\u003c/figcaption>\\u003c/figure>\\u003cp>Dhyaan dijiye ki gateway \\u003cb>do alag\\u003c/b> hain. User traffic stateless hai, isliye normal load balancer chalega. Charger traffic stateful hai \u2014 ek charger ka connection ek hi pod pe hai. Inko ek hi gateway me mix karna sabse common design mistake hai.\\u003c/p>\"}, {\"id\": \"ocpp\", \"title\": \"OCPP gateway \u2014 sabse critical\", \"html\": \"\\u003cp>Har charger ke saath ek persistent WebSocket connection. Charger NAT ke peeche baitha hai, isliye server usko directly call nahi kar sakta. Connection \\u003cb>charger\\u003c/b> initiate karta hai aur hamesha open rehta hai.\\u003c/p>\\u003cp>Protocol: OCPP 1.6J (JSON over WebSocket) ya OCPP 2.0.1. Ye industry standard hai \u2014 interview me naam lena hi credibility deta hai.\\u003c/p>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Charger to server\\u003c/th>\\u003cth>Server to charger\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>BootNotification (power-up pe)\\u003c/td>\\u003ctd>RemoteStartTransaction\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Heartbeat (har 60s)\\u003c/td>\\u003ctd>RemoteStopTransaction\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>StatusNotification\\u003c/td>\\u003ctd>Reset\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Authorize (RFID tap)\\u003c/td>\\u003ctd>ChangeConfiguration\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>StartTransaction / StopTransaction\\u003c/td>\\u003ctd>UpdateFirmware\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>MeterValues (har 15-30s)\\u003c/td>\\u003ctd>SetChargingProfile\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003ch3>Scaling problem: stateful routing\\u003c/h3>\\u003cp>Session service ko \\u003ccode class=\\\"ic\\\">RemoteStart\\u003c/code> bhejna hai. Par charger 123 ka connection sirf pod 7 pe hai. Round-robin load balancer 90% chance pe galat pod pe bhej dega.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>Connection registry (Redis):\\n  charger:CP-123  -&gt;  { pod: &quot;ocpp-gw-7&quot;, ip: &quot;10.0.4.22&quot; }   TTL 90s\\n\\nCharger connect  -&gt;  gateway ye key likhta hai\\nHeartbeat        -&gt;  TTL refresh\\nCommand bhejni   -&gt;  Redis lookup -&gt; us pod ko gRPC call\\u003c/code>\\u003c/pre>\\u003cp>Alternative jo kam coupling deta hai: per-pod Kafka topic ya Redis pub/sub channel. Gateway apne channel pe subscribe kare, services broadcast karein.\\u003c/p>\\u003ch3>Capacity\\u003c/h3>\\u003cp>Ek pod comfortably ~50K WebSockets handle kar leta hai \u2014 file descriptor limit aur memory tune karke. 500K chargers ke liye 10 se 15 pods plus headroom. Netty ya Go, dono is scale pe theek hain.\\u003c/p>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Reconnect storm\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Ek gateway pod crash hua to 50K chargers ek saath reconnect karenge \u2014 thundering herd. Fix: chargers me randomized exponential backoff configure karo, aur gateway pe connection admission rate limit lagao. Bina iske recovery khud ek outage ban jaati hai.\\u003c/div>\\u003c/div>\"}, {\"id\": \"discovery\", \"title\": \"Discovery service\", \"html\": \"\\u003cp>Query: mere 5km ke andar CCS2 fast chargers dikhao, price ke hisaab se sort karke.\\u003c/p>\\u003ch3>Geo index ke options\\u003c/h3>\\u003cul class=\\\"bul\\\">\\u003cli>Redis \\u003ccode class=\\\"ic\\\">GEOSEARCH\\u003c/code> \u2014 simple aur tez, basic radius query ke liye\\u003c/li>\\u003cli>PostGIS ya Elasticsearch \\u003ccode class=\\\"ic\\\">geo_distance\\u003c/code> \u2014 complex filters ke saath\\u003c/li>\\u003cli>\\u003cb>Scale pe behtar:\\u003c/b> S2 cells ya H3 hexagons. Lat/long ko cell id me convert karo \u2014 phir normal B-tree index kaam kar jaata hai aur caching bahut aasan ho jaati hai\\u003c/li>\\u003c/ul>\\u003ch3>Static aur live data alag rakho\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Static data\\u003c/th>\\u003cth>Live data\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Location, connector type, power, tariff\\u003c/td>\\u003ctd>Available / Occupied / Faulted\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Postgres + heavy cache, TTL 1 hour\\u003c/td>\\u003ctd>Redis, TTL 90s, StatusNotification se update\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>500K rows, mushkil se badalta hai\\u003c/td>\\u003ctd>Har second badalta hai\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Kyun separate\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Agar dono ek saath store karo to cache ka koi fayda nahi \u2014 live status har second invalidate kar dega. Alag rakh ke: static list cache se aati hai, uske upar Redis se live status merge kar do. Discovery ka p99 20ms rehta hai.\\u003c/div>\\u003c/div>\"}, {\"id\": \"session\", \"title\": \"Session service \u2014 system ka dil\", \"html\": \"\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 300\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar2\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR2\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Charging session state machine\\u003c/title>\\n\\u003cdesc>A session moves from idle through authorizing, pre-authorized, starting, charging,\\nstopping, completed and billed, with failure branches leaving the start and charge states.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"24\\\" y=\\\"40\\\" width=\\\"118\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"83\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Idle\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"142\\\" y1=\\\"63\\\" x2=\\\"176\\\" y2=\\\"63\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar2)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"180\\\" y=\\\"40\\\" width=\\\"150\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"255\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Authorizing\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"330\\\" y1=\\\"63\\\" x2=\\\"364\\\" y2=\\\"63\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar2)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"368\\\" y=\\\"40\\\" width=\\\"168\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"452\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Pre-authorized\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"536\\\" y1=\\\"63\\\" x2=\\\"570\\\" y2=\\\"63\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar2)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"574\\\" y=\\\"40\\\" width=\\\"150\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"649\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Starting\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M649 86 L649 112 L452 112 L452 140\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar2)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"368\\\" y=\\\"144\\\" width=\\\"168\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"452\\\" y=\\\"167\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Charging\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"368\\\" y1=\\\"167\\\" x2=\\\"334\\\" y2=\\\"167\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar2)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"180\\\" y=\\\"144\\\" width=\\\"150\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"255\\\" y=\\\"167\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Stopping\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M255 190 L255 216 L452 216 L452 240\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar2)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"368\\\" y=\\\"244\\\" width=\\\"168\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"452\\\" y=\\\"267\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Completed\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"536\\\" y1=\\\"267\\\" x2=\\\"570\\\" y2=\\\"267\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar2)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"574\\\" y=\\\"244\\\" width=\\\"150\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"649\\\" y=\\\"267\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Billed\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"649\\\" y1=\\\"86\\\" x2=\\\"649\\\" y2=\\\"140\\\" class=\\\"arr dash\\\" marker-end=\\\"url(#ar2)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" stroke-dasharray=\\\"4 3\\\" />\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"574\\\" y=\\\"144\\\" width=\\\"150\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"649\\\" y=\\\"167\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Failed\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"24\\\" y=\\\"144\\\" width=\\\"118\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"83\\\" y=\\\"167\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Faulted\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"180\\\" y1=\\\"167\\\" x2=\\\"146\\\" y2=\\\"167\\\" class=\\\"arr dash\\\" marker-end=\\\"url(#ar2)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" stroke-dasharray=\\\"4 3\\\" />\\n\\u003c/svg>\\u003cfigcaption>Happy path seedha chalta hai. Dashed arrows failure branches hain \u2014 inko explicitly model karna zaroori hai, warna session hamesha ke liye atak jaate hain.\\u003c/figcaption>\\u003c/figure>\\u003ch3>Chaar design points jo bolne chahiye\\u003c/h3>\\u003col class=\\\"num\\\">\\u003cli>\\u003cb>Idempotency mandatory.\\u003c/b> Charger network flaky hai, wo \\u003ccode class=\\\"ic\\\">StartTransaction\\u003c/code> do baar bhej sakta hai. \\u003ccode class=\\\"ic\\\">idempotency_key = (chargerId, connectorId, transactionId)\\u003c/code> rakho aur \\u003ccode class=\\\"ic\\\">INSERT ... ON CONFLICT DO NOTHING\\u003c/code> use karo. Warna ek charging ke do bill ban jayenge.\\u003c/li>\\u003cli>\\u003cb>transactionId charger generate karta hai, server nahi.\\u003c/b> Kyunki charger offline bhi transaction chala sakta hai. Server ko uska id accept karke apne id se map karna padta hai.\\u003c/li>\\u003cli>\\u003cb>Hot state Redis me, durable state Postgres me.\\u003c/b> Live kWh aur cost har 15 sec Redis me update karo \u2014 sasta aur tez. Sirf state transitions Postgres me likho \u2014 durable aur auditable.\\u003c/li>\\u003cli>\\u003cb>Timeouts har state pe.\\u003c/b> \\u003ccode class=\\\"ic\\\">STARTING\\u003c/code> me 60 sec se zyada baitha? Auto-fail karo aur pre-auth release karo. Warna user ka paisa block rahega aur charger occupied dikhega. Iske liye scheduled reaper ya Redis keyspace notification use karo.\\u003c/li>\\u003c/ol>\"}, {\"id\": \"reservation\", \"title\": \"Reservation \u2014 double booking\", \"html\": \"\\u003cp>Problem: do users ek hi connector ke liye same slot book na kar payein.\\u003c/p>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Galat solution\\u003c/span>\\u003cdiv class=\\\"note-b\\\">SELECT karke check karo, phir INSERT. Ye race condition hai \u2014 dono requests ko &quot;available&quot; dikhega aur dono book kar lenge.\\u003c/div>\\u003c/div>\\u003ch3>Option 1 \u2014 DB constraint (best answer)\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>ALTER TABLE reservations ADD CONSTRAINT no_overlap\\nEXCLUDE USING gist (\\n  connector_id WITH =,\\n  tstzrange(start_time, end_time) WITH &amp;&amp;\\n);\\u003c/code>\\u003c/pre>\\u003cp>Database khud guarantee de raha hai. Koi application-level lock nahi chahiye, koi retry logic nahi chahiye. Ye jawab interviewer ko sabse zyada impress karta hai.\\u003c/p>\\u003ch3>Option 2 \u2014 Optimistic locking\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>UPDATE connector_slots\\n   SET reserved_by = ?, version = version + 1\\n WHERE id = ? AND reserved_by IS NULL AND version = ?\\n\\n-- rows_affected == 0  -&gt;  koi aur jeet gaya  -&gt;  retry ya fail\\u003c/code>\\u003c/pre>\\u003ch3>Option 3 \u2014 Distributed lock\\u003c/h3>\\u003cp>Sirf tab jab multi-database coordination chahiye. Yahan \\u003cb>fencing token\\u003c/b> zaroor mention karo \u2014 lock expire hone ke baad stale holder write na kar de.\\u003c/p>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Expiry ko job se handle karo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Slot 15 min ke liye hold karo. User na aaye to auto-release plus no-show fee. Isko delayed job se karo \u2014 Kafka delayed topic ya Redis sorted set. Cron scan se mat karo, wo scale pe poori table scan karta rahega.\\u003c/div>\\u003c/div>\"}, {\"id\": \"billing\", \"title\": \"Billing aur rating engine\", \"html\": \"\\u003cp>Yahan ek bhi paisa galat nahi hona chahiye.\\u003c/p>\\u003ch3>1. Pre-authorization\\u003c/h3>\\u003cp>Session start pe payment provider pe hold lagao, maan lijiye 1000 rupaye. Hold fail ho to session start hi mat karo. Isse &quot;charge karke bhaag gaya&quot; problem solve hoti hai.\\u003c/p>\\u003ch3>2. Rating\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>Tariff complex ho sakti hai:\\n\\n  18/kWh                      (energy)\\n+ 2/min after 60 min          (idle / occupancy fee)\\n+ 20 flat                     (session fee)\\nx time-of-day multiplier      (peak hours 1.3x)\\n- subscription discount 15%\\u003c/code>\\u003c/pre>\\u003cp>Rating engine \\u003cb>rule-based\\u003c/b> banao, hardcoded formula nahi. Aur tariff ka \\u003cb>versioning\\u003c/b> rakho \u2014 jo tariff session start ke waqt active thi wahi apply hogi, chahe beech me tariff change ho jaye. Session record me \\u003ccode class=\\\"ic\\\">tariff_version_id\\u003c/code> snapshot store karo.\\u003c/p>\\u003ch3>3. Immutable double-entry ledger\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>Session S-991 completed, 428.50\\n\\nEntry 1:  DEBIT   user_wallet:U-77       428.50\\nEntry 2:  CREDIT  cpo_revenue:CPO-12     385.65\\nEntry 3:  CREDIT  platform_fee:PLATFORM   42.85\\n\\nInvariant: SUM(debits) == SUM(credits), hamesha\\u003c/code>\\u003c/pre>\\u003cp>Ledger rows kabhi UPDATE ya DELETE mat karo \u2014 sirf APPEND. Refund bhi ek naya reversing entry hota hai. Yahi principle Round 2 ke ledger reconciliation question me bhi chalta hai.\\u003c/p>\\u003ch3>4. Capture\\u003c/h3>\\u003cp>Session complete hone pe actual amount capture karo, baaki hold release. Agar \\u003ccode class=\\\"ic\\\">StopTransaction\\u003c/code> kabhi nahi aaya (charger mar gaya) to last known meter value se bill banao, session ko \\u003ccode class=\\\"ic\\\">DISPUTED\\u003c/code> flag karo, aur reconciliation job usko baad me settle kare.\\u003c/p>\"}, {\"id\": \"rest\", \"title\": \"Baaki components\", \"html\": \"\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Component\\u003c/th>\\u003cth>Kya karta hai\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>API gateway\\u003c/td>\\u003ctd>JWT auth, per-user rate limiting (Round 3 ka token bucket yahin lagta hai), routing, TLS termination\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Identity service\\u003c/td>\\u003ctd>Users, RFID tokens, OCPI tokens. Authorize requests ka O(1) lookup. Local authorization list charger pe cache karo taaki offline bhi RFID kaam kare\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Device management\\u003c/td>\\u003ctd>Firmware OTA staged rollout (1% then 10% then 100%), remote config, diagnostics upload\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Smart charging\\u003c/td>\\u003ctd>Ek site pe 10 chargers hain par transformer sirf 200kW deta hai. SetChargingProfile bhej kar har charger ka current limit dynamically set karo. Real world me bahut important, interview me bonus points\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Roaming (OCPI)\\u003c/td>\\u003ctd>Doosre CPO networks se token authorize, CDR exchange, settlement\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Notification\\u003c/td>\\u003ctd>Push aur SMS \u2014 charging complete, 80% done, car unplugged\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003ch3>Telemetry pipeline\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>OCPP gateway -&gt; Kafka topic &quot;meter-values&quot;\\n                (partition key = chargerId, taaki ek charger ke\\n                 messages order me rahein)\\n     |\\n     +--&gt; Stream processor (Flink / Kafka Streams)\\n     |      -&gt; Redis me live kWh update  (app ke liye)\\n     |      -&gt; Session service ko running cost feed\\n     |\\n     +--&gt; TimescaleDB / Cassandra   (30 din, analytics)\\n     |\\n     +--&gt; S3 / object store         (Parquet, long term + ML)\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Kafka kyun\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Buffer as shock absorber. Downstream slow ho ya restart ho, data lost nahi hota, aur replay bhi kar sakte ho. Billing ke liye exactly-once semantics configure karo \u2014 at-least-once me double billing ho sakti hai.\\u003c/div>\\u003c/div>\"}, {\"id\": \"data\", \"title\": \"Data model aur failure modes\", \"html\": \"\\u003cpre class=\\\"code\\\">\\u003ccode>-- Low write, high read  -&gt;  Postgres + heavy cache\\nstations(id, cpo_id, lat, lng, s2_cell_id, address, amenities)\\nconnectors(id, station_id, type, max_power_kw, tariff_id)\\ntariffs(id, version, energy_rate, time_rate, valid_from, valid_to)\\n\\n-- Hot path  -&gt;  Redis\\nconnector:{id}:status  -&gt; AVAILABLE | OCCUPIED | FAULTED    TTL 90s\\nsession:{id}:live      -&gt; { kwh, cost, started_at }         TTL 24h\\ncharger:{id}:conn      -&gt; { pod, ip }                       TTL 90s\\n\\n-- High write, durable  -&gt;  Postgres, shard by session_id\\nsessions(id, user_id, connector_id, state, started_at, ended_at,\\n         meter_start, meter_stop, tariff_version_id, idempotency_key)\\n\\n-- Append only, never update\\nledger_entries(id, session_id, account, direction, amount, created_at)\\n\\n-- Time series  -&gt;  Timescale / Cassandra + S3\\nmeter_values(session_id, timestamp, kwh, voltage, current, soc)\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Sharding key\\u003c/span>\\u003cdiv class=\\\"note-b\\\">sessions ko session_id pe hash-shard karo. user_id pe mat karo \u2014 fleet operators aur power users hot partition bana denge.\\u003c/div>\\u003c/div>\\u003ch3>Failure modes\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Failure\\u003c/th>\\u003cth>Handling\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Charger session ke beech offline\\u003c/td>\\u003ctd>Charger \\u003cb>locally\\u003c/b> transaction continue karta hai aur data buffer karta hai. Reconnect pe replay karta hai. Server idempotency se dedupe karta hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Gateway pod crash\\u003c/td>\\u003ctd>Chargers backoff ke saath reconnect. Session state Redis aur Postgres me hai, gateway me nahi \u2014 isliye kuch lost nahi hota\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>StopTransaction kabhi nahi aaya\\u003c/td>\\u003ctd>Timeout reaper: last meter value se 10 min gap ho to COMPLETED_ESTIMATED mark karo, last reading se bill banao, DISPUTED flag lagao\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Payment capture fail\\u003c/td>\\u003ctd>Session PENDING_PAYMENT me daalo, exponential backoff se retry, dunning flow, user ko further sessions se block karo\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Kafka lag badh gaya\\u003c/td>\\u003ctd>Graceful degrade \u2014 UI pe &quot;updating&quot; dikhao. Billing kabhi Redis pe depend na kare, hamesha authoritative StopTransaction pe\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Redis down\\u003c/td>\\u003ctd>Discovery &quot;status unknown&quot; ke saath serve kare, session start Postgres se chale. \\u003cb>Redis kabhi source of truth na ho\\u003c/b>\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\"}], \"mocks\": [{\"tag\": \"Opener\", \"q\": \"Ek EV charging network design kijiye jo 500K chargers support kare.\", \"a\": \"\\u003cp>Main pehle scope pin karunga: kya ye CPO platform hai (hum chargers own karte hain) ya aggregator (doosron ke chargers list karte hain)? Main CPO maan ke chalta hoon.\\u003c/p>\\u003cp>Do bilkul alag traffic classes hain. User traffic \u2014 discovery, booking, payment \u2014 normal stateless HTTP hai, few hundred QPS. Charger traffic 500K persistent WebSocket connections hai jo 33K messages per second bhejta hai. Ye do alag systems hain jo ek hi core services ko share karte hain.\\u003c/p>\\u003cp>Main OCPP over WebSocket use karunga, ek dedicated stateful gateway tier ke saath, Redis me connection registry, aur Kafka telemetry ke liye. Core services \u2014 session, reservation, discovery, billing \u2014 stateless hain aur independently scale karti hain.\\u003c/p>\"}, {\"tag\": \"Deep dive\", \"q\": \"Server ko ek specific charger ko command bhejni hai. Kaise routing hogi?\", \"a\": \"\\u003cp>Ye stateful routing problem hai. Charger ka WebSocket ek specific gateway pod pe terminate hota hai, isliye normal load balancer kaam nahi karega.\\u003c/p>\\u003cp>Connection registry rakhta hoon Redis me: \\u003ccode class=\\\"ic\\\">charger:{id} -&gt; {pod, ip}\\u003c/code> with 90 second TTL, jo heartbeat pe refresh hoti hai. Session service pehle Redis lookup karti hai, phir us pod ko direct gRPC call.\\u003c/p>\\u003cp>Alternative jo mujhe zyada pasand hai: per-pod Redis pub/sub channel ya Kafka topic. Service bas \\u003ccode class=\\\"ic\\\">pod-7\\u003c/code> channel pe publish karti hai, gateway subscribe karta hai. Isse service ko pod ka IP jaanna nahi padta aur pod restart pe koi stale connection issue nahi.\\u003c/p>\\u003cp>Trade-off: Redis lookup me ek extra hop hai par latency kam hai. Pub/sub me coupling kam hai par ek broker dependency add hoti hai.\\u003c/p>\"}, {\"tag\": \"Failure\", \"q\": \"Charger charging ke beech me offline ho gaya. Kya hota hai?\", \"a\": \"\\u003cp>Sabse important baat: \\u003cb>charging rukti nahi\\u003c/b>. OCPP me charger autonomously transaction continue karta hai. Wo meter values locally buffer karta hai. Ye by design hai \u2014 network failure se user ki car charge hona band nahi honi chahiye.\\u003c/p>\\u003cp>Server side pe main heartbeat miss detect karta hoon aur session ko \\u003ccode class=\\\"ic\\\">CHARGING_OFFLINE\\u003c/code> mark karta hoon. App pe stale data ka indicator dikhata hoon, session cancel nahi karta.\\u003c/p>\\u003cp>Reconnect pe charger buffered transaction data replay karta hai. Yahan idempotency critical hai \u2014 wahi \\u003ccode class=\\\"ic\\\">transactionId\\u003c/code> dobara aayega, aur mujhe usko dedupe karna hai, duplicate session nahi banana.\\u003c/p>\\u003cp>Agar charger 24 ghante tak wapas nahi aaya, to reaper job last known meter value se session estimate karke close karti hai aur DISPUTED flag lagati hai \u2014 manual review ke liye.\\u003c/p>\"}, {\"tag\": \"Consistency\", \"q\": \"Availability display eventually consistent hai. Kya isse booking galat ho sakti hai?\", \"a\": \"\\u003cp>Haan, aur ye acceptable hai \u2014 par sirf \\u003cb>display\\u003c/b> ke liye. Main do layer alag rakhta hoon.\\u003c/p>\\u003cp>Discovery me availability stale ho sakti hai, 30 second tak. User ko thoda purana status dikhega. Iska cost yeh hai ki user drive karke pahunche aur charger busy ho.\\u003c/p>\\u003cp>Par actual \\u003cb>reservation\\u003c/b> strongly consistent hai \u2014 Postgres exclusion constraint se. Aur actual \\u003cb>session start\\u003c/b> bhi, kyunki wo charger se live confirmation leta hai. Matlab: stale display se galat booking nahi ho sakti, sirf ek failed attempt ho sakti hai jiska immediate feedback milta hai.\\u003c/p>\\u003cp>Ye trade-off deliberate hai: strongly consistent availability ke liye har read pe charger se poochna padta, jo 500 QPS pe 500K devices ko hit karta. Uska koi tuk nahi.\\u003c/p>\"}, {\"tag\": \"Money\", \"q\": \"Aap kaise guarantee karenge ki user ko galat bill na jaye?\", \"a\": \"\\u003cp>Chaar layers.\\u003c/p>\\u003cp>\\u003cb>Pehla\\u003c/b>, authoritative source hamesha charger ka \\u003ccode class=\\\"ic\\\">StopTransaction\\u003c/code> hota hai jisme \\u003ccode class=\\\"ic\\\">meterStart\\u003c/code> aur \\u003ccode class=\\\"ic\\\">meterStop\\u003c/code> aate hain. Redis ka live counter sirf display ke liye hai, billing ke liye kabhi nahi.\\u003c/p>\\u003cp>\\u003cb>Doosra\\u003c/b>, tariff versioning. Session start pe jo tariff version tha wo session record me snapshot ho jaata hai. Beech me price change ho to purane sessions affect nahi hote.\\u003c/p>\\u003cp>\\u003cb>Teesra\\u003c/b>, double-entry ledger jo append-only hai. Har session ke liye debits aur credits barabar hone chahiye. Ek daily job ye invariant verify karta hai.\\u003c/p>\\u003cp>\\u003cb>Chautha\\u003c/b>, payment provider ke saath daily reconciliation \u2014 hamara ledger vs unka settlement file. Ye bilkul Round 2 wala problem hai.\\u003c/p>\"}, {\"tag\": \"Scale\", \"q\": \"Ek gateway pod pe kitne chargers rakh sakte hain? Bottleneck kya hai?\", \"a\": \"\\u003cp>Practically ~50K WebSocket connections per pod, agar file descriptors aur socket buffers tune kiye hon. Bottleneck memory hai, CPU nahi \u2014 har idle connection ka kernel buffer aur application-level state cost hota hai.\\u003c/p>\\u003cp>Message rate se calculate karein: 50K chargers, har 15 sec ek meter value, matlab ~3.3K messages per second per pod. Ye JSON parsing ke liye trivial hai. Isliye connection count bind karta hai, throughput nahi.\\u003c/p>\\u003cp>Main pod ko deliberately chhota rakhunga \u2014 20K connections per pod, zyada pods. Kyunki blast radius chhota rehta hai: ek pod gire to 20K chargers reconnect karenge, 50K nahi.\\u003c/p>\"}, {\"tag\": \"Tricky\", \"q\": \"Ek site pe 10 chargers hain par grid connection sirf 200kW ka hai. Kaise handle karenge?\", \"a\": \"\\u003cp>Ye smart charging ya load management hai, aur OCPP me iske liye first-class support hai \u2014 \\u003ccode class=\\\"ic\\\">SetChargingProfile\\u003c/code>.\\u003c/p>\\u003cp>Site pe ek local controller rakhta hoon jo total draw monitor karta hai. Jab demand capacity cross kare, wo har charger ko updated charging profile bhejta hai jo uska max current limit karta hai.\\u003c/p>\\u003cp>Allocation policy business decision hai: equal split simple hai; priority-based better hai (jo user jaldi me hai ya premium tariff pe hai usko zyada); aur state-of-charge aware sabse achha hai \u2014 90% bhari car ko current kam do, 20% wali ko zyada.\\u003c/p>\\u003cp>Important: ye \\u003cb>local\\u003c/b> hona chahiye, cloud se nahi. Agar internet jaaye to grid overload nahi hona chahiye \u2014 wo transformer trip kar dega.\\u003c/p>\"}, {\"tag\": \"Wrap-up\", \"q\": \"Agar aapko sirf ek cheez pehle build karni ho to kya?\", \"a\": \"\\u003cp>Session lifecycle, correct idempotency ke saath.\\u003c/p>\\u003cp>Discovery ke bina bhi log QR code scan karke charge kar lenge. Reservation ke bina bhi kaam chal jaayega. Par agar session state machine galat hai, to log paise dete hain aur charge nahi hota, ya charge hota hai aur bill nahi banta. Wo trust ka problem hai jo product ko maar deta hai.\\u003c/p>\\u003cp>Aur ye wo hissa hai jise baad me theek karna sabse mushkil hai, kyunki data pehle hi corrupt ho chuka hoga.\\u003c/p>\"}]}, {\"id\": \"ledger\", \"num\": 2, \"kind\": \"Coding\", \"title\": \"Reconcile 2 ledgers\", \"blurb\": \"Do ledgers compare karke missing aur mismatched entries nikalna. Asli test hai hash index sochna, duplicates handle karna, aur money ko float me na rakhna.\", \"sections\": [{\"id\": \"clarify\", \"title\": \"Clarify pehle (marks hain)\", \"html\": \"\\u003cp>Karat ka rubric problem framing pe alag se points deta hai. Coding se pehle ye poocho:\\u003c/p>\\u003cul class=\\\"bul\\\">\\u003cli>Har entry me \\u003cb>unique transaction id\\u003c/b> hai? Agar nahi, to poora approach badal jaata hai\\u003c/li>\\u003cli>\\u003cb>Duplicates\\u003c/b> ho sakte hain? Same txnId do baar?\\u003c/li>\\u003cli>Amount float hai ya integer paise?\\u003c/li>\\u003cli>Data sorted hai ya random?\\u003c/li>\\u003cli>Size \u2014 memory me fit ho jaayega?\\u003c/li>\\u003cli>&quot;Missing&quot; ka matlab sirf absent, ya \\u003cb>amount mismatch\\u003c/b> bhi count hoga?\\u003c/li>\\u003c/ul>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Expect kya hoga\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Interviewer usually part 1 me bolega: unique id hai, memory me fit ho jaayega. Phir part 2 aur 3 me wahi constraints todega \u2014 duplicates add karega, phir bolega 100 million rows hain. Isliye pehle se clean abstractions likhna faayda deta hai.\\u003c/div>\\u003c/div>\"}, {\"id\": \"model\", \"title\": \"Data model \u2014 pehla design decision\", \"html\": \"\\u003cpre class=\\\"code\\\">\\u003ccode>import java.time.Instant;\\n\\npublic record Entry(\\n    String  txnId,\\n    String  account,\\n    long    amountPaise,   // long, double NAHI\\n    Instant ts\\n) {}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Money kabhi double me nahi\\u003c/span>\\u003cdiv class=\\\"note-b\\\">double me 0.1 + 0.2 != 0.3. Ledger me ek paisa ka floating point error reconciliation report ko hi jhootha bana deta hai. Smallest currency unit (paise) me long rakho, ya BigDecimal explicit scale ke saath.\\u003c/div>\\u003c/div>\\u003cp>Ye ek line bolna hi aapko finance-domain-aware dikha deta hai \u2014 aur ye wo cheez hai jo 80% candidates miss karte hain.\\u003c/p>\"}, {\"id\": \"solution\", \"title\": \"Solution \u2014 hash index\", \"html\": \"\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 340\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar3\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR3\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Ledger reconciliation with a hash index\\u003c/title>\\n\\u003cdesc>Ledger B is indexed by transaction id into buckets, ledger A is streamed against that\\nindex, and every row lands in one of four outcome buckets.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"40\\\" y=\\\"28\\\" width=\\\"180\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"130\\\" y=\\\"51\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Ledger A\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"130\\\" y=\\\"71\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">Internal system\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"540\\\" y=\\\"28\\\" width=\\\"180\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"630\\\" y=\\\"51\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Ledger B\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"630\\\" y=\\\"71\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">Bank statement\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"630\\\" y1=\\\"86\\\" x2=\\\"630\\\" y2=\\\"118\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar3)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"500\\\" y=\\\"122\\\" width=\\\"220\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"610\\\" y=\\\"145\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Hash index by txnId\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"610\\\" y=\\\"165\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">Map to deque, O(m) build\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"130\\\" y1=\\\"86\\\" x2=\\\"130\\\" y2=\\\"140\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar3)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"40\\\" y=\\\"144\\\" width=\\\"220\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"150\\\" y=\\\"167\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Scan A, poll bucket\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"150\\\" y=\\\"187\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">Consume on match\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"500\\\" y1=\\\"167\\\" x2=\\\"266\\\" y2=\\\"167\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar3)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"150\\\" y1=\\\"202\\\" x2=\\\"150\\\" y2=\\\"242\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar3)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"610\\\" y1=\\\"180\\\" x2=\\\"610\\\" y2=\\\"242\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar3)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"30\\\" y=\\\"246\\\" width=\\\"164\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"112\\\" y=\\\"269\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Matched\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"112\\\" y=\\\"289\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">Fields all agree\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"206\\\" y=\\\"246\\\" width=\\\"164\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"288\\\" y=\\\"269\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Mismatched\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"288\\\" y=\\\"289\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">Same id, diff amount\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"382\\\" y=\\\"246\\\" width=\\\"164\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"464\\\" y=\\\"269\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Only in A\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"464\\\" y=\\\"289\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">Bucket was empty\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"558\\\" y=\\\"246\\\" width=\\\"164\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"640\\\" y=\\\"269\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Only in B\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"640\\\" y=\\\"289\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">Leftover in index\\u003c/text>\\u003c/g>\\n\\u003c/svg>\\u003cfigcaption>B ko index karo, A ko stream karo, aur har match pe bucket se entry consume kar do. Jo index me bacha wo automatically only-in-B hai \u2014 dusre pass ki zarurat nahi.\\u003c/figcaption>\\u003c/figure>\\u003cpre class=\\\"code\\\">\\u003ccode>public class LedgerReconciler {\\n\\n    public record Mismatch(Entry a, Entry b, String reason) {}\\n\\n    public record Result(\\n        List&lt;Entry&gt;    onlyInA,\\n        List&lt;Entry&gt;    onlyInB,\\n        List&lt;Mismatch&gt; mismatched,\\n        int            matchedCount\\n    ) {}\\n\\n    public Result reconcile(List&lt;Entry&gt; ledgerA, List&lt;Entry&gt; ledgerB) {\\n\\n        // 1. B ko txnId pe index karo. Deque isliye taaki duplicates bachein.\\n        Map&lt;String, Deque&lt;Entry&gt;&gt; indexB = new HashMap&lt;&gt;();\\n        for (Entry e : ledgerB) {\\n            indexB.computeIfAbsent(e.txnId(), k -&gt; new ArrayDeque&lt;&gt;()).add(e);\\n        }\\n\\n        List&lt;Entry&gt;    onlyInA    = new ArrayList&lt;&gt;();\\n        List&lt;Mismatch&gt; mismatched = new ArrayList&lt;&gt;();\\n        int matched = 0;\\n\\n        // 2. A scan karo, B se ek-ek entry consume karo\\n        for (Entry a : ledgerA) {\\n            Deque&lt;Entry&gt; bucket = indexB.get(a.txnId());\\n\\n            if (bucket == null || bucket.isEmpty()) {\\n                onlyInA.add(a);              // B me hai hi nahi\\n                continue;\\n            }\\n\\n            Entry b = bucket.poll();         // consume: dobara match na ho\\n            String reason = diff(a, b);\\n            if (reason == null) matched++;\\n            else mismatched.add(new Mismatch(a, b, reason));\\n        }\\n\\n        // 3. Jo B me bacha, wo A me missing tha\\n        List&lt;Entry&gt; onlyInB = new ArrayList&lt;&gt;();\\n        for (Deque&lt;Entry&gt; leftover : indexB.values()) onlyInB.addAll(leftover);\\n\\n        return new Result(onlyInA, onlyInB, mismatched, matched);\\n    }\\n\\n    private String diff(Entry a, Entry b) {\\n        if (a.amountPaise() != b.amountPaise())\\n            return &quot;amount &quot; + a.amountPaise() + &quot; vs &quot; + b.amountPaise();\\n        if (!Objects.equals(a.account(), b.account()))\\n            return &quot;account &quot; + a.account() + &quot; vs &quot; + b.account();\\n        return null;   // perfect match\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003ch3>Har component ka reasoning\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Choice\\u003c/th>\\u003cth>Kyun\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Hash index\\u003c/td>\\u003ctd>Naive nested loop O(n x m) hai. 1M x 1M = 10^12 operations, ghanton lagega. Index se ek pass build, ek pass lookup \u2014 \\u003cb>O(n + m)\\u003c/b>\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Deque as bucket\\u003c/td>\\u003ctd>Agar \\u003ccode class=\\\"ic\\\">Map&lt;String, Entry&gt;\\u003c/code> rakhte to duplicate txnId purani entry ko overwrite kar deta \u2014 silent data loss. Deque se multiple entries survive karti hain\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">bucket.poll()\\u003c/code>\\u003c/td>\\u003ctd>Do kaam ek line me: same B entry dobara match nahi hogi, aur loop ke baad jo bacha wo \\u003cb>automatically\\u003c/b> only-in-B hai. Koi visited-set ya second pass nahi chahiye\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">diff()\\u003c/code> alag method\\u003c/td>\\u003ctd>Business rules yahin extend honge \u2014 tolerance (plus minus 1 paisa rounding), date window (T+1 settlement), currency check. Inline likhte to main logic gandi hoti\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Chaar buckets\\u003c/td>\\u003ctd>Interviewer sirf &quot;missing&quot; bolta hai, par real reconciliation me chaar outcomes hote hain. Chaaron return karna dikhata hai ki aapne domain socha hai\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cp>\\u003cb>Complexity:\\u003c/b> Time O(n + m), Space O(m) \u2014 sirf B ka index.\\u003c/p>\"}, {\"id\": \"streaming\", \"title\": \"Follow-up \u2014 memory me fit nahi hota\", \"html\": \"\\u003cp>Interviewer bolega: 100 million rows hain, 8GB RAM hai. Ab hash map nahi chalega.\\u003c/p>\\u003cp>\\u003cb>Answer: external merge join.\\u003c/b> Dono ledgers ko txnId pe sort karo \u2014 external merge sort se ya DB se \\u003ccode class=\\\"ic\\\">ORDER BY\\u003c/code> ke saath stream karke \u2014 phir two-pointer merge.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>public void reconcileStreaming(Iterator&lt;Entry&gt; a, Iterator&lt;Entry&gt; b, Sink sink) {\\n    // PRECONDITION: dono iterators txnId se sorted hain\\n    Entry ea = next(a), eb = next(b);\\n\\n    while (ea != null || eb != null) {\\n        int cmp = (ea == null) ?  1\\n                : (eb == null) ? -1\\n                : ea.txnId().compareTo(eb.txnId());\\n\\n        if (cmp &lt; 0) {\\n            sink.onlyInA(ea);  ea = next(a);\\n        } else if (cmp &gt; 0) {\\n            sink.onlyInB(eb);  eb = next(b);\\n        } else {\\n            if (ea.amountPaise() != eb.amountPaise()) sink.mismatch(ea, eb);\\n            else sink.matched(ea);\\n            ea = next(a);  eb = next(b);\\n        }\\n    }\\n}\\n\\nprivate Entry next(Iterator&lt;Entry&gt; it) { return it.hasNext() ? it.next() : null; }\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Kyun better hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Memory \\u003cb>O(1)\\u003c/b> \u2014 sirf do entries RAM me. Time O(n log n) sort ke liye, par sort disk pe ho sakta hai. Yahi approach har real reconciliation system use karta hai \u2014 banks, payment gateways, exchanges. Sink interface isliye ki output bhi stream ho, poori list memory me na bane.\\u003c/div>\\u003c/div>\"}, {\"id\": \"edge\", \"title\": \"Edge cases\", \"html\": \"\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Case\\u003c/th>\\u003cth>Handling\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>txnId null ya empty\\u003c/td>\\u003ctd>Reject karo, quarantine bucket me daalo\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Duplicate txnId\\u003c/td>\\u003ctd>Deque / multiset \u2014 already handled\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Amount double me\\u003c/td>\\u003ctd>Kabhi nahi. long paise ya BigDecimal\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Reversal aur refund\\u003c/td>\\u003ctd>Signed amount, ya alag type field pe alag treatment\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>T+1 settlement lag\\u003c/td>\\u003ctd>Sirf missing mat bolo. Ek &quot;pending&quot; bucket rakho, next run me match karo\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Timezone\\u003c/td>\\u003ctd>Sab Instant (UTC) me normalize karo. Local time me kabhi compare mat karo\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Case-sensitive ids\\u003c/td>\\u003ctd>TXN-001 vs txn-001 \u2014 lookup se pehle normalize karo\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Ek ledger empty\\u003c/td>\\u003ctd>Poora doosra only-in-X. Code natural handle karta hai\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003ch3>Agar txnId hai hi nahi?\\u003c/h3>\\u003cp>Fuzzy matching: composite key \\u003ccode class=\\\"ic\\\">(amount, date +/- 1 day, counterparty)\\u003c/code>. Ambiguous matches ko manual review queue me bhejo, auto-match mat karo. Ye bolna real world awareness dikhata hai \u2014 bahut sare bank statements me clean id hoti hi nahi.\\u003c/p>\"}], \"mocks\": [{\"tag\": \"Opener\", \"q\": \"Do ledgers diye gaye hain. Missing entries nikaliye.\", \"a\": \"\\u003cp>Pehle main confirm karunga ki har entry me unique transaction id hai, duplicates possible hain ya nahi, aur data memory me fit hoga ya nahi. Ye teen cheezein poora approach decide karti hain.\\u003c/p>\\u003cp>Maan lijiye unique id hai aur memory me fit hai. Main chhoti ledger ko txnId pe hash index karunga, phir badi ko stream karke lookup karunga. O(n + m) time, O(min(n,m)) space. Nested loop O(n x m) hota, jo million rows pe chalega hi nahi.\\u003c/p>\\u003cp>Main chaar buckets return karunga, sirf missing nahi: matched, mismatched, only-in-A, only-in-B. Real reconciliation me &quot;same id par alag amount&quot; sabse important case hota hai.\\u003c/p>\"}, {\"tag\": \"Follow-up\", \"q\": \"Duplicate transaction ids ho sakte hain. Ab kya badlega?\", \"a\": \"\\u003cp>Map value ko single Entry se Deque me badal dunga. Agar single Entry rakhta to computeIfAbsent ya put purani entry ko silently overwrite kar deta \u2014 data loss.\\u003c/p>\\u003cp>Match karte waqt \\u003ccode class=\\\"ic\\\">poll()\\u003c/code> karunga, \\u003ccode class=\\\"ic\\\">get()\\u003c/code> nahi. Isse har B entry sirf ek baar match hogi. Agar A me ek id teen baar hai aur B me do baar, to do match honge aur ek only-in-A me jaayega \u2014 jo bilkul correct hai.\\u003c/p>\\u003cp>Aur ek bonus: loop ke baad index me jo bacha, wo exactly only-in-B hai. Alag se track karne ki zarurat nahi.\\u003c/p>\"}, {\"tag\": \"Scale\", \"q\": \"100 million rows hain, 8GB RAM. Ab?\", \"a\": \"\\u003cp>Hash index out. Main external merge join karunga.\\u003c/p>\\u003cp>Dono ledgers ko txnId pe sort karo \u2014 ya to external merge sort se, ya seedha database se \\u003ccode class=\\\"ic\\\">ORDER BY txn_id\\u003c/code> ke saath cursor stream karke. Phir classic two-pointer merge: chhota id wala pointer aage badhta hai aur uski entry only-in-X me jaati hai; barabar hone pe compare karke dono aage badhte hain.\\u003c/p>\\u003cp>Memory O(1) \u2014 sirf do rows. Time sort dominate karta hai, O(n log n), par wo disk pe hota hai. Output bhi stream karunga, list me collect nahi karunga, warna wahi memory problem wapas aa jaayega.\\u003c/p>\\u003cp>Agar DB me dono tables hain to actually sabse sasta jawab hai: \\u003ccode class=\\\"ic\\\">FULL OUTER JOIN\\u003c/code> likh do aur database ko sort-merge karne do. Wo iske liye hi optimized hai.\\u003c/p>\"}, {\"tag\": \"Correctness\", \"q\": \"Amounts ke liye aap kaun sa type use karenge aur kyun?\", \"a\": \"\\u003cp>long, paise me. Ya BigDecimal fixed scale ke saath. double kabhi nahi.\\u003c/p>\\u003cp>double IEEE 754 binary floating point hai. 0.1 exactly represent hi nahi hota. Thousands of rows sum karo to error accumulate ho jaata hai, aur reconciliation report differences dikhane lagti hai jo actually exist hi nahi karte.\\u003c/p>\\u003cp>long paise me arithmetic exact hai aur tez bhi. Division kahin chahiye \u2014 jaise tax split \u2014 to rounding rule explicitly define karna padta hai, aur remainder ko kisi ek party pe assign karna padta hai taaki total match rahe.\\u003c/p>\"}, {\"tag\": \"Design\", \"q\": \"Ye reconciliation roz raat ko chalti hai. Production concerns kya hain?\", \"a\": \"\\u003cp>\\u003cb>Idempotency\\u003c/b> \u2014 same input pe dobara chalao to same output aaye aur duplicate records na banein. Run id ke saath results store karunga.\\u003c/p>\\u003cp>\\u003cb>Timing\\u003c/b> \u2014 bank settlement T+1 hota hai. Aaj ka transaction kal ke statement me aayega. Isliye &quot;missing&quot; aur &quot;abhi tak nahi aaya&quot; alag buckets hone chahiye, warna har raat false alerts aayenge.\\u003c/p>\\u003cp>\\u003cb>Alerting thresholds\\u003c/b> \u2014 5 mismatches normal hain. 5000 ka matlab upstream system toot gaya. Absolute count nahi, percentage aur trend pe alert karo.\\u003c/p>\\u003cp>\\u003cb>Audit trail\\u003c/b> \u2014 har reconciliation run ka result immutable store ho. Financial audits me ye evidence hai.\\u003c/p>\"}, {\"tag\": \"Tricky\", \"q\": \"Ek entry A me 500 hai aur B me 500 hai, par dates alag hain. Match hai ya nahi?\", \"a\": \"\\u003cp>Ye business rule hai, technical decision nahi \u2014 aur main yahi poochunga.\\u003c/p>\\u003cp>Payment settlement me typically haan, ye match hai. Transaction Monday ko hua, bank ne Tuesday ko settle kiya. Main ek configurable date tolerance rakhunga, usually 1 se 3 din.\\u003c/p>\\u003cp>Par accounting close ke liye nahi \u2014 agar month boundary cross ho rahi hai to wo different period ka revenue hai aur usko separately flag karna padega.\\u003c/p>\\u003cp>Main isko \\u003ccode class=\\\"ic\\\">diff()\\u003c/code> method me pluggable rule banaunga, hardcode nahi karunga, kyunki har counterparty ka apna settlement window hota hai.\\u003c/p>\"}, {\"tag\": \"Testing\", \"q\": \"Is code ke liye aap kaun se tests likhenge?\", \"a\": \"\\u003cp>Pehle boundary cases: dono lists empty, ek empty, dono identical, dono completely disjoint.\\u003c/p>\\u003cp>Phir semantic cases: same id alag amount (mismatch me jaana chahiye), duplicate ids asymmetric counts ke saath (3 in A, 2 in B), aur null ya blank txnId.\\u003c/p>\\u003cp>Phir ek \\u003cb>property test\\u003c/b> \u2014 ye main zaroor mention karunga. Random ledgers generate karo aur invariant assert karo: \\u003ccode class=\\\"ic\\\">matched + mismatched + onlyInA == A.size()\\u003c/code> aur \\u003ccode class=\\\"ic\\\">matched + mismatched + onlyInB == B.size()\\u003c/code>. Ye invariant kisi bhi counting bug ko pakad lega jo handwritten example miss kar de.\\u003c/p>\"}]}, {\"id\": \"ratelimit\", \"num\": 3, \"kind\": \"Coding\", \"title\": \"Token bucket limiter\", \"blurb\": \"allow() function jo QPS cap kare, phir distributed extension. Do cheez decide karti hain: lazy refill, aur distributed me consistency ka trade-off.\", \"sections\": [{\"id\": \"mech\", \"title\": \"Mechanics\", \"html\": \"\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 320\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar4\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR4\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Token bucket mechanics\\u003c/title>\\n\\u003cdesc>Tokens drip into a capped bucket at a fixed rate; each request removes one token,\\nand a request arriving at an empty bucket is rejected.\\u003c/desc>\\n\\n\\u003ctext class=\\\"th\\\" x=\\\"60\\\" y=\\\"40\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#161B22\\\">Refill: rate x elapsed, capped at capacity\\u003c/text>\\n\\u003cline x1=\\\"60\\\" y1=\\\"54\\\" x2=\\\"60\\\" y2=\\\"96\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar4)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"120\\\" y1=\\\"54\\\" x2=\\\"120\\\" y2=\\\"96\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar4)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"180\\\" y1=\\\"54\\\" x2=\\\"180\\\" y2=\\\"96\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar4)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003crect x=\\\"36\\\" y=\\\"100\\\" width=\\\"180\\\" height=\\\"150\\\" rx=\\\"8\\\" class=\\\"grp\\\" fill=\\\"none\\\" stroke=\\\"#AEB6C1\\\" stroke-width=\\\"1\\\" stroke-dasharray=\\\"4 4\\\" />\\n\\u003crect x=\\\"44\\\" y=\\\"176\\\" width=\\\"164\\\" height=\\\"66\\\" rx=\\\"5\\\" class=\\\"fill-volt\\\" fill=\\\"#C6BFF3\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"126\\\" y=\\\"126\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">capacity = burst size\\u003c/text>\\n\\u003ctext class=\\\"th\\\" x=\\\"126\\\" y=\\\"214\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#161B22\\\">tokens\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"126\\\" y=\\\"272\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Overflow is discarded\\u003c/text>\\n\\u003cpath d=\\\"M216 175 L254 175 L254 149 L288 149\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar4)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003cpath d=\\\"M216 175 L254 175 L254 251 L288 251\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar4)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"292\\\" y=\\\"120\\\" width=\\\"180\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"382\\\" y=\\\"143\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">tokens &gt;= 1\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"382\\\" y=\\\"163\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">Allow, decrement\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"292\\\" y=\\\"222\\\" width=\\\"180\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"382\\\" y=\\\"245\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">tokens &lt; 1\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"382\\\" y=\\\"265\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">Reject, 429\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"520\\\" y=\\\"120\\\" width=\\\"200\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"620\\\" y=\\\"143\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Request served\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"620\\\" y=\\\"163\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">Downstream call\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"472\\\" y1=\\\"149\\\" x2=\\\"516\\\" y2=\\\"149\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar4)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"520\\\" y=\\\"222\\\" width=\\\"200\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"620\\\" y=\\\"245\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Retry-After header\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"620\\\" y=\\\"265\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">deficit / rate\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"472\\\" y1=\\\"251\\\" x2=\\\"516\\\" y2=\\\"251\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar4)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003c/svg>\\u003cfigcaption>Tokens fixed rate se bucket me girte hain aur capacity pe ruk jaate hain. Har request ek token uthati hai. Bucket khaali ho to request reject, aur client ko batao ki kitna wait karna hai.\\u003c/figcaption>\\u003c/figure>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Knob\\u003c/th>\\u003cth>Kya control karta hai\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">capacity\\u003c/code>\\u003c/td>\\u003ctd>\\u003cb>Burst tolerance\\u003c/b> \u2014 kitni requests ek saath allowed hain\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">refillPerSecond\\u003c/code>\\u003c/td>\\u003ctd>\\u003cb>Sustained QPS cap\\u003c/b> \u2014 long run me average rate\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cp>Example: capacity 100, rate 10 per second. User 100 requests ek saath maar sakta hai, phir 10 per second pe settle ho jaayega. Yahi token bucket ki khaasiyat hai \u2014 leaky bucket burst allow hi nahi karta.\\u003c/p>\"}, {\"id\": \"single\", \"title\": \"Part 1 \u2014 single node, thread safe\", \"html\": \"\\u003cpre class=\\\"code\\\">\\u003ccode>public class TokenBucket {\\n\\n    private final long         capacity;        // burst size\\n    private final double       refillPerNano;   // tokens per nanosecond\\n    private final LongSupplier clock;           // injectable = testable\\n\\n    private double tokens;\\n    private long   lastRefillNanos;\\n\\n    public TokenBucket(long capacity, double refillPerSecond) {\\n        this(capacity, refillPerSecond, System::nanoTime);\\n    }\\n\\n    TokenBucket(long capacity, double refillPerSecond, LongSupplier clock) {\\n        if (capacity &lt;= 0 || refillPerSecond &lt;= 0)\\n            throw new IllegalArgumentException(&quot;capacity and rate must be &gt; 0&quot;);\\n        this.capacity        = capacity;\\n        this.refillPerNano   = refillPerSecond / 1_000_000_000.0;\\n        this.clock           = clock;\\n        this.tokens          = capacity;         // full bucket se start\\n        this.lastRefillNanos = clock.getAsLong();\\n    }\\n\\n    public boolean allow() { return allow(1); }\\n\\n    public synchronized boolean allow(int permits) {\\n        if (permits &lt;= 0 || permits &gt; capacity)\\n            throw new IllegalArgumentException(&quot;permits out of range&quot;);\\n        refill();\\n        if (tokens &gt;= permits) {\\n            tokens -= permits;\\n            return true;\\n        }\\n        return false;\\n    }\\n\\n    /** Kitna wait karna padega taaki request allow ho jaye */\\n    public synchronized long retryAfterMillis(int permits) {\\n        refill();\\n        if (tokens &gt;= permits) return 0;\\n        double deficit = permits - tokens;\\n        return (long) Math.ceil(deficit / refillPerNano / 1_000_000.0);\\n    }\\n\\n    private void refill() {\\n        long now     = clock.getAsLong();\\n        long elapsed = now - lastRefillNanos;\\n        if (elapsed &lt;= 0) return;                        // clock guard\\n        tokens = Math.min(capacity, tokens + elapsed * refillPerNano);\\n        lastRefillNanos = now;\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003ch3>Har design choice ka reasoning\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Choice\\u003c/th>\\u003cth>Kyun\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>\\u003cb>Lazy refill\\u003c/b>\\u003c/td>\\u003ctd>Bahut log background thread banate hain jo har 100ms tokens add kare. 1 million users = 1 million timers = system dead. Yahan refill on-demand hota hai: elapsed time x rate. \\u003cb>Zero background work.\\u003c/b> Ye seedha junior vs senior separator hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">System.nanoTime()\\u003c/code>\\u003c/td>\\u003ctd>Monotonic hai. \\u003ccode class=\\\"ic\\\">currentTimeMillis()\\u003c/code> wall clock hai \u2014 NTP sync ya DST pe peeche jump kar sakta hai, jisse elapsed negative ho jaata aur tokens ghat jaate\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">double tokens\\u003c/code>\\u003c/td>\\u003ctd>Fractional tokens accumulate hone dena zaroori hai. long use karo aur rate 0.5/sec ho to har call pe fraction truncate hoke rate hamesha 0 ho jaayegi\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">synchronized\\u003c/code>\\u003c/td>\\u003ctd>Read-modify-write hai \u2014 refill padhta hai, allow likhta hai. Bina lock ke do threads ek hi token do baar kharch kar lenge\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Injectable clock\\u003c/td>\\u003ctd>Bina iske test likh hi
