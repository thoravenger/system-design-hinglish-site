   throw new InsufficientFundsException(cmd.from());\\n\\n    // 3. Double entry - dono rows ek hi transaction me\\n    UUID txn = UUID.randomUUID();\\n    ledger.append(txn, cmd.from(), &#x27;D&#x27;, cmd.amountPaise());\\n    ledger.append(txn, cmd.to(),   &#x27;C&#x27;, cmd.amountPaise());\\n\\n    // 4. Balance projection incrementally update\\n    balances.apply(cmd.from(), -cmd.amountPaise());\\n    balances.apply(cmd.to(),   +cmd.amountPaise());\\n\\n    // 5. Outbox - event usi transaction me (Round 7 wala pattern)\\n    outbox.save(new TransferCompleted(txn, cmd));\\n\\n    TransferResult r = TransferResult.ok(txn);\\n    idempotency.complete(cmd.key(), json(r));\\n    return r;\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Lock ordering yahan dobara aayi\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Round 4 ka deadlock fix seedha yahan lag raha hai. Do accounts lock karne hain, isliye hamesha ascending account id me. Bina iske A-to-B aur B-to-A concurrent transfers deadlock karenge \u2014 aur ye production me hi dikhega, test me nahi.\\u003c/div>\\u003c/div>\\u003ch3>Deep dive \u2014 balance kaise nikalein\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Option\\u003c/th>\\u003cth>Fayda\\u003c/th>\\u003cth>Nuksan\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Har baar SUM(entries)\\u003c/td>\\u003ctd>Hamesha correct, koi drift nahi\\u003c/td>\\u003ctd>Millions rows pe slow, har read pe scan\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Snapshot + incremental\\u003c/b>\\u003c/td>\\u003ctd>O(1) read\\u003c/td>\\u003ctd>Drift ho sakti hai \u2014 isliye periodic verification job chahiye\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Snapshot + delta since\\u003c/td>\\u003ctd>Balance ke liye O(1), audit ke liye full history\\u003c/td>\\u003ctd>Thoda complex, par production answer yahi hai\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Ye trade-off explicitly bolo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">&quot;Main snapshot rakhunga par usko authoritative nahi maanunga. Ek nightly job SUM(entries) se snapshot verify karega. Agar mismatch mile to alert \u2014 kyunki uska matlab kahin bug hai, aur paise me silent drift acceptable nahi.&quot;\\u003c/div>\\u003c/div>\"}, {\"id\": \"d2\", \"title\": \"Design 2 \u2014 High-throughput transaction processing\", \"html\": \"\\u003cp>\\u003cb>Prompt:\\u003c/b> ek system design kijiye jo 10,000 transactions per second handle kare.\\u003c/p>\\u003cp>\\u003cb>Kyun ye:\\u003c/b> ye async processing, sharding, backpressure aur exactly-once ka poora pattern sikhata hai. Metrics pipeline, fraud detection, order processing \u2014 sab isi ka roop hain.\\u003c/p>\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 260\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar12\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR12\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>High-throughput transaction pipeline\\u003c/title>\\n\\u003cdesc>The API accepts and deduplicates, publishes to Kafka keyed by account id, and workers\\nown one partition each so a single account is never processed concurrently.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"40\\\" y=\\\"40\\\" width=\\\"190\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"135\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">API gateway\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"135\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">auth, rate limit\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"230\\\" y1=\\\"69\\\" x2=\\\"266\\\" y2=\\\"69\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar12)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"270\\\" y=\\\"40\\\" width=\\\"210\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"375\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Accept + dedupe\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"375\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">202, status pending\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"480\\\" y1=\\\"69\\\" x2=\\\"516\\\" y2=\\\"69\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar12)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"520\\\" y=\\\"40\\\" width=\\\"200\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"620\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Kafka\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"620\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">key = accountId\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M620 98 L620 122 L145 122 L145 146\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar12)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"40\\\" y=\\\"150\\\" width=\\\"210\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"145\\\" y=\\\"173\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Workers per partition\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"145\\\" y=\\\"192\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">no cross-account race\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"250\\\" y1=\\\"179\\\" x2=\\\"286\\\" y2=\\\"179\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar12)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"290\\\" y=\\\"150\\\" width=\\\"200\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"390\\\" y=\\\"173\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Sharded ledger DB\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"390\\\" y=\\\"192\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">shard by accountId\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"490\\\" y1=\\\"179\\\" x2=\\\"526\\\" y2=\\\"179\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar12)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"530\\\" y=\\\"150\\\" width=\\\"190\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"625\\\" y=\\\"173\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Outbox events\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"625\\\" y=\\\"192\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">notify, ledger, audit\\u003c/text>\\u003c/g>\\n\\u003ctext class=\\\"ts\\\" x=\\\"40\\\" y=\\\"242\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Sync path sirf accept karta hai. Asli kaam async hai.\\u003c/text>\\n\\u003c/svg>\\u003cfigcaption>Sync path sirf validate karke accept karta hai aur 202 lauta deta hai. Asli ledger write async hota hai, partition ke andar sequential.\\u003c/figcaption>\\u003c/figure>\\u003ch3>Central insight\\u003c/h3>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Sync path chhota rakho\\u003c/span>\\u003cdiv class=\\\"note-b\\\">10K TPS pe aap har request ka DB write sync me nahi kar sakte. API sirf \\u003cb>accept\\u003c/b> karta hai \u2014 validate, dedupe, Kafka pe daalo, 202 Accepted ke saath status URL do. User ko &quot;Processing&quot; dikhta hai. Ye exactly wahi hai jo real UPI aur card networks karte hain.\\u003c/div>\\u003c/div>\\u003ch3>Partition key ka chunav \u2014 yahi poora design hai\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>Kafka partition key = accountId\\n\\nKyun ye kaam karta hai:\\n  - ek account ke saare transactions ek hi partition me\\n  - ek partition ka ek hi consumer hota hai\\n  - matlab ek account pe kabhi concurrent write nahi\\n  - matlab us account ke liye locking ki zarurat hi nahi\\n  - aur ordering automatically mil jaati hai\\n\\nAlag accounts alag partitions me parallel chalte hain -&gt; throughput.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Ordering yahan sirf per-account chahiye\\u003c/b>, global nahi. Ye realisation hi 10K TPS ko possible banati hai. Global ordering maang loge to aap ek hi partition pe atak jaoge.\\u003c/p>\\u003ch3>Scale math bolo\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>10,000 TPS\\nEk worker 200 TPS handle karta hai (DB write + validation)\\n  -&gt; 50 workers chahiye\\n  -&gt; at least 50 partitions (worker ko partition milna chahiye)\\n  -&gt; headroom ke liye 100 partitions rakho\\n\\nDB: 10K writes/sec ek Postgres node pe nahi jaayega\\n  -&gt; accountId pe shard, maan lijiye 10 shards = 1K writes/sec per shard\\n  -&gt; ye ek node comfortably kar leta hai\\u003c/code>\\u003c/pre>\\u003ch3>Failure modes\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Failure\\u003c/th>\\u003cth>Handling\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Worker crash mid-processing\\u003c/td>\\u003ctd>Offset commit nahi hua, message dobara aayega. Consumer idempotent hai (Round 7) to safe\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Consumer lag badh gaya\\u003c/td>\\u003ctd>Partitions aur workers badhao. Par partition count badhane pe key mapping badal jaati hai \u2014 pehle se zyada rakho\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Ek account pe hot partition\\u003c/td>\\u003ctd>Ek merchant 50% traffic la raha hai. Uske liye sub-key (accountId + hash bucket) use karo, par phir uska per-account ordering chala jaayega \u2014 ye trade-off bolo\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Poison message\\u003c/td>\\u003ctd>Retry count track karo, N ke baad dead letter topic me daalo. Ek message poori partition block nahi karni chahiye\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Kafka down\\u003c/td>\\u003ctd>API 503 de aur client retry kare. Fintech me fail-closed \u2014 silently drop karna sabse bura option hai\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\"}, {\"id\": \"d3\", \"title\": \"Design 3 \u2014 Notification service (fan-out)\", \"html\": \"\\u003cp>\\u003cb>Prompt:\\u003c/b> ek notification service design kijiye jo email, SMS aur push reliably deliver kare.\\u003c/p>\\u003cp>\\u003cb>Kyun ye:\\u003c/b> ye \\u003cb>fan-out\\u003c/b> sikhata hai \u2014 wo pattern jo EV charging me bilkul nahi tha. Feed, timeline, broadcast alerts, sab yahi hain.\\u003c/p>\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 310\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar13\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR13\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Fan-out on write versus fan-out on read\\u003c/title>\\n\\u003cdesc>On write, one event is copied into every recipient inbox ahead of time. On read, the\\nrecipient list is queried and merged at request time.\\u003c/desc>\\n\\n\\u003ctext class=\\\"th\\\" x=\\\"30\\\" y=\\\"24\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#161B22\\\">Fan-out on write\\u003c/text>\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"40\\\" y=\\\"40\\\" width=\\\"180\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"130\\\" y=\\\"68\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">New event\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"130\\\" y1=\\\"86\\\" x2=\\\"130\\\" y2=\\\"114\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar13)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"30\\\" y=\\\"118\\\" width=\\\"200\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"130\\\" y=\\\"146\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Fan-out worker\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"130\\\" y1=\\\"164\\\" x2=\\\"130\\\" y2=\\\"192\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar13)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"24\\\" y=\\\"196\\\" width=\\\"212\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"130\\\" y=\\\"218\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">N inboxes written\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"130\\\" y=\\\"237\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">precomputed\\u003c/text>\\u003c/g>\\n\\u003ctext class=\\\"ts\\\" x=\\\"130\\\" y=\\\"276\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Write mehnga, read O(1)\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"130\\\" y=\\\"294\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Celebrity problem yahin hai\\u003c/text>\\n\\u003ctext class=\\\"th\\\" x=\\\"420\\\" y=\\\"24\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#161B22\\\">Fan-out on read\\u003c/text>\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"490\\\" y=\\\"40\\\" width=\\\"180\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"580\\\" y=\\\"68\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Read request\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"580\\\" y1=\\\"86\\\" x2=\\\"580\\\" y2=\\\"114\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar13)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"470\\\" y=\\\"118\\\" width=\\\"220\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"580\\\" y=\\\"146\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Query M sources\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"580\\\" y1=\\\"164\\\" x2=\\\"580\\\" y2=\\\"192\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar13)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"450\\\" y=\\\"196\\\" width=\\\"260\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"580\\\" y=\\\"218\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Merge + sort at read\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"580\\\" y=\\\"237\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">nothing stored\\u003c/text>\\u003c/g>\\n\\u003ctext class=\\\"ts\\\" x=\\\"580\\\" y=\\\"276\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Write sasta, read mehnga\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"580\\\" y=\\\"294\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Latency M ke saath badhti hai\\u003c/text>\\n\\u003c/svg>\\u003cfigcaption>Do strategies. Zyadatar real systems hybrid hain \u2014 normal users ke liye write, aur bahut bade audience wale senders ke liye read.\\u003c/figcaption>\\u003c/figure>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>\\u003c/th>\\u003cth>Fan-out on write\\u003c/th>\\u003cth>Fan-out on read\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Kya hota hai\\u003c/td>\\u003ctd>Event aate hi N recipients ke inbox me copy\\u003c/td>\\u003ctd>Read time pe sources query karke merge\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Read latency\\u003c/td>\\u003ctd>O(1), pehle se ready\\u003c/td>\\u003ctd>O(M), M sources ke saath badhti hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Write cost\\u003c/td>\\u003ctd>O(N), N recipients\\u003c/td>\\u003ctd>O(1)\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Storage\\u003c/td>\\u003ctd>N copies\\u003c/td>\\u003ctd>Ek copy\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Kab\\u003c/td>\\u003ctd>Recipients kam, reads zyada\\u003c/td>\\u003ctd>Recipients bahut, reads kam\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Celebrity problem\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Fan-out on write pe agar sender ke 50 million recipients hain to ek event = 50 million writes. Wo minutes le lega aur queue block ho jaayegi. \\u003cb>Hybrid answer:\\u003c/b> normal senders pe write fan-out, aur bade audience wale senders pe read fan-out \u2014 unke events read time pe merge karo. Ye jawab bolna aapko turant senior dikhata hai.\\u003c/div>\\u003c/div>\\u003ch3>Banking me ye kaisa dikhta hai\\u003c/h3>\\u003cp>Fintech me &quot;celebrity&quot; ek bank hota hai jo 2 crore customers ko ek regulatory notice bhejta hai. Wahan real-time fan-out ki zarurat hi nahi \u2014 batch job, throttled, priority queue me low priority. Isliye \\u003cb>priority classes\\u003c/b> zaroor mention karo.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>Priority queues - ye fintech me mandatory hai\\n\\n  P0  OTP, fraud alert          -&gt; seconds, koi batching nahi, dedicated capacity\\n  P1  transaction alert          -&gt; under a minute\\n  P2  statement ready            -&gt; minutes theek hai\\n  P3  marketing, regulatory bulk -&gt; hours, throttled, off-peak\\n\\nEk bulk campaign kabhi OTP delivery ko block nahi karna chahiye.\\u003c/code>\\u003c/pre>\\u003cpre class=\\\"code\\\">\\u003ccode>// Delivery: retry, dedupe, provider failover\\npublic void deliver(Notification n) {\\n    if (!dedupe.firstTime(n.idempotencyKey())) return;      // duplicate suppress\\n    if (!prefs.allows(n.userId(), n.channel(), n.category())) return;  // opt-out\\n    if (!userRateLimit.allow(n.userId(), n.category())) {   // Round 3 ka bucket\\n        queue.defer(n, Duration.ofMinutes(10));\\n        return;\\n    }\\n\\n    for (Provider p : providers.forChannel(n.channel())) {  // primary, phir backup\\n        try {\\n            Receipt r = p.send(n);\\n            audit.record(n, p, r);\\n            return;\\n        } catch (TransientException e) {\\n            continue;                                       // agla provider try karo\\n        } catch (PermanentException e) {\\n            audit.failed(n, p, e);                           // invalid number, retry bekaar\\n            return;\\n        }\\n    }\\n    queue.retryWithBackoff(n);                               // sab fail, backoff pe retry\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Delivery guarantee saaf bolo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">&quot;Main at-least-once dunga, aur dedupe key se duplicate suppress karunga. Exactly-once possible nahi hai kyunki provider ka ack kho sakta hai \u2014 us case me main dobara bhejna prefer karunga, kyunki ek extra OTP miss hue OTP se behtar hai. Marketing me ulta hoga.&quot;\\u003c/div>\\u003c/div>\"}, {\"id\": \"d4\", \"title\": \"Design 4 \u2014 Reservation without double-booking\", \"html\": \"\\u003cp>\\u003cb>Prompt:\\u003c/b> seat booking, flash sale inventory, ya fintech me \\u003cb>fund hold\\u003c/b>.\\u003c/p>\\u003cp>\\u003cb>Kyun ye:\\u003c/b> ye concurrency control ka canonical problem hai. Ek hi resource, kai claimants, aur galti ka cost bahut zyada.\\u003c/p>\\u003ch3>Teen states, aur TTL hi asli design hai\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>AVAILABLE  --reserve--&gt;  HELD (TTL 10 min)  --confirm--&gt;  CONFIRMED\\n                           |\\n                           +--TTL expire--&gt;  AVAILABLE\\u003c/code>\\u003c/pre>\\u003cp>Fintech version: user payment shuru karta hai, aap uske funds pe \\u003cb>hold\\u003c/b> lagate ho. Wo 10 minute me complete kare to capture, warna hold apne aap release ho jaaye. Bilkul wahi state machine hai.\\u003c/p>\\u003ch3>Concurrency control \u2014 teen options, ek best\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>// OPTION 1: conditional update  &lt;- best, database khud atomicity deta hai\\nint rows = jdbc.update(\\n    &quot;UPDATE seats SET status = &#x27;HELD&#x27;, held_by = ?, hold_expires_at = ? &quot; +\\n    &quot; WHERE id = ? AND status = &#x27;AVAILABLE&#x27;&quot;,\\n    user, expiry, seatId);\\n\\nif (rows == 0) throw new AlreadyTakenException();   // koi aur jeet gaya\\n// Koi lock nahi, koi retry nahi. Ek statement, atomic.\\n\\n\\n// OPTION 2: exclusion constraint - overlapping time ranges ke liye\\nALTER TABLE holds ADD CONSTRAINT no_overlap\\nEXCLUDE USING gist (resource_id WITH =, tstzrange(start_at, end_at) WITH &amp;&amp;);\\n\\n\\n// OPTION 3: SELECT ... FOR UPDATE - jab multiple rows check karni hon\\nSELECT * FROM seats WHERE id IN (?, ?, ?) ORDER BY id FOR UPDATE;\\n// ORDER BY id zaroori hai - warna deadlock (Round 4)\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Distributed lock yahan galat jawab hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Bahut candidates seedha Redis lock pe jaate hain. Interviewer ko impress karne wala jawab ulta hai: \\u003cb>&quot;yahan lock ki zarurat hi nahi, database ka conditional update kaafi hai&quot;\\u003c/b> \u2014 kyunki wo atomic hai, ek round trip hai, aur uske paas koi expiry ya fencing token wali problem nahi hai.\\u003c/div>\\u003c/div>\\u003ch3>TTL expiry kaise implement karein\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Approach\\u003c/th>\\u003cth>Verdict\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Cron jo har minute expired rows scan kare\\u003c/td>\\u003ctd>Simple, par table badi hone pe scan mehnga. Partial index (WHERE status='HELD') se theek ho jaata hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Redis key TTL + keyspace notification\\u003c/td>\\u003ctd>Fast, par Redis source of truth nahi hona chahiye \u2014 notification miss ho sakta hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Lazy expiry on read\\u003c/b>\\u003c/td>\\u003ctd>Read time pe check karo ki hold expire ho gaya. Isko cron ke saath combine karo \u2014 best of both\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cp>\\u003cb>Sabse robust answer:\\u003c/b> lazy expiry (correctness ke liye) plus background cleanup (storage ke liye). Sirf cron pe depend karoge to expiry aur next read ke beech me stale hold dikhega.\\u003c/p>\\u003ch3>Flash sale variant\\u003c/h3>\\u003cp>Agar prompt me 1 lakh log 1000 items ke liye ek second me aayein: DB pe seedha 1 lakh conditional updates mat maro. Pehle \\u003cb>rate limiter\\u003c/b> aur \\u003cb>admission control\\u003c/b> lagao (Round 3), phir Redis me atomic counter se pehle 1000 ko hi DB tak aane do. Baaki ko turant &quot;sold out&quot; do \u2014 unko queue me rakhne ka koi fayda nahi.\\u003c/p>\"}, {\"id\": \"d5\", \"title\": \"Design 5 \u2014 Transaction search aur statement\", \"html\": \"\\u003cp>\\u003cb>Prompt:\\u003c/b> user apne 5 saal ke transactions search kare \u2014 date range, amount range, merchant name, category.\\u003c/p>\\u003cp>\\u003cb>Kyun ye:\\u003c/b> ye read-side scale sikhata hai \u2014 CQRS, indexing, pagination, aur hot/cold storage. Dashboard, analytics, feed, sab isi ka roop hain.\\u003c/p>\\u003ch3>Core insight \u2014 write model se search nahi hota\\u003c/h3>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Ye line bolo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">&quot;Ledger table write ke liye optimized hai \u2014 append only, account id pe shard. Usi table pe merchant name ka full-text search chalana galat hai. Main ek alag \\u003cb>read model\\u003c/b> banaunga jo outbox events se feed hoga.&quot; Yahi CQRS hai, aur yahan wo genuinely justified hai \u2014 Round 7 me maine bola tha ki zyadatar jagah nahi hota.\\u003c/div>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>Ledger DB (write)          Search index (read)\\n  append only                denormalized document\\n  shard by accountId         merchant name, category, tags\\n  strong consistency         eventual, few seconds lag\\n        |\\n        +--&gt; outbox --&gt; Kafka --&gt; indexer --&gt; Elasticsearch / OpenSearch\\u003c/code>\\u003c/pre>\\u003ch3>Hot aur cold storage\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Tier\\u003c/th>\\u003cth>Data\\u003c/th>\\u003cth>Store\\u003c/th>\\u003cth>Latency\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Hot\\u003c/td>\\u003ctd>Last 90 din\\u003c/td>\\u003ctd>Postgres + search index\\u003c/td>\\u003ctd>under 100ms\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Warm\\u003c/td>\\u003ctd>90 din se 2 saal\\u003c/td>\\u003ctd>Search index, cheaper nodes\\u003c/td>\\u003ctd>under 1s\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Cold\\u003c/td>\\u003ctd>2 saal se zyada\\u003c/td>\\u003ctd>S3 Parquet, query on demand\\u003c/td>\\u003ctd>seconds, async job\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cp>Cold tier ke liye UI honest rahe: &quot;statement generate ho raha hai, ready hone pe email aayega.&quot; Ye legally bhi zaroori hai \u2014 banks ko 7-10 saal data rakhna padta hai par usko instant serve karna zaroori nahi.\\u003c/p>\\u003ch3>Pagination \u2014 offset nahi, cursor\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>-- GALAT: deep pages pe slow, aur naya data aane pe rows skip ho jaate hain\\nSELECT * FROM txns WHERE account_id = ?\\n ORDER BY created_at DESC LIMIT 50 OFFSET 100000;\\n\\n-- SAHI: keyset / cursor pagination\\nSELECT * FROM txns\\n WHERE account_id = ?\\n   AND (created_at, id) &lt; (?, ?)        -- last page ka cursor\\n ORDER BY created_at DESC, id DESC\\n LIMIT 50;\\n\\n-- (created_at, id) tuple isliye ki same timestamp wale rows pe bhi\\n-- ordering deterministic rahe. Sirf created_at se rows repeat ho sakte hain.\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Fintech ka special constraint\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Search index \\u003cb>eventually consistent\\u003c/b> hai. Agar user abhi transfer karke turant history dekhe aur wo na dikhe, to wo panic karega aur support call karega. \\u003cb>Fix:\\u003c/b> recent transactions (last few minutes) seedha ledger DB se padho aur search results ke upar merge kar do. Read-your-own-writes guarantee bani rehti hai.\\u003c/div>\\u003c/div>\"}, {\"id\": \"llm\", \"title\": \"LLM infra \u2014 ek short part\", \"html\": \"\\u003cp>2026 me LLM infrastructure prompts general engineering loops me aa gaye hain, sirf ML roles me nahi. Banking role me shayad na aaye, par mention hone pe blank nahi hona chahiye. Ye ek page kaafi hai.\\u003c/p>\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 260\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar14\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR14\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>LLM serving path\\u003c/title>\\n\\u003cdesc>Requests pass a gateway that enforces quota and token budget, hit a semantic cache,\\nand on a miss enter a queue where a batcher groups them for a GPU pool.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"40\\\" y=\\\"40\\\" width=\\\"170\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"125\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Client\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"125\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">prompt + context\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"210\\\" y1=\\\"69\\\" x2=\\\"246\\\" y2=\\\"69\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar14)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"250\\\" y=\\\"40\\\" width=\\\"280\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"390\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Gateway\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"390\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">auth, quota, token budget\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"530\\\" y1=\\\"69\\\" x2=\\\"566\\\" y2=\\\"69\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar14)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"570\\\" y=\\\"40\\\" width=\\\"170\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"655\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Semantic cache\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"655\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">embedding lookup\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M655 98 L655 122 L135 122 L135 146\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar14)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"400\\\" y=\\\"116\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">cache miss\\u003c/text>\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"40\\\" y=\\\"150\\\" width=\\\"190\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"135\\\" y=\\\"173\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Request queue\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"135\\\" y=\\\"192\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">priority + backpressure\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"230\\\" y1=\\\"179\\\" x2=\\\"266\\\" y2=\\\"179\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar14)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"270\\\" y=\\\"150\\\" width=\\\"210\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"375\\\" y=\\\"173\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Continuous batcher\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"375\\\" y=\\\"192\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">groups live requests\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"480\\\" y1=\\\"179\\\" x2=\\\"516\\\" y2=\\\"179\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar14)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"520\\\" y=\\\"150\\\" width=\\\"220\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"630\\\" y=\\\"173\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">GPU pool\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"630\\\" y=\\\"192\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">KV cache reuse\\u003c/text>\\u003c/g>\\n\\u003ctext class=\\\"ts\\\" x=\\\"40\\\" y=\\\"242\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Bottleneck GPU memory hai, CPU ya network nahi.\\u003c/text>\\n\\u003c/svg>\\u003cfigcaption>Baaki systems se sabse bada farak: bottleneck GPU memory hai, aur requests ka duration bahut variable hai \u2014 50 token bhi, 4000 token bhi.\\u003c/figcaption>\\u003c/figure>\"}, {\"id\": \"llm2\", \"title\": \"LLM infra \u2014 kya alag hai\", \"html\": \"\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Normal service\\u003c/th>\\u003cth>LLM service\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Request latency roughly uniform\\u003c/td>\\u003ctd>50 token vs 4000 token \u2014 100x farak\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Bottleneck CPU ya DB\\u003c/td>\\u003ctd>\\u003cb>GPU memory\\u003c/b> (KV cache), aur wo mehnga hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Autoscale seconds me\\u003c/td>\\u003ctd>GPU node minutes leta hai, aur available hi na ho\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Cost per request tiny\\u003c/td>\\u003ctd>Cost per request meaningful \u2014 isliye quota aur budget chahiye\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Retry sasta\\u003c/td>\\u003ctd>Retry mehnga \u2014 pehle validate karo\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003ch3>Chaar cheezein jo bolni chahiye\\u003c/h3>\\u003col class=\\\"num\\\">\\u003cli>\\u003cb>Continuous batching.\\u003c/b> Static batching me poora batch sabse lambi request ka wait karta hai. Continuous batching me jaise hi ek request khatam ho, uski jagah nayi aa jaati hai \u2014 GPU utilization bahut badh jaata hai.\\u003c/li>\\u003cli>\\u003cb>KV cache.\\u003c/b> Generation ke dauran attention keys aur values reuse hote hain. Yahi GPU memory khaata hai, aur yahi decide karta hai ki ek node pe kitne concurrent requests chalenge. Shared prefix (jaise ek common system prompt) ka cache reuse bada win hai.\\u003c/li>\\u003cli>\\u003cb>Semantic cache.\\u003c/b> Exact match cache LLM me kaam nahi karta kyunki prompts thode alag hote hain. Embedding similarity se cache karo. Fintech me ye khaas kaam ka hai \u2014 &quot;mera balance kya hai&quot; ke 50 phrasings ek hi intent hain.\\u003c/li>\\u003cli>\\u003cb>Quota aur token budget.\\u003c/b> Rate limit request count pe nahi, \\u003cb>tokens\\u003c/b> pe lagao \u2014 kyunki cost wahin hai. Round 3 ka token bucket literally yahan fit hota hai, bas permits = estimated tokens.\\u003c/li>\\u003c/ol>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Banking context me ye add karo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">&quot;Regulated environment me main model ko kabhi authoritative nahi banaunga. LLM sirf retrieval aur summarisation kare; balance, limits aur eligibility hamesha deterministic system se aayein. Aur har prompt-response pair audit log me jaaye, PII redaction ke saath.&quot; Ye jawab compliance awareness dikhata hai, jo banking me technical skill se kam important nahi hai.\\u003c/div>\\u003c/div>\"}], \"mocks\": [{\"tag\": \"Opener\", \"q\": \"Design a payment system that handles 10,000 transactions per second.\", \"a\": \"\\u003cp>Pehle main scope pin karunga: ye internal wallet transfers hain ya card network jaisa external settlement? Main wallet maan ke chalta hoon, aur agar galat ho to adjust kar lunga.\\u003c/p>\\u003cp>Sabse pehla decision: \\u003cb>10K TPS pe sync writes nahi honge.\\u003c/b> API sirf accept karega \u2014 validate, idempotency check, Kafka pe publish, aur 202 with a status URL. User ko Processing dikhega. Yahi real payment networks karte hain.\\u003c/p>\\u003cp>Kafka me partition key \\u003cb>accountId\\u003c/b> hoga. Isse ek account ke saare transactions ek partition me rahenge, ek hi consumer unko process karega, aur us account pe concurrent write ka sawaal hi nahi rahega. Locking ki zarurat khatam. Ordering per-account mil jaayegi, aur alag accounts parallel chalenge.\\u003c/p>\\u003cp>Ledger append-only double-entry hoga, accountId pe shard. 10 shards pe 1000 writes per second per shard \u2014 ek Postgres node ye comfortably kar leta hai.\\u003c/p>\\u003cp>Aur main saaf bolunga ki main \\u003cb>global ordering nahi\\u003c/b> de raha, sirf per-account. Global maango to ek partition pe atak jaoge aur 10K TPS possible hi nahi hai.\\u003c/p>\"}, {\"tag\": \"Pushback\", \"q\": \"Aapne kaha 202 Accepted. Par user ko turant confirmation chahiye. Ab?\", \"a\": \"\\u003cp>Achha point. Do options hain aur unka trade-off alag hai.\\u003c/p>\\u003cp>\\u003cb>Option 1 \u2014 sync fast path.\\u003c/b> Chhoti amounts aur trusted accounts ke liye sync process karo, baaki async. 90% transactions instant confirm honge, aur 10% Processing dikhayenge. Cost: do code paths maintain karne padenge, aur peak pe fast path bhi choke ho sakta hai.\\u003c/p>\\u003cp>\\u003cb>Option 2 \u2014 async plus push.\\u003c/b> 202 do, par processing typically 200 millisecond leti hai. Client WebSocket ya SSE pe result turant paa jaata hai. User ke liye ye sync jaisa hi lagta hai.\\u003c/p>\\u003cp>Main option 2 chununga. Ek hi code path rehta hai, aur perceived latency almost wahi hai. Aur agar system slow ho jaye to graceful degrade hota hai \u2014 user ko Processing dikhega, error nahi.\\u003c/p>\\u003cp>Par main ye zaroor clarify karunga ki &quot;turant&quot; ka matlab kya hai. Agar 200ms acceptable hai to async theek hai. Agar hard requirement 50ms hai to design hi badalna padega.\\u003c/p>\"}, {\"tag\": \"Deep dive\", \"q\": \"Balance kaise store karenge? Har baar sum karenge?\", \"a\": \"\\u003cp>Nahi, par main snapshot ko authoritative bhi nahi banaunga.\\u003c/p>\\u003cp>Main teeno options ka trade-off bolta hoon. Har read pe \\u003ccode class=\\\"ic\\\">SUM(entries)\\u003c/code> hamesha correct hai par millions rows pe scan slow hai. Sirf snapshot rakhna O(1) hai par drift ka risk hai \u2014 koi bug snapshot aur entries ko diverge kar sakta hai, aur paise me silent drift acceptable nahi.\\u003c/p>\\u003cp>Mera answer: \\u003cb>snapshot rakho, entries se verify karo.\\u003c/b> Balance table me balance_paise aur last_entry_id dono rakho. Read O(1) hai. Ek nightly job entries se recompute karke compare karta hai, aur mismatch pe alert bhejta hai.\\u003c/p>\\u003cp>Aur ledger hamesha source of truth rahega. Snapshot ek \\u003cb>cache\\u003c/b> hai jise kabhi bhi entries se rebuild kiya ja sakta hai. Agar snapshot corrupt ho jaye to system recover kar sakta hai \u2014 ulta possible nahi hota.\\u003c/p>\"}, {\"tag\": \"Pushback\", \"q\": \"Ek merchant 50% traffic la raha hai. Aapki accountId partitioning toot gayi.\", \"a\": \"\\u003cp>Haan, ye hot partition problem hai aur mera design isse handle nahi karta. Achha catch.\\u003c/p>\\u003cp>Fix ye hai ki us account ke liye key ko sub-shard karun \u2014 \\u003ccode class=\\\"ic\\\">accountId + hash(txnId) % 16\\u003c/code>. Ab uska traffic 16 partitions me phail jaayega.\\u003c/p>\\u003cp>Par iska ek \\u003cb>real cost\\u003c/b> hai jo mujhe bolna chahiye: us account ke liye ordering guarantee chali jaayegi, kyunki uske transactions alag partitions me parallel process honge.\\u003c/p>\\u003cp>To sawaal ye hai \u2014 us merchant ke liye ordering matter karti hai? Agar wo sirf credits receive kar raha hai to nahi, kyunki addition commutative hai. Agar uske balance pe limits check ho rahi hain to haan, aur tab mujhe alag approach chahiye \u2014 jaise us account ke liye dedicated worker aur batched updates.\\u003c/p>\\u003cp>Main is decision ko configurable rakhunga, per-account, kyunki har merchant ka pattern alag hoga.\\u003c/p>\"}, {\"tag\": \"Fan-out\", \"q\": \"Notification system me ek bank 2 crore customers ko notice bhejta hai. Kya hoga?\", \"a\": \"\\u003cp>Naive fan-out on write pe ye 2 crore writes hain. Wo queue block kar dega aur uske peeche OTP atak jaayenge \u2014 jo sabse bura outcome hai.\\u003c/p>\\u003cp>\\u003cb>Do fixes, dono zaroori hain.\\u003c/b>\\u003c/p>\\u003cp>\\u003cb>Pehla, priority classes.\\u003c/b> OTP aur fraud alerts P0 hain \u2014 dedicated capacity, koi batching nahi. Bulk regulatory notices P3 hain \u2014 throttled aur off-peak. Ek bulk campaign kabhi OTP delivery ko block nahi kar sakta. Ye separation infrastructure level pe hona chahiye, sirf queue priority se nahi.\\u003c/p>\\u003cp>\\u003cb>Doosra, bulk ke liye fan-out on write karna hi nahi.\\u003c/b> Ek campaign record banao aur usko recipients ke against read time pe resolve karo, ya batch job se chunks me process karo \u2014 10,000 per batch, rate limited.\\u003c/p>\\u003cp>Aur yahan real-time ki zarurat hi nahi hai. Regulatory notice ka SLA hours me hota hai, seconds me nahi. Requirement ko question karna bhi design ka hissa hai.\\u003c/p>\"}, {\"tag\": \"Concurrency\", \"q\": \"Do users ek hi seat book kar rahe hain. Distributed lock lagayenge?\", \"a\": \"\\u003cp>Nahi, aur ye deliberate hai. Yahan lock ki zarurat hi nahi.\\u003c/p>\\u003cp>Ek \\u003cb>conditional update\\u003c/b> kaafi hai: \\u003ccode class=\\\"ic\\\">UPDATE seats SET status=&#x27;HELD&#x27; WHERE id=? AND status=&#x27;AVAILABLE&#x27;\\u003c/code>. Database ise atomically karta hai. Jiska rows_affected 1 aaya wo jeeta, jiska 0 aaya wo haara. Ek round trip, koi coordination nahi, koi expiry ka issue nahi.\\u003c/p>\\u003cp>Distributed lock yahan actually \\u003cb>kamzor\\u003c/b> option hai. Uske paas lock expiry, GC pause, aur fencing token wali poori class of problems hain \u2014 aur wo sab yahan bilkul avoidable hain.\\u003c/p>\\u003cp>Main distributed lock tab lunga jab coordination multiple systems ke beech chahiye ho, jaise ek scheduled job jo sirf ek instance pe chale. Single database ke andar constraint hamesha behtar hai.\\u003c/p>\\u003cp>Aur hold ke saath TTL rakhunga \u2014 10 minute. Expiry lazy check plus background cleanup, dono se, kyunki sirf cron pe depend karne se expiry aur next read ke beech stale hold dikhega.\\u003c/p>\"}, {\"tag\": \"Consistency\", \"q\": \"User transfer karke turant history dekhta hai par transaction nahi dikhta. Ye acceptable hai?\", \"a\": \"\\u003cp>Nahi, banking me bilkul nahi. User panic karega aur support call karega \u2014 aur wo technically &quot;eventual consistency&quot; hone se koi farak nahi padta.\\u003c/p>\\u003cp>Problem ye hai ki search index outbox events se feed hota hai, isliye usme kuch second ka lag hai. Wo lag search ke liye theek hai par \\u003cb>apne hi transaction\\u003c/b> ke liye nahi.\\u003c/p>\\u003cp>\\u003cb>Fix \u2014 read your own writes.\\u003c/b> Last few minutes ke transactions seedha ledger DB se padho, aur search index ke results ke upar merge kar do. Ledger accountId pe shard hai, to ye query fast hai \u2014 ek account ka recent slice.\\u003c/p>\\u003cp>Ye ek general pattern hai: eventual consistency read-heavy analytics ke liye theek hai, par user ke apne data ke liye hamesha ek strongly consistent path rakho. Cost sirf itna hai ki read path me ek merge step add hota hai.\\u003c/p>\"}, {\"tag\": \"LLM\", \"q\": \"Aapke banking app me AI assistant add karna hai. Kaise design karenge?\", \"a\": \"\\u003cp>Pehla aur sabse important decision: \\u003cb>model kabhi authoritative nahi hoga.\\u003c/b> Balance, limits, eligibility, transaction status \u2014 ye sab deterministic systems se aayenge. LLM sirf natural language samajhne aur jawab format karne ka kaam karega.\\u003c/p>\\u003cp>Architecture: gateway pe auth, quota aur \\u003cb>token budget\\u003c/b> \u2014 rate limit request count pe nahi, tokens pe, kyunki cost wahin hai. Round 3 ka token bucket seedha fit hota hai, bas permits estimated tokens ban jaate hain.\\u003c/p>\\u003cp>Phir \\u003cb>semantic cache\\u003c/b>. &quot;Mera balance kya hai&quot; ke 50 phrasings ek hi intent hain \u2014 embedding similarity se cache karo. Exact match cache LLM me kaam nahi karta.\\u003c/p>\\u003cp>Serving side pe continuous batching, kyunki request duration bahut variable hai. Bottleneck GPU memory hai \u2014 KV cache. Shared system prompt ka prefix cache reuse bada win deta hai.\\u003c/p>\\u003cp>Aur regulated environment me: har prompt aur response audit log me, PII redaction ke saath. Aur koi bhi action \u2014 transfer, limit change \u2014 model se nahi, explicit user confirmation ke baad deterministic path se hi jaayega.\\u003c/p>\"}]}, {\"id\": \"dsa\", \"num\": 9, \"kind\": \"Coding\", \"title\": \"DSA warm-up\", \"blurb\": \"Karat ke coding problems LeetCode-hard nahi hote \u2014 practical, medium level. Hash map aur frequency counting akela 40%+ questions cover karta hai.\", \"sections\": [{\"id\": \"rhythm\", \"title\": \"Rhythm \u2014 har problem pe yahi\", \"html\": \"\\u003cp>Karat qualitative rubric use karta hai \u2014 aapko score breakdown kabhi nahi dikhta. Interviewer dekhta hai ki aapka code problem kitna theek solve karta hai \\u003cb>aur aap kaise pahunche\\u003c/b>. Isliye har problem pe ek fixed rhythm rakho:\\u003c/p>\\u003col class=\\\"num\\\">\\u003cli>\\u003cb>Clarify (60 sec).\\u003c/b> Input size? Duplicates? Empty input? Sorted? Return kya \u2014 value, index, ya list? Ek galat assumption poora solution barbaad kar deti hai.\\u003c/li>\\u003cli>\\u003cb>Plan out loud (60 sec).\\u003c/b> &quot;Main hash map se frequency count karunga, phir ek pass me max nikalunga. O(n) time, O(n) space.&quot; Approach bolne se pehle code mat likho.\\u003c/li>\\u003cli>\\u003cb>Code (10-12 min).\\u003c/b> Bolte hue likho. Chup mat raho.\\u003c/li>\\u003cli>\\u003cb>Test (2-3 min).\\u003c/b> Ek normal case aur ek edge case khud chalao, line by line. Interviewer ke bataye bina.\\u003c/li>\\u003cli>\\u003cb>Explain complexity.\\u003c/b> Time aur space, dono. Aur agar improve ho sakta hai to bolo.\\u003c/li>\\u003c/ol>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Ek counter-intuitive baat\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Interviewers un candidates ko flag karte hain jo \\u003cb>bina kisi iteration ke perfect code likh dete hain\\u003c/b> \u2014 wo suspicious mana jaata hai. Step by step kaam karna hi expected behaviour hai. Ek chhoti galti karke usko khud pakadna aur theek karna bilkul normal hai \u2014 balki achha signal hai.\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Sabse bada risk\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Silence. Sabse mushkil hissa questions nahi hain, \\u003cb>60 minute tak vocal rehna\\u003c/b> hai. Agar aap atak jaao to jo pata hai wo bolo \u2014 &quot;mujhe lag raha hai yahan hash map chahiye par main soch raha hoon ki key kya banegi&quot;. Chup rehna sabse mehnga hai.\\u003c/div>\\u003c/div>\\u003ch3>Pattern distribution\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Pattern\\u003c/th>\\u003cth>Kitna common\\u003c/th>\\u003cth>Kya practice karein\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>\\u003cb>Hash map / frequency\\u003c/b>\\u003c/td>\\u003ctd>~40%+ questions\\u003c/td>\\u003ctd>Counting, grouping, dedupe, lookup by key\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Grid BFS / DFS\\u003c/b>\\u003c/td>\\u003ctd>Common\\u003c/td>\\u003ctd>Islands, shortest path, reachability\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Arrays / intervals\\u003c/b>\\u003c/td>\\u003ctd>Common\\u003c/td>\\u003ctd>Merge, sort, two pointer\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Sliding window\\u003c/b>\\u003c/td>\\u003ctd>Regular\\u003c/td>\\u003ctd>Longest substring, window sums, time windows\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Stack / string parsing\\u003c/b>\\u003c/td>\\u003ctd>Regular\\u003c/td>\\u003ctd>Parentheses, tokenizing, logs\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Advanced (DP, trie, graph algos)\\u003c/td>\\u003ctd>Kam\\u003c/td>\\u003ctd>Zyada time mat do\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cp>Sweet spot \\u003cb>medium-level, data structures pe focused\\u003c/b> problems hain. Reported Karat problems me grid traversal bina kisi advanced algorithm ke, aur hash map plus set operations dono aate hain.\\u003c/p>\"}, {\"id\": \"hashmap\", \"title\": \"Hash map aur frequency \u2014 40% yahi hai\", \"html\": \"\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">01\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Most frequent element\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">warm-up\\u003c/span>\\u003c/div>\\u003cp>Array me sabse zyada baar aane wala element lautao. Tie pe koi bhi chalega.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>public int mostFrequent(int[] nums) {\\n    if (nums == null || nums.length == 0)\\n        throw new IllegalArgumentException(&quot;empty input&quot;);\\n\\n    Map&lt;Integer, Integer&gt; freq = new HashMap&lt;&gt;();\\n    int best = nums[0], bestCount = 0;\\n\\n    for (int x : nums) {\\n        int count = freq.merge(x, 1, Integer::sum);   // count karo aur wapas lo\\n        if (count &gt; bestCount) { bestCount = count; best = x; }\\n    }\\n    return best;\\n}\\n// O(n) time, O(n) space. Ek hi pass - alag se max dhoondhne ki zarurat nahi.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Clarify:\\u003c/b> tie pe kya? Empty array pe kya? Negative numbers allowed? \\u003cb>Follow-up:\\u003c/b> top K frequent \u2014 tab min-heap of size K use karo, O(n log k).\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">02\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Two sum\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">warm-up\\u003c/span>\\u003c/div>\\u003cp>Do indices lautao jinke values ka sum target ho.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>public int[] twoSum(int[] nums, int target) {\\n    Map&lt;Integer, Integer&gt; seen = new HashMap&lt;&gt;();   // value -&gt; index\\n\\n    for (int i = 0; i &lt; nums.length; i++) {\\n        Integer j = seen.get(target - nums[i]);     // complement pehle dekha?\\n        if (j != null) return new int[]{j, i};\\n        seen.put(nums[i], i);\\n    }\\n    return new int[0];\\n}\\n// O(n). Sorting + two pointer O(n log n) hoga aur indices bhi kho jayenge.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Trap:\\u003c/b> \\u003ccode class=\\\"ic\\\">seen.put\\u003c/code> ko lookup ke \\u003cb>baad\\u003c/b> rakho. Pehle rakhoge to target = 2 aur nums = [1] pe element khud ko match kar lega.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">03\\u003c/span>\\u003cspan class=\\\"prob-t\\\">First non-repeating character\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">string\\u003c/span>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>public char firstUnique(String s) {\\n    Map&lt;Character, Integer&gt; count = new LinkedHashMap&lt;&gt;();   // insertion order\\n\\n    for (char ch : s.toCharArray()) count.merge(ch, 1, Integer::sum);\\n\\n    for (Map.Entry&lt;Character, Integer&gt; e : count.entrySet())\\n        if (e.getValue() == 1) return e.getKey();\\n\\n    return &#x27;_&#x27;;   // koi unique nahi\\n}\\n// LinkedHashMap isliye ki doosra pass insertion order me chale.\\n// HashMap use karte to order random hota aur &quot;first&quot; ka matlab hi khatam.\\u003c/code>\\u003c/pre>\\u003cp>Ye choice bolna zaroori hai \u2014 LinkedHashMap kyun, HashMap kyun nahi. Yahi wo detail hai jispe interviewer follow-up karta hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">04\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Group anagrams\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">grouping\\u003c/span>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>public List&lt;List&lt;String&gt;&gt; groupAnagrams(String[] words) {\\n    Map&lt;String, List&lt;String&gt;&gt; groups = new HashMap&lt;&gt;();\\n\\n    for (String w : words) {\\n        char[] chars = w.toCharArray();\\n        Arrays.sort(chars);                          // canonical key\\n        groups.computeIfAbsent(new String(chars), k -&gt; new ArrayList&lt;&gt;()).add(w);\\n    }\\n    return new ArrayList&lt;&gt;(groups.values());\\n}\\n// O(n * k log k), k = average word length.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Follow-up jo aata hai:\\u003c/b> sorting ke bina? Tab key ke liye 26-length count array ka string banao \u2014 O(n * k). Sorting se tez, par code lamba hoga; interviewer ke poochne pe hi karo.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">05\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Top N from log lines\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">practical\\u003c/span>\\u003c/div>\\u003cp>Logs me se sabse zyada aane wale N endpoints lautao. Ye Karat-style practical flavour hai.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>public List&lt;String&gt; topN(List&lt;String&gt; logs, int n) {\\n    Map&lt;String, Integer&gt; freq = new HashMap&lt;&gt;();\\n    for (String line : logs) freq.merge(extractEndpoint(line), 1, Integer::sum);\\n\\n    // Min-heap of size n: sabse chhota top pe, to usko nikalna sasta hai\\n    PriorityQueue&lt;Map.Entry&lt;String, Integer&gt;&gt; heap =\\n        new PriorityQueue&lt;&gt;(Map.Entry.comparingByValue());\\n\\n    for (Map.Entry&lt;String, Integer&gt; e : freq.entrySet()) {\\n        heap.offer(e);\\n        if (heap.size() &gt; n) heap.poll();            // sabse kam frequency gira do\\n    }\\n\\n    List&lt;String&gt; out = new ArrayList&lt;&gt;();\\n    while (!heap.isEmpty()) out.add(heap.poll().getKey());\\n    Collections.reverse(out);                        // descending chahiye\\n    return out;\\n}\\n// O(m log n), m = unique keys. Poora sort O(m log m) hota.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Kyun min-heap, max-heap nahi:\\u003c/b> humein top N chahiye, isliye heap me sabse \\u003cb>kam\\u003c/b> wala top pe rakhna hai taaki usko nikal sakein. Ye ulta lagta hai par yahi sahi hai \u2014 aur interviewer isko explicitly poochta hai.\\u003c/p>\\u003c/div>\"}, {\"id\": \"badge\", \"title\": \"Badge access \u2014 reported Karat problem\", \"html\": \"\\u003cp>Ye actual reported Karat problem hai, aur ye \\u003cb>multi-part\\u003c/b> hai \u2014 bilkul waise jaise Karat ke problems escalate karte hain. Part 1 simple, part 2 sliding window.\\u003c/p>\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">06\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Invalid badge records\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">part 1\\u003c/span>\\u003c/div>\\u003cp>Records diye gaye hain chronological order me: \\u003ccode class=\\\"ic\\\">[name, action]\\u003c/code> jahan action &quot;enter&quot; ya &quot;exit&quot; hai. Aise log lautao jo bina exit kiye enter kar gaye, ya bina enter kiye exit kar gaye.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>public List&lt;String&gt; invalidRecords(List&lt;String[]&gt; records) {\\n    Set&lt;String&gt; inside = new HashSet&lt;&gt;();\\n    Set&lt;String&gt; bad    = new LinkedHashSet&lt;&gt;();      // order stable rahe\\n\\n    for (String[] r : records) {\\n        String name = r[0], action = r[1];\\n\\n        if (action.equals(&quot;enter&quot;)) {\\n            if (!inside.add(name)) bad.add(name);     // add false = pehle se andar\\n        } else {\\n            if (!inside.remove(name)) bad.add(name);  // remove false = andar tha hi nahi\\n        }\\n    }\\n    bad.addAll(inside);        // jo end tak andar reh gaye = kabhi exit nahi kiya\\n    return new ArrayList&lt;&gt;(bad);\\n}\\n// O(n) time, O(n) space.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Elegance yahan hai:\\u003c/b> \\u003ccode class=\\\"ic\\\">Set.add()\\u003c/code> aur \\u003ccode class=\\\"ic\\\">Set.remove()\\u003c/code> dono boolean lautate hain. Usi return value se duplicate enter aur orphan exit dono detect ho jaate hain \u2014 koi alag state machine nahi chahiye.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">07\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Three uses within one hour\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">part 2\\u003c/span>\\u003c/div>\\u003cp>Un logon ko lautao jinhone kisi bhi ek-ghante ki window me 3 ya zyada baar badge use kiya. Times \\u003ccode class=\\\"ic\\\">&quot;1300&quot;\\u003c/code> format me hain.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>public Map&lt;String, List&lt;Integer&gt;&gt; frequentAccess(List&lt;String[]&gt; records) {\\n    // 1. Har person ke times ikattha karo\\n    Map&lt;String, List&lt;Integer&gt;&gt; byPerson = new HashMap&lt;&gt;();\\n    for (String[] r : records)\\n        byPerson.computeIfAbsent(r[0], k -&gt; new ArrayList&lt;&gt;()).add(toMinutes(r[1]));\\n\\n    Map&lt;String, List&lt;Integer&gt;&gt; out = new LinkedHashMap&lt;&gt;();\\n\\n    for (Map.Entry&lt;String, List&lt;Integer&gt;&gt; e : byPerson.entrySet()) {\\n        List&lt;Integer&gt; times = e.getValue();\\n        Collections.sort(times);                     // window ke liye sorted chahiye\\n\\n        int i = 0;                                   // 2. Sliding window\\n        for (int j = 0; j &lt; times.size(); j++) {\\n            while (times.get(j) - times.get(i) &gt;= 60) i++;   // window shrink karo\\n            if (j - i + 1 &gt;= 3) {\\n                out.put(e.getKey(), new ArrayList&lt;&gt;(times.subList(i, j + 1)));\\n                break;                               // pehli window mili, bas\\n            }\\n        }\\n    }\\n    return out;\\n}\\n\\nprivate int toMinutes(String hhmm) {\\n    int v = Integer.parseInt(hhmm);\\n    return (v / 100) * 60 + v % 100;                 // 1300 -&gt; 780\\n}\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Clarify zaroor karein:\\u003c/b> &quot;within one hour&quot; ka matlab strictly less than 60 minutes hai ya 60 included hai? Aur agar kisi ne 5 baar use kiya to saare 5 timestamps chahiye ya pehle 3? Ye poochna hi rubric me points deta hai \u2014 kyunki problem statement genuinely ambiguous hai.\\u003c/p>\\u003c/div>\"}, {\"id\": \"grid\", \"title\": \"Grid traversal \u2014 BFS aur DFS\", \"html\": \"\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">08\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Number of islands\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">DFS\\u003c/span>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>public int numIslands(char[][] grid) {\\n    if (grid == null || grid.length == 0) return 0;\\n    int count = 0;\\n\\n    for (int r = 0; r &lt; grid.length; r++)\\n        for (int col = 0; col &lt; grid[0].length; col++)\\n            if (grid[r][col] == &#x27;1&#x27;) { count++; sink(grid, r, col); }\\n\\n    return count;\\n}\\n\\nprivate void sink(char[][] g, int r, int c) {\\n    if (r &lt; 0 || r &gt;= g.length || c &lt; 0 || c &gt;= g[0].length || g[r][c] != &#x27;1&#x27;) return;\\n    g[r][c] = &#x27;0&#x27;;                                   // visited mark\\n    sink(g, r + 1, c); sink(g, r - 1, c);\\n    sink(g, r, c + 1); sink(g, r, c - 1);\\n}\\n// O(rows * cols) time, O(rows * cols) worst-case recursion depth.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Ye bolna zaroori hai:\\u003c/b> main input grid ko \\u003cb>mutate\\u003c/b> kar raha hoon visited mark karne ke liye. Ye O(1) extra space deta hai, par caller ka data badal jaata hai. Agar wo acceptable na ho to alag \\u003ccode class=\\\"ic\\\">boolean[][] visited\\u003c/code> array use karunga. Ye trade-off khud se bolna senior signal hai.\\u003c/p>\\u003cp>\\u003cb>Aur:\\u003c/b> bahut badi grid pe recursion stack overflow kar sakti hai \u2014 tab explicit stack ya BFS use karunga.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">09\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Nearest exit from maze\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">BFS\\u003c/span>\\u003c/div>\\u003cp>Maze me entrance se sabse paas ke exit tak minimum steps. Exit koi bhi border cell hai jo entrance na ho. \\u003ccode class=\\\"ic\\\">&#x27;+&#x27;\\u003c/code> deewar hai, \\u003ccode class=\\\"ic\\\">&#x27;.&#x27;\\u003c/code> raasta.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>public int nearestExit(char[][] maze, int[] entrance) {\\n    int m = maze.length, n = maze[0].length;\\n    int[][] dirs = {{1,0}, {-1,0}, {0,1}, {0,-1}};\\n\\n    Deque&lt;int[]&gt; queue = new ArrayDeque&lt;&gt;();\\n    queue.add(entrance);\\n    maze[entrance[0]][entrance[1]] = &#x27;+&#x27;;            // entrance visited\\n\\n    int steps = 0;\\n    while (!queue.isEmpty()) {\\n        steps++;                                     // ek poora level = ek step\\n        for (int size = queue.size(); size &gt; 0; size--) {\\n            int[] cur = queue.poll();\\n\\n            for (int[] d : dirs) {\\n                int r = cur[0] + d[0], col = cur[1] + d[1];\\n                if (r &lt; 0 || r &gt;= m || col &lt; 0 || col &gt;= n) continue;\\n                if (maze[r][col] == &#x27;+&#x27;) continue;\\n\\n                if (r == 0 || r == m - 1 || col == 0 || col == n - 1)\\n                    return steps;                    // border pe pahunch gaye\\n\\n                maze[r][col] = &#x27;+&#x27;;                  // enqueue ke waqt mark karo\\n                queue.add(new int[]{r, col});\\n            }\\n        }\\n    }\\n    return -1;\\n}\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Do cheezein jo log galat karte hain.\\u003c/b> Pehla: \\u003cb>BFS chahiye, DFS nahi\\u003c/b> \u2014 shortest path poocha gaya hai, aur DFS pehla mila raasta dega jo sabse chhota hona zaroori nahi. Doosra: visited \\u003cb>enqueue ke waqt\\u003c/b> mark karo, dequeue ke waqt nahi \u2014 warna ek cell kai baar queue me chala jaayega.\\u003c/p>\\u003c/div>\"}, {\"id\": \"intervals\", \"title\": \"Intervals aur arrays\", \"html\": \"\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">10\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Merge overlapping intervals\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">sorting\\u003c/span>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>public int[][] merge(int[][] intervals) {\\n    if (intervals.length &lt;= 1) return intervals;\\n\\n    Arrays.sort(intervals, Comparator.comparingInt(a -&gt; a[0]));   // start pe sort\\n\\n    List&lt;int[]&gt; out = new ArrayList&lt;&gt;();\\n    int[] current = intervals[0].clone();\\n\\n    for (int i = 1; i &lt; intervals.length; i++) {\\n        if (intervals[i][0] &lt;= current[1]) {                      // overlap\\n            current[1] = Math.max(current[1], intervals[i][1]);\\n        } else {\\n            out.add(current);\\n            current = intervals[i].clone();\\n        }\\n    }\\n    out.add(current);                                             // aakhri wala\\n    return out.toArray(new int[0][]);\\n}\\n// O(n log n) sort, O(n) merge.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Do trap:\\u003c/b> loop ke baad \\u003ccode class=\\\"ic\\\">current\\u003c/code> add karna mat bhoolo. Aur \\u003ccode class=\\\"ic\\\">Math.max\\u003c/code> zaroori hai \u2014 ek interval poora doosre ke andar ho sakta hai, jaise [1,10] aur [2,3].\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">11\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Minimum meeting rooms\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">sorting\\u003c/span>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>public int minRooms(int[][] meetings) {\\n    int n = meetings.length;\\n    if (n == 0) return 0;\\n\\n    int[] starts = new int[n], ends = new int[n];\\n    for (int i = 0; i &lt; n; i++) { starts[i] = meetings[i][0]; ends[i] = meetings[i][1]; }\\n\\n    Arrays.sort(starts);\\n    Arrays.sort(ends);                               // starts aur ends alag sort\\n\\n    int rooms = 0, max = 0, j = 0;\\n    for (int i = 0; i &lt; n; i++) {\\n        while (j &lt; n &amp;&amp; ends[j] &lt;= starts[i]) { rooms--; j++; }   // khaali hue\\n        rooms++;                                                   // naya start\\n        max = Math.max(max, rooms);\\n    }\\n    return max;\\n}\\n// O(n log n). Heap wala solution bhi chalta hai par ye simpler hai.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Insight:\\u003c/b> starts aur ends ko \\u003cb>alag-alag\\u003c/b> sort karna counter-intuitive lagta hai \u2014 pairs toot jaate hain. Par humein sirf ye jaanna hai ki kisi bhi waqt kitne meetings chal rahe hain, ye nahi ki kaun sa meeting kaun se room me hai.\\u003c/p>\\u003c/div>\"}, {\"id\": \"window\", \"title\": \"Sliding window aur stack\", \"html\": \"\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">12\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Longest substring without repeating characters\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">window\\u003c/span>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>public int lengthOfLongest(String s) {\\n    int[] lastSeen = new int[128];                   // ASCII\\n    Arrays.fill(lastSeen, -1);\\n\\n    int best = 0, windowStart = 0;\\n\\n    for (int i = 0; i &lt; s.length(); i++) {\\n        char ch = s.charAt(i);\\n\\n        if (lastSeen[ch] &gt;= windowStart)             // window ke andar repeat mila\\n            windowStart = lastSeen[ch] + 1;          // window aage sarkao\\n\\n        lastSeen[ch] = i;\\n        best = Math.max(best, i - windowStart + 1);\\n    }\\n    return best;\\n}\\n// O(n) time, O(1) space (fixed 128 array).\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Sabse common bug:\\u003c/b> \\u003ccode class=\\\"ic\\\">windowStart\\u003c/code> ko piche jaane dena. Condition me \\u003ccode class=\\\"ic\\\">&gt;= windowStart\\u003c/code> isliye hai \u2014 agar repeat window ke bahar tha to usko ignore karo. Bina iske &quot;abba&quot; jaise inputs pe galat jawab aayega.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"prob\\\">\\u003cdiv class=\\\"prob-h\\\">\\u003cspan class=\\\"prob-n\\\">13\\u003c/span>\\u003cspan class=\\\"prob-t\\\">Valid parentheses\\u003c/span>\\u003cspan class=\\\"prob-tag\\\">stack\\u003c/span>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>public boolean isValid(String s) {\\n    Deque&lt;Character&gt; stack = new ArrayDeque&lt;&gt;();\\n    Map&lt;Character, Character&gt; pairs = Map.of(&#x27;)&#x27;, &#x27;(&#x27;, &#x27;]&#x27;, &#x27;[&#x27;, &#x27;}&#x27;, &#x27;{&#x27;);\\n\\n    for (char ch : s.toCharArray()) {\\n        if (pairs.containsValue(ch)) {\\n            stack.push(ch);                          // opening\\n        } else if (pairs.containsKey(ch)) {          // closing\\n            if (stack.isEmpty() || stack.pop() != pairs.get(ch)) return false;\\n        }\\n        // baaki characters ignore\\n    }\\n    return stack.isEmpty();                          // kuch khula reh gaya?\\n}\\n// O(n) time, O(n) space.\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Stack ke liye ArrayDeque use karo, \\u003ccode class=\\\"ic\\\">java.util.Stack\\u003c/code> nahi.\\u003c/b> Stack legacy hai, Vector extend karta hai, aur har operation synchronized hai \u2014 bekaar ka overhead. Ye choice bolna chhoti si baat hai par modern Java awareness dikhati hai.\\u003c/p>\\u003c/div>\"}, {\"id\": \"checklist\", \"title\": \"Practice plan aur checklist\", \"html\": \"\\u003ch3>Agar 3 din hain\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Din\\u003c/th>\\u003cth>Kya\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Din 1\\u003c/td>\\u003ctd>Problems 1-7 (hash map + badge). Har ek plain text editor me, timer ke saath, bolte hue\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Din 2\\u003c/td>\\u003ctd>Problems 8-11 (grid + intervals). Grid problems pe extra time \u2014 BFS vs DFS ka chunav sochna\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Din 3\\u003c/td>\\u003ctd>Problems 12-13, phir 1-13 me se 4 random dobara. Sirf wo jo pehli baar atke the\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Sabse important practice rule\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Plain text editor me likho \u2014 IDE me nahi. Java verbose hai, aur bina autocomplete ke \\u003ccode class=\\\"ic\\\">Map&lt;String, List&lt;Integer&gt;&gt;\\u003c/code> type karna, imports yaad rakhna, aur 15 minute me khatam karna ek alag skill hai. Pehli baar shock lagega, aur wo shock interview me lagne se behtar hai ki abhi lage.\\u003c/div>\\u003c/div>\\u003ch3>Interview se pehle final checklist\\u003c/h3>\\u003cul class=\\\"bul\\\">\\u003cli>Recruiter se poochh liya ki \\u003cb>redo available hai ya nahi\\u003c/b> \u2014 agar hai to pressure kaafi kam ho jaata hai\\u003c/li>\\u003cli>Pata hai ki \\u003cb>2 parts solve karne\\u003c/b> hain pass karne ke liye\\u003c/li>\\u003cli>Domain knowledge section me ek-line jawab dene ki practice ki hai (Round 6)\\u003c/li>\\u003cli>Ek problem \\u003cb>bolte hue\\u003c/b> solve karke dekh li hai, akele nahi\\u003c/li>\\u003cli>Plain editor me timed practice ki hai\\u003c/li>\\u003cli>3-4 project stories numbers ke saath taiyar hain\\u003c/li>\\u003cli>Quiet room, wired internet, backup hotspot, camera, ID\\u003c/li>\\u003c/ul>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Aakhri baat\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Aap ab content ke hisaab se over-prepared ho. Jo bacha hai wo \\u003cb>delivery\\u003c/b> hai \u2014 vocal rehna, pacing, aur trade-offs bolna. Interview se ek din pehle naya content mat padho; ek problem bolkar solve karo aur so jao.\\u003c/div>\\u003c/div>\"}], \"mocks\": [{\"tag\": \"Warm-up\", \"q\": \"Ek array me sabse frequent element nikaliye.\", \"a\": \"\\u003cp>Pehle main do cheez poochunga: tie hone pe kya karna hai, aur empty array pe kya expected hai \u2014 exception ya koi sentinel value?\\u003c/p>\\u003cp>Approach: ek hash map me har element ka count rakhunga. Aur main \\u003cb>usi loop me\\u003c/b> running max bhi track karunga, taaki doosra pass na karna pade. \\u003ccode class=\\\"ic\\\">Map.merge\\u003c/code> naya count return karta hai, to comparison wahin ho jaata hai.\\u003c/p>\\u003cp>O(n) time, O(n) space. Space kam karne ka koi tareeka nahi hai general case me \u2014 agar array sorted hota to O(1) space me ho jaata, ek pass me consecutive runs count karke.\\u003c/p>\\u003cp>Follow-up agar top K poocha jaye to main size K ka min-heap use karunga, O(n log k).\\u003c/p>\"}, {\"tag\": \"Reported\", \"q\": \"Badge records diye hain. Kaun log bina exit kiye enter kar gaye ya bina enter kiye exit?\", \"a\": \"\\u003cp>Main ek \\u003ccode class=\\\"ic\\\">Set\\u003c/code> rakhunga jo abhi andar maujood logon ko track kare, aur ek aur set invalid names ke liye.\\u003c/p>\\u003cp>Trick ye hai ki \\u003ccode class=\\\"ic\\\">Set.add()\\u003c/code> aur \\u003ccode class=\\\"ic\\\">Set.remove()\\u003c/code> dono boolean return karte hain. Enter pe agar \\u003ccode class=\\\"ic\\\">add\\u003c/code> false laute to wo pehle se andar tha \u2014 double enter. Exit pe agar \\u003ccode class=\\\"ic\\\">remove\\u003c/code> false laute to wo andar tha hi nahi \u2014 orphan exit.\\u003c/p>\\u003cp>Loop ke baad jo log abhi bhi &quot;inside&quot; set me hain, unhone kabhi exit nahi kiya \u2014 unko bhi invalid list me daal dunga.\\u003c/p>\\u003cp>O(n) time, O(n) space. Aur main \\u003ccode class=\\\"ic\\\">LinkedHashSet\\u003c/code> use karunga output ke liye taaki result deterministic rahe \u2014 test likhna aasan ho jaata hai.\\u003c/p>\"}, {\"tag\": \"Follow-up\", \"q\": \"Ab wo log nikaliye jinhone ek ghante me 3 baar badge use kiya.\", \"a\": \"\\u003cp>Pehle main clarify karunga: &quot;ek ghante me&quot; ka matlab strictly 60 minute se kam hai ya 60 include hai? Aur agar kisi ne 5 baar use kiya to saare 5 timestamps chahiye ya pehla valid window? Statement genuinely ambiguous hai.\\u003c/p>\\u003cp>Approach: pehle har person ke timestamps group karunga hash map me. Times HHMM format me hain, unhe minutes me convert karunga \u2014 \\u003ccode class=\\\"ic\\\">(v / 100) * 60 + v % 100\\u003c/code> \u2014 kyunki 1259 aur 1300 ke beech string arithmetic galat degi.\\u003c/p>\\u003cp>Phir har person ke sorted times pe \\u003cb>sliding window\\u003c/b> chalaunga. Right pointer aage badhta hai, aur jab tak window 60 minute se badi hai, left pointer aage sarkata hai. Window me 3 ya zyada entries mili to wo person qualify kar gaya.\\u003c/p>\\u003cp>O(n log n) per person sorting ke liye. Agar input already chronological hai to sorting skip ho sakti hai \u2014 main ye poochunga, kyunki wo ek free optimization hai.\\u003c/p>\"}, {\"tag\": \"Grid\", \"q\": \"Maze me entrance se nearest exit tak minimum steps. Kaise?\", \"a\": \"\\u003cp>Ye shortest path hai, isliye \\u003cb>BFS\\u003c/b>, DFS nahi. DFS pehla mila raasta dega jo shortest hona zaroori nahi.\\u003c/p>\\u003cp>Main queue me entrance daalunga aur level by level expand karunga. Har level ek step hai \u2014 isliye queue ka size loop ke shuru me capture karta hoon aur utne hi nodes ek level me process karta hoon.\\u003c/p>\\u003cp>Do details jo important hain. Pehla: visited ko \\u003cb>enqueue ke waqt\\u003c/b> mark karo, dequeue ke waqt nahi \u2014 warna ek hi cell kai baar queue me chala jaayega aur complexity bigad jaayegi. Doosra: entrance khud border pe ho sakta hai, par wo exit nahi ginta, isliye main exit check sirf neighbours pe karta hoon.\\u003c/p>\\u003cp>O(m*n) time aur space. Main visited ke liye grid ko mutate kar raha hoon \u2014 agar wo acceptable na ho to alag boolean array use karunga.\\u003c/p>\"}, {\"tag\": \"Trade-off\", \"q\": \"Aapne grid mutate kar diya. Ye theek hai?\", \"a\": \"\\u003cp>Achha point, aur ye maine deliberately kiya tha par mujhe bolna chahiye tha.\\u003c/p>\\u003cp>Grid mutate karne se extra space O(1) ho jaata hai \u2014 visited array ki zarurat nahi. Par iska cost ye hai ki \\u003cb>caller ka data destroy ho jaata hai\\u003c/b>. Agar wo grid kahin aur use ho raha hai to ye bug hai.\\u003c/p>\\u003cp>Production me main ye nahi karunga bina documentation ke. Ya to alag \\u003ccode class=\\\"ic\\\">boolean[][] visited\\u003c/code> rakhunga \u2014 O(m*n) extra space par side-effect free \u2014 ya method ke naam me hi bata dunga, jaise \\u003ccode class=\\\"ic\\\">countIslandsDestructive\\u003c/code>.\\u003c/p>\\u003cp>Interview me main aapse poochunga ki input reuse hoga ya nahi, aur uske hisaab se decide karunga. Agar aap bolte ho ki nahi hoga to mutation theek hai.\\u003c/p>\"}, {\"tag\": \"Java\", \"q\": \"Aapne ArrayDeque use kiya. Stack kyun nahi?\", \"a\": \"\\u003cp>Kyunki \\u003ccode class=\\\"ic\\\">java.util.Stack\\u003c/code> legacy class hai. Wo \\u003ccode class=\\\"ic\\\">Vector\\u003c/code> extend karti hai, aur uske saare methods \\u003ccode class=\\\"ic\\\">synchronized\\u003c/code> hain \u2014 single-threaded code me wo sirf overhead hai, koi fayda nahi.\\u003c/p>\\u003cp>Aur ek design problem hai: Stack Vector extend karti hai, isliye usme \\u003ccode class=\\\"ic\\\">get(index)\\u003c/code> jaise methods bhi aa jaate hain jo stack ke semantics todte hain. Aap galti se beech me se element padh sakte ho.\\u003c/p>\\u003cp>\\u003ccode class=\\\"ic\\\">ArrayDeque\\u003c/code> tez hai, unsynchronized hai, aur stack aur queue dono ke liye kaam karta hai. Java docs khud isko Stack ke upar recommend karte hain.\\u003c/p>\\u003cp>Ek gotcha: ArrayDeque null elements allow nahi karta. Zyadatar cases me ye fayda hai \u2014 bug jaldi pakda jaata hai \u2014 par agar null store karna ho to LinkedList chahiye.\\u003c/p>\"}, {\"tag\": \"Process\", \
