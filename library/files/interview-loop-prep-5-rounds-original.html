\\\">\\u003cp class=\\\"rf-q\\\">Idempotent API kya hai aur kyun zaroori hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Ek hi request kai baar bhejne pe result wahi rahe. Zaroori isliye ki network retries aur timeouts distributed systems me guaranteed hain.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>POST ko idempotent kaise banaoge?\\u003c/b> Client \\u003ccode class=\\\"ic\\\">Idempotency-Key\\u003c/code> header bheje; server key store kare aur duplicate pe stored response lauta de.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Pagination \u2014 offset ya cursor?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Offset simple hai par deep pages pe slow aur data shift hone pe items skip ho jaate hain. Cursor (keyset) stable aur fast hai \u2014 bade datasets me wahi use karo.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">PUT aur PATCH?\\u003c/p>\\u003cp class=\\\"rf-a\\\">PUT poora resource replace karta hai aur idempotent hai; PATCH partial update hai aur zaroori nahi ki idempotent ho.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Is code me security issue kya hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Ye Karat ka classic code-exhibit probe hai. Sabse common answers: SQL injection (string concatenation), XXE (DTD enabled), hardcoded secrets, aur logs me PII.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>SQL injection fix?\\u003c/b> PreparedStatement with bind parameters. Escaping se mat karo.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">JWT aur OAuth2?\\u003c/p>\\u003cp class=\\\"rf-a\\\">JWT ek token \\u003cb>format\\u003c/b> hai; OAuth2 ek authorization \\u003cb>protocol\\u003c/b> hai jo aksar JWT use karta hai. Ye compare karne wali cheezein nahi hain.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>JWT revoke kaise?\\u003c/b> Seedha nahi ho sakta \u2014 short expiry plus refresh token, ya ek denylist rakho.\\u003c/p>\\u003c/div>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>// Kya galat hai? (typical Karat code exhibit)\\nString sql = &quot;SELECT * FROM users WHERE email = &#x27;&quot; + email + &quot;&#x27;&quot;;\\nstmt.executeQuery(sql);\\nlog.info(&quot;login attempt: &quot; + email + &quot; pwd=&quot; + password);\\n\\n// 1. SQL injection - PreparedStatement + bind param use karo\\n// 2. Password plaintext log me - kabhi credentials log mat karo\\n// 3. SELECT * - schema change pe silently toot sakta hai\\u003c/code>\\u003c/pre>\"}, {\"id\": \"db\", \"title\": \"Database aur JPA\", \"html\": \"\\u003cdiv class=\\\"rf\\\">\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">N+1 problem kya hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Ek query se N parent aaye, phir har parent ke children ke liye alag query \u2014 total N+1 queries. Lazy loading ka classic side effect.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Fix?\\u003c/b> \\u003ccode class=\\\"ic\\\">JOIN FETCH\\u003c/code>, \\u003ccode class=\\\"ic\\\">@EntityGraph\\u003c/code>, ya batch size set karo. Aur dev me SQL logging on rakho taaki dikhe.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Optimistic aur pessimistic locking?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Optimistic version column check karta hai commit pe \u2014 conflict rare ho to better. Pessimistic row lock leta hai (\\u003ccode class=\\\"ic\\\">SELECT FOR UPDATE\\u003c/code>) \u2014 contention zyada ho to.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Optimistic fail hone pe?\\u003c/b> \\u003ccode class=\\\"ic\\\">OptimisticLockException\\u003c/code> catch karke fresh data ke saath retry karo.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Isolation levels?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Read uncommitted, read committed (Postgres default), repeatable read (MySQL default), serializable. Upar jaate jaate consistency badhti hai, concurrency ghatti hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Kaun sa problem kaun sa rokta hai?\\u003c/b> Read committed dirty read rokta hai; repeatable read non-repeatable read; serializable phantom read.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">First aur second level cache?\\u003c/p>\\u003cp class=\\\"rf-a\\\">First level per-session hota hai aur default on hai. Second level cross-session, explicitly configure karna padta hai (Ehcache, Hazelcast).\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Index kab nuksan karta hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Write-heavy tables pe \u2014 har insert aur update pe index maintain hota hai. Aur low cardinality columns pe index ka koi faayda nahi.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Slow query kaise optimize karenge?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Pehle \\u003ccode class=\\\"ic\\\">EXPLAIN ANALYZE\\u003c/code> chalao. Sequential scan dikhe to index dekho; badi sort dikhe to index se ordering do; N+1 dikhe to join karo.\\u003c/p>\\u003cp class=\\\"rf-f\\\">&quot;Index laga dunga&quot; bolna kamzor jawab hai \u2014 pehle measure karna strong jawab hai.\\u003c/p>\\u003c/div>\\u003c/div>\"}], \"mocks\": [{\"tag\": \"Trap\", \"q\": \"@Transactional lagane ke baad bhi rollback nahi ho raha. Kya wajah ho sakti hai?\", \"a\": \"\\u003cp>Teen common wajah hain, aur main isi order me check karunga.\\u003c/p>\\u003cp>\\u003cb>Pehla, self-invocation.\\u003c/b> Agar same class ke andar se annotated method call ki gayi hai to Spring ka proxy bypass ho jaata hai aur transaction shuru hi nahi hoti. Fix: method ko doosre bean me nikalo.\\u003c/p>\\u003cp>\\u003cb>Doosra, checked exception.\\u003c/b> Default me Spring sirf unchecked exceptions pe rollback karta hai. Agar aapka code IOException phenkta hai to commit ho jaayega. Fix: \\u003ccode class=\\\"ic\\\">@Transactional(rollbackFor = Exception.class)\\u003c/code>.\\u003c/p>\\u003cp>\\u003cb>Teesra, exception swallow ho rahi hai.\\u003c/b> Agar method ke andar try-catch hai jo exception khaa jaata hai to Spring ko pata hi nahi chalega ki kuch galat hua.\\u003c/p>\\u003cp>Aur ek kam common: MyISAM jaisa storage engine jo transactions support hi nahi karta.\\u003c/p>\"}, {\"tag\": \"Deep dive\", \"q\": \"volatile counter++ thread safe hai?\", \"a\": \"\\u003cp>Nahi. Ye sabse common misconception hai.\\u003c/p>\\u003cp>volatile sirf \\u003cb>visibility\\u003c/b> guarantee karta hai \u2014 matlab ek thread ka write dusre thread ko turant dikh jaayega. Par \\u003ccode class=\\\"ic\\\">counter++\\u003c/code> ek operation nahi hai, wo teen hain: read, increment, write.\\u003c/p>\\u003cp>Do threads ek saath read kar sakte hain, dono 5 dekhenge, dono 6 likhenge. Ek increment kho gaya. volatile isse nahi rokta kyunki wo \\u003cb>atomicity\\u003c/b> nahi deta.\\u003c/p>\\u003cp>Fix: \\u003ccode class=\\\"ic\\\">AtomicInteger.incrementAndGet()\\u003c/code> jo CAS use karta hai, ya synchronized block. High contention pe \\u003ccode class=\\\"ic\\\">LongAdder\\u003c/code> aur better hai kyunki wo internally cells me split karke contention kam karta hai.\\u003c/p>\"}, {\"tag\": \"Design\", \"q\": \"Live API me ek naya required field add karna hai. Kaise karenge?\", \"a\": \"\\u003cp>Required field add karna \\u003cb>breaking change\\u003c/b> hai, isliye main same version me nahi karunga. API ek contract hai \u2014 chalte version ke andar uska shape nahi badalna chahiye.\\u003c/p>\\u003cp>Main naya version banaunga, jaise \\u003ccode class=\\\"ic\\\">/v2/orders\\u003c/code>. Purana v1 chalta rahega, aur dono ek hi service me handle honge \u2014 v1 request ko internally v2 model me map karke, missing field ke liye ek sensible default use karke.\\u003c/p>\\u003cp>Phir deprecation timeline announce karunga, v1 pe usage metrics track karunga, aur response me \\u003ccode class=\\\"ic\\\">Deprecation\\u003c/code> aur \\u003ccode class=\\\"ic\\\">Sunset\\u003c/code> headers bhejunga. Jab traffic zero ho jaaye tabhi hataunga.\\u003c/p>\\u003cp>Agar field \\u003cb>optional\\u003c/b> hota to main same version me add kar deta \u2014 optional field add karna backward compatible hai kyunki purane clients usko ignore kar denge.\\u003c/p>\"}, {\"tag\": \"Code exhibit\", \"q\": \"Is snippet me kya problem hai? Query string concatenation se ban rahi hai.\", \"a\": \"\\u003cp>Sabse pehle \\u003cb>SQL injection\\u003c/b>. User input seedha query me concatenate ho raha hai, to koi bhi input daal ke query ka structure badal sakta hai. Fix PreparedStatement with bind parameters hai \u2014 escaping se nahi, kyunki escaping har edge case cover nahi karti.\\u003c/p>\\u003cp>Doosra, agar wahan credentials ya PII log ho rahi hai to wo bhi serious issue hai. Logs aksar central systems me jaate hain jahan access broad hota hai.\\u003c/p>\\u003cp>Teesra, \\u003ccode class=\\\"ic\\\">SELECT *\\u003c/code> fragile hai \u2014 column add ya reorder hone pe code silently galat behave kar sakta hai. Explicit columns likho.\\u003c/p>\\u003cp>Aur agar result set bada ho sakta hai to pagination ya streaming chahiye, warna ye memory issue banega.\\u003c/p>\"}, {\"tag\": \"Ops\", \"q\": \"Liveness aur readiness probe alag kyun hote hain?\", \"a\": \"\\u003cp>Kyunki wo do bilkul alag sawaal poochte hain, aur unke actions bhi alag hain.\\u003c/p>\\u003cp>\\u003cb>Liveness\\u003c/b> poochta hai: process zinda hai? Fail ho to orchestrator container \\u003cb>restart\\u003c/b> karta hai. Isme sirf wo cheez check karo jo restart se theek hoti hai \u2014 jaise deadlocked thread pool.\\u003c/p>\\u003cp>\\u003cb>Readiness\\u003c/b> poochta hai: abhi traffic le sakte ho? Fail ho to pod ko load balancer se \\u003cb>hataya\\u003c/b> jaata hai, restart nahi. Isme downstream dependencies check karo \u2014 DB connection pool, cache.\\u003c/p>\\u003cp>Common production bug: dono ko ek hi endpoint pe map kar dena jo DB check karta hai. Phir DB thoda slow ho jaye to poora fleet restart loop me chala jaata hai aur outage aur bada ho jaata hai. Ye maine dekha hai, isliye main inhe hamesha alag rakhta hoon.\\u003c/p>\"}, {\"tag\": \"Modern Java\", \"q\": \"Virtual threads ka kya faayda hai? Aap kab use karenge?\", \"a\": \"\\u003cp>Virtual threads JVM-managed hain, OS-managed nahi. Jab wo blocking I/O pe wait karte hain to underlying carrier thread free ho jaata hai. Isliye lakhon concurrent tasks chal sakte hain jahan pehle hazaar platform threads limit the.\\u003c/p>\\u003cp>\\u003cb>Kab faayda:\\u003c/b> I/O-heavy services \u2014 jo bahut saare downstream HTTP ya DB calls karte hain. Aap simple blocking code likh sakte ho aur reactive jaisi scalability paa sakte ho, bina reactive ki complexity ke.\\u003c/p>\\u003cp>\\u003cb>Kab faayda nahi:\\u003c/b> CPU-bound kaam me. Wahan core count hi bottleneck hai, aur zyada threads sirf context switching badhaayenge.\\u003c/p>\\u003cp>Ek gotcha: agar aap \\u003ccode class=\\\"ic\\\">synchronized\\u003c/code> block ke andar blocking call karte ho to virtual thread carrier ko \\u003cb>pin\\u003c/b> kar deta hai aur faayda khatam ho jaata hai. Isliye ReentrantLock prefer karo.\\u003c/p>\"}, {\"tag\": \"Judgment\", \"q\": \"Ek question ka jawab nahi aata. Kya karenge?\", \"a\": \"\\u003cp>Seedha bol dunga ki maine wo use nahi kiya. Bluff karna sabse bura option hai \u2014 interviewer follow-up poochega aur wahan pakda jaunga, aur phir baaki jawabon pe bhi bharosa kam ho jaayega.\\u003c/p>\\u003cp>Par main wahin nahi rukunga. Main batauunga ki mera samajh kya hai aur main kaise sochta: &quot;Ye maine production me use nahi kiya, par concept se main expect karunga ki ye aise kaam karta ho, kyunki...&quot;\\u003c/p>\\u003cp>Rubric me reasoning ke points hote hain, sirf correct recall ke nahi. Ek honest, well-reasoned &quot;pata nahi par main aise sochta hoon&quot; ek confident galat jawab se zyada score karta hai.\\u003c/p>\"}]}, {\"id\": \"microservices\", \"num\": 7, \"kind\": \"Architecture\", \"title\": \"Microservices patterns\", \"blurb\": \"Lead level pe questions architecture ki taraf shift ho jaate hain. Saga, outbox, CQRS, Kafka ordering, distributed locking, CAP \u2014 har ek ka kab aur kyun.\", \"sections\": [{\"id\": \"saga\", \"title\": \"Distributed transactions aur Saga\", \"html\": \"\\u003cp>Monolith me ek database transaction sab kuch handle kar leti thi. Microservices me har service ka apna DB hai \u2014 koi shared transaction hai hi nahi. To agar teesra step fail ho jaye to pehle do ko undo kaise karein?\\u003c/p>\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 300\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar7\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR7\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Saga with compensating transactions\\u003c/title>\\n\\u003cdesc>Four forward steps run left to right; shipping fails, and compensations then run\\nright to left undoing inventory, payment and the order itself.\\u003c/desc>\\n\\n\\u003ctext class=\\\"ts\\\" x=\\\"30\\\" y=\\\"30\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Forward transactions\\u003c/text>\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"30\\\" y=\\\"44\\\" width=\\\"160\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"110\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Create order\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"110\\\" y=\\\"85\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">status pending\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"190\\\" y1=\\\"71\\\" x2=\\\"206\\\" y2=\\\"71\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar7)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"210\\\" y=\\\"44\\\" width=\\\"160\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"290\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Charge payment\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"290\\\" y=\\\"85\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">hold funds\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"370\\\" y1=\\\"71\\\" x2=\\\"386\\\" y2=\\\"71\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar7)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"390\\\" y=\\\"44\\\" width=\\\"160\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"470\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Reserve stock\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"470\\\" y=\\\"85\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">decrement\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"550\\\" y1=\\\"71\\\" x2=\\\"566\\\" y2=\\\"71\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar7)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"570\\\" y=\\\"44\\\" width=\\\"160\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"650\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Ship order\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"650\\\" y=\\\"85\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">fails\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M650 98 L650 132 L470 132 L470 172\\\" fill=\\\"none\\\" class=\\\"arr red\\\" marker-end=\\\"url(#arR7)\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.4\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"30\\\" y=\\\"164\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Compensating transactions\\u003c/text>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"390\\\" y=\\\"176\\\" width=\\\"160\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"470\\\" y=\\\"198\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Release stock\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"470\\\" y=\\\"217\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">increment back\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"386\\\" y1=\\\"203\\\" x2=\\\"374\\\" y2=\\\"203\\\" class=\\\"arr red\\\" marker-end=\\\"url(#arR7)\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"210\\\" y=\\\"176\\\" width=\\\"160\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"290\\\" y=\\\"198\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Refund payment\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"290\\\" y=\\\"217\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">release hold\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"206\\\" y1=\\\"203\\\" x2=\\\"194\\\" y2=\\\"203\\\" class=\\\"arr red\\\" marker-end=\\\"url(#arR7)\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"30\\\" y=\\\"176\\\" width=\\\"160\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"110\\\" y=\\\"198\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Cancel order\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"110\\\" y=\\\"217\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">status cancelled\\u003c/text>\\u003c/g>\\n\\u003ctext class=\\\"ts\\\" x=\\\"30\\\" y=\\\"262\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Har forward step ka ek compensation hona chahiye.\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"30\\\" y=\\\"280\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Rollback nahi hota, ulta business action hota hai.\\u003c/text>\\n\\u003c/svg>\\u003cfigcaption>Saga me rollback nahi hota. Har forward step ka ek \\u003cb>compensating action\\u003c/b> hota hai jo business level pe ulta kaam karta hai \u2014 refund, release, cancel.\\u003c/figcaption>\\u003c/figure>\\u003ch3>Do flavours\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Choreography\\u003c/th>\\u003cth>Orchestration\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Har service events sunti hai aur react karti hai\\u003c/td>\\u003ctd>Ek central orchestrator batata hai kaun kya kare\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Koi central coordinator nahi\\u003c/td>\\u003ctd>Saga state ek jagah, explicit\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Simple shuru me, par flow kahin likha nahi hota\\u003c/td>\\u003ctd>Flow readable hai, debug aasan\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>3-4 services tak theek\\u003c/td>\\u003ctd>Zyada services ya complex branching me behtar\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Debug mushkil \u2014 logs jodne padte hain\\u003c/td>\\u003ctd>Ek extra service maintain karni padti hai\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>// Orchestration ka simplified sketch\\n@Service\\nclass OrderSaga {\\n\\n    void execute(OrderRequest req) {\\n        SagaState st = repo.start(req.orderId());          // persist karo\\n        List&lt;Runnable&gt; compensations = new ArrayList&lt;&gt;();\\n\\n        try {\\n            orders.create(req);\\n            compensations.add(() -&gt; orders.cancel(req.orderId()));\\n\\n            String hold = payments.authorize(req.userId(), req.amountPaise());\\n            compensations.add(() -&gt; payments.release(hold));\\n\\n            inventory.reserve(req.sku(), req.qty());\\n            compensations.add(() -&gt; inventory.release(req.sku(), req.qty()));\\n\\n            shipping.schedule(req.orderId());              // yahan fail hua\\n            repo.complete(st);\\n\\n        } catch (Exception e) {\\n            // Ulte order me compensate karo\\n            Collections.reverse(compensations);\\n            for (Runnable c : compensations) runQuietly(c);\\n            repo.markCompensated(st, e);\\n            throw new SagaFailedException(req.orderId(), e);\\n        }\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Teen cheezein jo interviewer poochega\\u003c/span>\\u003cdiv class=\\\"note-b\\\">\\u003cb>1.\\u003c/b> Compensation khud fail ho gaya to? Usko retry karo aur ek dead letter queue me daalo, phir manual intervention. \\u003cb>2.\\u003c/b> Saga state kahan hai? Persist karo, memory me nahi \u2014 crash ke baad resume karna hai. \\u003cb>3.\\u003c/b> Isolation nahi hai \u2014 beech me koi aur order ka partial state dekh sakta hai. Isliye status field rakho (PENDING, CONFIRMED) aur pending ko user ko dikhao mat.\\u003c/div>\\u003c/div>\\u003ch3>Saga aur 2PC me kya farak?\\u003c/h3>\\u003cp>2PC (two-phase commit) me ek coordinator sab participants ko lock kara ke rakhta hai jab tak sab ready na bolein. Wo strong consistency deta hai par \\u003cb>blocking\\u003c/b> hai \u2014 coordinator gira to participants locked reh jaate hain. Microservices me isliye avoid karte hain. Saga eventual consistency deta hai par kabhi block nahi karta.\\u003c/p>\"}, {\"id\": \"outbox\", \"title\": \"Dual write problem aur Outbox\", \"html\": \"\\u003cp>Ye lead-level ka favourite question hai kyunki bug sookshm hai:\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>@Transactional\\npublic void placeOrder(Order o) {\\n    repo.save(o);                       // 1. database\\n    kafka.send(&quot;orders&quot;, toEvent(o));   // 2. broker  &lt;- PROBLEM\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Kya galat hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Ye do alag systems me write hai, aur inke beech koi atomicity nahi. Agar DB commit ho jaye par Kafka send fail ho \u2014 order ban gaya, event kabhi nahi gaya, downstream ko pata hi nahi chala. Ulta bhi ho sakta hai: event chala gaya par transaction rollback ho gayi, ab downstream ek aisi order process kar raha hai jo exist hi nahi karti.\\u003c/div>\\u003c/div>\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 260\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar8\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR8\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Transactional outbox pattern\\u003c/title>\\n\\u003cdesc>The service writes the business row and an outbox row in one database transaction;\\na separate relay reads the outbox and publishes to Kafka, so there is no dual write.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"40\\\" y=\\\"46\\\" width=\\\"200\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"140\\\" y=\\\"74\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Order service\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"240\\\" y1=\\\"69\\\" x2=\\\"284\\\" y2=\\\"69\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar8)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003crect x=\\\"288\\\" y=\\\"28\\\" width=\\\"412\\\" height=\\\"82\\\" rx=\\\"14\\\" class=\\\"grp\\\" fill=\\\"none\\\" stroke=\\\"#AEB6C1\\\" stroke-width=\\\"1\\\" stroke-dasharray=\\\"4 4\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"494\\\" y=\\\"46\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">One database transaction\\u003c/text>\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"304\\\" y=\\\"54\\\" width=\\\"180\\\" height=\\\"44\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"394\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">orders row\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"504\\\" y=\\\"54\\\" width=\\\"180\\\" height=\\\"44\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"594\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">outbox row\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M594 110 L594 132 L140 132 L140 156\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar8)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"40\\\" y=\\\"160\\\" width=\\\"200\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"140\\\" y=\\\"182\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Relay / CDC\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"140\\\" y=\\\"201\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">polls unsent rows\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"240\\\" y1=\\\"187\\\" x2=\\\"284\\\" y2=\\\"187\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar8)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"288\\\" y=\\\"160\\\" width=\\\"180\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"378\\\" y=\\\"182\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Kafka topic\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"378\\\" y=\\\"201\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">at least once\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"468\\\" y1=\\\"187\\\" x2=\\\"512\\\" y2=\\\"187\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar8)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"516\\\" y=\\\"160\\\" width=\\\"184\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"608\\\" y=\\\"182\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Consumers\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"608\\\" y=\\\"201\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">dedupe by event id\\u003c/text>\\u003c/g>\\n\\u003ctext class=\\\"ts\\\" x=\\\"40\\\" y=\\\"246\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">DB commit hua to event guaranteed jaayega. Dono kabhi diverge nahi honge.\\u003c/text>\\n\\u003c/svg>\\u003cfigcaption>Fix simple hai: dono writes ek hi database me karo, ek hi transaction me. Broker tak pahunchana ek alag process ka kaam hai.\\u003c/figcaption>\\u003c/figure>\\u003cpre class=\\\"code\\\">\\u003ccode>CREATE TABLE outbox (\\n  id          UUID PRIMARY KEY,\\n  aggregate   TEXT        NOT NULL,   -- &quot;order&quot;\\n  event_type  TEXT        NOT NULL,   -- &quot;OrderPlaced&quot;\\n  payload     JSONB       NOT NULL,\\n  created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),\\n  sent_at     TIMESTAMPTZ\\n);\\nCREATE INDEX ON outbox (created_at) WHERE sent_at IS NULL;\\u003c/code>\\u003c/pre>\\u003cpre class=\\\"code\\\">\\u003ccode>@Transactional\\npublic void placeOrder(Order o) {\\n    repo.save(o);\\n    outbox.save(new OutboxRow(UUID.randomUUID(), &quot;order&quot;,\\n                              &quot;OrderPlaced&quot;, json(o)));   // same transaction\\n}\\n\\n// Alag process, alag schedule\\n@Scheduled(fixedDelay = 500)\\nvoid relay() {\\n    for (OutboxRow r : outbox.findUnsent(500)) {\\n        kafka.send(topic(r), r.id().toString(), r.payload());  // key = event id\\n        outbox.markSent(r.id());\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Delivery semantics saaf bolo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Relay \\u003cb>at-least-once\\u003c/b> deta hai \u2014 send ke baad aur markSent se pehle crash ho to event dobara jaayega. Isliye consumer ko \\u003cb>idempotent\\u003c/b> hona hi padega, event id se dedupe karke. Exactly-once ka dawa mat karo; at-least-once plus idempotent consumer practically wahi cheez hai.\\u003c/div>\\u003c/div>\\u003cp>Polling ke bajaye \\u003cb>CDC\\u003c/b> bhi use kar sakte ho \u2014 Debezium database ke write-ahead log se outbox rows padhta hai. Latency kam, DB pe load kam, par ek aur component maintain karna padta hai.\\u003c/p>\"}, {\"id\": \"kafka\", \"title\": \"Kafka \u2014 ordering aur idempotency\", \"html\": \"\\u003cdiv class=\\\"rf\\\">\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Ordering guarantee kahan tak hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Sirf \\u003cb>ek partition ke andar\\u003c/b>. Topic level pe koi global order nahi hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>To ek order ke events sequence me kaise rakhein?\\u003c/b> Partition key = orderId. Same key hamesha same partition me jaati hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Consumer crash ho gaya. Kya hota hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Rebalance hota hai, uske partitions doosre consumers ko mil jaate hain, aur wo last committed offset se padhna shuru karte hain.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Isse duplicate?\\u003c/b> Haan \u2014 jo messages process ho gaye par commit nahi hue, wo dobara aayenge. Isliye idempotent processing zaroori hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Offset commit kab karein?\\u003c/p>\\u003cp class=\\\"rf-a\\\">\\u003cb>Process karne ke baad\\u003c/b>, pehle nahi. Pehle commit karo aur crash ho jaye to message kho jaayega.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Auto-commit?\\u003c/b> Production me off karo \u2014 wo timer pe commit karta hai, processing se independent.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Consumer lag badh raha hai. Kya karenge?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Pehle dekho lag consumer slow hone se hai ya producer spike se. Consumer slow hai to partitions aur consumers badhao, ya processing ko batch aur async karo.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Partitions badhane ka side effect?\\u003c/b> Ordering toot sakti hai kyunki existing keys naye partitions pe redistribute ho jaayengi.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Kafka ya RabbitMQ?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Kafka high-throughput event log hai jisme replay hoti hai aur retention hoti hai. RabbitMQ traditional broker hai \u2014 complex routing, per-message ack, priority queues.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Aap kab RabbitMQ chunoge?\\u003c/b> Jab task queue chahiye jisme per-message retry aur routing rules ho, aur replay ki zarurat na ho.\\u003c/p>\\u003c/div>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>// Idempotent consumer - Kafka ka har design me zaroori hissa\\n@KafkaListener(topics = &quot;orders&quot;)\\n@Transactional\\npublic void onEvent(ConsumerRecord&lt;String, String&gt; rec) {\\n    String eventId = rec.key();\\n\\n    // Ek hi transaction me: dedupe check aur business write\\n    int inserted = processed.insertIfAbsent(eventId);   // ON CONFLICT DO NOTHING\\n    if (inserted == 0) return;                          // pehle hi handle ho chuka\\n\\n    OrderPlaced e = parse(rec.value());\\n    inventory.reserve(e.sku(), e.qty());\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Ye line strong hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">&quot;Main exactly-once ka dawa nahi karunga. Kafka at-least-once deta hai, aur main consumer ko idempotent banata hoon \u2014 dedupe table aur business write ek hi transaction me. Effect exactly-once jaisa hi hota hai, par failure mode saaf hai.&quot;\\u003c/div>\\u003c/div>\"}, {\"id\": \"resilience\", \"title\": \"Resilience patterns\", \"html\": \"\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 220\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar9\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR9\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Circuit breaker state machine\\u003c/title>\\n\\u003cdesc>Closed opens when the failure rate crosses the threshold, open moves to half-open\\nafter the reset timeout, and a half-open probe either closes the breaker or reopens it.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"40\\\" y=\\\"60\\\" width=\\\"150\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"115\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Closed\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"115\\\" y=\\\"101\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">calls pass\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"190\\\" y1=\\\"87\\\" x2=\\\"301\\\" y2=\\\"87\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar9)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"245\\\" y=\\\"76\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">failure rate high\\u003c/text>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"305\\\" y=\\\"60\\\" width=\\\"150\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"380\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Open\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"380\\\" y=\\\"101\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">fail fast\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"455\\\" y1=\\\"87\\\" x2=\\\"566\\\" y2=\\\"87\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar9)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"510\\\" y=\\\"76\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">reset timeout\\u003c/text>\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"570\\\" y=\\\"60\\\" width=\\\"150\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"645\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Half open\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"645\\\" y=\\\"101\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">one probe\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M670 114 L670 146 L380 146 L380 118\\\" fill=\\\"none\\\" class=\\\"arr red\\\" marker-end=\\\"url(#arR9)\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.4\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"500\\\" y=\\\"140\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">probe fails\\u003c/text>\\n\\u003cpath d=\\\"M620 114 L620 178 L115 178 L115 118\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar9)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"360\\\" y=\\\"196\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">probe passes\\u003c/text>\\n\\u003c/svg>\\u003cfigcaption>Circuit breaker ka poora point ye hai ki failing dependency pe call karna hi band kar do, taaki thread pool bhar ke aapki service bhi na gire.\\u003c/figcaption>\\u003c/figure>\\u003cpre class=\\\"code\\\">\\u003ccode>resilience4j:\\n  circuitbreaker:\\n    instances:\\n      payments:\\n        slidingWindowSize: 100\\n        failureRateThreshold: 50          # 50% fail -&gt; open\\n        waitDurationInOpenState: 30s      # phir half-open\\n        permittedNumberOfCallsInHalfOpenState: 5\\n  retry:\\n    instances:\\n      payments:\\n        maxAttempts: 3\\n        waitDuration: 200ms\\n        exponentialBackoffMultiplier: 2\\n  bulkhead:\\n    instances:\\n      payments:\\n        maxConcurrentCalls: 20\\u003c/code>\\u003c/pre>\\u003cpre class=\\\"code\\\">\\u003ccode>@CircuitBreaker(name = &quot;payments&quot;, fallbackMethod = &quot;queueForLater&quot;)\\n@Retry(name = &quot;payments&quot;)\\n@Bulkhead(name = &quot;payments&quot;)\\npublic PaymentResult charge(PaymentRequest r) {\\n    return paymentClient.charge(r);\\n}\\n\\nprivate PaymentResult queueForLater(PaymentRequest r, Throwable t) {\\n    outbox.save(retryEvent(r));                  // baad me async retry\\n    return PaymentResult.pending();              // user ko &quot;Processing&quot; dikhega\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Pattern\\u003c/th>\\u003cth>Kis problem ko solve karta hai\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>\\u003cb>Circuit breaker\\u003c/b>\\u003c/td>\\u003ctd>Failing dependency pe call karte rehne se aapke threads bhar jaate hain aur cascading failure hoti hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Retry + backoff\\u003c/b>\\u003c/td>\\u003ctd>Transient failures. Par \\u003cb>jitter\\u003c/b> zaroori hai, warna sab clients ek saath retry karke retry storm bana denge\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Bulkhead\\u003c/b>\\u003c/td>\\u003ctd>Ek slow dependency poora thread pool na khaa jaye \u2014 usko apna limited pool do\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Timeout\\u003c/b>\\u003c/td>\\u003ctd>Sabse basic aur sabse zyada bhoola jaane wala. Har remote call pe timeout hona hi chahiye\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Fallback\\u003c/b>\\u003c/td>\\u003ctd>Degrade karo, fail mat karo \u2014 cached value, default, ya queue for later\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Retry ka khatarnak combination\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Retry aur circuit breaker ka order matter karta hai. Agar retry breaker ke bahar hai to 3 retries = breaker ke liye 3 failures, aur breaker galat jaldi khul jaayega. Aur \\u003cb>non-idempotent\\u003c/b> operations pe retry mat karo bina idempotency key ke \u2014 warna double charge ho jaayega.\\u003c/div>\\u003c/div>\"}, {\"id\": \"consistency\", \"title\": \"CAP, consistency aur distributed locking\", \"html\": \"\\u003cdiv class=\\\"rf\\\">\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">CAP theorem ek line me?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Network partition hone pe aapko consistency ya availability me se ek chunna padta hai. Partition tolerance optional nahi hai \u2014 network to fail hoga hi.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>To CA system hota hai?\\u003c/b> Practically nahi. Single-node DB ko CA bol sakte ho, par wo distributed hi nahi hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">ACID aur BASE?\\u003c/p>\\u003cp class=\\\"rf-a\\\">ACID strong guarantees deta hai \u2014 atomic, consistent, isolated, durable. BASE (basically available, soft state, eventual consistency) availability ke liye consistency dheeli karta hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Kab kya?\\u003c/b> Paise aur inventory pe ACID. Feed, recommendations, analytics pe BASE bilkul theek hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Eventual consistency user ko kaise samjhaoge?\\u003c/p>\\u003cp class=\\\"rf-a\\\">UI me pending state dikhao. &quot;Order placed, confirming payment&quot; \u2014 user ko sach batao, jhoothi certainty mat do.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Distributed lock kab zaroori hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Jab ek hi kaam multiple instances me se sirf ek ko karna ho \u2014 scheduled job, ya ek external resource pe exclusive access.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Kya avoid kar sakte ho?\\u003c/b> Aksar haan. Database constraint ya conditional update se aksar lock ki zarurat hi nahi rehti \u2014 aur wo zyada reliable hota hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Redis lock safe hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Bina fencing token ke nahi. GC pause ya network delay me lock expire ho sakta hai jabki holder ko lagta hai wo abhi bhi hold kiye hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Fencing token kaise?\\u003c/b> Har lock grant ke saath ek monotonic number do; storage layer purane number wali writes reject kare.\\u003c/p>\\u003c/div>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>// Fencing token ke saath. Bina iske distributed lock illusion hai.\\npublic boolean process(String jobId) {\\n    Lease lease = locks.acquire(jobId, Duration.ofSeconds(30));\\n    if (lease == null) return false;                 // koi aur chala raha hai\\n    try {\\n        Result r = doWork(jobId);\\n\\n        // Storage token check karta hai: agar usne isse bada token dekh liya\\n        // hai to ye write reject ho jaayegi. Stale holder corrupt nahi kar sakta.\\n        return store.writeIfTokenIsCurrent(jobId, r, lease.token());\\n    } finally {\\n        locks.release(lease);\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003ch3>CQRS aur Event Sourcing \u2014 kab justify hota hai\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Pattern\\u003c/th>\\u003cth>Kab haan\\u003c/th>\\u003cth>Kab nahi\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>\\u003cb>CQRS\\u003c/b>\\u003c/td>\\u003ctd>Read aur write ka load ya shape bilkul alag ho \u2014 jaise write normalized hai par read ek denormalized dashboard chahta hai\\u003c/td>\\u003ctd>Simple CRUD me. Do models maintain karna double kaam hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Event sourcing\\u003c/b>\\u003c/td>\\u003ctd>Audit trail legally zaroori ho, ya past state reconstruct karna ho \u2014 banking, ledgers\\u003c/td>\\u003ctd>Zyadatar systems me. Schema evolution aur replay bahut complex ho jaate hain\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Ye jawab mature lagta hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">&quot;Maine CQRS tab use kiya jab read model ka shape write model se alag tha. Par main isko default nahi banaunga \u2014 zyadatar services ke liye ye extra complexity hai jiska koi payoff nahi.&quot; Pattern jaanna aur pattern ko \\u003cb>reject\\u003c/b> kar paana, dono senior signal hain.\\u003c/div>\\u003c/div>\"}, {\"id\": \"ops\", \"title\": \"Observability aur deployment\", \"html\": \"\\u003cdiv class=\\\"rf\\\">\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Distributed tracing kaise kaam karti hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Har request ko ek trace id milti hai jo har service call me headers me propagate hoti hai. Har hop ek span banata hai, aur collector unko jodkar poori timeline banata hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Async me kaise?\\u003c/b> Trace context ko Kafka message headers me daalo, warna producer aur consumer ke spans jud nahi payenge.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Logs, metrics aur traces me farak?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Metrics batate hain \\u003cb>kya\\u003c/b> galat hai (error rate badha); traces batate hain \\u003cb>kahan\\u003c/b> (kaun si service); logs batate hain \\u003cb>kyun\\u003c/b> (exact exception).\\u003c/p>\\u003cp class=\\\"rf-f\\\">Ye teen-line jawab interviewers ko pasand aata hai kyunki ye purpose-driven hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Service discovery kyun chahiye?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Instances scale aur restart pe aate jaate rehte hain, IP fixed nahi hota. Discovery logical service name ko live instances pe resolve karti hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Kubernetes me?\\u003c/b> Wahan DNS plus Service abstraction ye kaam kar deti hai, alag Eureka ki zarurat nahi rehti.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Blue-green aur canary?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Blue-green me poora traffic ek saath naye version pe switch hota hai \u2014 rollback instant. Canary me traffic ka chhota hissa (1%, 5%) jaata hai aur metrics dekhkar badhaya jaata hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Config aur secrets kaise manage karenge?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Config environment se aaye, jar ke andar se nahi. Secrets ek vault se aayein, rotate hote rahein, aur kabhi git me na jaayein.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Ek service ka schema change karna hai jise 5 services padhti hain. Kaise?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Expand aur contract. Pehle naya field add karo (optional), sab consumers ko migrate karo, phir purana field hatao. Kabhi ek deploy me dono mat karo.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Ye lead-level judgment question hai \u2014 coordination ki zarurat dikhana important hai.\\u003c/p>\\u003c/div>\\u003c/div>\"}], \"mocks\": [{\"tag\": \"Opener\", \"q\": \"Microservices me distributed transaction kaise handle karenge?\", \"a\": \"\\u003cp>Main 2PC avoid karunga. Wo strong consistency to deta hai par blocking hai \u2014 coordinator gir jaye to participants locks ke saath atke reh jaate hain, aur wo microservices me acceptable nahi.\\u003c/p>\\u003cp>Main \\u003cb>Saga\\u003c/b> use karunga. Har step apni local transaction commit karta hai, aur har step ka ek compensating action hota hai. Fail hone pe ulte order me compensate karte hain.\\u003c/p>\\u003cp>Important: compensation \\u003cb>rollback nahi\\u003c/b> hai, wo ek naya business action hai. Payment ka compensation refund hai, delete nahi. Ye distinction matter karta hai kyunki audit trail me dono events dikhne chahiye.\\u003c/p>\\u003cp>3-4 services tak choreography theek hai. Usse zyada ya branching logic ho to orchestration chunta hoon, kyunki flow ek jagah readable hota hai aur debug ho paata hai.\\u003c/p>\"}, {\"tag\": \"Trap\", \"q\": \"Ye code DB me save karke Kafka pe event bhejta hai, ek @Transactional me. Theek hai?\", \"a\": \"\\u003cp>Nahi. Ye \\u003cb>dual write problem\\u003c/b> hai. Transaction sirf database ko cover karti hai, Kafka ko nahi.\\u003c/p>\\u003cp>Do failure modes hain. DB commit ho jaye par Kafka send fail ho \u2014 order exist karta hai par downstream ko kabhi pata nahi chala. Ya Kafka send ho jaye aur phir transaction rollback ho \u2014 downstream ek aisi order process kar raha hai jo database me hai hi nahi.\\u003c/p>\\u003cp>Fix \\u003cb>transactional outbox\\u003c/b> hai. Business row aur ek outbox row, dono ek hi database transaction me likho. Phir ek alag relay process outbox se padhkar Kafka pe publish karta hai.\\u003c/p>\\u003cp>Ye at-least-once deta hai \u2014 relay send ke baad crash ho to event dobara jaayega. Isliye consumer ko event id se idempotent banana hi padega. Main exactly-once ka dawa nahi karunga.\\u003c/p>\"}, {\"tag\": \"Deep dive\", \"q\": \"Ek order ke events sequence me process hone chahiye. Kafka me kaise?\", \"a\": \"\\u003cp>Kafka ordering sirf \\u003cb>ek partition ke andar\\u003c/b> guarantee karta hai, topic level pe nahi. To main partition key ko \\u003ccode class=\\\"ic\\\">orderId\\u003c/code> rakhunga \u2014 same key hamesha same partition me jaayegi, aur us order ke saare events sequence me rahenge.\\u003c/p>\\u003cp>Alag orders alag partitions me ja sakti hain aur parallel process ho sakti hain, jo chahiye bhi hai. Ordering per-entity chahiye, global nahi.\\u003c/p>\\u003cp>\\u003cb>Do gotchas\\u003c/b> jo main flag karunga. Pehla: partitions badhane pe key ka hash mapping badal jaata hai, to purani aur nayi events alag partitions me ja sakti hain \u2014 ordering toot jaayegi. Isliye partition count pehle se soch ke rakho.\\u003c/p>\\u003cp>Doosra: agar consumer ke andar processing async kar di \u2014 jaise thread pool me daal diya \u2014 to partition ka ordering benefit khatam ho jaata hai. Ordering matter karti hai to per-partition processing sequential rakhni padegi.\\u003c/p>\"}, {\"tag\": \"Design\", \"q\": \"Payment service intermittently slow ho rahi hai aur aapki service bhi gir rahi hai. Kya karenge?\", \"a\": \"\\u003cp>Ye cascading failure hai. Payment slow hai, aapke threads uska wait kar rahe hain, thread pool bhar gaya, aur ab aapki service un requests ko bhi serve nahi kar paa rahi jinka payment se koi lena dena nahi.\\u003c/p>\\u003cp>\\u003cb>Sabse pehle timeout.\\u003c/b> Har remote call pe aggressive timeout \u2014 agar payment normally 200ms leta hai to 2 second pe cut karo, 30 second pe nahi. Ye sabse basic aur sabse zyada bhoola jaane wala fix hai.\\u003c/p>\\u003cp>\\u003cb>Phir bulkhead.\\u003c/b> Payment calls ko apna limited thread pool do, maan lijiye 20 concurrent. Ab wo poora pool nahi khaa sakta.\\u003c/p>\\u003cp>\\u003cb>Phir circuit breaker.\\u003c/b> Failure rate 50% cross kare to breaker khol do \u2014 call karna hi band, turant fallback. 30 second baad ek probe bhejo.\\u003c/p>\\u003cp>\\u003cb>Aur fallback meaningful ho.\\u003c/b> Main request ko outbox me daal ke user ko &quot;Processing&quot; dikhaunga aur async retry karunga. User ko error dikhane se behtar hai.\\u003c/p>\"}, {\"tag\": \"Judgment\", \"q\": \"Aap CQRS aur event sourcing kab use karenge?\", \"a\": \"\\u003cp>Zyadatar cases me \\u003cb>nahi\\u003c/b> karunga, aur main ye khulke bolunga.\\u003c/p>\\u003cp>\\u003cb>CQRS\\u003c/b> tab justify hota hai jab read aur write ka shape ya load bilkul alag ho. Jaise write side normalized transactional model hai, par read side ek heavy denormalized dashboard chahta hai jo 20 tables join karega. Wahan do models rakhna sensible hai.\\u003c/p>\\u003cp>\\u003cb>Event sourcing\\u003c/b> tab jab audit trail legally zaroori ho ya past state reconstruct karna business requirement ho \u2014 banking, ledgers, compliance systems.\\u003c/p>\\u003cp>Baaki jagah dono extra complexity hain. Event sourcing me schema evolution bahut mushkil ho jaata hai \u2014 purane events ke shape kabhi badal nahi sakte, aur replay logic har version handle karna padta hai. Maine teams ko ismein phaste dekha hai.\\u003c/p>\\u003cp>Mera default: simple CRUD se shuru karo. Jab actual pain dikhe tabhi pattern lao.\\u003c/p>\"}, {\"tag\": \"Ops\", \"q\": \"Ek shared schema field hatana hai jise 5 services padhti hain. Process kya hoga?\", \"a\": \"\\u003cp>\\u003cb>Expand and contract\\u003c/b>, teen phases me. Ek deploy me kabhi nahi.\\u003c/p>\\u003cp>\\u003cb>Phase 1 \u2014 expand.\\u003c/b> Naya field add karo, purana bhi rakho. Producer dono likhe. Koi consumer toota nahi, kyunki purana field abhi bhi hai.\\u003c/p>\\u003cp>\\u003cb>Phase 2 \u2014 migrate.\\u003c/b> Har consuming service ko naye field pe move karo, ek-ek karke. Main har team ko ticket bhejunga aur usage metrics track karunga taaki pata chale kaun abhi bhi purana field padh raha hai.\\u003c/p>\\u003cp>\\u003cb>Phase 3 \u2014 contract.\\u003c/b> Jab metrics zero dikhaayein tabhi purana field hatao. Metrics pe bharosa karo, logon ke &quot;haan humne migrate kar diya&quot; pe nahi.\\u003c/p>\\u003cp>Lead role me asli kaam yahan technical nahi, \\u003cb>coordination\\u003c/b> hai \u2014 timeline communicate karna, tracking rakhna, aur kisi team ko surprise na dena.\\u003c/p>\"}, {\"tag\": \"Tricky\", \"q\": \"Distributed lock lagane se pehle aap kya check karenge?\", \"a\": \"\\u003cp>Sabse pehle main ye poochunga ki lock ki zarurat hai bhi ya nahi. Aksar nahi hoti, aur distributed lock hatane se system simple aur reliable dono ho jaata hai.\\u003c/p>\\u003cp>Bahut saare cases me ek \\u003cb>database constraint\\u003c/b> ya \\u003cb>conditional update\\u003c/b> kaam kar jaata hai. Unique index duplicate rok deta hai. \\u003ccode class=\\\"ic\\\">UPDATE ... WHERE status = &#x27;pending&#x27;\\u003c/code> se sirf ek winner nikalta hai. Database ye atomically karta hai, koi coordination nahi chahiye.\\u003c/p>\\u003cp>Agar lock sach me chahiye \u2014 jaise ek scheduled job jo sirf ek instance pe chale \u2014 to main \\u003cb>fencing token\\u003c/b> ke saath hi lagaunga. Bina uske lock ek illusion hai: GC pause me lock expire ho sakta hai jabki holder ko lagta hai wo abhi bhi hold kiye hai, aur wapas aake stale write kar dega.\\u003c/p>\\u003cp>Aur lease duration hamesha kaam ke expected time se kaafi zyada rakhunga, plus renewal mechanism, taaki normal slowness pe lock chhoot na jaye.\\u003c/p>\"}]}, {\"id\": \"sysdesign2\", \"num\": 8, \"kind\": \"System design\", \"title\": \"Pattern kit + 5 core designs\", \"blurb\": \"20 designs ratt-ne ki zarurat nahi. Paanch achhe se karo \u2014 baaki sab inhi ke combinations hain. Fintech aur banking pe weighted, plus ek LLM infra part.\", \"sections\": [{\"id\": \"framework\", \"title\": \"Framework \u2014 kisi bhi prompt pe\", \"html\": \"\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 250\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar10\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR10\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>How to answer any system design question\\u003c/title>\\n\\u003cdesc>Six steps across two rows with time budgets: requirements, scale math, API and data\\nmodel, then architecture, one deep dive, and failure modes with trade-offs.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"30\\\" y=\\\"40\\\" width=\\\"210\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"135\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Requirements\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"135\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">5 min, scope + NFRs\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"240\\\" y1=\\\"69\\\" x2=\\\"271\\\" y2=\\\"69\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar10)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"275\\\" y=\\\"40\\\" width=\\\"210\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"380\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Scale math\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"380\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">5 min, QPS + storage\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"485\\\" y1=\\\"69\\\" x2=\\\"516\\\" y2=\\\"69\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar10)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"520\\\" y=\\\"40\\\" width=\\\"210\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"625\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">API + data model\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"625\\\" y=\\\"82\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">5 min\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M625 98 L625 124 L135 124 L135 152\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar10)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"30\\\" y=\\\"156\\\" width=\\\"210\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"135\\\" y=\\\"179\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Architecture\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"135\\\" y=\\\"198\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">10 min, components\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"240\\\" y1=\\\"185\\\" x2=\\\"271\\\" y2=\\\"185\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar10)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"275\\\" y=\\\"156\\\" width=\\\"210\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"380\\\" y=\\\"179\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Deep dive\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"380\\\" y=\\\"198\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">15 min, one hard part\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"485\\\" y1=\\\"185\\\" x2=\\\"516\\\" y2=\\\"185\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar10)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"520\\\" y=\\\"156\\\" width=\\\"210\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"625\\\" y=\\\"179\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Failure modes\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"625\\\" y=\\\"198\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">10 min, trade-offs\\u003c/text>\\u003c/g>\\n\\u003ctext class=\\\"ts\\\" x=\\\"30\\\" y=\\\"238\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Deep dive sabse lamba hai. Wahin score banta hai.\\u003c/text>\\n\\u003c/svg>\\u003cfigcaption>45-60 minute ka round. Deep dive sabse lamba hissa hai \u2014 wahin aap junior se alag dikhte ho. Pehle teen steps jaldi nipta do.\\u003c/figcaption>\\u003c/figure>\"}, {\"id\": \"framework2\", \"title\": \"Har step me kya bolna hai\", \"html\": \"\\u003ch3>1. Requirements \u2014 5 min\\u003c/h3>\\u003cp>Do list banao aur loud bolo. \\u003cb>Functional:\\u003c/b> system kya karega. \\u003cb>Non-functional:\\u003c/b> scale, latency, consistency, availability. Fintech me ek line zaroor bolo: &quot;monetary correctness pe koi tolerance nahi hai, isliye paise wale path pe main strong consistency lunga chahe availability thodi kam ho.&quot;\\u003c/p>\\u003ch3>2. Scale math \u2014 5 min\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>Har design me yahi 4 numbers nikalo:\\n\\n  DAU aur per-user actions      -&gt;  QPS\\n  QPS x peak factor (3x se 5x)  -&gt;  peak QPS\\n  Row size x rows per day x 365 -&gt;  storage per year\\n  Read:write ratio              -&gt;  cache aur replica strategy\\n\\nExample (banking):\\n  10M users, har user 3 txn/day  = 30M txn/day\\n  30M / 86400                    = ~350 TPS average\\n  peak 5x                        = ~1750 TPS\\n  1KB per txn x 30M x 365        = ~11 TB/year\\n  read:write ~ 20:1              = read replicas chahiye, write shard karna padega\\u003c/code>\\u003c/pre>\\u003ch3>3. API + data model \u2014 5 min\\u003c/h3>\\u003cp>2-3 core endpoints likho aur main tables. Yahin idempotency key dikha do \u2014 fintech me wo API contract ka hissa hai, implementation detail nahi.\\u003c/p>\\u003ch3>4. Architecture \u2014 10 min\\u003c/h3>\\u003cp>Boxes banao par har box ke saath uska \\u003cb>kaam\\u003c/b> bolo. &quot;Yahan Kafka&quot; kaafi nahi hai; &quot;Kafka isliye ki sync path sirf accept kare aur worker crash pe replay ho sake&quot; \u2014 ye chahiye.\\u003c/p>\\u003ch3>5. Deep dive \u2014 15 min\\u003c/h3>\\u003cp>Interviewer ek hissa chunega. Agar na chune to \\u003cb>aap chuno\\u003c/b> \u2014 sabse hard part. Fintech me wo hamesha consistency ya idempotency hoga.\\u003c/p>\\u003ch3>6. Failure modes + trade-offs \u2014 10 min\\u003c/h3>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Ye round yahan jeeta jaata hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Ek real recruiter debrief: 12 saal ke experience wala staff engineer system design fail hua. Feedback ek line ka tha \u2014 usne components describe kiye par trade-offs kabhi discuss nahi kiye. Har major decision pe bolo: \\u003cb>&quot;ya to X, ya Y. Maine X chuna kyunki ___. Iska cost ye hai ki ___.&quot;\\u003c/b>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Format ab collaborative hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Aap chup-chaap boxes nahi bana rahe. Interviewer junior engineer ya PM ka role play karega aur push karega \u2014 &quot;ye hamare scale pe nahi chalega&quot;. Wo dekh raha hai ki aap defend karte ho ya blindly maan lete ho. \\u003cb>Dono galat hain.\\u003c/b> Sahi jawab: &quot;achha point, agar wo constraint hai to main ye badal dunga, aur iska cost ye hoga.&quot;\\u003c/div>\\u003c/div>\"}, {\"id\": \"blocks\", \"title\": \"10 building blocks \u2014 sab yahin se bante hain\", \"html\": \"\\u003cp>Har system design prompt inhi me se 3-4 blocks ka combination hai. Inko alag-alag samajh lo, phir prompt kuch bhi ho, aap assemble kar loge.\\u003c/p>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Block\\u003c/th>\\u003cth>Kya solve karta hai\\u003c/th>\\u003cth>Kahan aata hai\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>\\u003cb>Idempotency key\\u003c/b>\\u003c/td>\\u003ctd>Retry pe duplicate side effect\\u003c/td>\\u003ctd>Har payment, har API, har queue consumer\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Double-entry ledger\\u003c/b>\\u003c/td>\\u003ctd>Paise ka correctness aur audit\\u003c/td>\\u003ctd>Wallet, payment, settlement, accounting\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Async queue + worker\\u003c/b>\\u003c/td>\\u003ctd>Sync path chhota rakhna, spike absorb karna\\u003c/td>\\u003ctd>Order processing, notification, ingestion\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Sharding by entity key\\u003c/b>\\u003c/td>\\u003ctd>Single DB ki write limit\\u003c/td>\\u003ctd>Ledger, sessions, timeline, kuch bhi high-write\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Fan-out (write ya read)\\u003c/b>\\u003c/td>\\u003ctd>Ek event N logon tak\\u003c/td>\\u003ctd>Notification, feed, broadcast, alerts\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Reservation with TTL\\u003c/b>\\u003c/td>\\u003ctd>Double-booking rokna\\u003c/td>\\u003ctd>Seat, inventory, fund hold, slot booking\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Read model / CQRS\\u003c/b>\\u003c/td>\\u003ctd>Read aur write ka shape alag\\u003c/td>\\u003ctd>Statement, dashboard, search, analytics\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Cache with invalidation\\u003c/b>\\u003c/td>\\u003ctd>Read latency aur DB load\\u003c/td>\\u003ctd>Har read-heavy path\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Rate limiter\\u003c/b>\\u003c/td>\\u003ctd>Abuse aur overload\\u003c/td>\\u003ctd>API gateway, per-user, per-partner\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003cb>Outbox / CDC\\u003c/b>\\u003c/td>\\u003ctd>Dual write problem\\u003c/td>\\u003ctd>Jahan bhi DB write ke baad event jaana hai\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003ch3>Transfer map \u2014 5 designs se baaki sab\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Agar ye poocha jaye\\u003c/th>\\u003cth>To ye designs mila do\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Ride hailing / food delivery\\u003c/td>\\u003ctd>Geo search (Round 1) + live tracking + payments (D1)\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Ticket / seat booking\\u003c/td>\\u003ctd>D4 reservation, bilkul waise ka waisa\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Flash sale inventory\\u003c/td>\\u003ctd>D4 + rate limiter (Round 3)\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Chat / messaging\\u003c/td>\\u003ctd>D3 fan-out + stateful gateway (Round 1)\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Metrics / logging pipeline\\u003c/td>\\u003ctd>D2 pipeline, ledger ki jagah time-series\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Subscription billing\\u003c/td>\\u003ctd>D1 ledger + scheduler + D3 notification\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Fraud detection\\u003c/td>\\u003ctd>D2 pipeline + stream processing + D5 read model\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>UPI / NEFT processing\\u003c/td>\\u003ctd>D1 + D2 + saga (Round 7)\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Statement / transaction search\\u003c/td>\\u003ctd>D5, seedha\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\"}, {\"id\": \"d1\", \"title\": \"Design 1 \u2014 Wallet aur payment ledger\", \"html\": \"\\u003cp>\\u003cb>Kyun sabse pehle:\\u003c/b> ye fintech ka core hai, aur isme wo saare primitives hain jo baaki money-related design me repeat honge \u2014 idempotency, ACID, double-entry, reconciliation.\\u003c/p>\\u003ch3>Requirements\\u003c/h3>\\u003cul class=\\\"bul\\\">\\u003cli>User to user transfer, wallet top-up, merchant payout\\u003c/li>\\u003cli>Balance kabhi galat nahi hona chahiye \u2014 \\u003cb>zero tolerance\\u003c/b>\\u003c/li>\\u003cli>Har transaction auditable ho, immutable ho\\u003c/li>\\u003cli>Daily reconciliation bank ke settlement file ke saath\\u003c/li>\\u003cli>10M users, ~350 TPS average, 1750 TPS peak, ~11 TB/year\\u003c/li>\\u003c/ul>\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 340\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar11\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR11\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Double-entry ledger write path\\u003c/title>\\n\\u003cdesc>A transfer passes an idempotency check and validation, then writes balanced debit and\\ncredit rows in one append-only transaction, feeding a balance snapshot and a daily\\nreconciliation job.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"40\\\" y=\\\"26\\\" width=\\\"200\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"140\\\" y=\\\"48\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Transfer request\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"140\\\" y=\\\"67\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">payer, payee, amount\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"240\\\" y1=\\\"53\\\" x2=\\\"286\\\" y2=\\\"53\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar11)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"290\\\" y=\\\"26\\\" width=\\\"200\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"390\\\" y=\\\"48\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Idempotency key\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"390\\\" y=\\\"67\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">dedupe on retry\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"490\\\" y1=\\\"53\\\" x2=\\\"536\\\" y2=\\\"53\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar11)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"540\\\" y=\\\"26\\\" width=\\\"180\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"630\\\" y=\\\"48\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Validate\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"630\\\" y=\\\"67\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">balance, limits\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M630 80 L630 104 L380 104 L380 124\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar11)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003crect x=\\\"40\\\" y=\\\"128\\\" width=\\\"680\\\" height=\\\"96\\\" rx=\\\"16\\\" class=\\\"grp\\\" fill=\\\"none\\\" stroke=\\\"#AEB6C1\\\" stroke-width=\\\"1\\\" stroke-dasharray=\\\"4 4\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"380\\\" y=\\\"150\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">One transaction, append only\\u003c/text>\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"70\\\" y=\\\"162\\\" width=\\\"290\\\" height=\\\"48\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"215\\\" y=\\\"190\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">DEBIT payer 428.50\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"400\\\" y=\\\"162\\\" width=\\\"290\\\" height=\\\"48\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"545\\\" y=\\\"190\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">CREDIT payee 428.50\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"210\\\" y1=\\\"224\\\" x2=\\\"210\\\" y2=\\\"248\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar11)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"565\\\" y1=\\\"224\\\" x2=\\\"565\\\" y2=\\\"248\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar11)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"40\\\" y=\\\"252\\\" width=\\\"340\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"210\\\" y=\\\"274\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Balance = credits - debits\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"210\\\" y=\\\"293\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">snapshot + incremental\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"410\\\" y=\\\"252\\\" width=\\\"310\\\" height=\\\"54\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"565\\\" y=\\\"274\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Reconciliation job\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"565\\\" y=\\\"293\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">daily, vs bank file\\u003c/text>\\u003c/g>\\n\\u003ctext class=\\\"ts\\\" x=\\\"40\\\" y=\\\"330\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Invariant: har transaction me SUM(debits) == SUM(credits).\\u003c/text>\\n\\u003c/svg>\\u003cfigcaption>Teen guard aage (idempotency, validation), ek atomic append beech me, do consumers peeche (balance projection aur reconciliation).\\u003c/figcaption>\\u003c/figure>\"}, {\"id\": \"d1b\", \"title\": \"Design 1 \u2014 schema aur code\", \"html\": \"\\u003cpre class=\\\"code\\\">\\u003ccode>-- Append only. Kabhi UPDATE ya DELETE nahi.\\nCREATE TABLE ledger_entries (\\n  id              BIGSERIAL PRIMARY KEY,\\n  transaction_id  UUID        NOT NULL,\\n  account_id      BIGINT      NOT NULL,\\n  direction       CHAR(1)     NOT NULL,   -- &#x27;D&#x27; ya &#x27;C&#x27;\\n  amount_paise    BIGINT      NOT NULL CHECK (amount_paise &gt; 0),\\n  currency        CHAR(3)     NOT NULL,\\n  created_at      TIMESTAMPTZ NOT NULL DEFAULT now()\\n);\\nCREATE INDEX ON ledger_entries (account_id, created_at DESC);\\n\\n-- Idempotency: same key dobara aaye to stored response lauta do\\nCREATE TABLE idempotency (\\n  key           TEXT PRIMARY KEY,\\n  request_hash  TEXT        NOT NULL,\\n  response_json JSONB,\\n  created_at    TIMESTAMPTZ NOT NULL DEFAULT now()\\n);\\n\\n-- Balance snapshot: har baar poora SUM mat karo\\nCREATE TABLE balances (\\n  account_id     BIGINT PRIMARY KEY,\\n  balance_paise  BIGINT NOT NULL,\\n  last_entry_id  BIGINT NOT NULL,\\n  version        BIGINT NOT NULL\\n);\\u003c/code>\\u003c/pre>\\u003cpre class=\\\"code\\\">\\u003ccode>@Transactional\\npublic TransferResult transfer(TransferCommand cmd) {\\n\\n    // 1. Idempotency - retry pe duplicate transfer na ho\\n    Optional&lt;String&gt; prior = idempotency.claim(cmd.key(), cmd.hash());\\n    if (prior.isPresent()) return parse(prior.get());     // pehle ho chuka\\n\\n    // 2. Deadlock se bachne ke liye account id ke ascending order me lock\\n    long a = Math.min(cmd.from(), cmd.to());\\n    long b = Math.max(cmd.from(), cmd.to());\\n    Balance ba = balances.lockForUpdate(a);               // SELECT ... FOR UPDATE\\n    Balance bb = balances.lockForUpdate(b);\\n\\n    Balance payer = (cmd.from() == a) ? ba : bb;\\n    Balance payee = (cmd.from() == a) ? bb : ba;\\n\\n    if (payer.balancePaise() &lt; cmd.amountPaise())\\n
