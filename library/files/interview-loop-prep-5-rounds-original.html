 nahi sakte. 10 second wait karke assert karoge? Test me fake clock advance karo, instant aur deterministic\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">retryAfterMillis()\\u003c/code>\\u003c/td>\\u003ctd>HTTP 429 me Retry-After header bhejne ke liye. Ye dikhata hai ki aap API consumer ke baare me soch rahe ho, sirf server ke nahi\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\"}, {\"id\": \"lockfree\", \"title\": \"Part 2 \u2014 lock free version\", \"html\": \"\\u003cp>Agar interviewer bole ki 10K threads ek hi bucket hit kar rahe hain:\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>public class LockFreeTokenBucket {\\n\\n    private record State(double tokens, long nanos) {}\\n\\n    private final long   capacity;\\n    private final double refillPerNano;\\n    private final AtomicReference&lt;State&gt; state;\\n\\n    public boolean allow(int permits) {\\n        while (true) {\\n            State cur = state.get();\\n            long  now = System.nanoTime();\\n\\n            double refilled = Math.min(\\n                capacity,\\n                cur.tokens() + Math.max(0, now - cur.nanos()) * refillPerNano\\n            );\\n            if (refilled &lt; permits) return false;      // reject: CAS ki zarurat hi nahi\\n\\n            State next = new State(refilled - permits, now);\\n            if (state.compareAndSet(cur, next)) return true;\\n            // CAS fail  -&gt;  koi aur jeeta  -&gt;  retry\\n        }\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Trade-off bolo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">CAS high contention pe better throughput deta hai, par extreme contention me retry loop CPU jala sakta hai. Modern JVM me synchronized bhi (biased aur thin locks ke saath) kaafi tez hai. \\u003cb>Measure karo, guess mat karo\\u003c/b> \u2014 ye line interviewer ko pasand aati hai.\\u003c/div>\\u003c/div>\"}, {\"id\": \"peruser\", \"title\": \"Part 3 \u2014 per user limiter\", \"html\": \"\\u003cpre class=\\\"code\\\">\\u003ccode>// MEMORY LEAK: har naya user ek permanent entry\\nprivate final ConcurrentHashMap&lt;String, TokenBucket&gt; buckets = new ConcurrentHashMap&lt;&gt;();\\n\\n// Bounded cache with eviction\\nprivate final Cache&lt;String, TokenBucket&gt; buckets = Caffeine.newBuilder()\\n    .maximumSize(1_000_000)\\n    .expireAfterAccess(Duration.ofMinutes(10))\\n    .build();\\n\\npublic boolean allow(String userId) {\\n    return buckets.get(userId, k -&gt; new TokenBucket(100, 10)).allow();\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">expireAfterAccess kyun safe hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Idle bucket evict hone pe user ko fresh full bucket milta hai. Technically ye thoda lenient hai, par user ko koi fayda nahi \u2014 10 minute gap me wo waise bhi refill ho chuka hota. Ye trade-off explicitly bolna important hai, warna interviewer sochega aapne notice hi nahi kiya.\\u003c/div>\\u003c/div>\"}, {\"id\": \"dist\", \"title\": \"Part 4 \u2014 distributed extension\", \"html\": \"\\u003cp>Note me likha hai &quot;discuss distributed extension&quot; \u2014 matlab ye \\u003cb>zaroor\\u003c/b> poocha jaayega.\\u003c/p>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Problem\\u003c/span>\\u003cdiv class=\\\"note-b\\\">10 API servers hain. Har node pe local bucket = user ko \\u003cb>10 guna\\u003c/b> limit mil gayi.\\u003c/div>\\u003c/div>\\u003ch3>Option A \u2014 Redis plus Lua (sabse common)\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>-- KEYS[1] = bucket key\\n-- ARGV    = capacity, refill_per_sec, now_seconds, requested\\nlocal capacity  = tonumber(ARGV[1])\\nlocal rate      = tonumber(ARGV[2])\\nlocal now       = tonumber(ARGV[3])\\nlocal requested = tonumber(ARGV[4])\\n\\nlocal b      = redis.call(&#x27;HMGET&#x27;, KEYS[1], &#x27;tokens&#x27;, &#x27;ts&#x27;)\\nlocal tokens = tonumber(b[1]) or capacity\\nlocal ts     = tonumber(b[2]) or now\\n\\nlocal delta = math.max(0, now - ts)\\ntokens = math.min(capacity, tokens + delta * rate)\\n\\nlocal allowed = 0\\nif tokens &gt;= requested then\\n  tokens  = tokens - requested\\n  allowed = 1\\nend\\n\\nredis.call(&#x27;HMSET&#x27;,  KEYS[1], &#x27;tokens&#x27;, tokens, &#x27;ts&#x27;, now)\\nredis.call(&#x27;EXPIRE&#x27;, KEYS[1], math.ceil(capacity / rate) * 2)\\nreturn allowed\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Detail\\u003c/th>\\u003cth>Kyun\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Lua, seedha GET plus SET nahi\\u003c/td>\\u003ctd>GET aur SET alag commands hain. Beech me doosra node bhi GET kar lega, dono ko same tokens dikhenge, dono allow ho jayenge \u2014 classic race. Lua script Redis me \\u003cb>atomically\\u003c/b> chalti hai. Aur ek round trip me kaam, teen me nahi\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">EXPIRE\\u003c/code>\\u003c/td>\\u003ctd>Bina TTL ke har user ki key hamesha padi rahegi \u2014 memory leak. TTL = poora bucket refill hone ka time x 2\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Cost\\u003c/td>\\u003ctd>Har request pe ek Redis round trip, roughly plus 1ms latency, aur Redis pe aapke total QPS ka load\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003ch3>Option B \u2014 local bucket plus quota lease\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>Har 100ms:\\n  Node  -&gt; Redis: &quot;mujhe agle 100ms ke liye 12 tokens do&quot;\\n  Redis -&gt; global budget se deduct karke grant kare\\n  Node  -&gt; local bucket me 12 tokens daale, unhi se serve kare\\u003c/code>\\u003c/pre>\\u003cp>\\u003cb>Trade-off:\\u003c/b> lease window ke andar thoda overshoot possible hai, par Redis pe load 100 se 1000 guna kam. Agar limit 1000 QPS hai aur aap 1020 tak allow kar dete ho \u2014 business impact zero.\\u003c/p>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Ye line bolo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">&quot;Rate limiting me perfect accuracy chahiye ya approximate chalega? Almost hamesha approximate chalta hai, aur uska scaling benefit bahut bada hai.&quot; Ye trade-off explicitly naming karna senior signal hai.\\u003c/div>\\u003c/div>\\u003ch3>Option C \u2014 sharding by key\\u003c/h3>\\u003cp>Consistent hashing se har user ko ek dedicated node pe route karo. Us node pe local in-memory bucket \u2014 zero coordination, zero network hop. \\u003cb>Downside:\\u003c/b> node fail hone pe rebalance, aur load skew \u2014 ek hot user ek node maar sakta hai.\\u003c/p>\"}, {\"id\": \"failure\", \"title\": \"Failure modes aur algorithm choice\", \"html\": \"\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Scenario\\u003c/th>\\u003cth>Decision\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Redis down\\u003c/td>\\u003ctd>\\u003cb>Fail-open ya fail-closed?\\u003c/b> Rate limiter usually fail-open \u2014 availability perfect limiting se zyada important hai. Par payment ya auth API ke liye fail-closed. Ye business decision hai, technical nahi. Hybrid: Redis down ho to local per-node limiter pe fallback \u2014 degraded par functional\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Clock skew\\u003c/td>\\u003ctd>Client-side now pass karna risky hai. Redis ke TIME command se server time lo \u2014 ek hi source of truth\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Redis latency spike\\u003c/td>\\u003ctd>Timeout 5ms set karo, timeout pe fail-open. Rate limiter ko kabhi critical path block mat karne do\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Hot key\\u003c/td>\\u003ctd>Ek user 100K QPS maar raha hai to wo Redis shard mar jaayega. Key ko sub-shard karo (user:123:{0..9}), ya local pre-filter lagao\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003ch3>Algorithm comparison\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Algorithm\\u003c/th>\\u003cth>Burst allow\\u003c/th>\\u003cth>Memory\\u003c/th>\\u003cth>Accuracy\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>\\u003cb>Token bucket\\u003c/b>\\u003c/td>\\u003ctd>Haan, configurable\\u003c/td>\\u003ctd>O(1)\\u003c/td>\\u003ctd>Achhi\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Leaky bucket\\u003c/td>\\u003ctd>Nahi, smooth karta hai\\u003c/td>\\u003ctd>O(1)\\u003c/td>\\u003ctd>Achhi\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Fixed window\\u003c/td>\\u003ctd>Boundary pe 2x leak\\u003c/td>\\u003ctd>O(1)\\u003c/td>\\u003ctd>Kharab\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Sliding window log\\u003c/td>\\u003ctd>Haan, exact\\u003c/td>\\u003ctd>O(n)\\u003c/td>\\u003ctd>Perfect\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Sliding window counter\\u003c/td>\\u003ctd>Haan, approx\\u003c/td>\\u003ctd>O(1)\\u003c/td>\\u003ctd>Achhi\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003cp>Token bucket industry default hai kyunki: burst allow karta hai (real traffic bursty hota hai), memory O(1) hai, aur do independent knobs deta hai.\\u003c/p>\"}], \"mocks\": [{\"tag\": \"Opener\", \"q\": \"Ek rate limiter implement kijiye jo QPS cap kare.\", \"a\": \"\\u003cp>Main token bucket use karunga. Do parameters: capacity jo burst size hai, aur refill rate jo sustained QPS cap hai.\\u003c/p>\\u003cp>Key implementation decision: refill \\u003cb>lazy\\u003c/b> hoga. Background thread nahi banaunga jo tokens add karta rahe \u2014 1 million users pe wo 1 million timers ban jaayenge. Jab bhi allow() call ho, main last refill se elapsed time nikalunga aur rate se multiply karke tokens compute kar lunga.\\u003c/p>\\u003cp>Clock ke liye nanoTime, currentTimeMillis nahi, kyunki wo monotonic hai. Aur clock ko inject karunga taaki test deterministic ho.\\u003c/p>\"}, {\"tag\": \"Follow-up\", \"q\": \"Token bucket aur leaky bucket me kya farak hai? Aapne ye kyun chuna?\", \"a\": \"\\u003cp>Leaky bucket output ko smooth karta hai \u2014 requests ek fixed rate se hi nikalti hain, chahe kitni bhi aa jaayein. Token bucket burst allow karta hai jab tak bucket me tokens hain.\\u003c/p>\\u003cp>Maine token bucket chuna kyunki real traffic bursty hota hai. Ek user page load karta hai to 20 API calls ek saath jaati hain. Leaky bucket unko artificially serialize kar dega aur user experience kharab hoga, bina koi actual protection diye.\\u003c/p>\\u003cp>Leaky bucket tab better hai jab downstream literally burst handle nahi kar sakta \u2014 jaise ek legacy system jo fixed rate pe hi consume karta hai. Wahan smoothing hi goal hai.\\u003c/p>\"}, {\"tag\": \"Deep dive\", \"q\": \"Ye 10 servers pe deploy hai. Ab limit galat ho jaayegi. Kya karenge?\", \"a\": \"\\u003cp>Haan, har node ka apna bucket hai to effective limit 10 guna ho jaati hai.\\u003c/p>\\u003cp>\\u003cb>Option A\\u003c/b>: Redis me shared state, aur update ek Lua script se karo. Lua critical hai \u2014 GET aur SET alag karne se race condition aa jaayegi. Ek round trip, atomic. Cost: har request pe ~1ms extra latency aur Redis pe poora QPS load.\\u003c/p>\\u003cp>\\u003cb>Option B\\u003c/b>, jo main production me prefer karunga: quota lease. Har node har 100ms me Redis se apna share leta hai aur usko locally consume karta hai. Redis pe load 100 se 1000 guna kam ho jaata hai. Trade-off: lease window ke andar thoda overshoot.\\u003c/p>\\u003cp>Choice ismein hai ki accuracy kitni chahiye. Agar limit 1000 QPS hai aur hum kabhi 1020 allow kar dete hain, koi farak nahi padta. Agar ye ek paid quota hai jahan har call ka paisa lagta hai, to Option A better hai.\\u003c/p>\"}, {\"tag\": \"Failure\", \"q\": \"Redis down ho gaya. Rate limiter ka kya hoga?\", \"a\": \"\\u003cp>Ye deliberate decision honi chahiye, accident nahi. Do choices hain.\\u003c/p>\\u003cp>\\u003cb>Fail-open\\u003c/b>: Redis down ho to sab allow karo. Rate limiter ki wajah se poora API down nahi hona chahiye. Ye default hai general API protection ke liye.\\u003c/p>\\u003cp>\\u003cb>Fail-closed\\u003c/b>: sab reject karo. Ye tab jab limiter security control hai \u2014 login attempts, OTP requests, payment retries. Wahan unlimited allow karna abuse invite karta hai.\\u003c/p>\\u003cp>Main hybrid banaunga: Redis pe 5ms timeout, aur failure pe local per-node limiter pe fall back karo. Limit thodi loose ho jaayegi (10 guna worst case), par total collapse se behtar hai. Aur ispe alert bhi bhejunga, kyunki silently degrade karna khatarnaak hai.\\u003c/p>\"}, {\"tag\": \"Tricky\", \"q\": \"Aapke code me tokens double hai. Long kyun nahi?\", \"a\": \"\\u003cp>Kyunki refill fractional hota hai. Agar rate 10 per second hai aur 50 millisecond beete hain, to 0.5 token add hona chahiye.\\u003c/p>\\u003cp>long use karta to har refill pe wo 0 me truncate ho jaata. Chhote intervals pe bucket kabhi refill hi nahi hota, aur effective rate 0 ho jaati. Ye ek silent bug hai jo load test me hi pakda jaayega.\\u003c/p>\\u003cp>Alternative jo kuch libraries use karti hain: tokens ko integer rakho par nanosecond-per-token me hisaab karo, matlab time domain me kaam karo tokens ke bajaye. Wo bhi correct hai aur floating point se bachata hai. Main double se start karunga kyunki wo padhne me saaf hai.\\u003c/p>\"}, {\"tag\": \"Testing\", \"q\": \"Is limiter ko aap test kaise karenge?\", \"a\": \"\\u003cp>Sabse important: \\u003cb>clock inject karo\\u003c/b>. Bina iske har test me sleep lagana padega, jo slow aur flaky dono hai.\\u003c/p>\\u003cp>Fake clock ke saath tests deterministic ho jaate hain: bucket bhar do, capacity ke barabar requests karo \u2014 sab allow honi chahiye. Ek aur karo \u2014 reject honi chahiye. Phir clock ko exactly ek token ke time se aage badhao \u2014 ab ek allow honi chahiye.\\u003c/p>\\u003cp>Boundary: exactly capacity tak fill, capacity se upar nahi jaana chahiye chahe kitna bhi time beet jaye. Clock backwards jaye to tokens ghatne nahi chahiye.\\u003c/p>\\u003cp>Concurrency ke liye: 100 threads, capacity 100, sab ek saath allow() karein. Exactly 100 true aane chahiye. Agar 101 aaye to lock galat hai.\\u003c/p>\"}, {\"tag\": \"Design\", \"q\": \"Rate limit exceed hone pe client ko kya response denge?\", \"a\": \"\\u003cp>HTTP 429 Too Many Requests, aur uske saath \\u003ccode class=\\\"ic\\\">Retry-After\\u003c/code> header jisme seconds ho.\\u003c/p>\\u003cp>Retry-After compute karna aasan hai: deficit tokens divided by refill rate. Isliye maine wo method bucket me hi rakha hai \u2014 wahi state se calculate hota hai.\\u003c/p>\\u003cp>Ye important isliye hai ki bina iske clients tight loop me retry karenge aur load aur badhega. Retry-After dene se well-behaved clients backoff karenge. Aur main \\u003ccode class=\\\"ic\\\">X-RateLimit-Limit\\u003c/code> aur \\u003ccode class=\\\"ic\\\">X-RateLimit-Remaining\\u003c/code> bhi bhejunga taaki clients limit ke paas pahunchne se pehle hi slow ho sakein.\\u003c/p>\"}]}, {\"id\": \"locks\", \"num\": 4, \"kind\": \"Coding\", \"title\": \"Locks and deadlock fix\", \"blurb\": \"Buggy code diya jaayega, bug dhoondhna hai. Asli answer lock ordering hai \u2014 aur &quot;identity&quot; ka matlab hai stable, comparable key jispe order define ho.\", \"sections\": [{\"id\": \"bug\", \"title\": \"Buggy code aur bug\", \"html\": \"\\u003cpre class=\\\"code\\\">\\u003ccode>class Account {\\n    final int id;\\n    long balance;\\n    final ReentrantLock lock = new ReentrantLock();\\n}\\n\\nvoid transfer(Account from, Account to, long amount) {\\n    from.lock.lock();\\n    to.lock.lock();                     // DEADLOCK YAHAN\\n    try {\\n        from.balance -= amount;\\n        to.balance   += amount;\\n    } finally {\\n        to.lock.unlock();\\n        from.lock.unlock();\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 330\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar5\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR5\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Circular wait and the lock ordering fix\\u003c/title>\\n\\u003cdesc>On the left two threads hold one lock each and wait on the other, forming a cycle.\\nOn the right both threads take locks in ascending id order, so no cycle can form.\\u003c/desc>\\n\\n\\u003ctext class=\\\"th\\\" x=\\\"30\\\" y=\\\"26\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#161B22\\\">Broken: circular wait\\u003c/text>\\n\\u003ctext class=\\\"th\\\" x=\\\"420\\\" y=\\\"26\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#161B22\\\">Fixed: ascending id order\\u003c/text>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"30\\\" y=\\\"48\\\" width=\\\"130\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"95\\\" y=\\\"71\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Thread 1\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"222\\\" y=\\\"48\\\" width=\\\"130\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"287\\\" y=\\\"71\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Lock B\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"222\\\" y=\\\"200\\\" width=\\\"130\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"287\\\" y=\\\"223\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Thread 2\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"30\\\" y=\\\"200\\\" width=\\\"130\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"95\\\" y=\\\"223\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Lock A\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"164\\\" y1=\\\"71\\\" x2=\\\"214\\\" y2=\\\"71\\\" class=\\\"arr red\\\" marker-end=\\\"url(#arR5)\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"287\\\" y1=\\\"94\\\" x2=\\\"287\\\" y2=\\\"192\\\" class=\\\"arr red\\\" marker-end=\\\"url(#arR5)\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"218\\\" y1=\\\"223\\\" x2=\\\"168\\\" y2=\\\"223\\\" class=\\\"arr red\\\" marker-end=\\\"url(#arR5)\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cline x1=\\\"95\\\" y1=\\\"200\\\" x2=\\\"95\\\" y2=\\\"102\\\" class=\\\"arr red\\\" marker-end=\\\"url(#arR5)\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"191\\\" y=\\\"288\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Wants, held by, wants, held by\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"191\\\" y=\\\"306\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">The cycle never breaks\\u003c/text>\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"420\\\" y=\\\"48\\\" width=\\\"130\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"485\\\" y=\\\"71\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Thread 1\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"600\\\" y=\\\"48\\\" width=\\\"130\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"665\\\" y=\\\"71\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Thread 2\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"510\\\" y=\\\"140\\\" width=\\\"130\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"575\\\" y=\\\"163\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Lock A (id 1)\\u003c/text>\\u003c/g>\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"510\\\" y=\\\"222\\\" width=\\\"130\\\" height=\\\"46\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"575\\\" y=\\\"245\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Lock B (id 2)\\u003c/text>\\u003c/g>\\n\\u003cpath d=\\\"M485 94 L485 163 L506 163\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar5)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003cpath d=\\\"M665 94 L665 163 L644 163\\\" fill=\\\"none\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar5)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" />\\n\\u003cline x1=\\\"575\\\" y1=\\\"186\\\" x2=\\\"575\\\" y2=\\\"218\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar5)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003ctext class=\\\"ts\\\" x=\\\"575\\\" y=\\\"298\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#5B6472\\\">Both take A first, then B\\u003c/text>\\n\\u003c/svg>\\u003cfigcaption>Baayein: chaar node ka cycle \u2014 Thread 1 ko B chahiye, B Thread 2 ke paas hai, Thread 2 ko A chahiye, A Thread 1 ke paas hai. Daayein: dono threads pehle A lete hain, isliye cycle ban hi nahi sakti.\\u003c/figcaption>\\u003c/figure>\\u003ch3>Bug kaise explain karein\\u003c/h3>\\u003cp>Thread 1 \\u003ccode class=\\\"ic\\\">transfer(A, B)\\u003c/code> chala raha hai \u2014 A ka lock le liya, ab B ka wait kar raha hai. Thread 2 \\u003ccode class=\\\"ic\\\">transfer(B, A)\\u003c/code> chala raha hai \u2014 B ka lock le liya, ab A ka wait kar raha hai. Dono hamesha ke liye atak gaye. Ye \\u003cb>circular wait\\u003c/b> hai.\\u003c/p>\\u003ch3>Coffman conditions \u2014 chaaron ek saath honi zaroori hain\\u003c/h3>\\u003col class=\\\"num\\\">\\u003cli>Mutual exclusion\\u003c/li>\\u003cli>Hold and wait\\u003c/li>\\u003cli>No preemption\\u003c/li>\\u003cli>\\u003cb>Circular wait\\u003c/b> \u2014 isko todna sabse aasan hai, aur yahi hum todenge\\u003c/li>\\u003c/ol>\"}, {\"id\": \"fix1\", \"title\": \"Fix 1 \u2014 lock ordering (best answer)\", \"html\": \"\\u003cpre class=\\\"code\\\">\\u003ccode>void transfer(Account from, Account to, long amount) {\\n    if (from == to)   throw new IllegalArgumentException(&quot;self transfer&quot;);\\n    if (amount &lt;= 0)  throw new IllegalArgumentException(&quot;amount must be positive&quot;);\\n\\n    // Hamesha stable identity ke ascending order me lock lo\\n    Account first  = (from.id &lt; to.id) ? from : to;\\n    Account second = (from.id &lt; to.id) ? to   : from;\\n\\n    first.lock.lock();\\n    try {\\n        second.lock.lock();\\n        try {\\n            if (from.balance &lt; amount) throw new InsufficientFundsException();\\n            from.balance -= amount;\\n            to.balance   += amount;\\n        } finally {\\n            second.lock.unlock();\\n        }\\n    } finally {\\n        first.lock.unlock();\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Ye kaam kyun karta hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Ab har thread \\u003cb>same global order\\u003c/b> me lock leta hai. transfer(A,B) aur transfer(B,A) dono pehle A lenge phir B. Circular wait ban hi nahi sakti. Deadlock structurally impossible ho gaya \u2014 sirf &quot;kam likely&quot; nahi.\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">try lock ke baad, pehle nahi\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Maine try ko lock() ke \\u003cb>baad\\u003c/b> rakha. Agar lock() khud exception phenke aur try pehle ho, to finally me unlock() call hoga jo lock aapne liya hi nahi \u2014 IllegalMonitorStateException.\\u003c/div>\\u003c/div>\"}, {\"id\": \"identity\", \"title\": \"Identity ka twist\", \"html\": \"\\u003cp>Sawaal me specifically &quot;identity&quot; likha hai. Agar natural id na ho to \\u003ccode class=\\\"ic\\\">System.identityHashCode()\\u003c/code> fallback hai \u2014 par wo \\u003cb>unique nahi\\u003c/b> hai, collision ho sakti hai.\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>private static final Object TIE_LOCK = new Object();\\n\\nvoid transfer(Account from, Account to, long amount) {\\n    int h1 = System.identityHashCode(from);\\n    int h2 = System.identityHashCode(to);\\n\\n    if (h1 &lt; h2) {\\n        synchronized (from) { synchronized (to)   { doTransfer(from, to, amount); } }\\n    } else if (h1 &gt; h2) {\\n        synchronized (to)   { synchronized (from) { doTransfer(from, to, amount); } }\\n    } else {\\n        // Rare hash collision: ek global tie-breaker lock\\n        synchronized (TIE_LOCK) {\\n            synchronized (from) { synchronized (to) { doTransfer(from, to, amount); } }\\n        }\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003cp>Ye pattern \\u003ci>Java Concurrency in Practice\\u003c/i> (Brian Goetz) se hai. Interview me book ka naam le lena credibility deta hai.\\u003c/p>\\u003ch3>Identity ke teen traps\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Trap\\u003c/th>\\u003cth>Detail\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">==\\u003c/code> vs \\u003ccode class=\\\"ic\\\">equals()\\u003c/code>\\u003c/td>\\u003ctd>Agar Account ne equals() override kiya ho to do alag objects &quot;equal&quot; compare ho sakte hain par unke locks alag honge. Lock identity ke liye hamesha == aur object identity use karo, equals() nahi\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>\\u003ccode class=\\\"ic\\\">from == to\\u003c/code>\\u003c/td>\\u003ctd>Self transfer. ReentrantLock reentrant hai isliye hang nahi hoga, par balance logic galat chalega. synchronized bhi reentrant hai. Phir bhi explicitly reject karo \u2014 business level pe ye invalid operation hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Mutable id\\u003c/td>\\u003ctd>Agar id non-final ho aur beech me badal jaye to ordering toot jaayegi. Isliye \\u003ccode class=\\\"ic\\\">final int id\\u003c/code>\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\"}, {\"id\": \"fix2\", \"title\": \"Fix 2 \u2014 tryLock plus backoff\", \"html\": \"\\u003cpre class=\\\"code\\\">\\u003ccode>boolean transfer(Account from, Account to, long amount, long timeoutMs)\\n        throws InterruptedException {\\n    long deadline = System.nanoTime() + MILLISECONDS.toNanos(timeoutMs);\\n\\n    while (System.nanoTime() &lt; deadline) {\\n        if (from.lock.tryLock(50, MILLISECONDS)) {\\n            try {\\n                if (to.lock.tryLock(50, MILLISECONDS)) {\\n                    try {\\n                        doTransfer(from, to, amount);\\n                        return true;\\n                    } finally { to.lock.unlock(); }\\n                }\\n            } finally { from.lock.unlock(); }   // dono locks chhod do\\n        }\\n        // Random jitter: bina iske LIVELOCK ho jaayega\\n        Thread.sleep(ThreadLocalRandom.current().nextInt(10, 60));\\n    }\\n    return false;\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Random jitter mandatory hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Bina jitter ke dono threads exactly same time pe retry karenge, phir wahi conflict, phir retry \u2014 infinite loop. Ye \\u003cb>livelock\\u003c/b> hai: threads chal rahe hain par progress zero. Randomness symmetry todti hai. Yahi principle Ethernet ke CSMA/CD backoff me hai.\\u003c/div>\\u003c/div>\\u003cp>\\u003cb>Kab use karein:\\u003c/b> jab natural ordering possible hi na ho, ya jab aap deadlock detect karke gracefully fail hona chahte ho \u2014 jaise ek API request jo timeout pe 503 return kar de.\\u003c/p>\\u003ch3>Do aur options \u2014 mention karke reject karo\\u003c/h3>\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>Approach\\u003c/th>\\u003cth>Verdict\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>Global lock\\u003c/td>\\u003ctd>Ek hi synchronized sab transfers pe. Correct hai, par \\u003cb>zero concurrency\\u003c/b> \u2014 1000 TPS ka system 50 TPS pe aa jaayega. Bolo aur reject karo; ye dikhata hai ki consider kiya\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>Lock striping\\u003c/td>\\u003ctd>N locks ka array, lock[id % N]. Contention kam, memory kam. Par ordering phir bhi chahiye, aur do accounts same stripe pe aa sakte hain\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\"}, {\"id\": \"detect\", \"title\": \"Detection aur distributed version\", \"html\": \"\\u003ch3>Production me deadlock kaise pakdein\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>ThreadMXBean bean = ManagementFactory.getThreadMXBean();\\nlong[] deadlocked = bean.findDeadlockedThreads();\\nif (deadlocked != null) {\\n    ThreadInfo[] infos = bean.getThreadInfo(deadlocked, true, true);\\n    // alert bhejo, thread dump log karo\\n}\\u003c/code>\\u003c/pre>\\u003cp>CLI se: \\u003ccode class=\\\"ic\\\">jstack &lt;pid&gt;\\u003c/code> \u2014 JVM khud &quot;Found one Java-level deadlock&quot; print karta hai poore lock chain ke saath. Tool ka naam lena practical experience dikhata hai.\\u003c/p>\\u003ch3>Database level\\u003c/h3>\\u003cp>Postgres me \\u003ccode class=\\\"ic\\\">SELECT ... FOR UPDATE\\u003c/code> bhi deadlock kar sakta hai. \\u003cb>Wahi lock ordering fix chalti hai:\\u003c/b>\\u003c/p>\\u003cpre class=\\\"code\\\">\\u003ccode>SELECT * FROM accounts\\n WHERE id IN (:from, :to)\\n ORDER BY id            -- rows ko consistent order me lock karo\\n   FOR UPDATE;\\u003c/code>\\u003c/pre>\\u003cp>Postgres deadlock detect karke ek transaction ko kill kar deta hai (SQLSTATE 40P01). Aapke app ko usko catch karke \\u003cb>retry\\u003c/b> karna hai \u2014 ye application ki zimmedari hai, database ki nahi.\\u003c/p>\\u003ch3>Distributed lock\\u003c/h3>\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Fencing token\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Agar node A ne lock liya, phir GC pause me chala gaya, lock expire ho gaya, node B ne le liya \u2014 ab node A wapas aakar likhega aur data corrupt karega. Fix: har lock ke saath monotonically increasing token do, aur storage layer purane token wali writes reject kare. Ye Martin Kleppmann ka famous Redlock critique hai \u2014 naam lena worth it hai.\\u003c/div>\\u003c/div>\"}], \"mocks\": [{\"tag\": \"Opener\", \"q\": \"Ye transfer code dekhiye. Isme kya problem hai?\", \"a\": \"\\u003cp>Isme deadlock hai. Do locks fixed order me nahi liye ja rahe \u2014 order arguments pe depend karta hai.\\u003c/p>\\u003cp>Concretely: Thread 1 transfer(A, B) karta hai aur A ka lock leke B ka wait karta hai. Thread 2 transfer(B, A) karta hai aur B ka lock leke A ka wait karta hai. Circular wait ban gaya, dono permanently blocked.\\u003c/p>\\u003cp>Ye Coffman conditions me se circular wait hai. Chaaron conditions ek saath honi chahiye deadlock ke liye, aur circular wait sabse aasan hai todna \u2014 isliye fix wahin karunga.\\u003c/p>\"}, {\"tag\": \"Fix\", \"q\": \"Theek kaise karenge?\", \"a\": \"\\u003cp>Lock ordering. Dono locks hamesha ek consistent global order me lunga \u2014 account id ke ascending order me.\\u003c/p>\\u003cp>Matlab transfer(A,B) aur transfer(B,A) dono pehle A ka lock lenge, phir B ka. Ab koi cycle possible hi nahi hai. Ye important hai: main deadlock ko &quot;kam likely&quot; nahi bana raha, main use \\u003cb>structurally impossible\\u003c/b> bana raha hoon.\\u003c/p>\\u003cp>Order ke liye koi bhi stable, total-ordered key chalegi \u2014 id, UUID, account number. Sirf ye zaroori hai ki wo immutable ho aur har thread ko same order dikhe.\\u003c/p>\"}, {\"tag\": \"Deep dive\", \"q\": \"Agar accounts me id na ho to?\", \"a\": \"\\u003cp>Tab System.identityHashCode() fallback hai. Par wo unique guarantee nahi karta \u2014 do alag objects ka same hash aa sakta hai.\\u003c/p>\\u003cp>Isliye teen branches banate hain: h1 \\u003c h2, h1 > h2, aur equal. Equal case me ek global tie-breaker lock lete hain, phir uske andar dono account locks. Ye rare path hai to uska contention cost matter nahi karta.\\u003c/p>\\u003cp>Ye exact pattern Java Concurrency in Practice me hai. Aur ek zaroori baat: identity ke liye == use karna hai, equals() nahi. Agar class ne equals() override kiya ho to do &quot;equal&quot; objects ke locks alag honge aur ordering ka koi matlab nahi rahega.\\u003c/p>\"}, {\"tag\": \"Alternative\", \"q\": \"Lock ordering ke alawa aur kya options hain?\", \"a\": \"\\u003cp>\\u003cb>tryLock with timeout aur backoff.\\u003c/b> Dono locks tryLock se lo; agar doosra na mile to pehla bhi chhod do, random time wait karo, aur retry karo. Ye hold-and-wait condition todta hai.\\u003c/p>\\u003cp>Ismein ek trap hai: backoff \\u003cb>random\\u003c/b> hona chahiye. Fixed backoff se dono threads same time pe retry karenge aur livelock ban jaayega \u2014 threads chal rahe hain par progress zero.\\u003c/p>\\u003cp>\\u003cb>Global lock\\u003c/b> bhi correct hai par concurrency khatam kar deta hai \u2014 main isko mention karke reject karunga. \\u003cb>Lock striping\\u003c/b> contention kam karta hai par ordering ki zarurat phir bhi rehti hai.\\u003c/p>\\u003cp>Production me main lock ordering hi chununga. tryLock tab jab ordering define hi na ki ja sake, jaise jab locks alag systems se aa rahe hon.\\u003c/p>\"}, {\"tag\": \"Tricky\", \"q\": \"from aur to same account hain to kya hoga?\", \"a\": \"\\u003cp>ReentrantLock aur synchronized dono reentrant hain, isliye same thread dobara lock le lega \u2014 hang nahi hoga.\\u003c/p>\\u003cp>Par logic galat chalega. Balance se amount ghatega aur wahi amount wapas judega, net zero. Technically &quot;kaam kar gaya&quot; lagega par ye ek meaningless operation hai jo audit log me confusion paida karti hai.\\u003c/p>\\u003cp>Isliye main isko explicitly reject karta hoon, method ke shuru me. Aur agar lock non-reentrant hota \u2014 jaise ek naive custom lock \u2014 to ye seedha self-deadlock hota. Isliye ye check defensive bhi hai aur semantic bhi.\\u003c/p>\"}, {\"tag\": \"Distributed\", \"q\": \"Yahi problem database me ho to?\", \"a\": \"\\u003cp>Bilkul wahi problem hai. \\u003ccode class=\\\"ic\\\">SELECT ... FOR UPDATE\\u003c/code> row locks leta hai, aur agar do transactions ulte order me rows lock karein to database-level deadlock ho jaata hai.\\u003c/p>\\u003cp>Fix bhi wahi hai: \\u003ccode class=\\\"ic\\\">ORDER BY id\\u003c/code> lagao \\u003ccode class=\\\"ic\\\">FOR UPDATE\\u003c/code> ke saath, taaki rows hamesha consistent order me lock hon.\\u003c/p>\\u003cp>Farak sirf itna hai ki Postgres apna deadlock \\u003cb>detect\\u003c/b> kar leta hai aur ek transaction ko abort kar deta hai, SQLSTATE 40P01 ke saath. JVM aisa nahi karta \u2014 wo bas hang rehta hai. Isliye database me retry logic likhna mandatory hai; JVM me prevention hi ekmatra option hai.\\u003c/p>\"}, {\"tag\": \"Ops\", \"q\": \"Production me deadlock ho gaya. Aap kaise diagnose karenge?\", \"a\": \"\\u003cp>Sabse pehle \\u003ccode class=\\\"ic\\\">jstack\\u003c/code> se thread dump lunga. JVM khud detect karke &quot;Found one Java-level deadlock&quot; print karta hai, poore lock chain ke saath \u2014 kaun sa thread kaun sa lock hold kar raha hai aur kiska wait kar raha hai.\\u003c/p>\\u003cp>Agar ye recurring problem hai to \\u003ccode class=\\\"ic\\\">ThreadMXBean.findDeadlockedThreads()\\u003c/code> ko ek monitoring loop me daal dunga jo periodically check kare aur alert bheje. Isse detection minutes me hoti hai, customer complaint ka wait nahi karna padta.\\u003c/p>\\u003cp>Long term fix code me hai, monitoring me nahi. Main saare lock acquisition sites audit karunga aur ek documented lock hierarchy banaunga. Static analysis tools bhi hain jo inconsistent lock ordering flag kar dete hain.\\u003c/p>\"}]}, {\"id\": \"xml\", \"num\": 5, \"kind\": \"Discussion\", \"title\": \"Large XML parse to DB\", \"blurb\": \"Pure discussion question \u2014 koi code nahi. Structure me answer do: pehle concerns categorize karo, phir har ek ka action item.\", \"sections\": [{\"id\": \"concerns\", \"title\": \"Concerns \u2014 chhe categories\", \"html\": \"\\u003ch3>A. Memory\\u003c/h3>\\u003cul class=\\\"bul\\\">\\u003cli>\\u003cb>DOM parser OOM karega.\\u003c/b> 10GB XML ka DOM tree RAM me 5 se 10 guna leta hai \u2014 object overhead, string interning, node pointers. \\u003ccode class=\\\"ic\\\">DocumentBuilder.parse()\\u003c/code> likha to instant OutOfMemoryError\\u003c/li>\\u003cli>\\u003cb>Unbounded collections\\u003c/b> \u2014 parse karke List me jama karna aur end me DB likhna, wahi OOM\\u003c/li>\\u003c/ul>\\u003ch3>B. Database write pattern\\u003c/h3>\\u003cul class=\\\"bul\\\">\\u003cli>\\u003cb>Row by row insert\\u003c/b> \u2014 per row ek network round trip. 50M rows x 1ms = \\u003cb>14 ghante\\u003c/b> sirf network me\\u003c/li>\\u003cli>\\u003cb>Ek hi giant transaction\\u003c/b> \u2014 WAL aur undo log blow up, locks poore duration hold, aur fail hone pe rollback me ghanton\\u003c/li>\\u003cli>\\u003cb>Indexes on\\u003c/b> during bulk load \u2014 har insert pe B-tree rebalance, 5 se 10 guna slower\\u003c/li>\\u003cli>FK constraint checks har row pe\\u003c/li>\\u003c/ul>\\u003ch3>C. Resilience\\u003c/h3>\\u003cul class=\\\"bul\\\">\\u003cli>\\u003cb>Koi checkpoint nahi\\u003c/b> \u2014 7 ghante chala, 95% pe crash, poora dobara\\u003c/li>\\u003cli>\\u003cb>Ek malformed record poori job maar dega\\u003c/b>\\u003c/li>\\u003cli>\\u003cb>Idempotency nahi\\u003c/b> \u2014 rerun pe duplicate rows\\u003c/li>\\u003cli>Single machine = single point of failure, horizontally scale nahi hota\\u003c/li>\\u003c/ul>\\u003ch3>D. Ordering\\u003c/h3>\\u003cp>Sawaal me &quot;chronological order&quot; specifically likha hai. Parallelize karoge to order toot jaayegi. Agar downstream order-dependent hai \u2014 event sourcing, running balance calculation \u2014 to ye \\u003cb>correctness bug\\u003c/b> hai, performance issue nahi.\\u003c/p>\\u003ch3>E. Security\\u003c/h3>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Ye bolna bahut impress karta hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">\\u003cb>XXE (XML External Entity)\\u003c/b> \u2014 attacker \\u003ccode class=\\\"ic\\\">&lt;!ENTITY xxe SYSTEM &quot;file:///etc/passwd&quot;&gt;\\u003c/code> daal ke server ki files padh sakta hai, ya SSRF kar sakta hai. \\u003cb>Billion Laughs\\u003c/b> \u2014 nested entity expansion se 1KB file 3GB memory me expand hoti hai, instant DoS. Zyadatar candidates security bilkul miss kar dete hain.\\u003c/div>\\u003c/div>\\u003ch3>F. Operability\\u003c/h3>\\u003cul class=\\\"bul\\\">\\u003cli>\\u003cb>Zero observability\\u003c/b> \u2014 6 ghante silence, pata hi nahi progress kya hai ya hang ho gaya\\u003c/li>\\u003cli>\\u003cb>Backpressure nahi\\u003c/b> \u2014 parser DB se tez hai, queue unbounded badhti jaayegi, OOM\\u003c/li>\\u003cli>\\u003cb>Timeout nahi\\u003c/b> \u2014 DB hang hua to job hamesha ke liye atka\\u003c/li>\\u003cli>Encoding \u2014 UTF-8 vs UTF-16, BOM handling\\u003c/li>\\u003c/ul>\"}, {\"id\": \"actions\", \"title\": \"Action items\", \"html\": \"\\u003cdiv class=\\\"tbl-wrap\\\">\\u003ctable class=\\\"tbl \\\">\\u003cthead>\\u003ctr>\\u003cth>#\\u003c/th>\\u003cth>Concern\\u003c/th>\\u003cth>Action item\\u003c/th>\\u003c/tr>\\u003c/thead>\\u003ctbody>\\u003ctr>\\u003ctd>1\\u003c/td>\\u003ctd>DOM OOM\\u003c/td>\\u003ctd>\\u003cb>StAX\\u003c/b> (\\u003ccode class=\\\"ic\\\">XMLStreamReader\\u003c/code>) pe switch karo \u2014 pull parser, constant memory. SAX bhi chalega par StAX behtar control deta hai\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>2\\u003c/td>\\u003ctd>Row by row insert\\u003c/td>\\u003ctd>\\u003cb>JDBC batching\\u003c/b> 1000 se 5000 per batch, \\u003ccode class=\\\"ic\\\">rewriteBatchedStatements=true\\u003c/code>. Ya native bulk loader \u2014 COPY, SqlBulkCopy\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>3\\u003c/td>\\u003ctd>Giant transaction\\u003c/td>\\u003ctd>\\u003cb>Chunked commits\\u003c/b> \u2014 har 10K records pe commit. Lock hold time chhota, rollback sasta\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>4\\u003c/td>\\u003ctd>Crash recovery\\u003c/td>\\u003ctd>\\u003cb>Checkpoint table\\u003c/b>: (file_id, last_record_no, byte_offset, status). Restart wahin se resume kare\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>5\\u003c/td>\\u003ctd>Duplicate on rerun\\u003c/td>\\u003ctd>\\u003cb>Natural key plus UPSERT\\u003c/b> (\\u003ccode class=\\\"ic\\\">ON CONFLICT DO NOTHING\\u003c/code>), ya content hash. Job idempotent honi chahiye\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>6\\u003c/td>\\u003ctd>Order\\u003c/td>\\u003ctd>Parse time pe \\u003cb>monotonic sequence number\\u003c/b> assign karo. Parallel process karo par write ordered ho \u2014 staging table me daal ke final \\u003ccode class=\\\"ic\\\">INSERT ... ORDER BY seq\\u003c/code>\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>7\\u003c/td>\\u003ctd>XXE plus XML bomb\\u003c/td>\\u003ctd>\\u003cb>DTD disable\\u003c/b> karo \u2014 do lines me dono band\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>8\\u003c/td>\\u003ctd>Bad records\\u003c/td>\\u003ctd>\\u003cb>Quarantine table\\u003c/b> me daalo, job continue rahe. Threshold cross ho (1% se zyada bad) to fail karo\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>9\\u003c/td>\\u003ctd>Backpressure\\u003c/td>\\u003ctd>\\u003cb>Bounded\\u003c/b> \\u003ccode class=\\\"ic\\\">ArrayBlockingQueue(10_000)\\u003c/code> parser aur writers ke beech. Queue full to parser block \u2014 yahi chahiye\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>10\\u003c/td>\\u003ctd>Observability\\u003c/td>\\u003ctd>Records per second metric, progress percent, ETA, structured logs har 100K records pe. Heartbeat table taaki hang detect ho\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>11\\u003c/td>\\u003ctd>Index overhead\\u003c/td>\\u003ctd>Bulk load se pehle non-critical indexes drop karo, baad me rebuild\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>12\\u003c/td>\\u003ctd>Single machine\\u003c/td>\\u003ctd>File ko chunks me split karo (top-level element boundaries pe), workers me distribute. Ya S3 plus Spark pe move karo\\u003c/td>\\u003c/tr>\\u003ctr>\\u003ctd>13\\u003c/td>\\u003ctd>Timeout\\u003c/td>\\u003ctd>Har DB call pe query timeout plus socket timeout. Kabhi infinite wait mat karo\\u003c/td>\\u003c/tr>\\u003c/tbody>\\u003c/table>\\u003c/div>\\u003ch3>XXE fix \u2014 ye code yaad rakho\\u003c/h3>\\u003cpre class=\\\"code\\\">\\u003ccode>XMLInputFactory factory = XMLInputFactory.newInstance();\\nfactory.setProperty(XMLInputFactory.SUPPORT_DTD, false);\\nfactory.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);\\nfactory.setProperty(XMLInputFactory.IS_COALESCING, true);\\u003c/code>\\u003c/pre>\"}, {\"id\": \"arch\", \"title\": \"Proposed architecture\", \"html\": \"\\u003cfigure class=\\\"dia\\\">\\u003csvg viewBox=\\\"0 0 760 300\\\" width=\\\"100%\\\" xmlns=\\\"http://www.w3.org/2000/svg\\\" role=\\\"img\\\">\\u003cdefs>\\u003cmarker id=\\\"ar6\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003cmarker id=\\\"arR6\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"8\\\" refY=\\\"5\\\" markerWidth=\\\"6\\\" markerHeight=\\\"6\\\" orient=\\\"auto-start-reverse\\\">\\u003cpath d=\\\"M2 1L8 5L2 9\\\" fill=\\\"none\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1.6\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>\\u003c/marker>\\u003c/defs>\\u003ctitle>Streaming XML ingestion pipeline\\u003c/title>\\n\\u003cdesc>A StAX reader streams records into a bounded queue that applies backpressure, writers\\nbatch into a staging table alongside a checkpoint, and bad records divert to quarantine.\\u003c/desc>\\n\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"24\\\" y=\\\"96\\\" width=\\\"150\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"99\\\" y=\\\"119\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">XML source\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"99\\\" y=\\\"139\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">Streamed, not loaded\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"174\\\" y1=\\\"125\\\" x2=\\\"206\\\" y2=\\\"125\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar6)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"210\\\" y=\\\"96\\\" width=\\\"150\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"285\\\" y=\\\"119\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">StAX reader\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"285\\\" y=\\\"139\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">DTD disabled\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"360\\\" y1=\\\"125\\\" x2=\\\"392\\\" y2=\\\"125\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar6)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-volt\\\">\\u003crect x=\\\"396\\\" y=\\\"96\\\" width=\\\"160\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E6E3FB\\\" stroke=\\\"#3A2BC4\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"476\\\" y=\\\"119\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#241B7A\\\">Bounded queue\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"476\\\" y=\\\"139\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#3A2BC4\\\">Backpressure at 10k\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"556\\\" y1=\\\"125\\\" x2=\\\"588\\\" y2=\\\"125\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar6)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"592\\\" y=\\\"96\\\" width=\\\"150\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"667\\\" y=\\\"119\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Writer pool\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"667\\\" y=\\\"139\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">Batch of 5000\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"667\\\" y1=\\\"154\\\" x2=\\\"667\\\" y2=\\\"196\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar6)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-teal\\\">\\u003crect x=\\\"560\\\" y=\\\"200\\\" width=\\\"182\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#DCEFEA\\\" stroke=\\\"#0B6E5B\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"651\\\" y=\\\"223\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#084A3D\\\">Staging + checkpoint\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"651\\\" y=\\\"243\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#0B6E5B\\\">One transaction\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"285\\\" y1=\\\"154\\\" x2=\\\"285\\\" y2=\\\"196\\\" class=\\\"arr\\\" marker-end=\\\"url(#ar6)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" />\\n\\u003cg class=\\\"n-rust\\\">\\u003crect x=\\\"196\\\" y=\\\"200\\\" width=\\\"182\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#F8E4DC\\\" stroke=\\\"#A93412\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"287\\\" y=\\\"223\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#6E220C\\\">Quarantine table\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"287\\\" y=\\\"243\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#A93412\\\">Bad rows, job survives\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"476\\\" y1=\\\"154\\\" x2=\\\"476\\\" y2=\\\"196\\\" class=\\\"arr dash\\\" marker-end=\\\"url(#ar6)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" stroke-dasharray=\\\"4 3\\\" />\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"396\\\" y=\\\"24\\\" width=\\\"160\\\" height=\\\"52\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"476\\\" y=\\\"47\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Metrics\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"476\\\" y=\\\"65\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">rows/sec, lag, ETA\\u003c/text>\\u003c/g>\\n\\u003cline x1=\\\"476\\\" y1=\\\"96\\\" x2=\\\"476\\\" y2=\\\"80\\\" class=\\\"arr dash\\\" marker-end=\\\"url(#ar6)\\\" stroke=\\\"#6B7482\\\" stroke-width=\\\"1.4\\\" fill=\\\"none\\\" stroke-dasharray=\\\"4 3\\\" />\\n\\u003cg class=\\\"n-gray\\\">\\u003crect x=\\\"396\\\" y=\\\"200\\\" width=\\\"150\\\" height=\\\"58\\\" rx=\\\"8\\\" fill=\\\"#E3E7ED\\\" stroke=\\\"#7C8593\\\" stroke-width=\\\"1\\\" />\\n\\u003ctext class=\\\"th\\\" x=\\\"471\\\" y=\\\"223\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"14\\\" font-weight=\\\"500\\\" fill=\\\"#252B34\\\">Queue depth\\u003c/text>\\n\\u003ctext class=\\\"ts\\\" x=\\\"471\\\" y=\\\"243\\\" text-anchor=\\\"middle\\\" font-family=\\\"Archivo\\\" font-size=\\\"12\\\" font-weight=\\\"400\\\" fill=\\\"#4C5563\\\">Slowest stage wins\\u003c/text>\\u003c/g>\\n\\u003c/svg>\\u003cfigcaption>Bounded queue hi asli design decision hai \u2014 wo parser ko DB ki speed pe chalne pe majboor karti hai. Checkpoint staging write ke saath ek hi transaction me hai, isliye recovery exact hai.\\u003c/figcaption>\\u003c/figure>\\u003cpre class=\\\"code\\\">\\u003ccode>File (disk / S3, streamed - poori memory me load nahi)\\n        |\\nStAX reader thread x 1\\n   - element by element parse\\n   - har record ko seq number assign\\n        |\\nArrayBlockingQueue(10_000)      &lt;- BOUNDED = backpressure\\n        |\\nWriter pool x N threads\\n   - batch of 5000 accumulate\\n   - executeBatch() -&gt; staging table\\n   - checkpoint update (SAME transaction)\\n        |\\nFinal: staging -&gt; main table, MERGE ORDER BY seq\\n        |\\nIndexes rebuild, staging drop\\u003c/code>\\u003c/pre>\"}, {\"id\": \"code\", \"title\": \"Reference implementation\", \"html\": \"\\u003cpre class=\\\"code\\\">\\u003ccode>public void ingest(InputStream xml, DataSource ds, long fileId) throws Exception {\\n    XMLInputFactory f = XMLInputFactory.newInstance();\\n    f.setProperty(XMLInputFactory.SUPPORT_DTD, false);\\n    f.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);\\n\\n    XMLStreamReader r = f.createXMLStreamReader(xml);\\n    long resumeFrom = loadCheckpoint(fileId);      // crash recovery\\n    long seq = 0;\\n\\n    try (Connection c = ds.getConnection();\\n         PreparedStatement ps = c.prepareStatement(\\n             &quot;INSERT INTO staging(seq, id, ts, payload) VALUES (?,?,?,?) &quot; +\\n             &quot;ON CONFLICT (id) DO NOTHING&quot;)) {      // idempotent\\n\\n        c.setAutoCommit(false);\\n        int inBatch = 0;\\n\\n        while (r.hasNext()) {\\n            if (r.next() != XMLStreamConstants.START_ELEMENT) continue;\\n            if (!&quot;record&quot;.equals(r.getLocalName())) continue;\\n\\n            seq++;\\n            if (seq &lt;= resumeFrom) { skipElement(r); continue; }   // resume\\n\\n            try {\\n                Record rec = parseRecord(r);          // element level only\\n                bind(ps, seq, rec);\\n                ps.addBatch();\\n                inBatch++;\\n            } catch (BadRecordException e) {\\n                quarantine(fileId, seq, e);           // fail mat karo\\n                continue;\\n            }\\n\\n            if (inBatch &gt;= 5000) {\\n                ps.executeBatch();\\n                saveCheckpoint(c, fileId, seq);       // SAME transaction\\n                c.commit();\\n                inBatch = 0;\\n                metrics.recordsProcessed(seq);\\n            }\\n        }\\n        if (inBatch &gt; 0) {\\n            ps.executeBatch();\\n            saveCheckpoint(c, fileId, seq);\\n            c.commit();\\n        }\\n    } finally {\\n        r.close();\\n    }\\n}\\u003c/code>\\u003c/pre>\\u003cdiv class=\\\"note good\\\">\\u003cspan class=\\\"note-t\\\">Sabse important line\\u003c/span>\\u003cdiv class=\\\"note-b\\\">\\u003ccode class=\\\"ic\\\">saveCheckpoint()\\u003c/code> \\u003cb>usi transaction me\\u003c/b> hai jisme batch insert hai. Agar checkpoint alag transaction me hota to crash ke waqt do galat states possible hain: data likha par checkpoint nahi (rerun pe duplicates), ya checkpoint likha par data nahi (silent data loss). Same transaction = atomic = correct recovery.\\u003c/div>\\u003c/div>\"}, {\"id\": \"close\", \"title\": \"Closing line\", \"html\": \"\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Ye bolke khatam karo\\u003c/span>\\u003cdiv class=\\\"note-b\\\">&quot;Sabse pehle main poochunga: file ka size kya hai, kitni baar chalti hai, aur SLA kya hai. Agar 100MB weekly hai to simple StAX plus batching kaafi hai \u2014 over-engineer karne ki zarurat nahi. Agar 50GB daily hai to ye single-machine design fundamentally galat hai; object storage plus distributed processing chahiye. \\u003cb>Solution problem ke scale se match karna chahiye.\\u003c/b>&quot;\\u003c/div>\\u003c/div>\\u003cp>Ye closing isliye strong hai ki wo dikhati hai aap engineering judgment lagate ho, sirf technique list nahi karte. Karat ke rubric me &quot;identifies a tradeoff&quot; alag se scoring axis hai.\\u003c/p>\"}], \"mocks\": [{\"tag\": \"Opener\", \"q\": \"System ek bahut bada XML file parse karke DB me likhta hai. Kya concerns hain?\", \"a\": \"\\u003cp>Main inko chhe categories me todunga: memory, database write pattern, resilience, ordering, security, aur operability.\\u003c/p>\\u003cp>\\u003cb>Sabse pehla killer memory hai.\\u003c/b> Agar DOM parser use ho raha hai to 10GB file ka tree RAM me 50 se 100GB lega \u2014 instant OOM. StAX ya SAX pe jaana padega, jo constant memory me stream karta hai.\\u003c/p>\\u003cp>\\u003cb>Doosra database write pattern hai.\\u003c/b> Row-by-row insert pe 50 million rows me 14 ghante lag jaayenge sirf network round trips me. Batching chahiye, aur ek hi giant transaction ke bajaye chunked commits.\\u003c/p>\\u003cp>Aur ek jo log aksar miss karte hain: \\u003cb>security\\u003c/b>. Untrusted XML parse karna XXE aur billion-laughs attacks invite karta hai. DTD disable karna do lines ka kaam hai.\\u003c/p>\"}, {\"tag\": \"Deep dive\", \"q\": \"Job 7 ghante chalne ke baad 95% pe crash ho gayi. Ab?\", \"a\": \"\\u003cp>Current design me poora dobara chalana padega, jo unacceptable hai.\\u003c/p>\\u003cp>Fix checkpointing hai. Ek checkpoint table rakhta hoon: file id, last processed record number, aur status. Har batch commit ke saath checkpoint bhi update hota hai.\\u003c/p>\\u003cp>\\u003cb>Critical detail:\\u003c/b> checkpoint update aur data insert \\u003cb>ek hi transaction\\u003c/b> me hone chahiye. Agar alag transactions me karo to crash ke waqt do galat states possible hain \u2014 data likha par checkpoint nahi, matlab rerun pe duplicates; ya checkpoint likha par data nahi, matlab silent data loss.\\u003c/p>\\u003cp>Restart pe main checkpoint padhta hoon aur us record number tak elements skip kar deta hoon. Byte offset store karna aur bhi tez hai, par record number simpler aur safer hai.\\u003c/p>\"}, {\"tag\": \"Correctness\", \"q\": \"Parallelize karke tez kar sakte hain? Order ka kya hoga?\", \"a\": \"\\u003cp>Ye sahi sawaal hai. Agar data genuinely chronological order me process hona zaroori hai to naive parallelization \\u003cb>correctness tod degi\\u003c/b>, sirf performance ka mamla nahi hai.\\u003c/p>\\u003cp>Pehle main poochunga: order kis liye chahiye? Agar downstream running balance calculate kar raha hai ya event sourcing hai, to order semantic hai. Agar bas &quot;file me isi order me tha&quot; hai to shayad matter hi nahi karta.\\u003c/p>\\u003cp>Agar order zaroori hai to: parse time pe har record ko \\u003cb>monotonic sequence number\\u003c/b> de do. Ab parallel me insert karo staging table me, koi order nahi. Final step me \\u003ccode class=\\\"ic\\\">INSERT INTO main SELECT * FROM staging ORDER BY seq\\u003c/code> \u2014 order wahin restore ho jaayega.\\u003c/p>\\u003cp>Isse parsing aur writing parallel ho jaate hain aur sirf final merge sequential rehta hai, jo bahut sasta hai.\\u003c/p>\"}, {\"tag\": \"Security\", \"q\": \"XML untrusted source se aa raha hai. Kya risk hai?\", \"a\": \"\\u003cp>Do bade attacks hain, aur dono ka fix ek hi hai.\\u003c/p>\\u003cp>\\u003cb>XXE\\u003c/b> \u2014 attacker document me external entity declare karta hai jo local file point kare, jaise /etc/passwd, ya ek internal URL. Parser use resolve kar deta hai aur content response me leak ho jaata hai. Ye SSRF ka bhi rasta hai \u2014 internal services hit kar sakte hain.\\u003c/p>\\u003cp>\\u003cb>Billion laughs\\u003c/b> \u2014 nested entity definitions jo exponentially expand hoti hain. 1KB ki file gigabytes memory le leti hai. Instant denial of service.\\u003c/p>\\u003cp>Fix: parser factory pe \\u003ccode class=\\\"ic\\\">SUPPORT_DTD\\u003c/code> false aur \\u003ccode class=\\\"ic\\\">IS_SUPPORTING_EXTERNAL_ENTITIES\\u003c/code> false. Do lines. Aur ye \\u003cb>default nahi\\u003c/b> hai Java me, isliye explicitly set karna padta hai \u2014 yahi wajah hai ki ye bug itna common hai.\\u003c/p>\"}, {\"tag\": \"Design\", \"q\": \"Parser DB se tez hai. Kya hoga?\", \"a\": \"\\u003cp>Agar beech me unbounded queue hai to wo badhti jaayegi jab tak memory khatam na ho jaaye. Ye classic producer-consumer mismatch hai aur OOM me khatam hota hai.\\u003c/p>\\u003cp>Fix \\u003cb>bounded\\u003c/b> queue hai \u2014 main \\u003ccode class=\\\"ic\\\">ArrayBlockingQueue\\u003c/code> 10,000 capacity ke saath use karunga. Jab queue bhar jaayegi to producer ka \\u003ccode class=\\\"ic\\\">put()\\u003c/code> block ho jaayega. Ye exactly wahi behaviour hai jo chahiye: parser automatically DB ki speed pe chalne lagega.\\u003c/p>\\u003cp>Ise backpressure kehte hain, aur ye system ko self-limiting bana deta hai \u2014 koi tuning nahi chahiye. Sabse dheema stage overall throughput decide karta hai, jo correct bhi hai.\\u003c/p>\\u003cp>Aur main queue depth ko metric ke roop me expose karunga. Agar wo hamesha full hai to DB bottleneck hai; hamesha khaali hai to parser bottleneck hai. Ek hi number se pata chal jaata hai kahan optimize karna hai.\\u003c/p>\"}, {\"tag\": \"Ops\", \"q\": \"Job 6 ghante chalegi. Aap kya monitor karenge?\", \"a\": \"\\u003cp>\\u003cb>Progress\\u003c/b> \u2014 records processed, percent complete, aur ETA. Bina iske koi nahi bata sakta ki job chal rahi hai ya hang hai.\\u003c/p>\\u003cp>\\u003cb>Throughput\\u003c/b> \u2014 records per second, rolling window pe. Agar ye girne lage to kuch degrade ho raha hai \u2014 DB slow, disk full, ya lock contention.\\u003c/p>\\u003cp>\\u003cb>Queue depth\\u003c/b> \u2014 bottleneck kahan hai ye ek number me bata deta hai.\\u003c/p>\\u003cp>\\u003cb>Error rate\\u003c/b> \u2014 quarantined records ka count aur percentage. Threshold rakhunga: 1% se zyada bad records ka matlab file hi corrupt hai ya schema badal gaya, to job fail karni chahiye, silently 40% data drop nahi karna chahiye.\\u003c/p>\\u003cp>Aur ek \\u003cb>heartbeat\\u003c/b> table jo har batch pe timestamp update kare. Agar wo 5 minute se purana ho to job hang hai \u2014 alert bhejo.\\u003c/p>\"}, {\"tag\": \"Judgment\", \"q\": \"Aap sabse pehle kya theek karenge agar time kam ho?\", \"a\": \"\\u003cp>Do cheezein, isi order me.\\u003c/p>\\u003cp>\\u003cb>Pehle streaming parser\\u003c/b>, agar DOM use ho raha hai. Ye ek din ka kaam hai aur sabse bade failure mode ko khatam kar deta hai \u2014 crash. Bina iske baaki kuch matter hi nahi karta kyunki job chalti hi nahi.\\u003c/p>\\u003cp>\\u003cb>Phir batching plus checkpointing.\\u003c/b> Batching se runtime ghanton se minutes me aa jaata hai. Checkpointing se failure ka cost poori job se ghatke ek batch reh jaata hai. Dono milke reliability aur speed dono theek kar dete hain.\\u003c/p>\\u003cp>Baaki cheezein \u2014 parallelization, distributed processing \u2014 tab tak wait kar sakti hain jab tak actual data ye na bataye ki abhi bhi zarurat hai. Main pehle measure karunga, phir optimize.\\u003c/p>\"}]}, {\"id\": \"rapidfire\", \"num\": 6, \"kind\": \"Discussion\", \"title\": \"Rapid-fire probes\", \"blurb\": \"Karat ke pehle 10 minute. Yahan \\u003cb>one-line answers\\u003c/b> chahiye \u2014 essay nahi. Har question ka jawab, aur follow-up jo interviewer deeper jaane pe poochega.\", \"sections\": [{\"id\": \"howto\", \"title\": \"Ye round kaise dena hai\", \"html\": \"\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Sabse important rule\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Ye \\u003cb>speed round\\u003c/b> hai. Ek line me jawab do, phir ruk jao. Agar interviewer ko aur chahiye to wo poochega. Jo log har question pe 3 minute bolte hain wo 10 minute me 4 questions hi cover kar paate hain \u2014 aur rubric me coverage bhi count hoti hai.\\u003c/div>\\u003c/div>\\u003cul class=\\\"bul\\\">\\u003cli>\\u003cb>Confident tone.\\u003c/b> &quot;Mujhe lagta hai shayad...&quot; se bachiye. Nahi pata to seedha bolo &quot;ye maine use nahi kiya, par mera samajh ye hai...&quot;\\u003c/li>\\u003cli>\\u003cb>Ek concrete example\\u003c/b> tabhi do jab jawab abstract lage. Ek line ka example kaafi hai\\u003c/li>\\u003cli>\\u003cb>Trap questions\\u003c/b> pehchano \u2014 kuch questions deliberately aisi cheez poochte hain jo log galat yaad rakhte hain (self-invocation, double-checked locking, HashMap resize)\\u003c/li>\\u003c/ul>\\u003cp>Neeche har entry me: \\u003cb>question\\u003c/b>, \\u003cb>ek line ka jawab\\u003c/b>, aur jahan zaroori hai wahan \\u003cb>follow-up\\u003c/b> jo interviewer next poochega.\\u003c/p>\"}, {\"id\": \"corejava\", \"title\": \"Core Java\", \"html\": \"\\u003cdiv class=\\\"rf\\\">\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Fail-fast aur fail-safe iterator me farak?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Fail-fast collection modify hone pe \\u003ccode class=\\\"ic\\\">ConcurrentModificationException\\u003c/code> phenkta hai; fail-safe ek copy ya snapshot pe iterate karta hai isliye exception nahi aata par data stale ho sakta hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Kaun kaun se?\\u003c/b> ArrayList aur HashMap fail-fast; CopyOnWriteArrayList aur ConcurrentHashMap fail-safe.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">equals() aur hashCode() ka contract kya hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Do equal objects ka hashCode same hona hi chahiye; ulta zaroori nahi. Agar equals() override kiya to hashCode() bhi karo.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Tod do to kya hoga?\\u003c/b> Object HashMap me daal ke wapas nahi milega \u2014 get() galat bucket me dhoondhega.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">HashMap internally kaise kaam karta hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Buckets ka array; key ka hash se index nikalta hai; collision pe linked list, aur 8 se zyada nodes hone pe wo red-black tree ban jaati hai (Java 8 se).\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Resize kab?\\u003c/b> Load factor 0.75 cross hone pe capacity double aur rehash.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Comparable aur Comparator?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Comparable class ke andar natural ordering define karta hai (\\u003ccode class=\\\"ic\\\">compareTo\\u003c/code>); Comparator bahar se alternate ordering deta hai (\\u003ccode class=\\\"ic\\\">compare\\u003c/code>).\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Optional me isPresent() aur ifPresent()?\\u003c/p>\\u003cp class=\\\"rf-a\\\">\\u003ccode class=\\\"ic\\\">isPresent()\\u003c/code> boolean lautata hai; \\u003ccode class=\\\"ic\\\">ifPresent()\\u003c/code> ek Consumer leta hai aur value hone pe chalata hai. Doosra zyada idiomatic hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Optional field me rakhna chahiye?\\u003c/b> Nahi \u2014 wo return type ke liye designed hai, serializable bhi nahi hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">SOLID me se ek principle real example ke saath?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Dependency Inversion \u2014 service concrete \\u003ccode class=\\\"ic\\\">MySqlRepository\\u003c/code> pe nahi, \\u003ccode class=\\\"ic\\\">Repository\\u003c/code> interface pe depend kare. Isse test me fake inject kar sakte ho.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Checked aur unchecked exception?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Checked compile time pe handle karna mandatory hai (IOException); unchecked runtime pe aati hai (NullPointerException) aur usually programming bug hoti hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Aap kya prefer karte ho?\\u003c/b> Modern Java me zyadatar unchecked, kyunki checked exceptions API me leak hoti hain aur log unko swallow kar dete hain.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">String immutable kyun hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Security (class loading, DB URLs), string pool caching, hashCode caching, aur thread safety bina synchronization ke.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">record aur normal class?\\u003c/p>\\u003cp class=\\\"rf-a\\\">record immutable data carrier hai \u2014 final fields, auto-generated constructor, equals, hashCode, toString. Behaviour ke liye nahi, sirf data ke liye.\\u003c/p>\\u003c/div>\\u003c/div>\"}, {\"id\": \"concurrency\", \"title\": \"Concurrency aur threads\", \"html\": \"\\u003cdiv class=\\\"rf\\\">\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">volatile aur synchronized me farak?\\u003c/p>\\u003cp class=\\\"rf-a\\\">volatile sirf \\u003cb>visibility\\u003c/b> deta hai \u2014 har read main memory se; synchronized visibility aur \\u003cb>atomicity\\u003c/b> dono deta hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>volatile counter++ safe hai?\\u003c/b> Nahi. Wo read-modify-write hai, teen operations. AtomicInteger use karo.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">ConcurrentHashMap internally kaise kaam karta hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Java 8 se per-bucket CAS aur node-level synchronized. Read lock-free hote hain, write sirf us bucket ko lock karti hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Java 7 me?\\u003c/b> Segment locking thi \u2014 fixed 16 segments, isliye concurrency uspe capped thi.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Mutex aur semaphore?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Mutex ownership wala single lock hai \u2014 jisne liya wahi chhodega. Semaphore ek counter hai jo N permits deta hai, koi bhi thread release kar sakta hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Kab semaphore?\\u003c/b> Resource pool limit karne me \u2014 jaise ek external API pe max 10 concurrent calls.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Deadlock ki conditions?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Mutual exclusion, hold and wait, no preemption, circular wait. Chaaron ek saath honi chahiye \u2014 kisi ek ko todo to deadlock nahi hoga.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Aap kaun si todenge?\\u003c/b> Circular wait \u2014 consistent lock ordering se. (Round 4 me poora hai.)\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Virtual threads kya hain aur kab use karein?\\u003c/p>\\u003cp class=\\\"rf-a\\\">JVM-managed lightweight threads. Blocking call pe carrier thread free ho jaata hai, isliye lakhon concurrent I/O tasks chal sakte hain.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Kab faayda nahi?\\u003c/b> CPU-bound kaam me \u2014 wahan core count hi limit hai. Aur synchronized block ke andar blocking karo to carrier pin ho jaata hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">ExecutorService shutdown() aur shutdownNow()?\\u003c/p>\\u003cp class=\\\"rf-a\\\">\\u003ccode class=\\\"ic\\\">shutdown()\\u003c/code> naye tasks lena band karta hai par pending complete karta hai; \\u003ccode class=\\\"ic\\\">shutdownNow()\\u003c/code> running threads ko interrupt karta hai aur pending list lautata hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">CompletableFuture ka ek real use?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Do independent service calls parallel me chalao aur dono ka result combine karo \u2014 \\u003ccode class=\\\"ic\\\">thenCombine\\u003c/code>. Serial calls ki latency add hone se bach jaate ho.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Exception?\\u003c/b> \\u003ccode class=\\\"ic\\\">exceptionally()\\u003c/code> ya \\u003ccode class=\\\"ic\\\">handle()\\u003c/code>, aur apna executor pass karo \u2014 common ForkJoinPool ko block mat karo.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Thread pool size kaise decide karenge?\\u003c/p>\\u003cp class=\\\"rf-a\\\">CPU-bound ke liye roughly core count; I/O-bound ke liye zyada, kyunki threads wait me rehte hain. Formula se zyada important hai measure karna.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Race condition aur deadlock alag kaise?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Race condition me output timing pe depend karta hai \u2014 galat result aata hai par system chalta rehta hai. Deadlock me progress hi ruk jaata hai.\\u003c/p>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"note warn\\\">\\u003cspan class=\\\"note-t\\\">Classic trap\\u003c/span>\\u003cdiv class=\\\"note-b\\\">&quot;Double-checked locking safe hai?&quot; \u2014 Java 5+ me \\u003cb>tabhi\\u003c/b> safe hai jab field \\u003ccode class=\\\"ic\\\">volatile\\u003c/code> ho. Bina volatile ke partially constructed object dikh sakta hai. Bahut log ye galat bolte hain.\\u003c/div>\\u003c/div>\"}, {\"id\": \"jvm\", \"title\": \"JVM aur performance\", \"html\": \"\\u003cdiv class=\\\"rf\\\">\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">JVM memory kaise organize hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Heap (objects, young aur old generation), stack (per thread frames), metaspace (class metadata), code cache (JIT output).\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>StackOverflowError vs OutOfMemoryError?\\u003c/b> Pehla stack me deep recursion se, doosra heap ya metaspace bharne se.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">G1 aur ZGC me kab kya?\\u003c/p>\\u003cp class=\\\"rf-a\\\">G1 default hai, throughput aur pause ka balance. ZGC tab jab pause time critical ho \u2014 wo bade heaps pe bhi single-digit millisecond pauses deta hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Memory leak Java me kaise hoti hai jab GC hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Jab reference zinda reh jaata hai \u2014 static collections jo badhti rehti hain, unclosed resources, listeners jo deregister nahi hue, ya ThreadLocal jo clean nahi hua.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Kaise pakdenge?\\u003c/b> Heap dump lo aur Eclipse MAT me dominator tree dekho, ya JFR se allocation profile.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Production me high CPU dikha. Pehla step?\\u003c/p>\\u003cp class=\\\"rf-a\\\">\\u003ccode class=\\\"ic\\\">top -H\\u003c/code> se hot thread ka native id nikalo, hex me convert karo, phir jstack ke output me wahi nid dhoondho \u2014 wahi hot code path hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">String concatenation loop me kyun bura hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Har iteration me naya String object banta hai \u2014 O(n squared) copying. StringBuilder use karo.\\u003c/p>\\u003c/div>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>// Trap: kaun sa faster hai aur kyun?\\nlist.stream().filter(x -&gt; x.active()).map(X::name).collect(toList());\\nfor (X x : list) if (x.active()) out.add(x.name());\\n\\n// Answer: chhoti lists pe loop faster hai (stream setup ka overhead).\\n// Badi lists ya parallel me stream jeet sakta hai. Readability ke liye\\n// stream chuno, performance ke liye measure karo - guess mat karo.\\u003c/code>\\u003c/pre>\"}, {\"id\": \"spring\", \"title\": \"Spring Boot\", \"html\": \"\\u003cdiv class=\\\"rf\\\">\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">@Transactional internally kaise kaam karta hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Spring ek proxy banata hai. Method call proxy se hoke jaati hai, jo transaction begin karta hai, method chalata hai, aur commit ya rollback karta hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Kab kaam nahi karta?\\u003c/b> Self-invocation pe \u2014 same class ke andar se method call karo to proxy bypass ho jaata hai. Aur private methods pe bhi.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Propagation REQUIRED aur REQUIRES_NEW?\\u003c/p>\\u003cp class=\\\"rf-a\\\">REQUIRED existing transaction join karta hai; REQUIRES_NEW existing ko suspend karke bilkul nayi transaction shuru karta hai.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>REQUIRES_NEW kab?\\u003c/b> Audit log likhne me \u2014 outer transaction rollback ho jaaye tab bhi log rehna chahiye.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">@Transactional default kis exception pe rollback karta hai?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Sirf unchecked (RuntimeException aur Error) pe. Checked exception pe \\u003cb>rollback nahi\\u003c/b> hota jab tak \\u003ccode class=\\\"ic\\\">rollbackFor\\u003c/code> na do.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Ye interview me bahut poocha jaata hai aur log galat bolte hain.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">RestTemplate aur WebClient?\\u003c/p>\\u003cp class=\\\"rf-a\\\">RestTemplate blocking aur maintenance mode me hai; WebClient non-blocking, reactive, aur naye code ke liye recommended \u2014 sync mode me bhi use ho sakta hai.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Bean scopes?\\u003c/p>\\u003cp class=\\\"rf-a\\\">singleton (default, per container ek), prototype (har request pe naya), aur web scopes \u2014 request, session, application.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Singleton bean me mutable state rakh sakte ho?\\u003c/b> Nahi \u2014 wo shared hai, thread safety toot jaayegi.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Global exception handling kaise?\\u003c/p>\\u003cp class=\\\"rf-a\\\">\\u003ccode class=\\\"ic\\\">@RestControllerAdvice\\u003c/code> class banao aur \\u003ccode class=\\\"ic\\\">@ExceptionHandler\\u003c/code> methods likho jo consistent error response shape return karein.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Readiness aur liveness probe me farak?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Liveness batata hai ki process zinda hai \u2014 fail ho to restart. Readiness batata hai ki traffic le sakta hai \u2014 fail ho to load balancer se hata do, restart nahi.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Ye lead-level question hai. Dono ko ek hi endpoint pe map karna common production bug hai.\\u003c/p>\\u003c/div>\\u003c/div>\\u003cpre class=\\\"code\\\">\\u003ccode>// Self-invocation trap - ye rollback nahi karega\\n@Service\\nclass OrderService {\\n    @Transactional\\n    public void save(Order o) { repo.save(o); }\\n\\n    public void process(List&lt;Order&gt; list) {\\n        for (Order o : list) save(o);   // proxy bypass, koi transaction nahi\\n    }\\n}\\n\\n// Fix: doosre bean me nikalo, ya self-reference inject karo\\u003c/code>\\u003c/pre>\"}, {\"id\": \"api\", \"title\": \"API design aur security\", \"html\": \"\\u003cdiv class=\\\"note say\\\">\\u003cspan class=\\\"note-t\\\">Ye Karat ka named probe hai\\u003c/span>\\u003cdiv class=\\\"note-b\\\">Karat ke VP of Content ne API design ko explicitly ek senior probe bataya hai. Expected answer: API ek \\u003cb>contract\\u003c/b> hai, isliye version karo \u2014 chalte version ke andar shape mat badlo.\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"rf\\\">\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">Ek live API ke input me naya field add karna hai. Kaise?\\u003c/p>\\u003cp class=\\\"rf-a\\\">Agar field \\u003cb>optional\\u003c/b> hai to backward compatible hai, same version me add kar sakte ho. Agar \\u003cb>required\\u003c/b> hai to wo breaking change hai \u2014 naya version chahiye.\\u003c/p>\\u003cp class=\\\"rf-f\\\">Follow-up: \\u003cb>Version kahan?\\u003c/b> URL path (\\u003ccode class=\\\"ic\\\">/v2/orders\\u003c/code>) sabse visible hai; header-based cleaner hai par debug karna mushkil.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i\\\">\\u003cp class=\\\"rf-q\\\">REST, gRPC aur message queue \u2014 kab kya?\\u003c/p>\\u003cp class=\\\"rf-a\\\">REST public aur cross-team APIs ke liye; gRPC internal high-throughput low-latency service-to-service ke liye; queue tab jab caller ko jawab ka wait nahi karna.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"rf-i
