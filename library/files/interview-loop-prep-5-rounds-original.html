"q\": \"Aap atak gaye. Kya karenge?\", \"a\": \"\\u003cp>Main \\u003cb>bolna band nahi karunga\\u003c/b> \u2014 ye sabse important hai. Silence Karat me sabse risky move hai kyunki interviewer ko dikhta hi nahi ki main soch raha hoon ya blank hoon.\\u003c/p>\\u003cp>Main bolunga ki mujhe kya samajh aa raha hai aur kahan atak raha hoon: &quot;mujhe lag raha hai yahan hash map chahiye, par main soch raha hoon ki key kya banegi kyunki duplicates possible hain.&quot; Aksar isko bolte bolte hi jawab mil jaata hai.\\u003c/p>\\u003cp>Agar phir bhi na aaye to main \\u003cb>brute force likh dunga\\u003c/b> aur bol dunga ki ye O(n squared) hai aur main isko optimize karna chahta hoon. Working brute force koi solution na hone se bahut behtar hai, aur usse aage optimize karna aasan hota hai.\\u003c/p>\\u003cp>Aur main ek chhota concrete example haath se chalaunga. 90% baar pattern wahin dikh jaata hai.\\u003c/p>\"}]}]");
const T = DATA;
let ti = 0, si = 'all';
const $ = s => document.querySelector(s);

function railHTML(){
  return T.map((t,i)=>`<button class="rail-i" role="tab" data-i="${i}"
     aria-selected="${i===ti}"><span class="rail-n">${t.num}</span>
     <span><span class="rail-t">${t.title}</span>
     <span class="rail-k">${t.kind}</span></span></button>`).join('');
}

function sideHTML(){
  const t = T[ti];
  let h = `<button class="side-i side-all" data-s="all"
      aria-current="${si==='all'}">All sections</button>`;
  h += t.sections.map(s=>`<button class="side-i" data-s="${s.id}"
      aria-current="${si===s.id}">${s.title}</button>`).join('');
  h += `<button class="side-i side-mock" data-s="mocks"
      aria-current="${si==='mocks'}">Mock questions (${t.mocks.length})</button>`;
  return h;
}

function mocksHTML(t){
  let h = `<div class="mock-top"><p>Question padho, jawab socho, phir kholo.</p>
    <button class="revealer" id="rv">Show all answers</button></div>`;
  h += t.mocks.map((m,i)=>`<div class="mock">
      <button class="mock-q" aria-expanded="false" data-m="${i}">
        <span class="mock-tag">${m.tag}</span>
        <span class="mock-qt">${m.q}</span>
        <span class="mock-mark" aria-hidden="true">+</span></button>
      <div class="mock-a" id="ma${i}" hidden>${m.a}</div></div>`).join('');
  return h;
}

function render(){
  const t = T[ti];
  $('#rail').innerHTML = railHTML();
  $('#side').innerHTML = sideHTML();
  let inner = `<div class="lede"><h2>Round ${t.num} — ${t.title}</h2>
      <p>${t.blurb}</p></div>`;
  if (si === 'mocks'){
    inner += `<h3 class="sec-h" style="margin-top:0">Mock questions with answers</h3>`
           + mocksHTML(t);
  } else if (si === 'all'){
    inner += t.sections.map(s=>`<section class="sec"><h3 class="sec-h">${s.title}</h3>
        ${s.html}</section>`).join('');
    inner += `<section class="sec"><h3 class="sec-h">Mock questions with answers</h3>
        ${mocksHTML(t)}</section>`;
  } else {
    const s = t.sections.find(x=>x.id===si);
    inner += `<section class="sec"><h3 class="sec-h">${s.title}</h3>${s.html}</section>`;
  }
  const c = $('#content');
  c.className = 'card fade';
  c.innerHTML = inner;
  void c.offsetWidth;
}

document.addEventListener('click', e=>{
  const r = e.target.closest('.rail-i');
  if (r){ ti = +r.dataset.i; si = 'all'; render();
          window.scrollTo({top:0,behavior:'instant'}); return; }
  const s = e.target.closest('.side-i');
  if (s){ si = s.dataset.s; render();
          if (window.innerWidth <= 920)
            $('#content').scrollIntoView({block:'start'});
          return; }
  const q = e.target.closest('.mock-q');
  if (q){
    const a = document.getElementById('ma'+q.dataset.m);
    const open = q.getAttribute('aria-expanded') === 'true';
    q.setAttribute('aria-expanded', String(!open));
    a.hidden = open;
    q.querySelector('.mock-mark').textContent = open ? '+' : '\u2212';
    return;
  }
  if (e.target.id === 'rv'){
    const qs = [...document.querySelectorAll('.mock-q')];
    const anyClosed = qs.some(x=>x.getAttribute('aria-expanded')==='false');
    qs.forEach(x=>{
      x.setAttribute('aria-expanded', String(anyClosed));
      document.getElementById('ma'+x.dataset.m).hidden = !anyClosed;
      x.querySelector('.mock-mark').textContent = anyClosed ? '\u2212' : '+';
    });
    e.target.textContent = anyClosed ? 'Hide all answers' : 'Show all answers';
  }
});

render();
</script>
</body></html>
