const PICKS = [{"id": 27, "why": "Start with why RAG exists; the base of most enterprise AI work."}, {"id": 32, "why": "The step up from basic RAG that interviewers now expect you to know."}, {"id": 42, "why": "Tool calling and MCP, the glue between Spring AI apps and real systems."}, {"id": 46, "why": "The vocabulary for designing agent systems in interviews."}, {"id": 16, "why": "How to prove an AI feature works, essential for Forward Deployed roles."}, {"id": 57, "why": "A finance-domain agent in production, close to banking use cases."}, {"id": 104, "why": "Migration patterns that map straight onto a bank monolith migration."}, {"id": 93, "why": "Exactly-once thinking for payments and Kafka consumers."}, {"id": 97, "why": "Distributed transactions across payment and FX services."}, {"id": 138, "why": "A cell-based payments architecture at card-network scale."}];
const ARTS=RAW.map((r,i)=>({id:i,t:r[0],o:r[1],title:r[2],url:"https://blog.bytebytego.com/p/"+r[3],date:r[4],paid:r[5]===1,note:r[6]}));
const KEY="bbg-study-read-v1";let read={};try{read=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let st={q:"",track:"all",acc:"all",hide:false};
const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fd=d=>{const[y,m,da]=d.split("-");return parseInt(da)+" "+M[m-1]+" "+y};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge=a=>a.paid?'<span class="b paid">Paid</span>':'<span class="b free">Free</span>';
const cell=a=>`<a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a><div class="note">${esc(a.note)}</div>`;
const chk=a=>`<input type="checkbox" data-id="${a.id}" ${read[a.id]?"checked":""}>`;
const free=ARTS.filter(a=>!a.paid).length;
document.getElementById("summary").textContent=`${ARTS.length} hand-picked ByteByteGo articles in ${TRACKS.length} tracks, each ordered from beginner to advanced. ${free} are free; paid ones show a preview only.`;
const sel=document.getElementById("track");sel.innerHTML='<option value="all">All tracks</option>'+TRACKS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
function render(){
 document.querySelector("#picks tbody").innerHTML=PICKS.map((p,i)=>{const a=ARTS[p.id];return `<tr class="${read[a.id]?"done":""}"><td>${i+1}</td><td>${cell(a)}</td><td>${esc(p.why)}</td><td>${badge(a)}</td><td>${chk(a)}</td></tr>`}).join("");
 const rows=[{l:"All tracks",d:ARTS.filter(a=>read[a.id]).length,n:ARTS.length}].concat(TRACKS.map(t=>{const L=ARTS.filter(a=>a.t===t.id);return{l:t.name,d:L.filter(a=>read[a.id]).length,n:L.length}}));
 document.getElementById("progress").innerHTML=rows.map(r=>{const p=r.n?Math.round(r.d/r.n*100):0;return `<div class="pr"><div class="l"><span>${esc(r.l)}</span><span>${r.d} of ${r.n} read · ${p}%</span></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join("");
 const s=st.q.trim().toLowerCase();
 const f=ARTS.filter(a=>(st.track==="all"||a.t===st.track)&&(st.acc==="all"||(st.acc==="paid"?a.paid:!a.paid))&&(!st.hide||!read[a.id])&&(!s||a.title.toLowerCase().includes(s)||a.note.toLowerCase().includes(s)));
 document.getElementById("count").textContent=`Showing ${f.length} of ${ARTS.length}`;
 document.getElementById("tracks").innerHTML=TRACKS.filter(t=>f.some(a=>a.t===t.id)).map(t=>{const L=f.filter(a=>a.t===t.id).sort((x,y)=>x.o-y.o);return `<details open><summary>${esc(t.name)}</summary><p class="blurb">${esc(t.blurb)}</p><div class="card"><table><thead><tr><th>Step</th><th>Article</th><th>Date</th><th>Access</th><th>Read</th></tr></thead><tbody>${L.map(a=>`<tr class="${read[a.id]?"done":""}"><td>${a.o}</td><td>${cell(a)}</td><td style="white-space:nowrap">${fd(a.date)}</td><td>${badge(a)}</td><td>${chk(a)}</td></tr>`).join("")}</tbody></table></div></details>`}).join("");
}
document.addEventListener("change",e=>{const id=e.target.dataset&&e.target.dataset.id;if(id!==undefined){read[id]=e.target.checked;try{localStorage.setItem(KEY,JSON.stringify(read))}catch(_){}render()}});
document.getElementById("q").oninput=e=>{st.q=e.target.value;render()};
sel.onchange=e=>{st.track=e.target.value;render()};
document.getElementById("hide").onchange=e=>{st.hide=e.target.checked;render()};
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");st.acc=b.dataset.v;render()});
