<style>

body.light{--bg:#f6f7fb;--panel:#ffffff;--panel2:#eef1f7;--text:#1b2230;--muted:#5b6575;--acc:#0b63ce;--acc2:#16794a;--warn:#9a6400;--border:#d8dde7;--code:#f3f5f9}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
#topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border)}

button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#search{flex:1;min-width:160px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px}

#layout{display:flex}

#sidebar a.read .t::after{content:" ✔";color:var(--acc2)}

main{flex:1;min-width:0;padding:16px 22px 80px;max-width:1100px}
section.design,section.intro{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin:0 0 22px;scroll-margin-top:64px}
section.hidden{display:none}
h2{margin:.2em 0 .3em;font-size:22px}
h3{margin:1.1em 0 .3em;font-size:17px;color:var(--acc)}
h4{margin:.8em 0 .2em;font-size:15px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin-right:6px;border:1px solid var(--border)}
.badge.free{background:rgba(126,224,161,.15);color:var(--acc2);border-color:var(--acc2)}
.badge.paid{background:rgba(255,204,102,.12);color:var(--warn);border-color:var(--warn)}
.note{border-left:4px solid var(--warn);background:var(--panel2);padding:8px 12px;border-radius:6px;font-size:14px;margin:8px 0}
.note.ok{border-left-color:var(--acc2)}
.naya{border:1px dashed var(--acc);background:rgba(90,169,255,.08);padding:8px 12px;border-radius:8px}
.fin{border-left:4px solid var(--acc2);background:var(--panel2);padding:8px 12px;border-radius:6px}
ul{padding-left:22px;margin:.3em 0}
li{margin:.25em 0}
.en{color:var(--muted);font-style:italic}
body.mode-hi .en{display:none}
body.mode-en .hi{display:none}
body.mode-en .en{color:var(--text);font-style:normal}
body.mode-both .en::before{content:"EN: ";font-weight:600;font-style:normal}
.pair{display:block}
li .pair + .pair{margin-top:2px}
.diagram{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto;margin:8px 0}
.diagram pre{margin:0;font-size:12.5px;white-space:pre;color:var(--text)}
.diagram svg{max-width:100%;height:auto}
.diagram .fallback-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.readchk{display:inline-flex;gap:6px;align-items:center;font-size:14px;margin-top:8px;cursor:pointer}
.src{font-size:13px;color:var(--muted)}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px}
table.cmp th,table.cmp td{border:1px solid var(--border);padding:6px 8px;vertical-align:top;text-align:left}
table.cmp th{background:var(--panel2);position:sticky;top:0}
.tablewrap{overflow:auto;max-height:75vh}
mark{background:#ffe08a;color:#000;padding:0 1px}
@media (max-width:860px){
 #menuBtn{display:inline-block}
 #sidebar{position:fixed;left:0;top:52px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.4);width:82vw;max-width:320px}
 body.nav-open #sidebar{transform:none}
 main{padding:10px 10px 60px}
 section.design,section.intro{padding:12px}
 #topbar h1{font-size:14px}
}

<script>
const B=(h,e)=>({h,e});

const DESIGNS=[];
DESIGNS.push({
id:"design-a-rate-limiter",ch:5,title:"Design A Rate Limiter",free:true,
table:{problem:"Ek client kitni requests bheje, limit karo (abuse/cost control)",naya:"Token bucket + rate limiting algorithms, HTTP 429",storage:"Redis (in-memory counters)",tradeoff:"Accuracy vs memory (sliding log vs counter); central Redis vs local"},
summary:B("Har user/IP/API key ke liye ek time window mein requests ki limit lagani hai. Limit cross ho to request drop karke HTTP 429 return karo.","Throttle the number of requests a client (user/IP/API key) can send in a time window; reject excess with HTTP 429."),
req:{f:[B("Server-side API rate limiter, alag-alag rules (per user, per IP, per endpoint).","Server-side API rate limiting with flexible rules (per user, IP, endpoint)."),B("Throttle hone par user ko clear message/headers milein (429, Retry-After).","Throttled users get a clear response (429 + headers like Retry-After)."),B("Distributed environment mein kaam kare – multiple servers ek hi limit share karein.","Must work across many servers sharing the same limits.")],
nf:[B("Low latency – limiter khud request ko slow na kare.","Low latency – the limiter must not slow down requests."),B("Kam memory use.","Use little memory."),B("Fault tolerant – limiter down ho to bhi system chale (fail-open).","Fault tolerant – if the limiter fails the whole system shouldn't go down.")]},
est:[B("Is chapter mein heavy estimation nahi hai; focus algorithm choice par hai. Example: 2 req/sec allowed, 3rd request ko 429.","No heavy estimation here; the focus is algorithm choice. Example: 2 req/s allowed, the 3rd gets a 429.")],
hld:{m:`flowchart LR
  C["Client"] --> RL["Rate Limiter Middleware / API Gateway"]
  RL -->|"allowed"| API["API Servers"]
  RL -->|"over limit"| R429["HTTP 429 Too Many Requests"]
  RL <--> REDIS[("Redis counters")]
  RULES["Rules config files"] --> CACHE["Rules cache"] --> RL`,
t:[B("Limiter ko client side mat rakho (client trust nahi kar sakte). Server ke saamne middleware ya API Gateway mein rakho.","Don't put the limiter on the client (untrusted). Put it as middleware or in the API gateway in front of servers."),B("Counters Redis mein: INCR se count badhao, EXPIRE se window ke baad reset. DB disk-based hai, slow hoga.","Counters live in Redis: INCR increments, EXPIRE resets after the window. A disk DB would be too slow."),B("Rules (jaise 5 login/min) config files mein, workers unhe cache mein load karte hain.","Rules (e.g. 5 logins/min) are kept in config files and loaded into a cache by workers.")]},
deep:[B("<b>Token bucket</b>: bucket mein fixed capacity ke tokens, refill rate se bharte hain. Har request ek token khaati hai; token nahi to drop. Burst allow karta hai. Amazon/Stripe jaisa common choice.","<b>Token bucket</b>: a bucket of fixed capacity refilled at a fixed rate; each request consumes a token, none left = drop. Allows bursts; very common (Amazon, Stripe)."),
B("<b>Leaking bucket</b>: FIFO queue, fixed rate se process. Stable outflow, par burst mein naye requests drop ho sakte hain.","<b>Leaking bucket</b>: FIFO queue processed at a fixed rate. Stable outflow, but bursts can starve new requests."),
B("<b>Fixed window counter</b>: har window (jaise 1 min) ka counter. Simple, par window ke edge par 2x traffic nikal sakta hai.","<b>Fixed window counter</b>: one counter per window. Simple, but a burst at window edges can let ~2x through."),
B("<b>Sliding window log</b>: har request ka timestamp (Redis sorted set). Accurate, par memory zyada.","<b>Sliding window log</b>: keep timestamps (e.g. Redis sorted set). Accurate but memory-heavy."),
B("<b>Sliding window counter</b>: current + previous window ka weighted mix. Memory kam, approx accurate.","<b>Sliding window counter</b>: weighted mix of current and previous window counts. Low memory, approximately accurate."),
B("Response headers: X-Ratelimit-Remaining, X-Ratelimit-Limit, X-Ratelimit-Retry-After. Dropped requests ko queue mein bhi daal sakte ho baad mein process karne ke liye.","Headers: X-Ratelimit-Remaining, X-Ratelimit-Limit, X-Ratelimit-Retry-After. Throttled requests may also be queued for later.")],
flow:{m:`sequenceDiagram
  participant C as Client
  participant RL as RateLimiter
  participant R as Redis
  participant S as APIServer
  C->>RL: request
  RL->>R: get bucket / counter
  alt tokens available
    RL->>R: decrement / INCR
    RL->>S: forward
    S-->>C: 200 OK
  else limit exceeded
    RL-->>C: 429 + Retry-After
  end`,t:[B("Request aayi → Redis se counter/bucket check → allow to forward, warna 429.","Request arrives → check counter/bucket in Redis → forward if allowed, else 429.")]},
tradeoffs:[B("Accuracy vs memory: sliding log accurate par costly; counter sasta par approx.","Accuracy vs memory: sliding log is accurate but costly; counters are cheap but approximate."),B("Central Redis (consistent) vs local in-memory (fast par inconsistent across servers).","Central Redis (consistent) vs local memory (faster but inconsistent across nodes)."),B("Hard limit vs soft limit (thoda exceed allow).","Hard vs soft limits.")],
failures:[B("Race condition: do requests ek saath read-then-write karein → Lua script ya Redis sorted set se atomic banao.","Race conditions in read-then-write: fix with Lua scripts or sorted sets (atomic ops)."),B("Multiple limiter nodes ka sync: centralized Redis use karo, sticky session nahi.","Sync across limiter nodes: use centralized Redis, not sticky sessions."),B("Redis down ho jaye to fail-open (allow) ya fail-closed – business decide kare.","If Redis is down: fail-open vs fail-closed is a business decision.")],
points:[B("Pehle poochho: client ya server side? kis basis par throttle (IP/user)? scale? distributed?","Clarify first: client vs server side, throttle key (IP/user), scale, distributed?"),B("Kam se kam 2-3 algorithms ke pros/cons bolo, phir token bucket choose karo.","Compare 2–3 algorithms, then justify token bucket."),B("Race condition + sync + monitoring zaroor bolo.","Mention race conditions, synchronization and monitoring.")],
naya:[B("Pehla 'design' chapter: yahan naya hai <b>rate limiting algorithms</b> (token bucket, leaking bucket, windows) aur <b>HTTP 429</b> ka concept. Ye system ko protect karne ka pattern hai, data store karne ka nahi.","First design chapter: introduces <b>rate limiting algorithms</b> (token bucket etc.) and <b>HTTP 429</b> – a protection pattern rather than a data store."),B("Redis ko as a fast shared counter use karna (INCR + EXPIRE) – aage bahut designs mein repeat hoga.","Using Redis as a fast shared counter (INCR + EXPIRE) – a building block reused later.")],
fintech:B("HSBC payments API par per-client/per-merchant TPS limit, OTP/login brute-force protection, Kafka consumer ke saamne downstream core-banking ko protect karne ke liye token bucket (Spring Cloud Gateway RequestRateLimiter = Redis token bucket).","Per-merchant TPS limits on payment APIs, OTP/login brute-force protection, protecting core banking downstream of Kafka consumers; Spring Cloud Gateway's RequestRateLimiter is a Redis token bucket.")
});

DESIGNS.push({
id:"design-consistent-hashing",ch:6,title:"Design Consistent Hashing",free:true,
table:{problem:"Servers add/remove hone par data/keys kam se kam move hon",naya:"Hash ring + virtual nodes",storage:"N/A (distribution technique)",tradeoff:"Zyada virtual nodes = better balance par zyada metadata"},
summary:B("Normal hash (key % N) mein server add/remove karte hi lagbhag saari keys reshuffle ho jaati hain. Consistent hashing se sirf ~k/n keys move hoti hain.","With key % N, adding/removing a server remaps almost all keys. Consistent hashing moves only ~k/n keys."),
req:{f:[B("Keys ko servers par evenly distribute karna.","Distribute keys evenly across servers."),B("Server add/remove par minimum keys move hon.","Minimal key movement when servers join/leave.")],nf:[B("Hotspot avoid karna (celebrity/hot keys).","Avoid hotspots."),B("Horizontal scaling easy ho.","Easy horizontal scaling.")]},
est:[B("Estimation nahi; concept chapter hai.","No estimation; it's a concept chapter.")],
hld:{m:`flowchart LR
  K1["key1"] -->|"clockwise"| S1(("Server 1"))
  K2["key2"] -->|"clockwise"| S2(("Server 2"))
  S1 --- S2 --- S3(("Server 3")) --- S0(("Server 0")) --- S1
  S1 -.-> V1["S1 virtual nodes: s1_0, s1_1, s1_2"]`,
t:[B("Hash space (jaise SHA-1 0..2^160-1) ko ek ring maan lo. Servers aur keys dono ko same hash function se ring par rakho.","Treat the hash space as a ring. Map both servers and keys onto it with the same hash function."),B("Key ka server = key se clockwise chalte hue pehla server.","A key belongs to the first server found going clockwise.")]},
deep:[B("<b>Add server</b>: sirf naye server aur uske anticlockwise wale pichle server ke beech ki keys move hongi.","<b>Add server</b>: only keys between the new server and its anticlockwise neighbour move."),B("<b>Remove server</b>: sirf us server ki keys agle clockwise server par jaayengi.","<b>Remove server</b>: only that server's keys move to the next clockwise server."),B("Problem: partitions uneven ho sakte hain aur keys non-uniform. Solution: <b>virtual nodes</b> – har real server ring par kai jagah (s0_0, s0_1...). Zyada vnodes = kam standard deviation = better balance.","Problem: uneven partitions/key distribution. Fix: <b>virtual nodes</b> – each server appears many times on the ring; more vnodes = lower std deviation = better balance."),B("Heterogeneous servers: bade server ko zyada vnodes de do.","Give bigger servers more vnodes.")],
flow:null,
tradeoffs:[B("Zyada vnodes → better balance, par ring metadata zyada store karna padta hai.","More vnodes → better balance, more metadata to store.")],
failures:[B("Server fail → uski keys next node par; replication ke saath data loss nahi.","Failed server's keys go to the next node; with replication there's no data loss.")],
points:[B("Rehashing problem (% N) se start karo, phir ring, phir vnodes.","Start with the rehashing problem, then ring, then vnodes."),B("Real use: DynamoDB, Cassandra partitioning, Discord, Akamai CDN, Maglev load balancer.","Real-world: Dynamo/Cassandra partitioning, Discord, Akamai, Google Maglev.")],
naya:[B("Naya concept: <b>hash ring</b> aur <b>virtual nodes</b>. Rate limiter mein ek counter tha; yahan sawaal hai data ko <i>bahut saare nodes</i> mein kaise baante bina har baar reshuffle ke. Ye agle KV store design ki neev hai.","New: <b>hash ring</b> + <b>virtual nodes</b>. It answers how to spread data across many nodes without reshuffling – the foundation of the next KV store design.")],
fintech:B("Kafka partitioning (key → partition) aur Redis Cluster ke hash slots isi idea se related hain; account-id based sharding mein bhi same soch – rebalancing kam se kam ho.","Related to Kafka key→partition and Redis Cluster hash slots; account-id sharding should minimize rebalancing.")
});

DESIGNS.push({
id:"design-a-key-value-store",ch:7,title:"Design A Key-value Store",free:true,
table:{problem:"Distributed, highly available put/get store (Dynamo jaisa)",naya:"CAP, quorum N/W/R, vector clocks, gossip, hinted handoff, Merkle tree",storage:"Memtable + commit log + SSTable (LSM)",tradeoff:"Consistency vs availability (CAP), W/R tuning"},
summary:B("put(key,value) aur get(key) wala store jo bahut bada data, high availability aur tunable consistency de.","A put/get store that handles big data with high availability and tunable consistency."),
req:{f:[B("put(key, value), get(key). Value chhoti (<10KB).","put(key,value) and get(key); small values (<10KB)."),B("Bada data store kar sake.","Store large datasets.")],nf:[B("High availability – failure mein bhi jaldi response.","High availability even during failures."),B("Scalable, automatic scaling.","Scalable with auto scaling."),B("Tunable consistency, low latency.","Tunable consistency, low latency.")]},
est:[B("Specific numbers nahi; Merkle tree example: 1 billion keys ko 1 million buckets mein (har bucket ~1000 keys).","No traffic numbers; Merkle example: 1B keys in 1M buckets (~1000 keys each).")],
hld:{m:`flowchart LR
  C["Client"] --> CO["Coordinator node"]

  end`,
t:[B("Single server (hash table) chhota pad jaata hai → distributed. Har node same kaam karta hai (decentralized, koi master nahi).","Single-node hash table won't fit → distribute. All nodes are equal (no master)."),B("Client ka request coordinator node lega jo replicas tak forward karega.","A coordinator node forwards client requests to replicas.")]},
deep:[B("<b>CAP theorem</b>: network partition hoga hi, to C ya A mein se choose karo. Bank balance = CP; social likes = AP.","<b>CAP</b>: partitions happen, so choose consistency or availability. Bank balance = CP, likes = AP."),
B("<b>Partition</b>: consistent hashing + vnodes. <b>Replication</b>: key ko ring par next N unique servers par copy (alag data centers mein).","<b>Partitioning</b>: consistent hashing + vnodes. <b>Replication</b>: copy to next N distinct servers on the ring, across DCs."),

B("<b>Consistency models</b>: strong, weak, eventual (Dynamo/Cassandra eventual).","<b>Consistency models</b>: strong, weak, eventual."),
B("<b>Vector clocks</b>: [server, version] pairs se pata chalta hai do versions mein conflict hai ya ek dusre ka ancestor. Conflict client resolve karta hai.","<b>Vector clocks</b>: [server, version] pairs detect whether versions conflict or descend; client resolves conflicts."),

B("<b>Sloppy quorum + hinted handoff</b>: temporary failure mein dusra healthy node writes le leta hai, wapas aane par hand back.","<b>Sloppy quorum + hinted handoff</b> for temporary failures."),
B("<b>Merkle tree (anti-entropy)</b>: permanent failure ke baad replicas sync – sirf alag buckets transfer.","<b>Merkle trees</b> sync replicas after permanent failure, transferring only differing buckets."),

  CO->>B: write

  Note over CO: W=2 acks received
  CO-->>C: success`,t:[B("N=3, W=2: do acks milte hi client ko success.","N=3, W=2: success after two acks.")]},
tradeoffs:[B("Consistency vs availability vs latency (W/R tuning).","Consistency vs availability vs latency via W/R."),B("Eventual consistency = conflict handling client par.","Eventual consistency pushes conflict resolution to clients."),B("Vector clock size badh sakta hai → threshold par purane pairs hatao.","Vector clocks can grow; trim old pairs.")],
failures:[B("Detection: gossip. Temporary: hinted handoff. Permanent: Merkle tree. Data center outage: multi-DC replication.","Detection: gossip; temporary: hinted handoff; permanent: Merkle; DC outage: multi-DC replication.")],
points:[B("Ek table yaad rakho: goal → technique (bada data→consistent hashing, high-avail reads→replication, high-avail writes→vector clocks, temp failure→sloppy quorum, perm failure→Merkle, DC outage→cross-DC).","Remember the goal→technique table: big data→consistent hashing, available writes→vector clocks, temp failure→sloppy quorum, etc.")],
naya:[B("Sabse zyada naye concepts isi chapter mein: <b>CAP, quorum (N/W/R), vector clocks, gossip, hinted handoff, Merkle tree, LSM (memtable/SSTable), Bloom filter</b>. Consistent hashing yahan ek building block ban jaata hai.","Concept-heavy: <b>CAP, quorum, vector clocks, gossip, hinted handoff, Merkle trees, LSM, Bloom filters</b>. Consistent hashing becomes a building block.")],

table:{problem:"Lambi URL → chhoti URL, aur fast redirect",naya:"Base62 encoding, 301 vs 302 redirect",storage:"Relational DB (id, shortURL, longURL) + cache",tradeoff:"Hash+collision check vs base62(unique ID); 301 (kam load) vs 302 (analytics)"},

est:[B("100 million URLs/din → write ≈ 1160/sec; read ≈ 11,600/sec.","100M URLs/day → ~1160 writes/s, ~11,600 reads/s."),B("10 saal: 365 billion records; avg URL 100 bytes → ~36.5 TB.","10 years: 365B records × 100 bytes ≈ 36.5 TB."),B("62^n ≥ 365 billion → n = 7 (62^7 ≈ 3.5 trillion).","62^n ≥ 365B → length 7 (≈3.5T).")],
hld:{m:`flowchart LR
  U["User"] --> LB["Load Balancer"] --> WS["Web/API Servers"]

deep:[B("<b>301 (permanent)</b>: browser cache kar leta hai → server load kam. <b>302 (temporary)</b>: har click server se → click analytics milta hai.","<b>301</b> is cached by browsers (less load); <b>302</b> hits the server each time (good for analytics)."),
B("<b>Option 1: hash + collision resolution</b>: CRC32/MD5/SHA-1 ke pehle 7 chars; collision ho to predefined string jodkar dobara hash. DB lookup costly → Bloom filter.","<b>Hash + collision resolution</b>: take 7 chars of a hash; on collision append a string and rehash; Bloom filter speeds checks."),
B("<b>Option 2: base62 conversion</b>: pehle unique ID (Snowflake) lo, phir base62 mein convert. Collision impossible, par next URL guess ho sakta hai (security concern).","<b>Base62</b>: generate a unique ID then encode in base62. No collisions, but next URL is predictable."),
B("Example: 11157 (base10) = '2TX' (base62).","Example: 11157 → '2TX'.")],
flow:{m:`sequenceDiagram
  participant U as User
  participant S as WebServer
  participant C as Cache
  participant D as DB
  U->>S: GET /zn9edcu
  S->>C: lookup
  alt cache hit
    C-->>S: longURL
  else miss
    S->>D: select longURL
    D-->>S: longURL
    S->>C: put
  end
  S-->>U: 301/302 Location longURL`,t:[B("Shorten flow: longURL DB mein hai? haan to purana short return; nahi to naya ID → base62 → save.","Shorten: if longURL exists return existing; else new ID → base62 → save.")]},
tradeoffs:[B("Hash approach: fixed length, par collision handling. Base62: no collision, length ID ke saath badhti hai, guessable.","Hash: fixed length but collisions. Base62: no collisions but predictable."),B("301 vs 302: performance vs analytics.","301 vs 302: performance vs analytics.")],
failures:[B("Rate limiter lagao (abuse). Web tier stateless, DB replication + sharding, cache.","Add rate limiting; stateless web tier; DB replication/sharding; caching.")],
points:[B("Estimation se length 7 derive karna interviewer ko pasand aata hai.","Deriving length 7 from estimates impresses."),B("Analytics, availability, consistency wrap-up mein bolo.","Mention analytics, availability, consistency in wrap-up.")],
naya:[B("Naya: <b>base62 encoding</b> aur <b>redirect semantics (301 vs 302)</b>. Unique ID generator (Snowflake) ko yahan reuse karte hain – pehli baar ek design dusre design ko building block banata hai.","New: <b>base62</b> and <b>301 vs 302</b>; reuses the unique ID generator as a building block.")],
fintech:B("Payment links / UPI-collect style short links, SMS mein short links – 302 + analytics, aur ID guessable na ho isliye random salt/encryption.","Payment links in SMS: use 302 for tracking and make IDs non-guessable.")
});

est:[B("1B pages/month → ~400 pages/sec, peak ~800.","~400 pages/s, peak 800."),B("Avg page 500KB → 500 TB/month → 5 saal mein ~30 PB.","500 KB/page → 500 TB/month → ~30 PB over 5 years.")],

  US --> USS[("URL Storage")]`,

deep:[B("<b>DFS vs BFS</b>: web graph bahut deep hai, isliye BFS (FIFO). Par plain BFS impolite hai (ek host ke saare links ek saath) aur priority nahi deta.","<b>BFS over DFS</b>, but plain BFS is impolite and has no priority."),
B("<b>URL frontier</b>: <i>front queues</i> = priority (PageRank, traffic, update frequency) via prioritizer; <i>back queues</i> = politeness – har queue mein sirf ek host ke URLs, har worker ek queue, downloads ke beech delay.","<b>Frontier</b>: front queues for priority, back queues for politeness (one host per queue, delay between fetches)."),
B("<b>Freshness</b>: important/often-changing pages ko zyada baar recrawl.","<b>Freshness</b>: recrawl important pages more."),
B("<b>Frontier storage</b>: hundreds of millions URLs → zyada disk par, memory buffers enqueue/dequeue ke liye.","Hybrid disk + memory buffers for frontier."),
B("<b>Downloader</b>: robots.txt cache karo, distributed crawl, DNS cache (DNS slow hota hai), geo-locality, short timeouts.","<b>Downloader</b>: cache robots.txt, distribute, DNS cache, locality, timeouts."),
B("<b>Robustness</b>: consistent hashing se load distribute, crawl state save karo, exceptions handle, data validation.","Consistent hashing, saved state, exception handling.")],
flow:null,
tradeoffs:[B("Politeness vs speed; priority vs freshness; memory (fast) vs disk (scalable).","Politeness vs speed; priority vs freshness; memory vs disk.")],
failures:[B("Spider traps (infinite deep URLs) → max URL length/ manual blacklist. Data noise (ads, spam) filter. Crash recovery via saved state.","Spider traps → length limits/blacklists; filter noise; restart from saved state.")],
points:[B("Politeness aur priority = front/back queues – ye diagram zaroor banao.","Draw front/back queues."),B("~29% pages duplicate hote hain → content hash se dedup.","~29% duplicates → hash-based dedup.")],
naya:[B("Naya: <b>URL frontier with politeness + priority queues</b>, <b>robots.txt</b>, aur do level ka dedup (<b>content seen</b> by hash, <b>URL seen</b> by Bloom filter). Pehli baar ek 'pipeline / worker' style batch system aata hai, request-response nahi.","New: <b>URL frontier</b> with politeness/priority, <b>robots.txt</b>, and two-level dedup; first pipeline-style batch system.")],
fintech:B("Kafka-based pipelines jaisa: topic = queue, partition-per-key se politeness (ek merchant/bank partner par concurrency limit), dedup via idempotent consumer. Statement/scraping jobs mein bhi ye pattern.","Like Kafka pipelines: per-key partitions for politeness, dedup via idempotent consumers.")
});

table:{problem:"Files upload/download, multi-device sync, revisions, sharing",naya:"Block servers (4MB chunks), delta sync, dedup by hash, long polling, strong consistency metadata",storage:"S3 (blocks) + relational metadata DB (ACID) + cold storage",tradeoff:"Client-side vs server-side block processing; strong consistency vs latency"},

req:{f:[B("Upload/download files.","Upload/download."),B("Multiple devices par sync.","Sync across devices."),B("File revisions (purane versions dekhna).","File revisions."),B("Sharing (friends/family/colleagues ke saath).","Sharing."),B("File edit/delete/share hone par notification.","Notifications on change.")],
nf:[B("Reliability – data loss unacceptable.","Reliability – no data loss."),B("Fast sync speed.","Fast sync."),B("Bandwidth kam use (mobile data).","Low bandwidth use."),B("Scalability, high availability.","Scalable and available.")]},
est:[B("50M signed-up users, 10M DAU.","50M users, 10M DAU."),B("Har user ko 10GB free → 50M × 10GB = ~500 PB total.","10GB each → ~500 PB."),B("Har user ~2 uploads/din, avg file 500KB → 10M × 2 / 86400 ≈ <b>240 upload QPS</b>, peak ≈ <b>480</b>.","~2 uploads/user/day → ~240 QPS, peak ~480."),B("Read:write ~1:1 (sync mein dono barabar).","Read:write ~1:1.")],

t:[B("Shuruaat ek server se (apache + MySQL + /drive folder), storage full hone par sharding, phir S3 (cross-region replication) par move.","Start with one server, then shard, then move files to S3 with cross-region replication."),B("APIs: <b>upload</b> (simple upload chhoti file ke liye; <b>resumable upload</b> badi file ke liye – network toota to wahin se continue), <b>download</b> (path), <b>get revisions</b> (path, limit).","APIs: <b>upload</b> (simple or <b>resumable</b>), <b>download</b>, <b>list revisions</b>."),B("Metadata (user, file, version, block list) DB mein; actual bytes S3 mein. Auth: HTTPS + OAuth.","Metadata in DB, bytes in S3; HTTPS + OAuth.")]},
deep:[B("<b>Block servers</b>: file ko ~4MB blocks mein todte hain, har block ka hash nikalte hain, compress (gzip/bzip2 text ke liye, alag codecs images/video ke liye) aur encrypt karke S3 mein daalte hain. File = ordered list of block hashes.","<b>Block servers</b> split files into ~4MB blocks, hash, compress, encrypt, store in S3; a file is an ordered list of block hashes."),
B("<b>Delta sync</b>: file edit hui to sirf badle hue blocks upload hote hain, poori file nahi → bandwidth bachti hai.","<b>Delta sync</b>: only changed blocks are uploaded."),
B("<b>Dedup</b>: same hash wala block pehle se hai (same account level) to dobara store nahi.","<b>Dedup</b>: identical block hashes are stored once."),
B("<b>Metadata DB – strong consistency (ACID)</b>: do devices ko same file ka alag view nahi dikhna chahiye. Relational DB natural fit. Tables: user, device (push_id), workspace, file, file_version (read-only rows = history), block.","<b>Metadata DB with strong consistency</b>: relational; tables user, device, workspace, file, file_version, block."),
B("<b>Metadata cache</b>: fast reads, par write par cache invalidate karo taaki cache aur DB consistent rahein.","<b>Metadata cache</b> with invalidation on write."),
B("<b>Notification service – long polling</b>: client server se connection khula rakhta hai; change hote hi response, client latest changes pull karta hai, phir naya long-poll. WebSocket ki zaroorat nahi kyunki communication mostly one-way (server→client) aur notifications kam frequent.","<b>Long polling</b> notifications: one-way and infrequent, so WebSocket isn't needed."),
B("<b>Offline backup queue</b>: client offline hai to changes queue mein, online aane par sync.","<b>Offline backup queue</b> holds changes for offline clients."),
B("<b>Storage space bachana</b>: dedup, smart revision policy (max versions limit, important versions zyada rakho), inactive data <b>cold storage</b> (S3 Glacier) mein.","Save space: dedup, revision limits, cold storage for inactive data.")],
flow:{m:`sequenceDiagram
  participant C1 as Client1
  participant A as APIServer
  participant M as MetadataDB
  participant N as Notification
  participant B as BlockServer
  participant S as S3
  participant C2 as Client2
  C1->>A: add file metadata
  A->>M: status = pending
  A->>N: notify file is uploading
  N-->>C2: change event
  C1->>B: upload blocks
  B->>S: store chunked, compressed, encrypted blocks
  S-->>A: upload completion callback
  A->>M: status = uploaded
  A->>N: notify upload done
  N-->>C2: pull latest metadata and download changed blocks`,t:[B("<b>Upload</b>: (1) metadata 'pending' (2) notification service doosre clients ko batata hai (3) blocks block server se S3 (4) S3 callback → status 'uploaded' (5) doosre clients notify hokar changes download karte hain.","<b>Upload</b>: pending metadata → notify → blocks to S3 → callback → uploaded → notify others."),B("<b>Download</b>: notification aaya → metadata se changed block list → block servers se sirf woh blocks → client file reconstruct.","<b>Download</b>: notified → fetch block list → download changed blocks → reconstruct.")]},
tradeoffs:[B("<b>Block servers client side vs server side</b>: client par chunk/compress/encrypt = kam bandwidth, fast; par har platform (iOS, Android, web) par logic likhna padega, aur client par encryption logic security/hack risk. Isliye centralized block servers.","<b>Client-side vs server-side block processing</b>: client-side saves bandwidth but duplicates logic across platforms and is a security risk; hence central block servers."),
B("Strong consistency (relational, slower) vs NoSQL scale – metadata ke liye consistency jeetti hai.","Consistency beats NoSQL scale for metadata."),
B("Long polling vs WebSocket: one-way & infrequent → long polling.","Long polling chosen over WebSocket."),
B("<b>Sync conflict</b>: jo version pehle process hua woh jeetega (<b>first write wins</b>); doosre user ko conflict dikhega aur <b>dono copies</b> (local + server) milengi, user merge ya choose kare.","<b>Conflicts</b>: first write wins; the other user sees both copies and resolves.")],
failures:[B("LB fail → secondary LB (heartbeat). Block server fail → doosra server pending jobs uthaye.","LB failover; another block server picks up jobs."),B("S3 fail → <b>cross-region replication</b> se doosre region se.","S3 cross-region replication."),B("API servers <b>stateless</b> → LB traffic doosre server par.","Stateless API servers."),B("Metadata cache replicated; DB master down → slave promote (<b>failover</b>), slave down → doosra slave.","Cache replicas; DB failover."),B("Notification server fail → clients ko <b>reconnect</b> karna padta hai (long poll connections lost) – reconnection slow hota hai, gradual.","Notification server failure → clients reconnect (slow)."),B("Offline backup queue replicated – consumers resubscribe.","Replicated offline queue.")],
points:[B("Reliability first → strong consistency metadata + S3 replication.","Reliability first."),B("Block-level: split, hash, compress, encrypt, delta sync, dedup – ye 6 words yaad rakho.","Remember: split, hash, compress, encrypt, delta, dedup."),B("Metadata vs file data separation – sabse important architecture insight.","Separate metadata from file data."),B("Long polling kyun, conflict handling, client vs server block servers trade-off bolo.","Explain long polling, conflicts, block server placement.")],
naya:[B("Naya (YouTube se compare karo): YouTube mein file ek baar upload, phir read-only stream. Drive mein file <b>baar baar edit</b> hoti hai aur <b>multiple devices sync</b> → isliye <b>block-level storage, delta sync, dedup</b>, <b>revisions</b>, <b>sync conflicts</b>, aur <b>long-polling notification</b>. Chat mein WebSocket tha, yahan long polling – kyunki traffic one-way aur kam frequent hai. Metadata ke liye <b>strong consistency</b> (KV store chapter ki eventual consistency se ulta).","Versus YouTube (upload once, stream read-only), Drive files are edited repeatedly and synced → <b>blocks, delta sync, dedup, revisions, conflicts, long polling</b>; and <b>strong consistency</b> for metadata, unlike the eventually consistent KV store.")],
fintech:B("Monolith migration mein bhi yahi soch: metadata (ACID, Oracle/Postgres) aur bulk documents (S3/object store) alag. Statement/KYC document versions, maker-checker workflow mein conflict (first write wins + reject), aur Kafka se 'file uploaded' event downstream systems ko.","Separate ACID metadata from bulk documents; document versions, maker-checker conflicts, Kafka 'file uploaded' events.")
});

 ${list([B("<b>Step 1 – Scope samjho (3-10 min)</b>: requirements, users, scale, features poochho. Seedha design mat shuru karo.","<b>Step 1 – Clarify scope</b>: requirements, scale, features; don't jump in."),B("<b>Step 2 – High-level design + buy-in (10-15 min)</b>: boxes diagram, APIs, back-of-envelope estimate; interviewer se agree karwao.","<b>Step 2 – High-level design</b>: boxes, APIs, estimates; get agreement."),B("<b>Step 3 – Deep dive (10-25 min)</b>: 1-2 critical components par detail, trade-offs bolo.","<b>Step 3 – Deep dive</b> into critical components with trade-offs."),B("<b>Step 4 – Wrap up (3-5 min)</b>: bottlenecks, failures, monitoring, next scale (10x) par kya badlega.","<b>Step 4 – Wrap up</b>: bottlenecks, failures, monitoring, 10x scale.")])}
 <h3>Basics (free chapters)</h3>
 ${list([B("<a href='"+SRC+"scale-from-zero-to-millions-of-users' target='_blank'>Scale From Zero To Millions Of Users</a> ✅ – LB, DB replication, cache, CDN, stateless web tier, multi-DC, message queue, sharding.","Scaling basics: LB, replication, cache, CDN, stateless tier, multi-DC, MQ, sharding."),B("<a href='"+SRC+"back-of-the-envelope-estimation' target='_blank'>Back-of-the-envelope Estimation</a> ✅ – power of 2, latency numbers, 1 din ≈ 10^5 sec, QPS/storage nikalna.","Estimation: powers of two, latency numbers, 1 day ≈ 10^5 s."),B("<a href='"+SRC+"a-framework-for-system-design-interviews' target='_blank'>A Framework For System Design Interviews</a> ✅ – upar wala 4-step.","The 4-step framework above.")])}
 <h3>Comparison table – sab designs ek nazar mein</h3>
 <div class="tablewrap"><table class="cmp"><thead><tr><th>#</th><th>Design</th><th>Status</th><th>Core problem</th><th>Naya concept</th><th>Main storage</th><th>Key trade-off</th></tr></thead><tbody>
 ${DESIGNS.map(d=>`<tr><td>${d.ch}</td><td><a href="#${d.id}">${d.title}</a></td><td>${d.free?"Free ✅":"Paid 🔒"}</td><td>${d.table.problem}</td><td>${d.table.naya}</td><td>${d.table.storage}</td><td>${d.table.tradeoff}</td></tr>`).join("")}
 </tbody></table></div>
 <h3>Concept ki journey (kaun sa design kya naya laata hai)</h3>
 ${pair(B("Rate limiter (Redis counter) → Consistent hashing (ring) → KV store (quorum, vector clocks, gossip) → Unique ID (Snowflake) → URL shortener (base62, ID reuse) → Crawler (frontier, politeness) → Notification (retry+dedup) → News feed (fanout write vs read) → Chat (WebSocket, presence) → Autocomplete (trie) → YouTube (transcoding DAG, CDN) → Google Drive (blocks, delta sync, long polling) → Geo designs (geohash, pub/sub) → Message queue (commit log) → Metrics/Ad click (time-series, stream windows) → Hotel (idempotency, locking, Saga) → S3 (erasure coding) → Leaderboard (sorted set) → Payment/Wallet/Exchange (ledger, event sourcing, determinism).","Journey: counters → ring → quorum → Snowflake → base62 → frontier → retry/dedup → fanout → WebSocket → trie → DAG/CDN → blocks/delta sync → geo → commit log → streams → idempotency/locking/Saga → erasure coding → sorted sets → ledgers/event sourcing."))}
 </section>`;
}

function renderDesign(d){
 const url=SRC+d.id;
 const badge=d.free?`<span class="badge free">Free chapter ✅</span>`:`<span class="badge paid">Paid 🔒</span>`;
 const notice=d.free
  ? `<div class="note ok">${pair(B("Source: ByteByteGo ka <b>free</b> chapter – yahan sab apne shabdon mein samjhaya gaya hai (copy-paste nahi). Detail ke liye original padho.","Source: ByteByteGo <b>free</b> chapter, explained in our own words. Read the original for details."))}</div>`
  : `<div class="note">${pair(B("🔒 Ye <b>paid chapter</b> hai – iska content humne nahi padha/copy kiya. Neeche sab <b>hamari taraf se short overview (ByteByteGo ka content nahi)</b> – general system-design knowledge se."+(d.deepOverview?" (Google Drive ke liye detail zyada hai kyunki ye pehle se discuss hua tha.)":"")+" Estimates jahan '(Hamari taraf se)' likha hai woh hamare assumptions hain.","🔒 <b>Paid chapter</b> – not read or copied. Everything below is <b>our own short overview (not ByteByteGo content)</b> from general knowledge; '(Ours)' marks our assumptions."))}</div>`;
 const req=`<h4>Functional</h4>${list(d.req.f)}<h4>Non-functional</h4>${list(d.req.nf)}`;
 return `<section class="design" id="${d.id}" data-id="${d.id}">
 <div>${badge}<span class="badge">Chapter ${d.ch}</span></div>
 <h2>${d.ch}. ${d.title}</h2>
 <div class="src">Source: <a href="${url}" target="_blank" rel="noopener">${url}</a></div>
 ${notice}
 <p>${pair(d.summary)}</p>
 <h3>1. Requirements</h3>${req}
 ${d.est&&d.est.length?`<h3>2. Back-of-envelope estimates</h3>${list(d.est)}`:""}
 <h3>3. Basic HLD (high-level design)</h3>${diagram(d.hld.m)}${list(d.hld.t)}
 <h3>4. Deep dive – key components aur kyun</h3>${list(d.deep)}
 ${d.flow?`<h3>5. Main flow</h3>${diagram(d.flow.m)}${list(d.flow.t)}`:""}
 <h3>6. Trade-offs</h3>${list(d.tradeoffs)}
 <h3>7. Failure handling</h3>${list(d.failures)}
 <h3>8. Interview key points 🎯</h3>${list(d.points)}
 <h3>9. Is design mein kya alag / kya naya hai ✨</h3><div class="naya">${list(d.naya)}</div>
 <h3>10. Fintech / HSBC connection 🏦</h3><div class="fin">${pair(d.fintech)}</div>
 <label class="readchk"><input type="checkbox" class="rd" data-id="${d.id}"> Padh liya ✔ (mark as read)</label>
 </section>`;
}

function renderSidebar(){
 const mk=d=>`<a href="#${d.id}" data-id="${d.id}"><span class="num">${d.ch}</span><span class="t">${d.free?"✅":"🔒"} ${d.title}</span></a>`;
 return `<div id="progress"></div><a href="#intro" data-id="intro"><span class="num">★</span><span class="t">Intro + comparison table</span></a>
 <div class="sec">Volume 1</div>${DESIGNS.filter(d=>d.ch<=16).map(mk).join("")}
 <div class="sec">Volume 2</div>${DESIGNS.filter(d=>d.ch>16).map(mk).join("")}`;
}

const LS_KEY="sd-hinglish-read-v1";
function getRead(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return {}}}
function setRead(o){try{localStorage.setItem(LS_KEY,JSON.stringify(o))}catch(e){}}
function refreshRead(){
 const r=getRead(); let n=0;
 document.querySelectorAll(".rd").forEach(c=>{c.checked=!!r[c.dataset.id]; if(c.checked)n++;});
 document.querySelectorAll("#sidebar a[data-id]").forEach(a=>a.classList.toggle("read",!!r[a.dataset.id]));
 document.getElementById("progress").textContent=`Progress: ${n}/${DESIGNS.length} padh liye`;
}
function setMode(m){
 document.body.classList.remove("mode-hi","mode-en","mode-both");
 document.body.classList.add("mode-"+m);
 document.querySelectorAll("#langGrp button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
 try{localStorage.setItem("sd-hinglish-mode",m)}catch(e){}
}
function doSearch(q){
 q=q.trim().toLowerCase();
 let shown=0;
 document.querySelectorAll("section.design").forEach(s=>{
  const hit=!q||s.textContent.toLowerCase().includes(q);
  s.classList.toggle("hidden",!hit); if(hit)shown++;
  const a=document.querySelector(`#sidebar a[data-id="${s.dataset.id}"]`); if(a)a.style.display=hit?"":"none";
 });
 document.getElementById("intro").classList.toggle("hidden",!!q && !document.getElementById("intro").textContent.toLowerCase().includes(q));
 window.__lastSearchCount=shown;
 return shown;
}
async function renderMermaid(){
 if(!window.mermaid) return;
 try{
  const dark=!document.body.classList.contains("light");
  mermaid.initialize({startOnLoad:false,theme:dark?"dark":"default",securityLevel:"strict"});
  const els=[...document.querySelectorAll(".diagram")];
  for(const el of els){
   const pre=el.querySelector("pre.mermaid-src"); if(!pre) continue;
   const code=pre.textContent;
   try{
    const {svg}=await mermaid.render("m"+el.dataset.id,code);
    const holder=document.createElement("div"); holder.className="svgwrap"; holder.innerHTML=svg;
    el.querySelector(".fallback-label").style.display="none";
    pre.style.display="none";
    const old=el.querySelector(".svgwrap"); if(old) old.remove();
    el.appendChild(holder);
   }catch(e){ console.warn("mermaid failed for",el.dataset.id,e); const bad=document.getElementById("dm"+el.dataset.id); if(bad) bad.remove(); }
  }
  window.__mermaidRendered=document.querySelectorAll(".svgwrap svg").length;
 }catch(e){console.warn("mermaid init failed",e)}
}
function init(){
 document.getElementById("main").innerHTML=renderIntro()+DESIGNS.map(renderDesign).join("");
 document.getElementById("sidebar").innerHTML=renderSidebar();
 document.querySelectorAll("#langGrp button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
 let m="hi"; try{m=localStorage.getItem("sd-hinglish-mode")||"hi"}catch(e){} setMode(m);
 document.getElementById("search").addEventListener("input",e=>doSearch(e.target.value));
 document.getElementById("main").addEventListener("change",e=>{ if(e.target.classList.contains("rd")){const r=getRead(); if(e.target.checked) r[e.target.dataset.id]=1; else delete r[e.target.dataset.id]; setRead(r); refreshRead();}});
 document.getElementById("menuBtn").onclick=()=>document.body.classList.toggle("nav-open");
 document.getElementById("sidebar").addEventListener("click",e=>{ if(e.target.closest("a")) document.body.classList.remove("nav-open");});
 let th=null; try{th=localStorage.getItem("sd-hinglish-theme")}catch(e){}
 if(th==="light" || (!th && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches)) document.body.classList.add("light");
 document.getElementById("themeBtn").onclick=()=>{document.body.classList.toggle("light"); try{localStorage.setItem("sd-hinglish-theme",document.body.classList.contains("light")?"light":"dark")}catch(e){} location.reload();};
 refreshRead();
 window.__appReady=true;
}
DESIGNS.sort((a,b)=>a.ch-b.ch);
init();
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" onload="renderMermaid()" onerror="console.info('Mermaid CDN unavailable – showing diagram code instead')"></script>
