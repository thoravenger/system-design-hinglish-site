ul{padding-left:22px;margin:.3em 0}
li{margin:.25em 0}

body.mode-en .hi{display:none}
body.mode-en .en{color:var(--text);font-style:normal}
body.mode-both .en::before{content:"EN: ";font-weight:600;font-style:normal}
.pair{display:block}
li .pair + .pair{margin-top:2px}
.diagram{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto;margin:8px 0}

.diagram svg{max-width:100%;height:auto}
.diagram .fallback-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.readchk{display:inline-flex;gap:6px;align-items:center;font-size:14px;margin-top:8px;cursor:pointer}
.src{font-size:13px;color:var(--muted)}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px}
table.cmp th,table.cmp td{border:1px solid var(--border);padding:6px 8px;vertical-align:top;text-align:left}

 body.nav-open #sidebar{transform:none}

 section.design,section.intro{padding:12px}
 #topbar h1{font-size:14px}

<script>
const B=(h,e)=>({h,e});
const GH="https://github.com/ByteByteGoHq/system-design-101/blob/main/data/guides/";
const T=[];
const add=(cat,f,title,what,why,fin,extra)=>T.push(Object.assign({cat,f,title,what,why,fin},extra||{}));
// ---------- API & Web ----------
let C="API & Web";
add(C,"api-gateway-101","API Gateway 101",
B("API Gateway saare clients ka ek single entry point hai: auth, rate limiting, routing, request/response transform, SSL termination, logging – ye sab cross-cutting kaam microservices se hata kar ek jagah.","A single entry point that centralises auth, rate limiting, routing, transformation, TLS termination and logging."),
B("Microservices design mein 'client seedha 20 services ko call kare?' – nahi, gateway. Follow-up: gateway SPOF na bane (multiple instances + LB).","Standard answer to 'how do clients reach many services'; mention HA for the gateway itself."),
B("Spring Cloud Gateway / Apigee: HSBC open-banking APIs mein OAuth token check, per-TPP rate limit, request logging for audit.","Spring Cloud Gateway/Apigee for open-banking APIs: OAuth, per-TPP limits, audit logs."),
{also:["reverse-proxy-vs-api-gateway-vs-load-balancer","what-are-the-differences-between-a-load-balancer-and-an-api-gateway"],m:`flowchart LR
 C["Clients"] --> GW["API Gateway: auth, rate limit, route"]
 GW --> S1["Payments svc"]
 GW --> S2["Accounts svc"]
 GW --> S3["Cards svc"]`});
add(C,"soap-vs-rest-vs-graphql-vs-rpc","SOAP vs REST vs GraphQL vs RPC",
B("Chaar API styles: SOAP (XML, strict contract, enterprise), REST (resources + HTTP verbs, simple), GraphQL (client jitna data chahiye utna maange, ek endpoint), RPC/gRPC (function call jaisa, binary, fast, service-to-service).","Four API styles: SOAP (strict XML), REST (resources), GraphQL (client-shaped queries), RPC/gRPC (fast binary calls)."),
B("Interviewer poochta hai 'external vs internal APIs ke liye kya?' – external REST, internal gRPC, mobile ke flexible screens ke liye GraphQL.","Typical answer: REST externally, gRPC internally, GraphQL for flexible clients."),
B("Banking mein abhi bhi SOAP/ISO 8583 legacy; monolith migration mein REST facade + internal gRPC/Kafka.","Banks still have SOAP/ISO 8583; migration adds REST facades plus gRPC/Kafka internally."),
{also:["rest-api-vs-graphql","how-does-grpc-work","a-cheatsheet-on-comparing-api-architectural-styles"]});
add(C,"how-do-we-perform-pagination-in-api-design","API Pagination",
B("Bada result ek saath mat bhejo. Offset/limit simple par deep pages slow aur data badalne par duplicates; cursor/keyset (last id ke baad) stable aur fast.","Offset/limit is simple but slow and unstable deep down; cursor/keyset pagination is stable and fast."),
B("Transaction history API design mein almost hamesha poocha jaata hai.","Almost always asked for history/list APIs."),
B("Account statement API: cursor = (txn_timestamp, txn_id) – naye transactions aane par bhi page skip/duplicate nahi.","Statement APIs: cursor on (timestamp, id) avoids duplicates as new txns arrive."));
add(C,"shortlong-polling-sse-websocket","Short/Long Polling vs SSE vs WebSocket",
B("Server se client tak updates: short polling (baar-baar poochho, waste), long polling (server tab tak hold kare jab tak data na ho), SSE (server→client one-way stream), WebSocket (dono taraf persistent).","Ways to push updates: short polling, long polling, SSE (one-way stream), WebSocket (bidirectional)."),
B("Chat = WebSocket, Google Drive = long polling, live price/status = SSE – reason ke saath bolna aana chahiye.","Know which fits: chat→WebSocket, Drive→long polling, live status→SSE."),
B("Payment status tracking screen ke liye SSE (Spring WebFlux) simple aur kaafi hai.","SSE via Spring WebFlux is enough for payment status screens."),
{also:["polling-vs-webhooks"]});
add(C,"polling-vs-webhooks","Polling vs Webhooks",
B("Polling: hum baar-baar external system se status poochte hain. Webhook: external system event hone par hamara URL call karta hai – efficient, par hamein endpoint secure, idempotent aur retry-safe banana padta hai.","Polling asks repeatedly; webhooks call you back – efficient but need secure, idempotent endpoints."),
B("PSP integration questions mein classic: webhook + fallback polling (webhook miss ho jaaye to).","Classic for PSP integration: webhooks with polling fallback."),
B("Card scheme/PSP callbacks: signature verify (HMAC), idempotent handler (event id), aur reconciliation job as backup.","PSP callbacks: verify HMAC, dedup by event id, reconcile as backup."));
add(C,"top-12-tips-for-api-security","Top 12 Tips for API Security",
B("API security checklist: HTTPS, OAuth2, strong API keys, authorization (RBAC/ABAC), rate limiting, input validation, versioning, allow-listing, OWASP risks check, API gateway, error messages mein internal details nahi, logging.","Checklist: HTTPS, OAuth2, keys, authz, rate limits, validation, versioning, allow-lists, OWASP, gateway, safe errors, logging."),
B("'Apna payment API secure kaise karoge?' ka structured jawab.","Structured answer to 'how would you secure this API?'."),
B("Bank context: mTLS between services, PII masking in logs, OWASP API Top 10 pen-test findings.","mTLS, PII masking, OWASP API Top 10."),
{also:["a-cheatsheet-to-build-secure-apis","how-do-we-design-effective-and-safe-apis"]});
add(C,"top-5-common-ways-to-improve-api-performance","Improve API Performance",
B("Paanch tarike: pagination, async logging, caching, payload compression, connection pooling.","Pagination, async logging, caching, compression, connection pooling."),
B("'API slow hai, kya karoge?' – pehle measure (p99), phir ye levers.","Measure p99 first, then apply these levers."),
B("Spring Boot: HikariCP pool tuning, async appenders (Logback), Redis cache – real examples de sakte ho.","HikariCP tuning, async Logback, Redis caching."),
{also:["top-5-strategies-to-reduce-latency"]});
add(C,"http1-http2-http3","HTTP/1 vs HTTP/2 vs HTTP/3",
B("HTTP/1.1: ek connection par ek-ek request (head-of-line blocking). HTTP/2: ek TCP connection par multiplexing, header compression. HTTP/3: QUIC (UDP par), TCP-level blocking bhi khatam, fast handshake.","1.1 has HOL blocking; 2 multiplexes over TCP; 3 uses QUIC over UDP."),
B("Networking basics round mein aur gRPC (HTTP/2 par chalta hai) samjhane ke liye.","Basics round; gRPC runs on HTTP/2."),null,{also:["what-makes-http2-faster-than-http1"]});
add(C,"what-is-a-load-balancer","Load Balancer",
B("Traffic ko multiple servers mein baantna. Algorithms: round robin, least connections, IP hash, weighted. L4 (TCP) vs L7 (HTTP path/header based). Health checks se bimaar server hatao.","Distributes traffic; RR/least-conn/hash; L4 vs L7; health checks."),
B("Har HLD ka pehla box. Sticky sessions kyun avoid karein – stateless servers.","First box in every HLD; prefer stateless over sticky sessions."),null,{also:["key-use-cases-for-load-balancers","proxy-vs-reverse-proxy"]});

// ---------- Caching ----------
C="Caching & Performance";
add(C,"top-5-caching-strategies","Caching Strategies (read/write)",
B("Read: <b>cache-aside</b> (app pehle cache, miss par DB phir cache fill) aur <b>read-through</b> (cache khud DB se laata hai). Write: <b>write-through</b> (cache+DB saath), <b>write-around</b> (seedha DB), <b>write-back</b> (pehle cache, baad mein DB – fast par data loss risk).","Read: cache-aside, read-through. Write: write-through, write-around, write-back (fast, risky)."),
B("Har design mein cache aata hai – kaunsa pattern aur kyun, ye bolna differentiator hai.","Naming the right pattern and why sets you apart."),
B("Balance jaise critical data par write-back kabhi nahi; reference data (IFSC, FX rates) cache-aside + TTL.","Never write-back balances; cache-aside + TTL for reference data like FX rates."),
{also:["what-are-the-top-caching-strategies","things-to-consider-when-using-cache"],m:`sequenceDiagram
 participant A as App
 participant C as Cache
 participant D as DB
 A->>C: get(key)
 C-->>A: miss
 A->>D: select
 D-->>A: row
 A->>C: set(key, ttl)`});
add(C,"how-can-cache-systems-go-wrong","How Cache Systems Go Wrong",
B("Chaar problems: <b>thundering herd</b> (bahut keys ek saath expire → DB par hamla; TTL mein random jitter), <b>cache penetration</b> (non-existent keys – null cache karo ya Bloom filter), <b>cache breakdown</b> (ek hot key expire – hot keys ko expire mat karo/lock), <b>cache crash</b> (circuit breaker + cache cluster).","Thundering herd (jitter), penetration (null cache/Bloom), breakdown (hot key), crash (breaker + cluster)."),
B("Senior-level follow-up: 'cache down ho gaya to?' – ye chaar naam aur fixes yaad rakho.","Senior follow-up; remember all four with fixes."),
B("Month-end/salary day par hot keys; Redis down hone par core-banking DB ko bachana (circuit breaker – Resilience4j).","Salary-day hot keys; protect core DB with Resilience4j breakers."),
{also:["cache-miss-attack"]});
add(C,"top-8-cache-eviction-strategies","Cache Eviction Strategies",
B("Memory full hone par kya hatayein: LRU (sabse purana use), LFU (sabse kam use), FIFO, TTL-based, random, MRU, SLRU, Two-tiered. Redis default configurable (allkeys-lru etc.).","LRU, LFU, FIFO, TTL, random, MRU, SLRU, two-tier."),
B("LRU cache implement karna (HashMap + doubly linked list) coding round mein bhi aata hai.","LRU implementation is also a coding question."),null,{also:["most-popular-cache-eviction"]});
add(C,"why-is-redis-so-fast","Why is Redis so Fast",
B("Teen wajah: data RAM mein, single-threaded event loop (IO multiplexing, no lock contention), aur efficient data structures (hash, skip list, etc.).","RAM storage, single-threaded IO multiplexing, efficient data structures."),
B("Redis har design mein – leaderboard, rate limiter, session, cache. 'Single thread hai phir bhi fast kyun?' common sawaal.","Classic question: why fast despite single thread?"),
B("Session store, OTP with TTL, idempotency keys with TTL, distributed lock (careful).","Sessions, OTPs/idempotency keys with TTL, locks."),
{also:["how-can-redis-be-used","how-does-redis-persist-data","the-ultimate-redis-101"]});
add(C,"what-is-cdn-content-delivery-network","CDN",
B("Static content (images, JS, video) users ke paas edge servers par cache. Push CDN (hum upload karein) vs pull CDN (pehli request par origin se le).","Edge caching of static content; push vs pull CDNs."),
B("YouTube/Netflix designs ka core; cost aur cache invalidation trade-off.","Core to video designs; cost and invalidation."),null,{also:["a-beginner's-guide-to-cdn-content-delivery-network"]});
add(C,"which-latency-numbers-should-you-know","Latency Numbers to Know",
B("Rough order: L1 cache ~ns, RAM ~100ns, SSD read ~100µs, same-DC round trip ~0.5ms, disk seek ~10ms, cross-continent ~150ms. Estimation ke liye zaroori.","Rough latency ladder from ns (cache) to ~150ms (cross-continent)."),
B("Back-of-envelope ke time kaam aata hai – 'cache kyun?' ka numeric jawab.","Gives numeric backing in estimates."),null);

// ---------- Database ----------
C="Database & Storage";
add(C,"what-does-acid-mean","ACID",
B("Atomicity (sab ya kuch nahi), Consistency (rules/constraints valid rahein), Isolation (concurrent transactions ek dusre ko gadbad na karein), Durability (commit ke baad crash par bhi data rahe – WAL).","Atomicity, Consistency, Isolation, Durability."),
B("Payment/hotel designs mein relational DB choose karne ka main argument.","Main argument for relational DBs in money designs."),
B("Fund transfer = debit + credit ek hi transaction; @Transactional in Spring – propagation/rollback rules jaano.","Transfers in one @Transactional; know propagation/rollback."));
add(C,"what-are-database-isolation-levels","Isolation Levels & MVCC",
B("Read uncommitted (dirty reads) → read committed → repeatable read → serializable (sabse strict). MVCC: har row ke versions, readers writers ko block nahi karte.","From read-uncommitted to serializable; MVCC keeps versions so readers don't block writers."),
B("'Double booking/lost update kaise rokoge?' – isolation + locking ka combination.","Pairs with locking to prevent lost updates."),
B("Oracle/Postgres default read committed – balance update par SELECT FOR UPDATE ya optimistic version zaroori.","Default read-committed means you still need FOR UPDATE or versions."));
add(C,"pessimistic-vs-optimistic-locking","Pessimistic vs Optimistic Locking",
B("Pessimistic: pehle lock (SELECT ... FOR UPDATE), safe par slow/deadlock. Optimistic: version column, update tabhi jab version same – conflict par retry; low contention mein best.","Pessimistic locks first; optimistic checks a version and retries."),
B("Hotel reservation, wallet, inventory – sab mein poocha jaata hai.","Asked in hotel, wallet, inventory designs."),
B("JPA @Version = optimistic; hot merchant account par pessimistic bottleneck → sub-accounts (dekho Hotspot accounts topic).","JPA @Version; hot accounts need sub-accounts."),
{also:["what-are-the-differences-among-database-locks"]});
add(C,"a-crash-course-in-database-sharding","Database Sharding",
B("Data ko multiple DBs mein todna. Strategies: range-based, hash-based, directory/lookup-based, geo-based. Problems: resharding, hot shards, cross-shard joins/transactions.","Split data across DBs by range, hash, directory or geo; watch resharding, hotspots, cross-shard queries."),
B("Scale follow-up ka standard jawab; shard key choice explain karna important.","Explain shard key choice."),
B("Customer/account id se shard; regulatory data residency ke liye geo-sharding.","Shard by customer/account; geo-shard for data residency."),
{also:["top-4-data-sharding-algorithms-explained","key-concepts-to-understand-database-sharding","vertical-partitioning-vs-horizontal-partitioning"]});
add(C,"7-must-know-strategies-to-scale-your-database","Scale Your Database (7 strategies)",
B("Indexing, materialized views, denormalization, vertical scaling, caching, replication (read replicas), sharding.","Indexing, materialized views, denormalization, vertical scaling, caching, replication, sharding."),
B("'DB bottleneck hai' – is order mein sasta se mehnga option bolo.","Present cheapest-first."),
B("Reporting queries ko read replica / CQRS read model par bhejna – core DB safe.","Move reporting to replicas/CQRS read models."),
{also:["read-replica-pattern","a-cheatsheet-on-database-performance"]});
add(C,"cap-theorem-one-of-the-most-misunderstood-terms","CAP Theorem",
B("Network partition ke time Consistency ya Availability – dono nahi. Normal time mein latency vs consistency (PACELC). CAP ko 3 mein se 2 chunna samajhna galat simplification hai.","During partitions pick C or A; otherwise latency vs consistency (PACELC)."),
B("KV store, chat, payment – sab mein. 'Bank ke liye CP kyun' clearly bolo.","Explain why banks pick CP."),
B("Ledger CP; notification/preferences AP.","Ledger CP, notifications AP."),
{also:["cap-base-solid-kiss-what-do-these-acronyms-mean"]});
add(C,"change-data-capture-key-to-leverage-real-time-data","Change Data Capture (CDC)",
B("DB ke transaction log (binlog/WAL/redo) ko padh kar har insert/update/delete ko event bana kar Kafka par bhejna (Debezium). App code change kiye bina downstream sync.","Read the DB log and stream changes to Kafka (e.g. Debezium)."),
B("Cache sync, search index, data warehouse, aur monolith migration (strangler) ka powerful tool.","Great for cache/search sync and migrations."),
B("Monolith → microservices: legacy Oracle se Debezium/GoldenGate CDC → Kafka → naye services. Transactional outbox ke saath compare karo.","Legacy Oracle → CDC → Kafka → new services; compare with outbox."),
{m:`flowchart LR
 DB[("Legacy DB")] -->|"redo / binlog"| CDC["CDC connector (Debezium)"] --> K["Kafka topic"]
 K --> S1["New microservice"]
 K --> S2["Search / cache"]
 K --> S3["Data warehouse"]`});
add(C,"b-tree-vs","B-Tree vs LSM Tree",
B("B-tree: in-place update, read fast (RDBMS). LSM: memtable + SSTables, writes fast (append), reads ke liye compaction + Bloom filter (Cassandra, RocksDB).","B-tree favours reads; LSM favours writes with compaction."),
B("'Write-heavy ke liye kaunsa DB?' ka underlying reason.","Explains DB choice for write-heavy loads."),null,{also:["8-data-structures-that-power-your-databases"]});
add(C,"how-to-upload-a-large-file-to-s3","Large File Upload to S3 (multipart)",
B("Multipart: initiate → uploadId → file ko parts mein (parallel) upload, har part ka ETag → complete request (parts + ETags) → S3 jodta hai. Fail part sirf retry.","Initiate, upload parts in parallel with ETags, complete; retry only failed parts."),
B("Google Drive / YouTube upload ka practical hissa (resumable upload).","Practical side of resumable uploads."),
B("Bulk payment files / statements upload – pre-signed URL + multipart.","Bulk payment files via pre-signed URL + multipart."),
{also:["erasure-coding","explain-the-top-6-use-cases-of-object-stores"]});
add(C,"how-do-you-decide-which-type-of-database-to-use","Choosing the Right Database",
B("Data ke shape aur access pattern se: relational (transactions), key-value (fast lookup), document (flexible schema), wide-column (huge writes), graph (relationships), time-series (metrics), search (full-text).","Pick by data shape and access pattern."),
B("Har HLD mein 'kaunsa DB aur kyun' – justification marks laata hai.","Justifying DB choice earns marks."),null,{also:["understanding-database-types","how-to-choose-the-right-database"]});
// ---------- Kafka & Messaging ----------
C="Kafka & Messaging";
add(C,"why-is-kafka-fast","Why is Kafka Fast",
B("Do main wajah: <b>sequential I/O</b> (disk par append-only log, random seek nahi) aur <b>zero copy</b> (OS page cache se seedha network card – sendfile(), app memory mein copy nahi). Batching + compression bhi madad karte hain.","Sequential I/O on an append-only log and zero-copy via sendfile(); plus batching/compression."),
B("Kafka use karte ho to ye sawaal pakka aayega. Steps 2.1-2.5 vs 3.1-3.3 (copy count) samjha sako.","Expect it; explain copies with vs without zero-copy."),
B("Aapke payment events throughput tuning: batch.size, linger.ms, compression.type=lz4 – zero copy TLS ke saath kaam nahi karta (encryption user-space mein) – ye senior-level point hai.","Tuning batch.size/linger.ms/compression; note zero-copy is lost with TLS."),
{m:`flowchart LR
 P["Producer"] -->|"append"| LOG[("Partition log on disk")]
 LOG --> PC["OS page cache"] -->|"sendfile zero copy"| NIC["Network card"] --> CO["Consumer"]`});
add(C,"top-5-kafka-use-cases","Top 5 Kafka Use Cases",
B("Log processing, real-time recommendations ke liye streaming, monitoring/alerting, CDC, aur <b>system migration</b> (purane aur naye system ko parallel chalana).","Log processing, streaming, monitoring, CDC, system migration."),
B("'Kafka kyun, RabbitMQ kyun nahi?' – retention + replay + throughput.","Why Kafka: retention, replay, throughput."),
B("Monolith migration mein Kafka as backbone: dual-run, replay se naya service backfill.","Migration backbone: dual-run and replay backfill."),
{also:["the-ultimate-kafka-101-you-cannot-miss"]});
add(C,"delivery-semantics","Delivery Semantics",
B("<b>At-most once</b>: message kho sakta hai, duplicate nahi (metrics). <b>At-least once</b>: kho nahi, duplicate ho sakta hai – consumer side dedup (unique key). <b>Exactly once</b>: sabse mushkil/costly – payments, trading, accounting.","At-most once (may lose), at-least once (may duplicate; dedup), exactly once (costly; finance)."),
B("Kafka + payments interview mein guaranteed topic. Offset commit order se semantics badalti hai.","Guaranteed in Kafka/payments interviews; commit order decides semantics."),
B("Practical: at-least-once + idempotent consumer (processed_event table with unique key) – Kafka transactions sirf Kafka-to-Kafka exactly-once deti hain, DB tak nahi.","At-least-once + idempotent consumer; Kafka EOS only covers Kafka-to-Kafka."));
add(C,"types-of-message-queue","Types of Message Queues",
B("Evolution: IBM MQ / ActiveMQ (classic queues), RabbitMQ (routing, exchanges), Kafka (distributed log), Pulsar (storage aur compute alag). Queue vs pub/sub vs log ka farak samjho.","From IBM MQ/RabbitMQ to Kafka/Pulsar; queue vs pub/sub vs log."),
B("Tool choice justify karna.","Justify the tool."),
B("Banks mein IBM MQ legacy + Kafka naya – bridge (MQ connector) common pattern.","IBM MQ legacy bridged to Kafka."),
{also:["explaining-the-4-most-commonly-used-types-of-queues-in-a-single-diagram","top-6-cloud-messaging-patterns"]});
add(C,"top-eventual-consistency-patterns-you-must-know","Eventual Consistency Patterns",
B("Chaar tarike: event-based (service event publish, dusre consume), background sync (periodic job sync), saga-based (local transactions + compensations), CQRS-based (write model se read model async).","Event-based, background sync, saga, CQRS."),
B("Microservices mein 'data consistency kaise?' ka menu.","Menu for microservice consistency questions."),
B("Payment → ledger → notification chain = event-based + saga; statements = CQRS read model.","Payments use events + saga; statements use CQRS."));
add(C,"differences-in-event-sourcing-system-design","Event Sourcing",
B("State store karne ki jagah har change ka immutable event store karo; current state = events replay. Audit aur time-travel free mein, par querying ke liye projections (CQRS) chahiye.","Store immutable events; state = replay; needs projections for queries."),
B("Digital wallet / ledger designs ka core.","Core to wallet/ledger designs."),
B("Ledger naturally event-sourced hai; Kafka compacted topics + snapshots.","Ledgers are naturally event-sourced."),
{also:["how-do-we-incorporate-event-sourcing-into-the-systems"]});

// ---------- Distributed patterns ----------
C="Distributed Patterns & Resilience";
add(C,"explaining-5-unique-id-generators-in-distributed-systems","5 Unique ID Generators",
B("UUID (128-bit, simple, unsorted – index ke liye kharab), Snowflake (timestamp + machine + sequence, fast), DB auto-increment (simple, DB bottleneck), DB segment (IDs ka batch le kar cache – DB load kam), Redis INCR (fast, in-memory).","UUID, Snowflake, DB auto-increment, DB segments, Redis."),
B("Unique ID chapter ka free alternative – trade-off table bana sako.","Free companion to the unique ID chapter."),
B("Transaction reference: Snowflake/ULID (sortable). Shopify bhi idempotency key ke liye ULID suggest karta hai.","Sortable refs via Snowflake/ULID."),
{also:["unique-id-generator"]});
add(C,"top-6-cases-to-apply-idempotency","Where to Apply Idempotency",
B("Chhe jagah: REST retries (PUT/DELETE idempotent), payment processing, order submit, DB operations re-apply, user registration/password reset, message reprocessing.","REST retries, payments, orders, DB ops, account actions, message handlers."),
B("Senior engineer ka signature topic – har write API par 'retry safe hai?' bolo.","Signature senior topic: is every write retry-safe?"),
B("Idempotency-Key header + Redis/DB table (key, request hash, response) + TTL; Spring filter/interceptor.","Idempotency-Key header backed by Redis/DB with TTL."));
add(C,"how-do-we-retry-on-failures","Retry Strategies (Backoff + Jitter)",
B("Linear backoff, linear + jitter, exponential backoff, exponential + jitter. Jitter (randomness) se saare clients ek saath retry nahi karte ('retry storm' nahi).","Linear/exponential backoff, with jitter to avoid retry storms."),
B("Har failure-handling answer mein: 'retry with exponential backoff + jitter, max attempts, phir DLQ'.","Standard phrase: exponential backoff + jitter, cap, then DLQ."),
B("Spring Retry / Resilience4j Retry; Kafka retry topics (retry-5s, retry-1m) + DLT.","Spring Retry/Resilience4j; Kafka retry topics + DLT."));
add(C,"resiliency-patterns","Resiliency Patterns",
B("Timeout, retry, circuit breaker, rate limiting, load shedding, bulkhead (resources alag pools mein), back pressure, let it crash.","Timeout, retry, circuit breaker, rate limiting, load shedding, bulkhead, back pressure, let-it-crash."),
B("'Downstream slow hai to?' – timeout + breaker + bulkhead combination.","Combine timeout, breaker and bulkhead."),
B("Core banking slow ho to payment API thread pool exhaust na ho – Resilience4j bulkhead + circuit breaker.","Protect thread pools with Resilience4j."),
{also:["a-cheat-sheet-for-designing-fault-tolerant-systems"]});
add(C,"top-7-most-used-distributed-system-patterns","Top 7 Distributed System Patterns",
B("Ambassador (sidecar proxy), circuit breaker, CQRS, event sourcing, leader election, pub/sub, sharding.","Ambassador, circuit breaker, CQRS, event sourcing, leader election, pub/sub, sharding."),
B("Pattern vocabulary – naam se bolna confidence dikhata hai.","Shared vocabulary for interviews."),null);
add(C,"why-do-we-need-to-use-a-distributed-lock","Distributed Lock",
B("Multiple instances mein ek waqt par ek hi kaam: leader election, scheduled job, inventory, resource allocation. Redis (SET NX PX / Redlock), ZooKeeper, DB row lock. Lock expiry + fencing token zaroori.","Locks across instances via Redis/ZooKeeper/DB; use expiry and fencing tokens."),
B("'Same scheduled job do pods par na chale' – ShedLock jaisa.","E.g. preventing duplicate scheduled jobs."),
B("EOD batch / standing-instruction job ek hi pod par – ShedLock (Spring) + DB.","ShedLock for EOD batches."));
add(C,"consistent-hashing","Consistent Hashing",
B("Hash ring + virtual nodes – node add/remove par kam keys move. (System design chapter ka free short version.)","Hash ring + vnodes; minimal key movement."),
B("KV store, cache cluster, sharding answers ka base.","Base for KV, cache and sharding answers."),null);
add(C,"how-do-we-design-for-high-availability","Designing for High Availability",
B("Redundancy (no SPOF), failover (active-active / active-passive), multi-AZ/region, health checks, graceful degradation. 'Nines' (99.9% ≈ 8.8 ghante/saal downtime).","Redundancy, failover, multi-AZ, health checks, degradation; know the nines."),
B("Non-functional requirements ko numbers mein bolna.","Quantify availability."),
B("Payments: active-active DCs, RPO/RTO targets, DR drills – regulator expectations.","Active-active DCs, RPO/RTO, DR drills."),
{also:["cloud-disaster-recovery-strategies"]});

B("'Monolith ko kaise todoge?' ke saath bolne layak checklist.","Checklist for decomposition questions."),

B("Saga implement karne ke do tarike – trade-off clearly bolo.","Two ways to implement sagas."),

add(C,"8-key-concepts-in-ddd","Domain-Driven Design (DDD)",

B("Monolith ko services mein todne ka logical tareeka – bounded contexts.","Bounded contexts guide service boundaries."),
B("Payments, Accounts, Customers, Limits – alag bounded contexts; Account aggregate balance invariant protect karta hai.","Payments/Accounts/Customers as contexts; Account aggregate guards balance."),
{also:["key-terms-in-domain-driven-design"]});

add(C,"the-12-factor-app","The 12-Factor App",
B("Cloud-native app ke 12 rules: codebase, dependencies, config env mein, backing services, build/release/run alag, stateless processes, port binding, concurrency, disposability, dev/prod parity, logs as streams, admin processes.","Twelve rules for cloud-native apps."),

add(C,"a-cheat-sheet-for-system-designs","System Design Cheat Sheet",

// ---------- Security ----------
C="Security (OAuth / JWT)";
add(C,"oauth-20-flows","OAuth 2.0 Flows",
B("Authorization code (+PKCE) – web/mobile apps ke liye best; client credentials – service-to-service; implicit – purana, avoid; resource owner password – sirf trusted legacy. Access token chhota-lived, refresh token se naya.","Auth code (+PKCE) for apps, client credentials for services; avoid implicit/password grants."),
B("'User login aur third-party access kaise?' – flow naam se bolo aur sequence draw karo.","Name the flow and draw the sequence."),
B("Open Banking (PSD2/UK OB): auth code + PKCE + consent, FAPI profile, mTLS-bound tokens; internal microservices client credentials (Spring Security OAuth2 Resource Server).","Open banking: auth code + PKCE, FAPI, mTLS; client credentials internally."),
{also:["oauth-2-explained-with-siple-terms"],m:`sequenceDiagram
 participant U as User
 participant A as App
 participant AS as AuthServer
 participant R as ResourceAPI
 U->>A: login click
 A->>AS: redirect with code_challenge
 U->>AS: authenticate + consent
 AS-->>A: authorization code
 A->>AS: code + code_verifier
 AS-->>A: access + refresh token
 A->>R: API call with Bearer token`});
add(C,"jwt-101-key-to-stateless-authentication","JWT 101",
B("JWT = header.payload.signature (Base64URL). Server signature verify karta hai – DB lookup nahi (stateless). Payload encrypted nahi hota – secrets mat daalo. Revoke karna mushkil → short expiry + refresh token.","Header.payload.signature; stateless verification; payload not encrypted; short expiry for revocation."),
B("Sessions vs JWT ka trade-off almost pakka poocha jaata hai.","Sessions vs JWT is a near-certain question."),
B("RS256 + JWKS rotation; gateway par validate; PII claims mat daalo.","RS256 with JWKS rotation; no PII in claims."),
{also:["explaining-json-web-token-jwt-to-a-10-year-old-kid","cookies-vs-sessions-vs-jwt-vs-paseto"]});
add(C,"session-cookie-jwt-token-sso-and-oauth-2","Session, Cookie, JWT, SSO, OAuth2",
B("Ek jagah sab: session (server state + cookie id), token (stateless), JWT (signed token), SSO (ek login se kai apps – SAML/OIDC), OAuth2 (delegated authorization), OIDC (OAuth ke upar identity).","Sessions, tokens, JWT, SSO, OAuth2 and OIDC compared."),
B("AuthN vs AuthZ confusion clear karne ke liye best overview.","Clears up AuthN vs AuthZ."),
B("Staff apps SSO (Azure AD/Ping), customer apps OIDC.","SSO for staff, OIDC for customers."),
{also:["explaining-sessions-tokens-jwt-sso-and-oauth-in-one-diagram","top-4-forms-of-authentication-mechanisms"]});
add(C,"encoding-vs-encryption-vs-tokenization","Encoding vs Encryption vs Tokenization",
B("Encoding (Base64) – sirf format, security nahi. Encryption – key se reversible. Tokenization – sensitive data (card number) ko random token se badlo; asli data vault mein.","Encoding is formatting, encryption is key-reversible, tokenization swaps data for a token."),
B("PCI-DSS questions mein seedha kaam aata hai.","Directly relevant to PCI-DSS."),
B("Card PAN tokenization (network tokens), Apple/Google Pay DPAN – scope reduction.","PAN tokenization reduces PCI scope."));
add(C,"how-do-we-manage-sensitive-data-in-a-system","Managing Sensitive Data",
B("Sensitive data pehchano, encryption + key management (KMS/HSM), data masking/desensitization, minimum permissions, data lifecycle (retention, deletion).","Classify, encrypt with managed keys, mask, least privilege, lifecycle."),
B("'PII kaise handle karoge?' ka structured answer.","Structured PII answer."),
B("HSM-backed keys, log masking, GDPR/RBI retention rules.","HSM keys, masking, retention rules."),
{also:["how-do-we-design-a-secure-system","how-do-we-design-a-permission-system"]});
add(C,"how-does-https-work","How HTTPS Works",
B("TCP handshake → TLS handshake (certificate verify, asymmetric crypto se session key exchange) → symmetric encryption se data. Asymmetric slow hai isliye sirf key exchange ke liye.","TLS uses asymmetric crypto to agree a session key, then symmetric encryption."),
B("Basics; mTLS ke liye foundation.","Foundation for mTLS."),
B("Service mesh mTLS (Istio), certificate rotation.","mTLS via service mesh."),
{also:["symmetric-encryption-vs-asymmetric-encryption","how-digital-signatures-work"]});
add(C,"how-to-store-passwords-in-the-database","Storing Passwords",
B("Plain text ya simple hash nahi; har user ka random salt + slow hash (bcrypt/scrypt/Argon2). Login par same salt se hash compare.","Use per-user salt + slow hash (bcrypt/Argon2)."),
B("Security basics – galat jawab red flag.","Wrong answer is a red flag."),
B("Spring Security BCryptPasswordEncoder; banking mein mostly IdP handle karta hai.","BCryptPasswordEncoder; usually delegated to IdP."));
add(C,"how-does-google-authenticator-or-other-types-of-2-factor-authenticators-work","2FA / TOTP",
B("Shared secret + current time window (30s) → HMAC → 6-digit code (TOTP). Server bhi same calculate karke match karta hai.","TOTP: HMAC of shared secret and time window."),
B("Login/OTP design mein.","Useful in login/OTP designs."),
B("Transaction signing / step-up auth for high-value payments.","Step-up auth for high-value payments."));
// ---------- Payments ----------
C="Payments & Fintech";
add(C,"payment-system","Payment System (overview)",
B("Buy click → payment event store → payment executor PSP ko call → success par seller ka wallet update → ledger mein double-entry append → raat ko PSP/bank settlement file se reconciliation.","Payment event → executor → PSP → wallet → ledger → nightly reconciliation."),
B("Payment chapter paid hai; ye free guide uska short public version hai – HLD yaad karne ke liye best.","Free public counterpart of the paid payment chapter."),
B("Seedha aapka domain: orchestration service, Kafka events, ledger, EOD recon.","Your domain: orchestration, Kafka, ledger, recon."),
{m:`flowchart LR
 U["Buy click"] --> PS["Payment service"] --> PE["Payment executor"] --> PSP["PSP / card network"]
 PS --> W["Wallet"]
 PS --> L[("Ledger: double entry")]
 PSP -->|"settlement file"| REC["Reconciliation"] --> L`});
add(C,"how-to-avoid-double-payment","How to Avoid Double Payment",
B("Exactly-once = at-least-once (<b>retry</b>) + at-most-once (<b>idempotency check</b>). Client unique idempotency key (UUID) header mein bhejta hai; server pehle check karta hai ki ye key process ho chuki hai ya nahi.","Exactly-once = retry (at-least-once) + idempotency (at-most-once) with a client-generated key."),
B("Payment interview ka #1 sawaal.","The #1 payments interview question."),
B("DB unique constraint on idempotency_key + stored response; concurrent same key par lock/409.","Unique constraint + stored response; 409 on concurrent duplicates."));
add(C,"reconciliation-in-payment","Reconciliation",
B("Alag systems (e-commerce order, PSP record, ledger) ke records match karna. Problems: alag formats (normalize layer), bahut data (batch Hadoop ya streaming Flink), cut-off time mismatch (23:59:55 vs 00:00:30 – 'temporary break', agle din dobara match). Exactly-once ke bawajood recon safety net hai.","Matching records across systems; handle formats, volume and cut-off breaks; always needed as a safety net."),
B("Senior fintech interviews mein differentiator.","A differentiator in fintech interviews."),
B("Nostro/vostro recon, scheme settlement files, breaks queue for ops team – aapke HSBC kaam se examples do.","Nostro/vostro and scheme-file recon with an ops breaks queue."));
add(C,"handling-hotspot-accounts","Handling Hotspot Accounts",
B("Bade merchant (sale day) ke account row par bahut concurrent updates → row lock bottleneck. Fixes: rate limit, account ko <b>sub-accounts</b> mein todna (har update ek sub-account lock kare), pehle cache mein balance update aur DB async.","Hot merchant rows bottleneck on locks; rate-limit, split into sub-accounts, or update a cache first."),
B("'Ek account par 10k TPS kaise?' – senior question.","Senior question: 10k TPS on one account."),
B("Big corporate/collection accounts, salary credits; Kafka partition by account + batching per partition bhi option.","Corporate collection accounts; partition-by-account batching."));
add(C,"money-movement","Money Movement (Clearing & Settlement)",
B("<b>Clearing</b> = kaun kisko kitna dega (netting), <b>settlement</b> = settlement bank mein reserve accounts ke beech asli paisa. Teen layers: transaction, payment+clearing (information flow), settlement (fund flow). Info aur fund flow alag aur async – isliye reconciliation.","Clearing computes net positions; settlement moves real money; info and fund flows are separate, hence reconciliation."),
B("Banking domain knowledge dikhane ka mauka.","Shows banking domain depth."),
B("CHAPS/BACS/FPS (UK), RTGS/NEFT – netting vs gross settlement.","UK CHAPS/BACS/FPS; net vs gross settlement."),
{also:["the-payments-ecosystem","how-to-learn-payments"]});
add(C,"swift-payment-messaging-system","SWIFT Messaging",
B("SWIFT cross-border banks ke beech <b>messages</b> bhejta hai (paisa nahi). Bank A → SWIFT network (secure) → Bank B; paisa correspondent/nostro accounts se move hota hai. MT messages se ISO 20022 (MX) par migration.","SWIFT carries messages, not money; funds move via correspondent accounts; MT → ISO 20022."),
B("Cross-border payments design mein.","For cross-border designs."),
B("HSBC = global transaction bank; ISO 20022 pacs.008/pacs.002 mapping, MT103 – real experience bolo.","ISO 20022 pacs.008/002, MT103 experience."),
{also:["foreign-exchange-payments"]});
add(C,"unified-payments-interface-upi-in-india","UPI in India",
B("VPA (jaise bob@axis) register, NPCI switch VPA ko bank account se resolve karta hai, UPI PIN 2FA issuing bank verify karta hai, phir debit-credit real-time.","VPA registration, NPCI as switch, PIN verified by issuer, real-time transfer."),
B("Real-time payments system design ka accha example; Indian interviews mein common.","Common real-time payments example in India."),
B("UK Faster Payments jaisa; switch-based architecture, timeouts aur reversal handling.","Similar to UK Faster Payments; handle timeouts/reversals."));
add(C,"how-does-visa-work-when-we-swipe-a-credit-card-at-a-merchant's-shop","How VISA Card Payment Works",
B("Authorization (merchant → acquirer → card network → issuer approve/decline), phir capture, phir clearing & settlement (batch). Interchange fees issuer ko.","Authorization, capture, then clearing & settlement; interchange to issuer."),
B("Card payment flow follow-ups.","Card flow follow-ups."),
B("Issuer side: authorization within ~100ms, fraud scoring inline, ISO 8583.","Issuer auth in ~100ms with inline fraud, ISO 8583."),
{also:["how-does-visa-make-money","how-applegoogle-pay-works"]});
add(C,"10-principles-for-building-resilient-payment-systems-by-shopify","10 Principles for Resilient Payments (Shopify)",
B("Kam timeouts (fail fast), circuit breakers, capacity planning (Little's law), monitoring (latency, traffic, errors, saturation), structured logging, idempotency keys (ULID), consistent reconciliation, load testing, incident management, retrospectives.","Short timeouts, breakers, capacity, golden signals, structured logs, idempotency, recon, load tests, incidents, retros."),
B("Real-world checklist – 'production mein payment system resilient kaise banaya' ka jawab.","Real-world resilience checklist."),
B("Apne projects se map karo: Resilience4j, Micrometer golden signals, Splunk structured logs, ULID keys.","Map to Resilience4j, Micrometer, Splunk, ULIDs."));
add(C,"digital-wallet-in-traditional-banks-vs-wallet-in-blockchain","Digital Wallet: Bank vs Blockchain",
B("Bank wallet: centralized ledger, bank trust. Blockchain wallet: private key user ke paas, decentralized ledger, transactions network validate karta hai.","Bank wallets use central ledgers; crypto wallets use user-held keys on a decentralized ledger."),
B("Wallet chapter (paid) ke saath context.","Context for the paid wallet chapter."),null);

add(C,"how-discord-stores-trillions-of-messages","How Discord Stores Trillions of Messages",

B("Chat design mein storage choice ka real proof.","Real evidence for chat storage choices."),
B("Java GC pauses ka lesson – latency-critical paths par GC tuning (ZGC) ya alag runtime.","GC-pause lesson for latency-critical Java."));
add(C,"how-does-a-typical-push-notification-system-work","Push Notification System",

B("Paid notification chapter ka free counterpart.","Free counterpart to the paid notification chapter."),
B("Transaction alerts/OTP – Kafka per channel, DLQ, delivery tracking.","Alerts/OTP via Kafka per channel with DLQ."),
{also:["how-does-netflix-scale-push-messaging-for-millions-of-devices"]});
add(C,"mcdonald's-event-driven-architecture","McDonald's Event-Driven Architecture",

B("Enterprise Kafka platform design ka accha real example.","Good example of an enterprise Kafka platform."),
B("Bank-wide Kafka platform: schema registry (Avro), standard SDK, DLQ conventions – aap isko apne kaam se relate kar sakte ho.","Bank Kafka platform: Avro registry, SDKs, DLQ conventions."));
add(C,"100x-postgres-scaling-at-figma","100x Postgres Scaling at Figma",
B("Figma ne Postgres ko vertical scaling → read replicas + connection pooling (PgBouncer) → vertical partitioning (tables alag DBs) → horizontal sharding se scale kiya.","Figma scaled Postgres via vertical scaling, replicas/pooling, vertical partitioning, then sharding."),
B("'Sharding kab?' – pehle saste options, phir sharding – real story.","Real story of when to shard."),
B("Monolith DB split: pehle tables ko domain-wise alag DB (vertical) – migration ka safe pehla step.","Vertical split as a safe first migration step."));
add(C,"what-is-the-journey-of-a-slack-message","Journey of a Slack Message",

body:[
B("<b>Note:</b> Ye ML aur GenAI chapters <b>hamari taraf se overview (book ka content nahi)</b> hain. GitHub repos (<a href='https://github.com/ByteByteGoHq/ml-bytebytego' target='_blank' rel='noopener'>ml-bytebytego</a>, <a href='https://github.com/ByteByteGoHq/generativeAI' target='_blank' rel='noopener'>generativeAI</a>) mein sirf har chapter ki <b>reference list</b> hai – chapter titles aur papers wahin se liye hain; explanation general ML knowledge se apne shabdon mein.","<b>Note:</b> These ML/GenAI chapters are <b>our own overview, not book content</b>. The repos contain only per-chapter reference lists; titles and papers come from there, explanations are our own."),
B("<b>1. Clarify requirements</b>: business goal (engagement? revenue? safety?), scale (users, items), latency, data availability, constraints (privacy, fairness).","<b>1. Clarify</b>: business goal, scale, latency, data, constraints."),
B("<b>2. Frame as ML task</b>: business objective → ML objective (e.g. 'watch time badhao' → 'P(watch) predict karo'); input/output define; task type: classification, regression, ranking, representation learning, generation.","<b>2. Frame</b>: map business to ML objective; define I/O and task type."),

B("<b>4. Features</b>: categorical (one-hot, embeddings), numerical (normalize, bucketize), text/image (pre-trained encoders), feature crosses; batch vs streaming features (feature store).","<b>4. Features</b>: encodings, crosses, pre-trained encoders, batch vs streaming."),
