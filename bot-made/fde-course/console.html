<main>
  <nav>
    <a href="index.html">Start</a>
    <a href="fintech.html">Fintech project</a>
  </nav>
  <h1>Try the API</h1>
  <p>Start the Python app on port 8090 first. Serve this folder with <code>python -m http.server 5500</code> and open this page from that server.</p>
  <p>
    <label>API base <input id="base" value="http://127.0.0.1:8090"></label>
  </p>
  <p>
    <label>Email <input id="email" value="ada@northline.test"></label>
  </p>
  <p><button id="load" type="button">Load accounts</button></p>
  <p>
    <label>Question <textarea id="question" rows="3">What is my balance and the overdraft policy?</textarea></label>
  </p>
  <p><button id="ask" type="button">Ask</button></p>
  <div id="out" class="out">Waiting.</div>
  <script>
    const out = document.querySelector("#out");
    function headers() {
      return { "Content-Type": "application/json", "X-Customer-Email": document.querySelector("#email").value };
    }
    function base() { return document.querySelector("#base").value.replace(/\/$/, ""); }
    document.querySelector("#load").onclick = async () => {
      out.textContent = "Loading...";
      try {
        const response = await fetch(base() + "/api/accounts", { headers: headers() });
        out.textContent = await response.text();
      } catch (err) {
        out.textContent = "Could not reach the API. Start uvicorn on port 8090.\n" + err;
      }
    };
    document.querySelector("#ask").onclick = async () => {
      out.textContent = "Asking...";
      try {
        const response = await fetch(base() + "/api/ask", {
          method: "POST",
          headers: headers(),
          body: JSON.stringify({ question: document.querySelector("#question").value })
        });
        out.textContent = await response.text();
      } catch (err) {
        out.textContent = "Could not reach the API.\n" + err;
      }
    };
  </script>
</main>
</body>
</html>
