<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Saved Posts · Authors</title><link rel="stylesheet" href="assets/app.css"></head><body>
<div id="sdh-libbar" style="position:relative;z-index:2147483000;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0;padding:8px 16px;background:#0f172a;color:#cbd5e1;font:600 13px/1.5 Inter,'Segoe UI',system-ui,-apple-system,sans-serif;border-bottom:2px solid #4f46e5;box-sizing:border-box;width:100%;text-align:left;letter-spacing:0"><a href="../index.html" style="color:#fff;text-decoration:none;font-weight:800">SystemDesign<span style="color:#8b8cff">.hinglish</span></a><span style="opacity:.45">/</span><a href="../all-topics.html" style="color:#fff;text-decoration:none">🗂 All Topics</a><span style="opacity:.45">·</span><a href="../library/index.html#linkedin-saved" style="color:#fff;text-decoration:none">📚 Library</a><span style="opacity:.45">/</span><span>LinkedIn Saved Posts</span><a href="linkedin_saved_posts.pdf" download style="color:#a5b4fc;text-decoration:none;font-size:12px">⬇ Saved posts PDF (644 pages)</a><a href="../library/linkedin-saved/linkedin-saved-posts-pipeline-hld-lld.html" style="color:#a5b4fc;text-decoration:none;font-size:12px">📄 How it was built (HLD + LLD)</a><span style="margin-left:auto;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid #6366f1;color:#c7d2fe">🔗 Offline feed</span></div>
<div id="nav"></div>
<main class="wrap one" style="grid-template-columns:minmax(0,1100px)"><section>
<div class="card head"><h1>Authors</h1><p id="sum"></p><input class="asearch" id="af" type="search" placeholder="Filter authors" aria-label="Filter authors">
<label style="font-size:13px;color:#5e5e5e;margin-left:10px">Sort: <select id="as"><option value="count">Most posts</option><option value="name">Name A–Z</option></select></label></div>
<div class="card"><div class="alist" id="list"></div></div></section></main>
<script src="assets/data.js"></script><script src="assets/common.js"></script>
<script>
(function(){
const {P,TOP,esc,nav,avatar,authorCounts}=SP;
document.getElementById('nav').innerHTML=nav('authors');
const all=authorCounts();const topicOf={};
P.forEach(p=>{(topicOf[p.author]=topicOf[p.author]||{})[p.topic]=(topicOf[p.author][p.topic]||0)+1});
document.getElementById('sum').textContent=`${all.length} authors across ${P.length} saved posts. Click an author to see their posts in the feed.`;
const f=document.getElementById('af'),s=document.getElementById('as'),L=document.getElementById('list');
function render(){
  const q=f.value.trim().toLowerCase();let a=all.filter(([n])=>n.toLowerCase().includes(q));
  if(s.value==='name')a=a.slice().sort((x,y)=>x[0].localeCompare(y[0]));
  L.innerHTML=a.length?a.map(([n,c])=>{const tp=Object.entries(topicOf[n]).sort((x,y)=>y[1]-x[1])[0][0];
    return `<a class="ra" href="index.html?author=${encodeURIComponent(n)}">${avatar(n)}<div style="min-width:0;flex:1"><div class="t">${esc(n)}</div><div class="s">${c} post${c>1?'s':''} · <span style="color:${TOP[tp].color};font-weight:600">${esc(TOP[tp].label)}</span></div></div></a>`}).join(''):'<div class="empty">No authors match.</div>';
}
f.addEventListener('input',render);s.addEventListener('change',render);render();window.__ready=true;
})();
</script></body></html>
